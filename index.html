// ===== COMPOSANTS UI DE BASE =====
const Loader=()=><div className="flex items-center justify-center p-8"><div className="loader"/></div>;

const Badge=({children,color='gray',size='sm'})=>{
    const colors={
        gray:'bg-gray-500/20 text-gray-400',
        blue:'bg-blue-500/20 text-blue-400',
        green:'bg-emerald-500/20 text-emerald-400',
        red:'bg-red-500/20 text-red-400',
        yellow:'bg-amber-500/20 text-amber-400',
        purple:'bg-purple-500/20 text-purple-400',
        cyan:'bg-cyan-500/20 text-cyan-400',
    };
    const sizes={sm:'text-xs px-2 py-0.5',md:'text-sm px-2.5 py-1'};
    return<span className={cn('rounded-full font-medium',colors[color],sizes[size])}>{children}</span>;
};

const Button=({children,onClick,variant='primary',size='md',disabled,loading,icon,className})=>{
    const variants={
        primary:'gradient-primary text-white hover:shadow-lg hover:shadow-blue-500/30',
        secondary:'bg-surface-700 text-surface-200 hover:bg-surface-600 border border-surface-600',
        success:'gradient-success text-white',
        danger:'gradient-danger text-white',
        ghost:'text-surface-400 hover:text-white hover:bg-surface-700',
    };
    const sizes={sm:'px-3 py-1.5 text-sm',md:'px-4 py-2',lg:'px-6 py-3 text-lg'};
    return(
        <button onClick={onClick} disabled={disabled||loading} className={cn('btn rounded-xl font-semibold flex items-center justify-center gap-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed',variants[variant],sizes[size],className)}>
            {loading?<div className="loader" style={{width:16,height:16}}/>:icon}{children}
        </button>
    );
};

const Input=({label,type='text',value,onChange,placeholder,required,error,className,...props})=>(
    <div className={className}>
        {label&&<label className="block text-sm font-medium text-surface-300 mb-1.5">{label}{required&&<span className="text-red-400">*</span>}</label>}
        <input type={type} value={value||''} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className={cn('w-full px-4 py-2.5 bg-surface-800 border rounded-xl text-white placeholder-surface-500',error?'border-red-500':'border-surface-600')} {...props}/>
        {error&&<p className="text-red-400 text-xs mt-1">{error}</p>}
    </div>
);

const Select=({label,value,onChange,options,placeholder,required,className})=>(
    <div className={className}>
        {label&&<label className="block text-sm font-medium text-surface-300 mb-1.5">{label}{required&&<span className="text-red-400">*</span>}</label>}
        <select value={value||''} onChange={e=>onChange(e.target.value)} className="w-full px-4 py-2.5 bg-surface-800 border border-surface-600 rounded-xl text-white">
            {placeholder&&<option value="">{placeholder}</option>}
            {options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
    </div>
);

const TextArea=({label,value,onChange,placeholder,rows=3,className})=>(
    <div className={className}>
        {label&&<label className="block text-sm font-medium text-surface-300 mb-1.5">{label}</label>}
        <textarea value={value||''} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={rows} className="w-full px-4 py-2.5 bg-surface-800 border border-surface-600 rounded-xl text-white placeholder-surface-500 resize-none"/>
    </div>
);

const Modal=({isOpen,onClose,title,children,size='md'})=>{
    if(!isOpen)return null;
    const sizes={sm:'max-w-md',md:'max-w-2xl',lg:'max-w-4xl',xl:'max-w-6xl'};
    return(
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay animate-fade-in" onClick={onClose}>
            <div className={cn('glass rounded-2xl w-full overflow-hidden',sizes[size])} onClick={e=>e.stopPropagation()}>
                <div className="flex items-center justify-between px-6 py-4 border-b border-surface-700">
                    <h2 className="text-xl font-bold text-white">{title}</h2>
                    <button onClick={onClose} className="p-2 hover:bg-surface-700 rounded-lg transition-colors">{Icons.close}</button>
                </div>
                <div className="p-6 max-h-[70vh] overflow-y-auto">{children}</div>
            </div>
        </div>
    );
};

const Card=({title,children,action,className})=>(
    <div className={cn('glass rounded-2xl overflow-hidden',className)}>
        {(title||action)&&(
            <div className="flex items-center justify-between px-6 py-4 border-b border-surface-700">
                {title&&<h3 className="font-bold text-white">{title}</h3>}
                {action}
            </div>
        )}
        <div className="p-6">{children}</div>
    </div>
);

const StatCard=({title,value,subtitle,icon,color='blue',trend})=>(
    <div className="stat-card glass rounded-2xl p-6">
        <div className="flex items-start justify-between">
            <div>
                <p className="text-surface-400 text-sm">{title}</p>
                <p className="text-2xl font-bold text-white mt-1">{value}</p>
                {subtitle&&<p className="text-surface-500 text-sm mt-1">{subtitle}</p>}
                {trend!==undefined&&(
                    <div className={cn('flex items-center gap-1 mt-2 text-sm',trend>=0?'text-emerald-400':'text-red-400')}>
                        {trend>=0?Icons.arrowUp:Icons.arrowDown}
                        <span>{Math.abs(trend)}%</span>
                    </div>
                )}
            </div>
            <div className={cn('w-12 h-12 rounded-xl flex items-center justify-center text-white',`gradient-${color}`)}>{icon}</div>
        </div>
    </div>
);

const Table=({columns,data,onRowClick,emptyMessage='Aucune donnée'})=>(
    <div className="overflow-x-auto">
        <table className="w-full">
            <thead>
                <tr className="border-b border-surface-700">
                    {columns.map((col,i)=><th key={i} className={cn('px-4 py-3 text-left text-sm font-semibold text-surface-400',col.className)}>{col.header}</th>)}
                </tr>
            </thead>
            <tbody>
                {data.length===0?(
                    <tr><td colSpan={columns.length} className="px-4 py-8 text-center text-surface-500">{emptyMessage}</td></tr>
                ):(
                    data.map((row,i)=>(
                        <tr key={row.id||i} onClick={()=>onRowClick?.(row)} className={cn('border-b border-surface-800 table-row',onRowClick&&'cursor-pointer')}>
                            {columns.map((col,j)=><td key={j} className={cn('px-4 py-3 text-sm',col.className)}>{col.render?col.render(row):row[col.key]}</td>)}
                        </tr>
                    ))
                )}
            </tbody>
        </table>
    </div>
);

const ProgressBar=({value,max=100,color='blue',showLabel=true,size='md'})=>{
    const percent=max>0?Math.min(100,Math.round((value/max)*100)):0;
    const colors={blue:'bg-blue-500',green:'bg-emerald-500',red:'bg-red-500',yellow:'bg-amber-500',purple:'bg-purple-500'};
    const heights={sm:'h-1.5',md:'h-2.5',lg:'h-4'};
    return(
        <div className="w-full">
            <div className={cn('w-full bg-surface-700 rounded-full overflow-hidden',heights[size])}>
                <div className={cn('progress-bar rounded-full',colors[color])} style={{width:`${percent}%`}}/>
            </div>
            {showLabel&&<p className="text-xs text-surface-400 mt-1">{percent}%</p>}
        </div>
    );
};

const LoginPage=({onLogin,onRegister})=>{
    const[email,setEmail]=useState('');
    const[password,setPassword]=useState('');
    const[loading,setLoading]=useState(false);
    const[error,setError]=useState('');

    const handleSubmit=async(e)=>{
        e.preventDefault();
        if(!email||!password){setError('Email et mot de passe requis');return;}
        setLoading(true);setError('');
        try{
            const{data,error:authError}=await supabase.auth.signInWithPassword({email:email.toLowerCase().trim(),password});
            if(authError)throw authError;
            onLogin(data.user);
        }catch(e){
            setError(e.message==='Invalid login credentials'?'Email ou mot de passe incorrect':e.message);
        }
        setLoading(false);
    };

    return(
        <div className="min-h-screen bg-surface-950 flex items-center justify-center p-4">
            <div className="w-full max-w-md">

};

// ===== PAGE D'INSCRIPTION =====
const RegisterPage=({onLogin,onBack})=>{
    const[step,setStep]=useState(1);
    const[form,setForm]=useState({organisation:'',nom:'',prenom:'',email:'',password:''});
    const[loading,setLoading]=useState(false);
    const[error,setError]=useState('');

    const handleChange=(k,v)=>setForm(p=>({...p,[k]:v}));

    const handleSubmit=async()=>{
        if(!form.organisation||!form.nom||!form.prenom||!form.email||!form.password){setError('Tous les champs sont requis');return;}
        if(form.password.length<6){setError('Mot de passe: minimum 6 caractères');return;}
        setLoading(true);setError('');
        try{
            // 1. Créer le compte auth
            const{data:authData,error:authError}=await supabase.auth.signUp({
                email:form.email.toLowerCase().trim(),
                password:form.password,
                options:{data:{nom:form.nom,prenom:form.prenom}}
            });
            if(authError)throw authError;
            
            // 2. Créer l'organisation
            const{data:org,error:orgError}=await supabase.from('organisations').insert([{nom:form.organisation}]).select().single();
            if(orgError)throw orgError;
            
            // 3. Créer l'utilisateur
            await supabase.from('utilisateurs').insert([{
                organisation_id:org.id,
                auth_id:authData.user?.id,
                nom:form.nom,
                prenom:form.prenom,
                email:form.email.toLowerCase().trim(),
                role:'Admin'
            }]);
            
            // 4. Créer données initiales (départements, grades, etc.)
            await initOrganisationData(org.id);
            
            alert('Compte créé ! Vérifiez votre email puis connectez-vous.');
            onBack();
        }catch(e){
            setError(e.message?.includes('already registered')?'Cet email est déjà utilisé':e.message);
        }
        setLoading(false);
    };

    return(
        <div className="min-h-screen bg-surface-950 flex items-center justify-center p-4">
            <div className="w-full max-w-md">
                <div className="text-center mb-8">
                    <div className="w-16 h-16 gradient-primary rounded-2xl flex items-center justify-center text-white font-bold text-3xl shadow-lg mx-auto mb-4">K</div>
                    <h1 className="text-2xl font-bold text-white">Créer votre compte</h1>
                    <p className="text-surface-400 mt-2">Essai gratuit de 14 jours</p>
                </div>
                <div className="glass rounded-2xl p-6 space-y-4">
                    {error&&<div className="p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-sm">{error}</div>}
                    {step===1&&(<>
                        <Input label="Nom de votre cabinet" value={form.organisation} onChange={v=>handleChange('organisation',v)} placeholder="Ex: Mon Cabinet Conseil" required/>
                        <Button onClick={()=>form.organisation?setStep(2):setError('Nom requis')} className="w-full">Continuer →</Button>
                    </>)}
                    {step===2&&(<>
                        <div className="grid grid-cols-2 gap-3">
                            <Input label="Prénom" value={form.prenom} onChange={v=>handleChange('prenom',v)} required/>
                            <Input label="Nom" value={form.nom} onChange={v=>handleChange('nom',v)} required/>
                        </div>
                        <Input label="Email" type="email" value={form.email} onChange={v=>handleChange('email',v)} required/>
                        <Input label="Mot de passe" type="password" value={form.password} onChange={v=>handleChange('password',v)} placeholder="Min. 6 caractères" required/>
                        <div className="flex gap-3">
                            <Button variant="secondary" onClick={()=>setStep(1)} className="flex-1">← Retour</Button>
                            <Button onClick={handleSubmit} loading={loading} className="flex-1">Créer mon compte</Button>
                        </div>
                    </>)}
                </div>
                <p className="text-center text-surface-400 mt-6">
                    Déjà inscrit ? <button onClick={onBack} className="text-primary-400 font-semibold hover:underline">Se connecter</button>
                </p>
            </div>
        </div>
    );
};

// Initialiser les données de base d'une organisation
async function initOrganisationData(orgId){
    // Départements
    const depts=[
        {code:'AUD',nom:'Audit et Assurance',facturable:true,couleur:'#1e40af'},
        {code:'TAX',nom:'Tax and Legal',facturable:true,couleur:'#7c3aed'},
        {code:'CON',nom:'Consulting',facturable:true,couleur:'#059669'},
        {code:'OUT',nom:'Outsourcing',facturable:true,couleur:'#d97706'},
        {code:'FA',nom:'Financial Advisory',facturable:true,couleur:'#dc2626'},
    ];
    const{data:deptsData}=await supabase.from('departements').insert(depts.map(d=>({...d,organisation_id:orgId}))).select();
    
    // Grades
    const grades=[
        {code:'ASS',nom:'Associé',niveau:10,taux_journalier:1500000,taux_cible:40},
        {code:'DIR',nom:'Directeur',niveau:8,taux_journalier:900000,taux_cible:60},
        {code:'SM',nom:'Senior Manager',niveau:7,taux_journalier:650000,taux_cible:70},
        {code:'M',nom:'Manager',niveau:6,taux_journalier:450000,taux_cible:75},
        {code:'AM',nom:'Assistant Manager',niveau:5,taux_journalier:350000,taux_cible:80},
        {code:'S',nom:'Senior',niveau:4,taux_journalier:250000,taux_cible:85},
        {code:'J',nom:'Junior',niveau:3,taux_journalier:150000,taux_cible:90},
    ];
    await supabase.from('grades').insert(grades.map(g=>({...g,organisation_id:orgId})));
    
    // Catégories de tâches
    const cats=[
        {code:'AUDIT',nom:'Audit',facturable:true,couleur:'#1e40af'},
        {code:'CONSEIL',nom:'Conseil',facturable:true,couleur:'#059669'},
        {code:'TAX',nom:'Fiscalité',facturable:true,couleur:'#7c3aed'},
        {code:'ADMIN',nom:'Administratif',facturable:false,couleur:'#6b7280'},
        {code:'CONGE',nom:'Congés',facturable:false,couleur:'#ef4444'},
    ];
    await supabase.from('categories_taches').insert(cats.map(c=>({...c,organisation_id:orgId})));
}

const DashboardPage=()=>{
    const{org}=useApp();
    const[data,setData]=useState(null);
    const[loading,setLoading]=useState(true);
    
    useEffect(()=>{loadDashboard();},[]);
    
    const loadDashboard=async()=>{
        try{
            const[projets,temps,factures,opportunites]=await Promise.all([
                supabase.from('projets').select('*').eq('organisation_id',org.id).eq('statut','active'),
                supabase.from('saisies_temps').select('heures,facturable').eq('organisation_id',org.id).gte('date',new Date(new Date().setDate(1)).toISOString().split('T')[0]),
                supabase.from('factures').select('montant_total,statut').eq('organisation_id',org.id),
                supabase.from('opportunites').select('montant,etape').eq('organisation_id',org.id),
            ]);
            
            const totalHeures=temps.data?.reduce((s,t)=>s+t.heures,0)||0;
            const heuresFacturables=temps.data?.filter(t=>t.facturable).reduce((s,t)=>s+t.heures,0)||0;
            const caFacture=factures.data?.filter(f=>f.statut==='paid').reduce((s,f)=>s+f.montant_total,0)||0;
            const enCours=factures.data?.filter(f=>['sent','overdue'].includes(f.statut)).reduce((s,f)=>s+f.montant_total,0)||0;
            const pipeline=opportunites.data?.filter(o=>!['Gagné','Perdu'].includes(o.etape)).reduce((s,o)=>s+o.montant,0)||0;
            
            setData({
                projetsActifs:projets.data?.length||0,
                heuresMois:totalHeures,
                tauxCharge:totalHeures>0?Math.round((heuresFacturables/totalHeures)*100):0,
                caFacture,
                enCours,
                pipeline,
            });
        }catch(e){console.error(e);}
        setLoading(false);
    };
    
    if(loading)return<Loader/>;
    
    return(
        <div className="space-y-6 animate-fade-in">
            <div>
                <h1 className="text-2xl font-bold text-white">Tableau de bord</h1>
                <p className="text-surface-400">Vue d'ensemble de votre activité</p>
            </div>
            
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4">
                <StatCard title="Missions actives" value={data.projetsActifs} icon={Icons.projects} color="primary"/>
                <StatCard title="Heures ce mois" value={fmt(data.heuresMois)}  icon={Icons.timesheet} color="secondary"/>
                <StatCard title="Taux de charge" value={`${data.tauxCharge}%`} icon={Icons.reports} color="success"/>
                <StatCard title="CA Facturé" value={fmtMoney(data.caFacture)} icon={Icons.invoices} color="purple"/>
                <StatCard title="En cours" value={fmtMoney(data.enCours)} icon={Icons.arrowUp} color="warning"/>
                <StatCard title="Pipeline" value={fmtMoney(data.pipeline)} icon={Icons.pipeline} color="primary"/>
            </div>
            
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <Card title="Projets en cours">
                    <p className="text-surface-400 text-sm">Les données détaillées s'afficheront ici</p>
                </Card>
                <Card title="Temps récents">
                    <p className="text-surface-400 text-sm">Les temps saisis récemment</p>
                </Card>
            </div>
        </div>
    );
};

const ClientsPage=()=>{
    const{org}=useApp();
    const[clients,setClients]=useState([]);
    const[loading,setLoading]=useState(true);
    const[search,setSearch]=useState('');
    const[modalOpen,setModalOpen]=useState(false);
    const[editClient,setEditClient]=useState(null);
    
    useEffect(()=>{loadClients();},[]);
    
    const loadClients=async()=>{
        const{data}=await supabase.from('clients').select('*').eq('organisation_id',org.id).order('nom');
        setClients(data||[]);
        setLoading(false);
    };
    
    const filtered=clients.filter(c=>c.nom?.toLowerCase().includes(search.toLowerCase())||c.code?.toLowerCase().includes(search.toLowerCase()));
    
    const handleSave=async(formData)=>{
        if(editClient?.id){
            await supabase.from('clients').update(formData).eq('id',editClient.id);
        }else{
            await supabase.from('clients').insert([{...formData,organisation_id:org.id}]);
        }
        setModalOpen(false);
        setEditClient(null);
        loadClients();
    };
    
    const columns=[
        {header:'Code',key:'code',render:r=><span className="font-mono text-primary-400">{r.code}</span>},
        {header:'Nom',key:'nom',render:r=><span className="font-medium text-white">{r.nom}</span>},
        {header:'Ville',key:'ville'},
        {header:'Email',key:'email'},
        {header:'Actions',render:r=>(
            <div className="flex gap-2">
                <button onClick={(e)=>{e.stopPropagation();setEditClient(r);setModalOpen(true);}} className="p-1.5 hover:bg-surface-700 rounded-lg">{Icons.edit}</button>
            </div>
        )},
    ];
    
    return(
        <div className="space-y-6 animate-fade-in">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h1 className="text-2xl font-bold text-white">Clients</h1>
                    <p className="text-surface-400">{clients.length} clients</p>
                </div>
                <Button onClick={()=>{setEditClient(null);setModalOpen(true);}} icon={Icons.plus}>Nouveau client</Button>
            </div>
            
            <Card>
                <div className="mb-4">
                    <div className="relative">
                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-surface-400">{Icons.search}</span>
                        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher..." className="w-full pl-10 pr-4 py-2.5 bg-surface-800 border border-surface-600 rounded-xl text-white"/>
                    </div>
                </div>
                {loading?<Loader/>:<Table columns={columns} data={filtered} emptyMessage="Aucun client"/>}
            </Card>
            
            <ClientModal isOpen={modalOpen} onClose={()=>{setModalOpen(false);setEditClient(null);}} client={editClient} onSave={handleSave}/>
        </div>
    );
};

        {header:'Budget',render:r=>fmtMoney(r.budget_montant)},
    ];
    
    return(
        <div className="space-y-6 animate-fade-in">
            <div className="flex items-center justify-between">
                <div>
                    <h1 className="text-2xl font-bold text-white">Missions</h1>
                    <p className="text-surface-400">{projets.length} missions</p>
                </div>
                <Button icon={Icons.plus}>Nouvelle mission</Button>
            </div>
            <Card>{loading?<Loader/>:<Table columns={columns} data={projets}/>}</Card>
        </div>
    );
};

const TimesheetPage=()=>{
    const{org,user}=useApp();
    const[weekStart,setWeekStart]=useState(getWeekStart());
    const[entries,setEntries]=useState([]);
    const[projects,setProjects]=useState([]);
    const[loading,setLoading]=useState(true);
    
    const weekDays=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map((d,i)=>({label:d,date:addDays(weekStart,i)}));
    
    useEffect(()=>{loadData();},[weekStart]);
    
    const loadData=async()=>{
        setLoading(true);
        const weekEnd=addDays(weekStart,6);
        const[temps,projs]=await Promise.all([
            supabase.from('saisies_temps').select('*,projets(nom,code)').eq('organisation_id',org.id).eq('utilisateur_id',user.id).gte('date',weekStart).lte('date',weekEnd),
            supabase.from('projets').select('id,nom,code').eq('organisation_id',org.id).eq('statut','active'),
        ]);
        setEntries(temps.data||[]);
        setProjects(projs.data||[]);
        setLoading(false);
    };
    
    const totalWeek=entries.reduce((s,e)=>s+e.heures,0);
    
    return(
        <div className="space-y-6 animate-fade-in">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h1 className="text-2xl font-bold text-white">Saisie des temps</h1>
                    <p className="text-surface-400">Semaine du {fmtDate(weekStart)}</p>
                </div>
                <div className="flex items-center gap-2">
                    <Button variant="secondary" onClick={()=>setWeekStart(addDays(weekStart,-7))}>←</Button>
                    <Button variant="secondary" onClick={()=>setWeekStart(getWeekStart())}>Aujourd'hui</Button>
                    <Button variant="secondary" onClick={()=>setWeekStart(addDays(weekStart,7))}>→</Button>
                </div>
            </div>
            
            <Card>
                {loading?<Loader/>:(
                    <div className="overflow-x-auto">
                        <table className="w-full">
                            <thead>
                                <tr className="border-b border-surface-700">
                                    <th className="px-4 py-3 text-left text-sm font-semibold text-surface-400 w-48">Projet</th>
                                    {weekDays.map(d=><th key={d.date} className="px-2 py-3 text-center text-sm font-semibold text-surface-400 w-20">{d.label}<br/><span className="text-xs">{d.date.split('-')[2]}</span></th>)}
                                    <th className="px-4 py-3 text-right text-sm font-semibold text-surface-400">Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                {projects.map(p=>{
                                    const projectEntries=entries.filter(e=>e.projet_id===p.id);
                                    const total=projectEntries.reduce((s,e)=>s+e.heures,0);
                                    return(
                                        <tr key={p.id} className="border-b border-surface-800">
                                            <td className="px-4 py-2 text-sm"><span className="font-medium text-white">{p.nom}</span></td>
                                            {weekDays.map(d=>{
                                                const entry=projectEntries.find(e=>e.date===d.date);
                                                return<td key={d.date} className="px-2 py-2 text-center">
                                                    <input type="number" min="0" max="24" step="0.5" value={entry?.heures||''} placeholder="-" className="w-16 px-2 py-1.5 bg-surface-800 border border-surface-600 rounded-lg text-center text-white text-sm"/>
                                                </td>;
                                            })}
                                            <td className="px-4 py-2 text-right font-bold text-white">{total>0?total:'–'}</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                            <tfoot>
                                <tr className="bg-surface-800/50">
                                    <td className="px-4 py-3 font-bold text-white">Total</td>
                                    {weekDays.map(d=>{
                                        const dayTotal=entries.filter(e=>e.date===d.date).reduce((s,e)=>s+e.heures,0);
                                        return<td key={d.date} className="px-2 py-3 text-center font-bold text-primary-400">{dayTotal>0?dayTotal:'–'}</td>;
                                    })}
                                    <td className="px-4 py-3 text-right font-bold text-xl text-primary-400">{totalWeek}h</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                )}
                <div className="flex justify-end gap-3 mt-6 pt-4 border-t border-surface-700">
                    <Button variant="secondary">Enregistrer brouillon</Button>
                    <Button>Soumettre la semaine</Button>
                </div>
            </Card>
        </div>
    );
};

const InvoicesPage=()=>{
    const{org}=useApp();
    const[factures,setFactures]=useState([]);
    const[loading,setLoading]=useState(true);
    
    useEffect(()=>{
        supabase.from('factures').select('*,clients(nom)').eq('organisation_id',org.id).order('date_emission',{ascending:false})
        .then(({data})=>{setFactures(data||[]);setLoading(false);});
    },[]);
    
    const statusColors={draft:'gray',sent:'blue',paid:'green',overdue:'red',cancelled:'gray'};
    
    const columns=[
        {header:'N°',render:r=><span className="font-mono text-primary-400">{r.reference}</span>},
        {header:'Client',render:r=>r.clients?.nom},
        {header:'Date',render:r=>fmtDate(r.date_emission)},
        {header:'Montant',render:r=><span className="font-bold text-white">{fmtMoney(r.montant_total)}</span>},
        {header:'Statut',render:r=><Badge color={statusColors[r.statut]}>{INVOICE_STATUS[r.statut]}</Badge>},
    ];
    
    return(
        <div className="space-y-6 animate-fade-in">
            <div className="flex items-center justify-between">
                <div>
                    <h1 className="text-2xl font-bold text-white">Facturation</h1>
                    <p className="text-surface-400">{factures.length} factures</p>
                </div>
                <Button icon={Icons.plus}>Nouvelle facture</Button>
            </div>
            <Card>{loading?<Loader/>:<Table columns={columns} data={factures}/>}</Card>
        </div>
    );
};

// ===== APPLICATION RACINE =====
const App=()=>{
    const[user,setUser]=useState(null);
    const[loading,setLoading]=useState(true);
    const[page,setPage]=useState('login');
    
    useEffect(()=>{
        // Vérifier la session
        supabase.auth.getSession().then(({data:{session}})=>{
            setUser(session?.user||null);
            setLoading(false);
        });
        // Écouter les changements
        const{data:{subscription}}=supabase.auth.onAuthStateChange((event,session)=>{
            setUser(session?.user||null);
        });
        return()=>subscription.unsubscribe();
    },[]);
    
    const handleLogout=async()=>{
        await supabase.auth.signOut();
        setUser(null);
        setPage('login');
    };
    
    if(loading)return<div className="min-h-screen bg-surface-950 flex items-center justify-center"><div className="loader"/></div>;
    
    if(user)return<MainApp user={user} onLogout={handleLogout}/>;
    
    if(page==='register')return<RegisterPage onLogin={setUser} onBack={()=>setPage('login')}/>;
    return<LoginPage onLogin={setUser} onRegister={()=>setPage('register')}/>;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
