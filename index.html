const getWeekStart = (date = new Date()) => {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(d.setDate(diff)).toISOString().split('T')[0];
};

const addDays = (date, n) => {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
};

const isWeekend = (date) => {
  const d = new Date(date);
  return d.getDay() === 0 || d.getDay() === 6;
};

const isHoliday = (date, holidays = []) => holidays.includes(date);

const daysBetween = (start, end) => {
  const s = new Date(start);
  const e = new Date(end);
  return Math.ceil((e - s) / (1000 * 60 * 60 * 24));
};

const workingDaysBetween = (start, end, holidays = []) => {
  let count = 0;
  let current = new Date(start);
  const endDate = new Date(end);
  while (current <= endDate) {
    const dateStr = current.toISOString().split('T')[0];
    if (!isWeekend(dateStr) && !isHoliday(dateStr, holidays)) {
      count++;
    }
    current.setDate(current.getDate() + 1);
  }
  return count;
};

  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || !data) return;
    if (chartRef.current) chartRef.current.destroy();
    
    const ctx = canvasRef.current.getContext('2d');
    chartRef.current = new Chart(ctx, {
      type,
      data,
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {position: 'bottom', labels: {padding: 20, usePointStyle: true}},
          ...options.plugins
        },
        ...options
      }
    });
    
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [type, data, options]);

  return <div style={{height}}><canvas ref={canvasRef}></canvas></div>;
};

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!email || !password) return setError('Email et mot de passe requis');
    setLoading(true); setError('');
    try {
      const {data, error: err} = await supabase.auth.signInWithPassword({email: email.toLowerCase().trim(), password});
      if (err) throw err;
      onLogin(data.user);
    } catch (e) {
      setError(e.message === 'Invalid login credentials' ? 'Email ou mot de passe incorrect' : e.message);

  return (

const RegisterPage = ({onLogin, onBack, onConfirm}) => {

  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const set = (k, v) => setForm(p => ({...p, [k]: v}));

  const handleSubmit = async () => {
    if (!form.cabinet || !form.nom || !form.prenom || !form.email || !form.password) return setError('Tous les champs sont requis');
    if (form.password.length < 6) return setError('Le mot de passe doit contenir au moins 6 caractères');
    setLoading(true); setError('');
    try {
      const {data: auth, error: e1} = await supabase.auth.signUp({email: form.email.toLowerCase().trim(), password: form.password});
      if (e1) throw e1;
      
      const {data: org, error: e2} = await supabase.from('organisations').insert([{nom: form.cabinet}]).select().single();
      if (e2) throw e2;
      
      await supabase.from('utilisateurs').insert([{
        organisation_id: org.id, auth_id: auth.user?.id, nom: form.nom, prenom: form.prenom,
        email: form.email.toLowerCase().trim(), role: 'Admin'
      }]);
      
      const fin = new Date(); fin.setDate(fin.getDate() + 14);
      await supabase.from('abonnements').insert([{
        organisation_id: org.id, plan: 'trial', statut: 'actif',
        date_debut: new Date().toISOString(), date_fin: fin.toISOString()
      }]);
      
      await initOrgData(org.id);
      onConfirm(form.email);

          {step === 2 && (
            <>

// ========== SUPER ADMIN APP ==========
const SuperAdminApp = ({user, onLogout, onSwitchToOrg, hasOrg = true}) => {
  const [orgs, setOrgs] = useState([]);
  const [users, setUsers] = useState([]);
  const [abos, setAbos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('orgs');
  const [editOrg, setEditOrg] = useState(null);
  const [editForm, setEditForm] = useState({plan: 'trial', date_fin: ''});
  const [saving, setSaving] = useState(false);
  const [linkModal, setLinkModal] = useState(false);
  const [selectedOrg, setSelectedOrg] = useState('');

  useEffect(() => { loadData(); }, []);

  const linkToOrg = async () => {
    if (!selectedOrg) return alert('Sélectionnez une organisation');
    setSaving(true);
    try {
      // Vérifier si l'utilisateur existe déjà
      const {data: existingUser} = await supabase.from('utilisateurs').select('id').eq('auth_id', user.id).maybeSingle();
      
      if (existingUser) {
        // Mettre à jour
        const {error} = await supabase.from('utilisateurs').update({organisation_id: selectedOrg}).eq('id', existingUser.id);
        if (error) throw error;
      } else {
        // Créer
        const {error} = await supabase.from('utilisateurs').insert([{
          auth_id: user.id,
          organisation_id: selectedOrg,
          email: user.email,
          nom: 'Admin',
          prenom: 'Super',
          role: 'Admin'
        }]);
        if (error) throw error;
      }
      setLinkModal(false);
      setSaving(false);
      // Forcer le rechargement complet de la page
      window.location.href = window.location.href;
    } catch(e) { 
      console.error(e);
      alert('Erreur: ' + e.message); 
      setSaving(false);
    }
  };

  const loadData = async () => {
    const [o, u, a] = await Promise.all([
      supabase.from('organisations').select('*').order('created_at', {ascending: false}),
      supabase.from('utilisateurs').select('*,organisations(nom)').order('created_at', {ascending: false}),
      supabase.from('abonnements').select('*,organisations(nom)').order('created_at', {ascending: false})
    ]);
    setOrgs(o.data || []);
    setUsers(u.data || []);
    setAbos(a.data || []);
    setLoading(false);
  };

  const getAbo = (orgId) => abos.find(a => a.organisation_id === orgId);
  
  const openEdit = (org) => {
    const a = getAbo(org.id);
    setEditOrg(org);
    setEditForm({plan: a?.plan || 'trial', date_fin: a?.date_fin?.split('T')[0] || ''});
  };

  const saveAbo = async () => {
    if (!editOrg) return;
    setSaving(true);
    try {
      const a = getAbo(editOrg.id);
      const data = {
        organisation_id: editOrg.id,
        plan: editForm.plan,
        statut: 'actif',
        date_debut: new Date().toISOString(),
        date_fin: editForm.date_fin ? new Date(editForm.date_fin).toISOString() : null,
        montant: PLANS[editForm.plan]?.prix || 0
      };
      if (a?.id) await supabase.from('abonnements').update(data).eq('id', a.id);
      else await supabase.from('abonnements').insert([data]);
      await loadData();
      setEditOrg(null);
    } catch (e) { alert(e.message); }
    setSaving(false);
  };

  const stats = {
    total: orgs.length,
    trial: abos.filter(a => a.plan === 'trial').length,
    standard: abos.filter(a => a.plan === 'standard').length,
    premium: abos.filter(a => a.plan === 'premium').length
  };

  return (
    <div className="min-h-screen bg-slate-50">
      <header className="bg-white border-b border-slate-100 px-6 py-4 flex items-center justify-between sticky top-0 z-30">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 gradient-primary rounded-xl flex items-center justify-center text-white font-bold">K</div>
          <div>
            <div className="font-bold text-slate-800">KabiNet</div>
            <div className="text-xs text-amber-600 font-medium">🛡️ Super Admin</div>
          </div>
        </div>
        <div className="flex items-center gap-4">
          <span className="text-sm text-slate-500 hidden sm:block">{user.email}</span>
          {hasOrg ? (
            <Button variant="primary" size="sm" onClick={onSwitchToOrg}>🏢 Mon Cabinet</Button>
          ) : (
            <Button variant="warning" size="sm" onClick={() => setLinkModal(true)}>🔗 Lier à un cabinet</Button>
          )}
          <Button variant="secondary" size="sm" onClick={onLogout}>Déconnexion</Button>
        </div>
      </header>

      <div className="max-w-7xl mx-auto p-6">
        <h1 className="text-2xl font-bold text-slate-800 mb-6">Administration Globale</h1>

        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <StatCard title="Organisations" value={stats.total} icon="🏢" color="blue" />
          <StatCard title="Essais" value={stats.trial} icon="🎁" color="amber" />
          <StatCard title="Standard" value={stats.standard} icon="⭐" color="green" />
          <StatCard title="Premium" value={stats.premium} icon="👑" color="purple" />
        </div>

        <Card>
          <Tabs tabs={[
            {key: 'orgs', label: 'Organisations', icon: '🏢', count: orgs.length},
            {key: 'users', label: 'Utilisateurs', icon: '👥', count: users.length},
            {key: 'abos', label: 'Abonnements', icon: '💳', count: abos.length}
          ]} active={tab} onChange={setTab} />
          
          <div className="p-4">
            {loading ? <Loader /> : (
              <>
                {tab === 'orgs' && (
                  <Table columns={[
                    {header: 'Cabinet', render: r => <div><div className="font-medium text-slate-800">{r.nom}</div><div className="text-xs text-slate-400">{fmtDate(r.created_at)}</div></div>},
                    {header: 'Plan', render: r => {
                      const a = getAbo(r.id);
                      const plan = PLANS[a?.plan] || PLANS.trial;
                      return <Badge color={plan.color}>{plan.icon} {plan.nom}</Badge>;
                    }},
                    {header: 'Expire', render: r => {
                      const a = getAbo(r.id);
                      if (!a?.date_fin) return '-';
                      const days = daysBetween(today(), a.date_fin);
                      return <span className={days < 0 ? 'text-red-500 font-medium' : days < 7 ? 'text-amber-500' : ''}>{fmtDate(a.date_fin)}</span>;
                    }}
                  ]} data={orgs} actions={r => (
                    <Button variant="ghost" size="xs" onClick={() => openEdit(r)}>✏️</Button>
                  )} />
                )}
                
                {tab === 'users' && (
                  <Table columns={[
                    {header: 'Utilisateur', render: r => <div><div className="font-medium text-slate-800">{r.prenom} {r.nom}</div><div className="text-xs text-slate-400">{r.email}</div></div>},
                    {header: 'Cabinet', render: r => r.organisations?.nom || '-'},
                    {header: 'Rôle', render: r => <Badge color={r.role === 'Admin' ? 'blue' : 'gray'}>{r.role}</Badge>},
                    {header: 'Créé', render: r => fmtDate(r.created_at)}
                  ]} data={users} />
                )}
                
                {tab === 'abos' && (
                  <Table columns={[
                    {header: 'Cabinet', render: r => r.organisations?.nom || '-'},
                    {header: 'Plan', render: r => <Badge color={PLANS[r.plan]?.color || 'gray'}>{PLANS[r.plan]?.nom || r.plan}</Badge>},
                    {header: 'Statut', render: r => <Badge color={r.statut === 'actif' ? 'green' : 'red'}>{r.statut}</Badge>},
                    {header: 'Période', render: r => <span className="text-sm">{fmtDate(r.date_debut)} → {fmtDate(r.date_fin)}</span>}
                  ]} data={abos} />
                )}
              </>
            )}
          </div>
        </Card>
      </div>

      <Modal isOpen={!!editOrg} onClose={() => setEditOrg(null)} title={`Modifier: ${editOrg?.nom}`} size="sm">
        <div className="space-y-4">
          <Select label="Plan" value={editForm.plan} onChange={v => setEditForm(p => ({...p, plan: v}))}
            options={Object.entries(PLANS).map(([k, v]) => ({value: k, label: `${v.icon} ${v.nom} - ${v.prix > 0 ? fmt(v.prix) + ' F/mois' : 'Gratuit'}`}))} />
          <Input label="Date d'expiration" type="date" value={editForm.date_fin} onChange={v => setEditForm(p => ({...p, date_fin: v}))} />
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setEditOrg(null)} className="flex-1">Annuler</Button>
            <Button onClick={saveAbo} loading={saving} className="flex-1">Enregistrer</Button>
          </div>
        </div>
      </Modal>

      <Modal isOpen={linkModal} onClose={() => setLinkModal(false)} title="Lier votre compte à un cabinet" size="sm">
        <div className="space-y-4">
          <p className="text-slate-600 text-sm">Votre compte Super Admin n'est pas encore lié à un cabinet. Sélectionnez le cabinet auquel vous souhaitez accéder :</p>
          <Select label="Cabinet" value={selectedOrg} onChange={setSelectedOrg} 
            options={orgs.map(o => ({value: o.id, label: o.nom}))} placeholder="Sélectionner un cabinet" />
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setLinkModal(false)} className="flex-1">Annuler</Button>
            <Button onClick={linkToOrg} loading={saving} className="flex-1">Lier mon compte</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};
// ========== DASHBOARD PAGE ==========
const DashboardPage = () => {
  const {org, user} = useApp();
  const [stats, setStats] = useState({});
  const [loading, setLoading] = useState(true);

  useEffect(() => { loadStats(); }, []);

  const loadStats = async () => {
    const [clients, projets, temps, factures, collab] = await Promise.all([
      supabase.from('clients').select('id').eq('organisation_id', org.id),
      supabase.from('projets').select('id, statut, budget_montant, montant_facture').eq('organisation_id', org.id),
      supabase.from('saisies_temps').select('heures, facturable').eq('organisation_id', org.id),
      supabase.from('factures').select('montant_total, statut').eq('organisation_id', org.id),
      supabase.from('collaborateurs').select('id, actif').eq('organisation_id', org.id)
    ]);

    const projetsActifs = projets.data?.filter(p => p.statut === 'active') || [];
    const heuresTotal = temps.data?.reduce((s, t) => s + (t.heures || 0), 0) || 0;
    const heuresFact = temps.data?.filter(t => t.facturable).reduce((s, t) => s + (t.heures || 0), 0) || 0;
    const caEncaisse = factures.data?.filter(f => f.statut === 'paid').reduce((s, f) => s + (f.montant_total || 0), 0) || 0;
    const budgetTotal = projets.data?.reduce((s, p) => s + (p.budget_montant || 0), 0) || 0;
    const caFacture = factures.data?.reduce((s, f) => s + (f.montant_total || 0), 0) || 0;
    
    setStats({
      clients: clients.data?.length || 0,
      projetsActifs: projetsActifs.length,
      heuresTotal, heuresFact,
      tauxCharge: heuresTotal > 0 ? Math.round((heuresFact / heuresTotal) * 100) : 0,
      caEncaisse, budgetTotal, caFacture,
      resteFacturer: budgetTotal - caFacture,
      collaborateurs: collab.data?.filter(c => c.actif).length || 0
    });
    setLoading(false);
  };

  if (loading) return <Loader text="Chargement..." />;

  return (
    <div>
      <PageHeader title="Tableau de bord" subtitle={`Bienvenue, ${user.prenom} !`} />
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <StatCard title="Missions actives" value={stats.projetsActifs} icon="📋" color="blue" />
        <StatCard title="Heures saisies" value={fmt(stats.heuresTotal) + 'h'} subtitle={`${stats.tauxCharge}% facturable`} icon="⏱️" color="green" />
        <StatCard title="CA encaissé" value={fmtMoney(stats.caEncaisse)} icon="💰" color="purple" />
        <StatCard title="Reste à facturer" value={fmtMoney(stats.resteFacturer)} icon="📊" color="amber" />
      </div>
      <div className="grid lg:grid-cols-2 gap-6">
        <Card title="📊 Indicateurs">
          <div className="space-y-4">
            <div><div className="flex justify-between text-sm mb-1"><span>Budget consommé</span><span className="font-medium">{stats.budgetTotal > 0 ? Math.round((stats.caFacture / stats.budgetTotal) * 100) : 0}%</span></div><ProgressBar value={stats.caFacture} max={stats.budgetTotal} color="blue" showLabel={false} /></div>
            <div><div className="flex justify-between text-sm mb-1"><span>Taux chargeabilité</span><span className="font-medium">{stats.tauxCharge}%</span></div><ProgressBar value={stats.heuresFact} max={stats.heuresTotal} color="green" showLabel={false} /></div>
            <div className="grid grid-cols-2 gap-4 pt-4 border-t"><div className="text-center"><div className="text-2xl font-bold">{stats.clients}</div><div className="text-sm text-slate-500">Clients</div></div><div className="text-center"><div className="text-2xl font-bold">{stats.collaborateurs}</div><div className="text-sm text-slate-500">Collaborateurs</div></div></div>
          </div>
        </Card>
        <Card title="🎯 Actions rapides">
          <div className="grid grid-cols-2 gap-3">
            <button className="p-4 bg-blue-50 rounded-xl text-left hover:bg-blue-100 transition-colors"><div className="text-2xl mb-2">➕</div><div className="font-medium">Nouvelle mission</div></button>
            <button className="p-4 bg-green-50 rounded-xl text-left hover:bg-green-100 transition-colors"><div className="text-2xl mb-2">⏱️</div><div className="font-medium">Saisir mes temps</div></button>
            <button className="p-4 bg-purple-50 rounded-xl text-left hover:bg-purple-100 transition-colors"><div className="text-2xl mb-2">💰</div><div className="font-medium">Créer facture</div></button>
            <button className="p-4 bg-amber-50 rounded-xl text-left hover:bg-amber-100 transition-colors"><div className="text-2xl mb-2">🏖️</div><div className="font-medium">Demander congé</div></button>
          </div>
        </Card>
      </div>
    </div>
  );
};

const CRMPage = () => {
  const {org} = useApp();
  const [tab, setTab] = useState('clients');
  const [clients, setClients] = useState([]);
  const [contacts, setContacts] = useState([]);
  const [opportunites, setOpportunites] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [modal, setModal] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);

  useEffect(() => { loadData(); }, []);

  const loadData = async () => {
    const [c, co, op] = await Promise.all([
      supabase.from('clients').select('*').eq('organisation_id', org.id).order('nom'),
      supabase.from('contacts').select('*,clients(nom)').eq('organisation_id', org.id).order('nom'),
      supabase.from('opportunites').select('*,clients(nom)').eq('organisation_id', org.id).order('created_at', {ascending: false})
    ]);
    setClients(c.data || []);
    setContacts(co.data || []);
    setOpportunites(op.data || []);
    setLoading(false);
  };

  // CLIENT CRUD
  const openNewClient = () => { setEditItem(null); setForm({code: genCode('CLI'), type_client: 'entreprise', nom: '', denomination: '', ninea: '', adresse: '', ville: 'DAKAR', email: '', telephone: ''}); setModal('client'); };
  const openEditClient = (c) => { setEditItem(c); setForm({...c}); setModal('client'); };
  const saveClient = async () => {
    if (!form.nom && !form.denomination) return alert('Nom requis');
    setSaving(true);
    try {
      const data = {...form, nom: form.denomination || form.nom};
      if (editItem?.id) await supabase.from('clients').update(data).eq('id', editItem.id);
      else await supabase.from('clients').insert([{...data, organisation_id: org.id}]);
      setModal(null); loadData();
    } catch (e) { alert(e.message); }
    setSaving(false);
  };
  const deleteClient = async (c) => { if (!confirm(`Supprimer "${c.nom}" ?`)) return; await supabase.from('clients').delete().eq('id', c.id); loadData(); };

  // CONTACT CRUD
  const openNewContact = (clientId = '') => { setEditItem(null); setForm({client_id: clientId, nom: '', prenom: '', fonction: '', email: '', telephone: '', principal: false}); setModal('contact'); };
  const openEditContact = (c) => { setEditItem(c); setForm({...c}); setModal('contact'); };
  const saveContact = async () => {
    if (!form.nom || !form.client_id) return alert('Client et nom requis');
    setSaving(true);
    try {
      const data = {
        client_id: form.client_id,
        nom: form.nom,
        prenom: form.prenom || '',
        fonction: form.fonction || '',
        email: form.email || '',
        telephone: form.telephone || '',
        mobile: form.mobile || '',
        principal: form.principal || false
      };
      
      let result;
      if (editItem?.id) {
        result = await supabase.from('contacts').update(data).eq('id', editItem.id);
      } else {
        result = await supabase.from('contacts').insert([{...data, organisation_id: org.id}]);
      }
      
      if (result.error) throw result.error;
      setModal(null); loadData();
    } catch (e) { 
      console.error('Contact save error:', e);
      alert('Erreur: ' + e.message); 
    }
    setSaving(false);
  };
  const deleteContact = async (c) => { if (!confirm(`Supprimer "${c.prenom} ${c.nom}" ?`)) return; await supabase.from('contacts').delete().eq('id', c.id); loadData(); };

        nom: form.nom,

      let result;

        result = await supabase.from('opportunites').update(data).eq('id', editItem.id);
      } else {
        result = await supabase.from('opportunites').insert([{...data, organisation_id: org.id}]);
      }
      
      if (result.error) throw result.error;
      setModal(null); loadData();
    } catch (e) { 
      console.error('Opportunite save error:', e);
      alert('Erreur: ' + e.message); 
    }
    setSaving(false);

            <div className="flex gap-4 mb-4"><SearchInput value={search} onChange={setSearch} placeholder="Rechercher..." className="flex-1" /><Select value="" onChange={() => {}} options={CLIENT_TYPES} placeholder="Type" className="w-40" /></div>
            <Table columns={[
              {header: 'Client', render: r => <div><div className="font-medium">{r.nom}</div><div className="text-xs text-slate-400">{r.code} • {CLIENT_TYPES.find(t => t.value === r.type_client)?.label}</div></div>},
              {header: 'NINEA', render: r => r.ninea || '-'},
              {header: 'Ville', key: 'ville'},
              {header: 'Contact', render: r => <div className="text-sm"><div>{r.email}</div><div className="text-slate-400">{r.telephone}</div></div>}
            ]} data={filteredClients} actions={r => <div className="flex gap-1"><Button variant="ghost" size="xs" onClick={() => openNewContact(r.id)}>👤</Button><Button variant="ghost" size="xs" onClick={() => openEditClient(r)}>✏️</Button><Button variant="ghost" size="xs" onClick={() => deleteClient(r)}>🗑️</Button></div>} />
          </Card>
        )}

        {tab === 'contacts' && (
          <Card>
            <div className="mb-4"><SearchInput value={search} onChange={setSearch} placeholder="Rechercher..." /></div>
            <Table columns={[
              {header: 'Contact', render: r => <div><div className="font-medium">{r.prenom} {r.nom}</div><div className="text-xs text-slate-400">{r.fonction}</div></div>},
              {header: 'Client', render: r => r.clients?.nom || '-'},
              {header: 'Email', key: 'email'},
              {header: 'Téléphone', render: r => r.telephone || '-'},
              {header: 'Principal', render: r => r.principal ? <Badge color="green">✓</Badge> : ''}
            ]} data={filteredContacts} actions={r => <div className="flex gap-1"><Button variant="ghost" size="xs" onClick={() => openEditContact(r)}>✏️</Button><Button variant="ghost" size="xs" onClick={() => deleteContact(r)}>🗑️</Button></div>} />
          </Card>
        )}

        {tab === 'opportunites' && (
          <Card action={<Button size="sm" onClick={openNewOpp} icon="➕">Opportunité</Button>}>
            <div className="grid grid-cols-3 gap-4 mb-6 p-4 bg-slate-50 rounded-xl">
              <div className="text-center"><div className="text-2xl font-bold">{oppActives.length}</div><div className="text-sm text-slate-500">En cours</div></div>
              <div className="text-center"><div className="text-2xl font-bold text-green-600">{fmtMoney(totalPipeline)}</div><div className="text-sm text-slate-500">Pipeline pondéré</div></div>
              <div className="text-center"><div className="text-2xl font-bold">{opportunites.filter(o => o.stage === 'gagne').length}</div><div className="text-sm text-slate-500">Gagnées</div></div>
            </div>
            <Table columns={[
              {header: 'Opportunité', render: r => <div><div className="font-medium">{r.nom}</div><div className="text-xs text-slate-400">{r.code}</div></div>},
              {header: 'Client', render: r => r.clients?.nom || '-'},
              {header: 'Montant', render: r => <span className="font-medium">{fmtMoney(r.montant)}</span>},
              {header: 'Proba', render: r => <span>{r.probabilite}%</span>},
              {header: 'Stage', render: r => { const s = OPPORTUNITY_STAGES.find(s => s.id === r.stage); return <Badge color={s?.color}>{s?.nom}</Badge>; }},
              {header: 'Clôture', render: r => r.date_cloture_prevue ? fmtDate(r.date_cloture_prevue) : '-'}
            ]} data={opportunites} actions={r => <div className="flex gap-1"><Button variant="ghost" size="xs" onClick={() => openEditOpp(r)}>✏️</Button></div>} />
          </Card>
        )}

        {tab === 'pipeline' && (
          <div className="flex gap-4 overflow-x-auto pb-4">
            {OPPORTUNITY_STAGES.filter(s => !['gagne', 'perdu'].includes(s.id)).map(stage => {
              const opps = opportunites.filter(o => o.stage === stage.id);
              const total = opps.reduce((s, o) => s + o.montant, 0);
              return (
                <div key={stage.id} className="pipeline-stage flex-shrink-0">
                  <div className="bg-slate-100 rounded-t-xl p-3">
                    <div className="flex justify-between items-center"><span className="font-medium">{stage.nom}</span><Badge color={stage.color}>{opps.length}</Badge></div>
                    <div className="text-sm text-slate-500 mt-1">{fmtMoney(total)}</div>
                  </div>
                  <div className="bg-slate-50 rounded-b-xl p-2 min-h-[300px] space-y-2">
                    {opps.map(o => (
                      <div key={o.id} className="kanban-card bg-white p-3 rounded-lg shadow-sm border hover:shadow-md transition-shadow cursor-pointer" onClick={() => openEditOpp(o)}>
                        <div className="font-medium text-sm">{o.nom}</div>
                        <div className="text-xs text-slate-400">{o.clients?.nom}</div>
                        <div className="flex justify-between items-center mt-2">
                          <span className="text-sm font-medium text-green-600">{fmtMoney(o.montant)}</span>
                          <span className="text-xs text-slate-400">{o.probabilite}%</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </>)}

      {/* MODAL CLIENT */}
      <Modal isOpen={modal === 'client'} onClose={() => setModal(null)} title={editItem ? 'Modifier client' : 'Nouveau client'} size="lg">
        <div className="space-y-4">
          <Select label="Type de client" value={form.type_client} onChange={v => setForm(p => ({...p, type_client: v}))} options={CLIENT_TYPES} required />
          {form.type_client === 'entreprise' ? (<>
            <div className="grid grid-cols-2 gap-4"><Input label="Code" value={form.code} onChange={v => setForm(p => ({...p, code: v}))} /><Input label="NINEA" value={form.ninea} onChange={v => setForm(p => ({...p, ninea: v}))} /></div>
            <Input label="Dénomination sociale" value={form.denomination} onChange={v => setForm(p => ({...p, denomination: v}))} required />
          </>) : (
            <div className="grid grid-cols-2 gap-4"><Input label="Code" value={form.code} onChange={v => setForm(p => ({...p, code: v}))} /><Input label="Nom" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} required /></div>
          )}
          <Input label="Adresse" value={form.adresse} onChange={v => setForm(p => ({...p, adresse: v}))} />
          <div className="grid grid-cols-2 gap-4"><Input label="Ville" value={form.ville} onChange={v => setForm(p => ({...p, ville: v}))} /><Input label="Pays" value={form.pays || 'Sénégal'} onChange={v => setForm(p => ({...p, pays: v}))} /></div>
          <div className="grid grid-cols-2 gap-4"><Input label="Email" type="email" value={form.email} onChange={v => setForm(p => ({...p, email: v}))} /><Input label="Téléphone" value={form.telephone} onChange={v => setForm(p => ({...p, telephone: v}))} /></div>
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button><Button onClick={saveClient} loading={saving} className="flex-1">Enregistrer</Button></div>
        </div>
      </Modal>

      {/* MODAL CONTACT */}
      <Modal isOpen={modal === 'contact'} onClose={() => setModal(null)} title={editItem ? 'Modifier contact' : 'Nouveau contact'}>
        <div className="space-y-4">
          <Select label="Client" value={form.client_id} onChange={v => setForm(p => ({...p, client_id: v}))} options={clients.map(c => ({value: c.id, label: c.nom}))} placeholder="Sélectionner" required />
          <div className="grid grid-cols-2 gap-4"><Input label="Prénom" value={form.prenom} onChange={v => setForm(p => ({...p, prenom: v}))} /><Input label="Nom" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} required /></div>
          <Input label="Fonction" value={form.fonction} onChange={v => setForm(p => ({...p, fonction: v}))} placeholder="Ex: Directeur Financier" />
          <div className="grid grid-cols-2 gap-4"><Input label="Email" type="email" value={form.email} onChange={v => setForm(p => ({...p, email: v}))} /><Input label="Téléphone" value={form.telephone} onChange={v => setForm(p => ({...p, telephone: v}))} /></div>
          <Checkbox label="Contact principal" checked={form.principal} onChange={v => setForm(p => ({...p, principal: v}))} />
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button><Button onClick={saveContact} loading={saving} className="flex-1">Enregistrer</Button></div>
        </div>
      </Modal>

      {/* MODAL OPPORTUNITE */}
      <Modal isOpen={modal === 'opportunite'} onClose={() => setModal(null)} title={editItem ? 'Modifier opportunité' : 'Nouvelle opportunité'}>
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4"><Input label="Code" value={form.code} onChange={v => setForm(p => ({...p, code: v}))} /><Select label="Client" value={form.client_id} onChange={v => setForm(p => ({...p, client_id: v}))} options={clients.map(c => ({value: c.id, label: c.nom}))} placeholder="Sélectionner" required /></div>
          <Input label="Nom de l'opportunité" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} required />
          <div className="grid grid-cols-3 gap-4"><Input label="Montant (FCFA)" type="number" value={form.montant} onChange={v => setForm(p => ({...p, montant: v}))} /><Input label="Probabilité (%)" type="number" value={form.probabilite} onChange={v => setForm(p => ({...p, probabilite: v}))} min={0} max={100} /><Select label="Étape" value={form.stage} onChange={v => setForm(p => ({...p, stage: v}))} options={OPPORTUNITY_STAGES.map(s => ({value: s.id, label: s.nom}))} /></div>
          <Input label="Date clôture prévue" type="date" value={form.date_cloture_prevue} onChange={v => setForm(p => ({...p, date_cloture_prevue: v}))} />
          <TextArea label="Description" value={form.description} onChange={v => setForm(p => ({...p, description: v}))} rows={3} />
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button><Button onClick={saveOpp} loading={saving} className="flex-1">Enregistrer</Button></div>
        </div>
      </Modal>
    </div>
  );
};
// ========== MISSIONS PAGE ==========
const MissionsPage = () => {
  const {org} = useApp();
  const [missions, setMissions] = useState([]);
  const [clients, setClients] = useState([]);
  const [depts, setDepts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [modal, setModal] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [acomptes, setAcomptes] = useState([]);

  useEffect(() => { loadData(); }, []);

  const loadData = async () => {
    const [m, c, d, a] = await Promise.all([
      supabase.from('projets').select('*,clients(nom),departements(nom)').eq('organisation_id', org.id).order('created_at', {ascending: false}),
      supabase.from('clients').select('id,nom').eq('organisation_id', org.id),
      supabase.from('departements').select('id,nom').eq('organisation_id', org.id),
      supabase.from('acomptes').select('*').eq('organisation_id', org.id)
    ]);
    setMissions(m.data || []);
    setClients(c.data || []);
    setDepts(d.data || []);
    setAcomptes(a.data || []);
    setLoading(false);
  };

  const openNew = () => {
    setEditItem(null);
    setForm({
      code: genCode('MIS'), nom: '', client_id: '', departement_id: '',
      type_facturation: 'regie', statut: 'draft', budget_montant: 0,
      date_debut: today(), date_fin_prevue: '', description: '', facturable: true
    });
    setModal('mission');
  };

  const openEdit = (m) => {
    setEditItem(m);
    setForm({...m, date_debut: m.date_debut?.split('T')[0] || '', date_fin_prevue: m.date_fin_prevue?.split('T')[0] || ''});
    setModal('mission');
  };

  const save = async () => {
    if (!form.nom || !form.client_id) return alert('Client et nom requis');
    setSaving(true);
    try {
      // Ne garder que les champs valides pour la table projets
      const data = {
        code: form.code,
        nom: form.nom,
        client_id: form.client_id || null,
        departement_id: form.departement_id || null,
        type_facturation: form.type_facturation,
        statut: form.statut,
        budget_montant: parseFloat(form.budget_montant) || 0,
        date_debut: form.date_debut || null,
        date_fin_prevue: form.date_fin_prevue || null,
        description: form.description || '',
        facturable: form.facturable !== false
      };
      
      if (editItem?.id) {
        const {error} = await supabase.from('projets').update(data).eq('id', editItem.id);
        if (error) throw error;
      } else {
        const {error} = await supabase.from('projets').insert([{...data, organisation_id: org.id}]);
        if (error) throw error;
      }
      setModal(null); 
      loadData();
    } catch (e) { 
      console.error('Save error:', e);
      alert('Erreur: ' + e.message); 
    }
    setSaving(false);
  };

  const openAcomptes = (m) => { setEditItem(m); setModal('acomptes'); };

  const deleteMission = async (m) => {
    // Vérifier s'il y a des heures saisies sur cette mission
    const {data: temps} = await supabase.from('saisies_temps').select('id').eq('projet_id', m.id);
    const hasTemps = temps && temps.length > 0;
    
    let confirmMsg = `Supprimer la mission "${m.nom}" ?`;
    if (hasTemps) {
      confirmMsg = `⚠️ ATTENTION: Cette mission a ${temps.length} saisie(s) de temps.\n\nSupprimer la mission "${m.nom}" ?\n\nToutes les heures et factures liées seront supprimées.`;
    }
    
    if (!confirm(confirmMsg)) return;
    
    // Supprimer les données liées
    await supabase.from('saisies_temps').delete().eq('projet_id', m.id);
    await supabase.from('acomptes').delete().eq('projet_id', m.id);
    await supabase.from('factures').delete().eq('projet_id', m.id);
    // Supprimer la mission
    await supabase.from('projets').delete().eq('id', m.id);
    
    loadData();
  };

  const addAcompte = async () => {
    const missionAcomptes = acomptes.filter(a => a.projet_id === editItem.id);
    const totalAcomptes = missionAcomptes.reduce((s, a) => s + (a.montant || 0), 0);
    const reste = (editItem.budget_montant || 0) - totalAcomptes;
    const num = missionAcomptes.length + 1;
    
    const montant = parseFloat(prompt(`Montant de l'acompte ${num} (Reste: ${fmt(reste)} F):`, reste)) || 0;
    if (montant <= 0) return;
    
    await supabase.from('acomptes').insert([{
      organisation_id: org.id,
      projet_id: editItem.id,
      numero: num,
      montant,
      date_prevu: today(),
      statut: 'prevu'
    }]);
    
    const newTotal = totalAcomptes + montant;
    await supabase.from('projets').update({montant_facture: newTotal}).eq('id', editItem.id);
    loadData();
  };

  const getMissionAcomptes = (missionId) => acomptes.filter(a => a.projet_id === missionId);
  const getMissionTotalFacture = (m) => getMissionAcomptes(m.id).reduce((s, a) => s + (a.montant || 0), 0);
  const getMissionResteFacturer = (m) => (m.budget_montant || 0) - getMissionTotalFacture(m);
  const getMissionProgress = (m) => m.budget_montant > 0 ? Math.round((getMissionTotalFacture(m) / m.budget_montant) * 100) : 0;

  // Calcul dépassement délai
  const getDelaiStatus = (m) => {
    if (!m.date_fin_prevue) return null;
    const days = daysBetween(today(), m.date_fin_prevue);
    if (m.statut === 'completed') return {status: 'ok', label: 'Terminé'};
    if (days < 0) return {status: 'late', label: `${Math.abs(days)}j de retard`, color: 'red'};
    if (days <= 7) return {status: 'warning', label: `${days}j restants`, color: 'yellow'};
    return {status: 'ok', label: `${days}j restants`, color: 'green'};
  };

  const filtered = missions.filter(m => {
    if (search && !m.nom?.toLowerCase().includes(search.toLowerCase()) && !m.code?.toLowerCase().includes(search.toLowerCase())) return false;
    if (filterStatus && m.statut !== filterStatus) return false;
    return true;
  });

  const stats = {
    total: missions.length,
    actives: missions.filter(m => m.statut === 'active').length,
    budget: missions.reduce((s, m) => s + (m.budget_montant || 0), 0),
    facture: missions.reduce((s, m) => s + getMissionTotalFacture(m), 0)
  };

  return (
    <div>
      <PageHeader title="Missions" subtitle={`${stats.actives} actives sur ${stats.total} • Budget: ${fmtMoney(stats.budget)}`}
        action={<Button onClick={openNew} icon="➕">Nouvelle mission</Button>} />

      {loading ? <Loader /> : (
        <Card>
          <div className="flex flex-col sm:flex-row gap-4 mb-4">
            <SearchInput value={search} onChange={setSearch} placeholder="Rechercher..." className="flex-1" />
            <Select value={filterStatus} onChange={setFilterStatus} options={Object.entries(MISSION_STATUS).map(([k, v]) => ({value: k, label: v.label}))} placeholder="Tous statuts" className="w-40" />
          </div>

          <Table columns={[
            {header: 'Mission', render: r => (
              <div>
                <div className="font-medium">{r.nom}</div>
                <div className="text-xs text-slate-400">{r.code}</div>
              </div>
            )},
            {header: 'Client', render: r => r.clients?.nom || '-'},
            {header: 'Type', render: r => <Badge>{r.type_facturation === 'forfait' ? 'Forfait' : 'Régie'}</Badge>},
            {header: 'Budget', render: r => (
              <div>
                <div className="font-medium">{fmtMoney(r.budget_montant)}</div>
                <ProgressBar value={getMissionTotalFacture(r)} max={r.budget_montant} color={getMissionProgress(r) >= 100 ? 'green' : 'blue'} size="sm" showLabel={false} />
                <div className="text-xs text-slate-400 mt-1">Reste: {fmtMoney(getMissionResteFacturer(r))}</div>
              </div>
            )},
            {header: 'Délai', render: r => {
              const d = getDelaiStatus(r);
              if (!d) return '-';
              return <Badge color={d.color}>{d.label}</Badge>;
            }},
            {header: 'Statut', render: r => <Badge color={MISSION_STATUS[r.statut]?.color}>{MISSION_STATUS[r.statut]?.label}</Badge>}
          ]} data={filtered} actions={r => (
            <div className="flex gap-1">
              <Button variant="ghost" size="xs" onClick={() => openAcomptes(r)} title="Acomptes">💰</Button>
              <Button variant="ghost" size="xs" onClick={() => openEdit(r)} title="Modifier">✏️</Button>
              <Button variant="ghost" size="xs" onClick={() => deleteMission(r)} title="Supprimer">🗑️</Button>
            </div>
          )} />
        </Card>
      )}

      {/* MODAL MISSION */}
      <Modal isOpen={modal === 'mission'} onClose={() => setModal(null)} title={editItem ? 'Modifier mission' : 'Nouvelle mission'} size="lg">
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4">
            <Input label="Code" value={form.code} onChange={v => setForm(p => ({...p, code: v}))} />
            <Select label="Client" value={form.client_id} onChange={v => setForm(p => ({...p, client_id: v}))} options={clients.map(c => ({value: c.id, label: c.nom}))} placeholder="Sélectionner" required />
          </div>
          <Input label="Nom de la mission" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} required />
          <div className="grid grid-cols-3 gap-4">
            <Select label="Département" value={form.departement_id} onChange={v => setForm(p => ({...p, departement_id: v}))} options={depts.map(d => ({value: d.id, label: d.nom}))} placeholder="Sélectionner" />
            <Select label="Type facturation" value={form.type_facturation} onChange={v => setForm(p => ({...p, type_facturation: v}))} options={BILLING_TYPES} />
            <Select label="Statut" value={form.statut} onChange={v => setForm(p => ({...p, statut: v}))} options={Object.entries(MISSION_STATUS).map(([k, v]) => ({value: k, label: v.label}))} />
          </div>
          <div className="grid grid-cols-3 gap-4">
            <Input label="Budget (FCFA)" type="number" value={form.budget_montant} onChange={v => setForm(p => ({...p, budget_montant: v}))} />
            <Input label="Date début" type="date" value={form.date_debut} onChange={v => setForm(p => ({...p, date_debut: v}))} />
            <Input label="Date fin prévue" type="date" value={form.date_fin_prevue} onChange={v => setForm(p => ({...p, date_fin_prevue: v}))} />
          </div>
          <TextArea label="Description" value={form.description} onChange={v => setForm(p => ({...p, description: v}))} rows={3} />
          <Checkbox label="Mission facturable" checked={form.facturable} onChange={v => setForm(p => ({...p, facturable: v}))} />
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button>
            <Button onClick={save} loading={saving} className="flex-1">Enregistrer</Button>
          </div>
        </div>
      </Modal>

      {/* MODAL ACOMPTES */}
      <Modal isOpen={modal === 'acomptes'} onClose={() => setModal(null)} title={`Acomptes - ${editItem?.nom}`} size="md">
        {editItem && (
          <div>
            <div className="p-4 bg-slate-50 rounded-xl mb-4">
              <div className="grid grid-cols-3 gap-4 text-center">
                <div><div className="text-sm text-slate-500">Budget</div><div className="text-xl font-bold">{fmtMoney(editItem.budget_montant)}</div></div>
                <div><div className="text-sm text-slate-500">Facturé</div><div className="text-xl font-bold text-green-600">{fmtMoney(getMissionTotalFacture(editItem))}</div></div>
                <div><div className="text-sm text-slate-500">Reste</div><div className="text-xl font-bold text-amber-600">{fmtMoney(getMissionResteFacturer(editItem))}</div></div>
              </div>
              <ProgressBar value={getMissionTotalFacture(editItem)} max={editItem.budget_montant} color="green" className="mt-4" />
            </div>

            <div className="space-y-2 mb-4">
              {getMissionAcomptes(editItem.id).map((a, i) => (
                <div key={a.id} className="flex items-center justify-between p-3 bg-white border rounded-xl">
                  <div>
                    <div className="font-medium">Acompte {a.numero}</div>
                    <div className="text-sm text-slate-400">{fmtDate(a.date_prevu)}</div>
                  </div>
                  <div className="text-right">
                    <div className="font-bold">{fmtMoney(a.montant)}</div>
                    <Badge color={a.statut === 'facture' ? 'green' : a.statut === 'prevu' ? 'blue' : 'gray'}>{a.statut}</Badge>
                  </div>
                </div>
              ))}
              {getMissionAcomptes(editItem.id).length === 0 && <p className="text-center text-slate-400 py-4">Aucun acompte</p>}
            </div>

            {getMissionResteFacturer(editItem) > 0 && (
              <Button onClick={addAcompte} className="w-full" icon="➕">Ajouter un acompte</Button>
            )}
          </div>
        )}
      </Modal>
    </div>
  );
};

// ========== STAFFING PAGE ==========

  const loadData = async () => {
    const [a, c, m] = await Promise.all([
      supabase.from('affectations').select('*,collaborateurs(nom,prenom),projets(nom,code)').eq('organisation_id', org.id),
      supabase.from('collaborateurs').select('*,grades(nom)').eq('organisation_id', org.id).eq('actif', true).order('nom'),
      supabase.from('projets').select('id,nom,code').eq('organisation_id', org.id).eq('statut', 'active')
    ]);
    setAffectations(a.data || []);
    setCollaborateurs(c.data || []);
    setMissions(m.data || []);
    setLoading(false);
  };

  const days = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven'].map((d, i) => ({label: d, date: addDays(weekStart, i)}));

  const getAffectation = (collabId, date) => affectations.find(a => a.collaborateur_id === collabId && a.date === date);

  const openNew = (collabId = '', date = '') => {
    setForm({collaborateur_id: collabId, projet_id: '', date: date || today(), heures: 8});
    setModal(true);
  };

  const saveAffectation = async () => {
    if (!form.collaborateur_id || !form.projet_id) return alert('Collaborateur et mission requis');
    setSaving(true);
    try {
      const existing = getAffectation(form.collaborateur_id, form.date);
      if (existing) await supabase.from('affectations').update(form).eq('id', existing.id);
      else await supabase.from('affectations').insert([{...form, organisation_id: org.id}]);
      setModal(false); loadData();
    } catch (e) { alert(e.message); }
    setSaving(false);
  };

  const deleteAffectation = async (a) => {
    await supabase.from('affectations').delete().eq('id', a.id);
    loadData();
  };

  // Calcul disponibilité
  const getCollabLoad = (collabId) => {
    const weekAff = affectations.filter(a => {
      if (a.collaborateur_id !== collabId) return false;
      return a.date >= weekStart && a.date <= addDays(weekStart, 4);
    });
    return weekAff.reduce((s, a) => s + (a.heures || 0), 0);
  };

  return (
    <div>
      <PageHeader title="Staffing" subtitle="Planning des affectations"
        action={<div className="flex gap-2">
          <Button variant="secondary" onClick={() => setWeekStart(addDays(weekStart, -7))}>← Sem. préc.</Button>
          <Button variant="secondary" onClick={() => setWeekStart(getWeekStart())}>Aujourd'hui</Button>
          <Button variant="secondary" onClick={() => setWeekStart(addDays(weekStart, 7))}>Sem. suiv. →</Button>
          <Button onClick={() => openNew()} icon="➕">Affecter</Button>
        </div>}
      />

      {loading ? <Loader /> : (
        <Card title={`Semaine du ${fmtDate(weekStart)}`}>
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead>
                <tr className="border-b">
                  <th className="px-4 py-3 text-left w-48">Collaborateur</th>
                  {days.map(d => <th key={d.date} className="px-2 py-3 text-center w-32">{d.label}<br/><span className="text-xs text-slate-400">{d.date.split('-')[2]}</span></th>)}
                  <th className="px-4 py-3 text-center w-24">Charge</th>
                </tr>
              </thead>
              <tbody>
                {collaborateurs.map(c => {
                  const load = getCollabLoad(c.id);
                  const loadPercent = Math.round((load / 40) * 100);
                  return (
                    <tr key={c.id} className="border-b border-slate-50">
                      <td className="px-4 py-2">
                        <div className="font-medium">{c.prenom} {c.nom}</div>
                        <div className="text-xs text-slate-400">{c.grades?.nom}</div>
                      </td>
                      {days.map(d => {
                        const aff = getAffectation(c.id, d.date);
                        return (
                          <td key={d.date} className="px-1 py-2 text-center">
                            {aff ? (
                              <div className="bg-blue-100 text-blue-700 rounded-lg p-2 text-xs cursor-pointer hover:bg-blue-200" onClick={() => deleteAffectation(aff)}>
                                <div className="font-medium truncate">{aff.projets?.code}</div>
                                <div>{aff.heures}h</div>
                              </div>
                            ) : (
                              <button onClick={() => openNew(c.id, d.date)} className="w-full h-12 border-2 border-dashed border-slate-200 rounded-lg hover:border-blue-400 hover:bg-blue-50 transition-colors text-slate-400">+</button>
                            )}
                          </td>
                        );
                      })}
                      <td className="px-4 py-2 text-center">
                        <div className={cn('font-bold', loadPercent > 100 ? 'text-red-500' : loadPercent >= 80 ? 'text-green-500' : 'text-slate-400')}>
                          {load}h / 40h
                        </div>
                        <ProgressBar value={load} max={40} color={loadPercent > 100 ? 'red' : 'green'} size="sm" showLabel={false} />
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      <Modal isOpen={modal} onClose={() => setModal(false)} title="Nouvelle affectation" size="sm">
        <div className="space-y-4">
          <Select label="Collaborateur" value={form.collaborateur_id} onChange={v => setForm(p => ({...p, collaborateur_id: v}))} options={collaborateurs.map(c => ({value: c.id, label: `${c.prenom} ${c.nom}`}))} placeholder="Sélectionner" required />
          <Select label="Mission" value={form.projet_id} onChange={v => setForm(p => ({...p, projet_id: v}))} options={missions.map(m => ({value: m.id, label: `${m.code} - ${m.nom}`}))} placeholder="Sélectionner" required />
          <div className="grid grid-cols-2 gap-4">
            <Input label="Date" type="date" value={form.date} onChange={v => setForm(p => ({...p, date: v}))} />
            <Input label="Heures" type="number" value={form.heures} onChange={v => setForm(p => ({...p, heures: v}))} min={1} max={12} />
          </div>
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(false)} className="flex-1">Annuler</Button>
            <Button onClick={saveAffectation} loading={saving} className="flex-1">Enregistrer</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};
// ========== TIMESHEET PAGE ==========
const TimesheetPage = () => {
  const {org, user} = useApp();
  const [weekStart, setWeekStart] = useState(getWeekStart());
  const [entries, setEntries] = useState([]);
  const [missions, setMissions] = useState([]);
  const [categories, setCategories] = useState([]);
  const [holidays, setHolidays] = useState([]);
  const [conges, setConges] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filterClient, setFilterClient] = useState('');
  const [filterSearch, setFilterSearch] = useState('');
  const [commentModal, setCommentModal] = useState(null);
  const [comment, setComment] = useState('');
  const [clients, setClients] = useState([]);

  const days = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map((d, i) => ({
    label: d, 
    date: addDays(weekStart, i),
    isWeekend: i >= 5
  }));

  useEffect(() => { loadData(); }, [weekStart]);

  const loadData = async () => {
    setLoading(true);
    const end = addDays(weekStart, 6);
    const [t, m, cat, h, cg, cl] = await Promise.all([
      supabase.from('saisies_temps').select('*,projets(nom,code,client_id,facturable)').eq('organisation_id', org.id).eq('utilisateur_id', user.id).gte('date', weekStart).lte('date', end),
      supabase.from('projets').select('*,clients(id,nom)').eq('organisation_id', org.id).in('statut', ['active', 'draft']),
      supabase.from('categories_taches').select('*').eq('organisation_id', org.id),
      supabase.from('jours_feries').select('date,nom').eq('organisation_id', org.id),
      supabase.from('conges').select('*').eq('collaborateur_id', user.id).eq('statut', 'approved'),
      supabase.from('clients').select('id,nom').eq('organisation_id', org.id)
    ]);
    setEntries(t.data || []);
    setMissions(m.data || []);
    setCategories(cat.data || []);
    setHolidays((h.data || []).map(x => x.date));
    setConges(cg.data || []);
    setClients(cl.data || []);
    setLoading(false);
  };

  const getEntry = (projId, date) => entries.find(e => e.projet_id === projId && e.date === date);

  const isDateDisabled = (date) => {
    if (isWeekend(date)) return 'weekend';
    if (holidays.includes(date)) return 'holiday';
    const conge = conges.find(c => date >= c.date_debut && date <= c.date_fin);
    if (conge) return 'conge';
    return false;
  };

  const updateEntry = async (projId, date, heures) => {
    if (isDateDisabled(date)) return;
    const existing = getEntry(projId, date);
    const h = parseFloat(heures) || 0;
    const mission = missions.find(m => m.id === projId);
    
    if (existing) {
      if (h > 0) await supabase.from('saisies_temps').update({heures: h}).eq('id', existing.id);
      else await supabase.from('saisies_temps').delete().eq('id', existing.id);
    } else if (h > 0) {
      await supabase.from('saisies_temps').insert([{
        organisation_id: org.id, utilisateur_id: user.id, projet_id: projId,
        date, heures: h, facturable: mission?.facturable !== false
      }]);
    }
    loadData();
  };

  const openComment = (projId, date) => {
    const entry = getEntry(projId, date);
    setComment(entry?.commentaire || '');
    setCommentModal({projId, date, entryId: entry?.id});
  };

  const saveComment = async () => {
    if (!commentModal) return;
    const {projId, date, entryId} = commentModal;
    if (entryId) {
      await supabase.from('saisies_temps').update({commentaire: comment}).eq('id', entryId);
    } else {
      await supabase.from('saisies_temps').insert([{
        organisation_id: org.id, utilisateur_id: user.id, projet_id: projId,
        date, heures: 0, commentaire: comment, facturable: true
      }]);
    }
    setCommentModal(null);
    loadData();
  };

  // Filtrage missions
  const filteredMissions = missions.filter(m => {
    if (filterClient && m.client_id !== filterClient) return false;
    if (filterSearch && !m.nom.toLowerCase().includes(filterSearch.toLowerCase()) && !m.code.toLowerCase().includes(filterSearch.toLowerCase())) return false;
    return true;
  });

  // Séparation facturables / non-facturables
  const missionsFact = filteredMissions.filter(m => m.facturable !== false);
  const missionsNonFact = filteredMissions.filter(m => m.facturable === false);

  const totalWeek = entries.reduce((s, e) => s + (e.heures || 0), 0);
  const totalFact = entries.filter(e => e.facturable).reduce((s, e) => s + (e.heures || 0), 0);

  const renderMissionRow = (m) => {
    const total = entries.filter(e => e.projet_id === m.id).reduce((s, e) => s + (e.heures || 0), 0);
    return (
      <tr key={m.id} className="border-b border-slate-50">
        <td className="px-4 py-2">
          <div className="font-medium text-sm">{m.nom}</div>
          <div className="text-xs text-slate-400">{m.code} • {m.clients?.nom || 'Interne'}</div>
        </td>
        {days.map(d => {
          const disabled = isDateDisabled(d.date);
          const entry = getEntry(m.id, d.date);
          return (
            <td key={d.date} className={cn('px-1 py-2 text-center', disabled === 'weekend' && 'cell-weekend', disabled === 'holiday' && 'cell-holiday', disabled === 'conge' && 'bg-pink-50')}>
              {disabled ? (
                <div className="w-14 h-10 flex items-center justify-center text-xs text-slate-400">
                  {disabled === 'holiday' ? '🎌' : disabled === 'conge' ? '🏖️' : '-'}
                </div>
              ) : (
                <div className="relative group">
                  <input type="number" min="0" max="24" step="0.5"
                    defaultValue={entry?.heures || ''}
                    onBlur={e => updateEntry(m.id, d.date, e.target.value)}
                    className="w-14 px-2 py-1.5 bg-slate-50 border rounded-lg text-center text-sm focus:bg-white" />
                  <button onClick={() => openComment(m.id, d.date)}
                    className={cn('absolute -top-1 -right-1 w-4 h-4 rounded-full text-xs opacity-0 group-hover:opacity-100 transition-opacity',
                      entry?.commentaire ? 'bg-blue-500 text-white' : 'bg-slate-200 text-slate-500')}>
                    {entry?.commentaire ? '💬' : '+'}
                  </button>
                </div>
              )}
            </td>
          );
        })}
        <td className="px-4 py-2 text-right font-bold">{total || '-'}</td>
      </tr>
    );
  };

  return (
    <div>
      <PageHeader title="Saisie des temps" subtitle={`Semaine du ${fmtDate(weekStart)}`}
        action={<div className="flex gap-2">
          <Button variant="secondary" size="sm" onClick={() => setWeekStart(addDays(weekStart, -7))}>←</Button>
          <Button variant="secondary" size="sm" onClick={() => setWeekStart(getWeekStart())}>Aujourd'hui</Button>
          <Button variant="secondary" size="sm" onClick={() => setWeekStart(addDays(weekStart, 7))}>→</Button>
        </div>}
      />

      {loading ? <Loader /> : (<>
        {/* Filtres */}
        <Card className="mb-4">
          <div className="flex flex-col sm:flex-row gap-4 items-end">
            <SearchInput value={filterSearch} onChange={setFilterSearch} placeholder="Rechercher une mission..." className="flex-1" />
            <Select value={filterClient} onChange={setFilterClient} options={clients.map(c => ({value: c.id, label: c.nom}))} placeholder="Tous les clients" className="w-48" />
            {(filterSearch || filterClient) && (
              <Button variant="ghost" size="sm" onClick={() => { setFilterSearch(''); setFilterClient(''); }}>🔄 Reset</Button>
            )}
          </div>
        </Card>

        {/* Tableau temps facturables */}
        <Card title="⏱️ Temps facturables" collapsible defaultOpen={true} className="mb-4">
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead>
                <tr className="border-b">
                  <th className="px-4 py-3 text-left w-64">Mission</th>
                  {days.map(d => (
                    <th key={d.date} className={cn('px-2 py-3 text-center w-16', d.isWeekend && 'bg-slate-50')}>
                      {d.label}<br/><span className="text-xs text-slate-400">{d.date.split('-')[2]}</span>
                      {holidays.includes(d.date) && <span className="block text-xs">🎌</span>}
                    </th>
                  ))}
                  <th className="px-4 py-3 text-right w-20">Total</th>
                </tr>
              </thead>
              <tbody>
                {missionsFact.length === 0 ? (
                  <tr><td colSpan={9} className="px-4 py-8 text-center text-slate-400">Aucune mission facturable active</td></tr>
                ) : missionsFact.map(renderMissionRow)}
              </tbody>
            </table>
          </div>
        </Card>

        {/* Tableau temps non-facturables */}
        <Card title="📋 Temps non-facturables" collapsible defaultOpen={false}>
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead>
                <tr className="border-b">
                  <th className="px-4 py-3 text-left w-64">Activité</th>
                  {days.map(d => (
                    <th key={d.date} className={cn('px-2 py-3 text-center w-16', d.isWeekend && 'bg-slate-50')}>
                      {d.label}<br/><span className="text-xs text-slate-400">{d.date.split('-')[2]}</span>
                    </th>
                  ))}
                  <th className="px-4 py-3 text-right w-20">Total</th>
                </tr>
              </thead>
              <tbody>
                {missionsNonFact.length === 0 ? (
                  <tr><td colSpan={9} className="px-4 py-8 text-center text-slate-400">Aucune activité non-facturable</td></tr>
                ) : missionsNonFact.map(renderMissionRow)}
              </tbody>
            </table>
          </div>
        </Card>

        {/* Totaux */}
        <Card className="mt-4">
          <div className="flex justify-between items-center">
            <div>
              <span className="text-slate-500">Total semaine:</span>
              <span className="text-2xl font-bold ml-2">{totalWeek}h</span>
            </div>
            <div className="flex gap-6">
              <div><span className="text-slate-500">Facturable:</span><span className="font-bold text-green-600 ml-2">{totalFact}h</span></div>
              <div><span className="text-slate-500">Non-fact:</span><span className="font-bold text-slate-400 ml-2">{totalWeek - totalFact}h</span></div>
              <div><span className="text-slate-500">Taux:</span><span className="font-bold text-blue-600 ml-2">{totalWeek > 0 ? Math.round((totalFact / totalWeek) * 100) : 0}%</span></div>
            </div>
          </div>
        </Card>
      </>)}

      {/* Modal commentaire */}
      <Modal isOpen={!!commentModal} onClose={() => setCommentModal(null)} title="Commentaire" size="sm">
        <div className="space-y-4">
          <TextArea label="Décrivez votre activité" value={comment} onChange={setComment} rows={4} placeholder="Ex: Préparation des états financiers..." />
          <div className="flex gap-3">
            <Button variant="secondary" onClick={() => setCommentModal(null)} className="flex-1">Annuler</Button>
            <Button onClick={saveComment} className="flex-1">Enregistrer</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};

// ========== CONGES PAGE ==========
const CongesPage = () => {
  const {org, user} = useApp();
  const [conges, setConges] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [tab, setTab] = useState('mes');

  useEffect(() => { loadData(); }, []);

  const loadData = async () => {
    const {data, error} = await supabase.from('conges').select('*').eq('organisation_id', org.id).order('date_debut', {ascending: false});
    if (error) console.error('Conges error:', error);
    setConges(data || []);
    setLoading(false);
  };

  const openNew = () => {
    setForm({utilisateur_id: user.id, type_conge: 'conge_paye', date_debut: '', date_fin: '', motif: ''});
    setModal(true);
  };

  const save = async () => {
    if (!form.date_debut || !form.date_fin) return alert('Dates requises');
    setSaving(true);
    try {
      const jours = workingDaysBetween(form.date_debut, form.date_fin);
      const {error} = await supabase.from('conges').insert([{
        organisation_id: org.id, 
        utilisateur_id: user.id,
        type_conge: form.type_conge,
        date_debut: form.date_debut,
        date_fin: form.date_fin,
        nb_jours: jours, 
        motif: form.motif,
        statut: 'pending'
      }]);
      if (error) throw error;
      setModal(false); loadData();
    } catch (e) { alert('Erreur: ' + e.message); }
    setSaving(false);
  };

  const updateStatus = async (conge, statut) => {
    await supabase.from('conges').update({statut, date_validation: new Date().toISOString()}).eq('id', conge.id);
    loadData();
  };

  const mesConges = conges.filter(c => c.utilisateur_id === user.id);
  const congesAValider = conges.filter(c => c.statut === 'pending');

  // Solde congés (simplifié: 30j/an)
  const soldeConges = 30 - mesConges.filter(c => c.statut === 'approved' && c.type_conge === 'conge_paye').reduce((s, c) => s + (c.nb_jours || 0), 0);

  return (
    <div>
      <PageHeader title="Congés & Absences" subtitle={`Solde: ${soldeConges} jours`}
        tabs={[{key: 'mes', label: 'Mes congés', count: mesConges.length}, {key: 'valider', label: 'À valider', count: congesAValider.length}, {key: 'tous', label: 'Tous', count: conges.length}]}
        activeTab={tab} onTabChange={setTab}
        action={<Button onClick={openNew} icon="➕">Demander congé</Button>}
      />

      {loading ? <Loader /> : (
        <Card>
          <Table columns={[
            {header: 'Type', render: r => { const t = LEAVE_TYPES.find(l => l.value === r.type_conge); return <Badge color={t?.color}>{t?.label}</Badge>; }},
            {header: 'Période', render: r => <span>{fmtDate(r.date_debut)} → {fmtDate(r.date_fin)}</span>},
            {header: 'Jours', render: r => <span className="font-medium">{r.nb_jours}j</span>},
            {header: 'Statut', render: r => <Badge color={LEAVE_STATUS[r.statut]?.color}>{LEAVE_STATUS[r.statut]?.label}</Badge>},
            {header: 'Motif', render: r => <span className="text-sm text-slate-500 truncate max-w-xs">{r.motif || '-'}</span>}
          ]} data={tab === 'mes' ? mesConges : tab === 'valider' ? congesAValider : conges}
          actions={r => tab === 'valider' && r.statut === 'pending' ? (
            <div className="flex gap-1">
              <Button variant="success" size="xs" onClick={() => updateStatus(r, 'approved')}>✓</Button>
              <Button variant="danger" size="xs" onClick={() => updateStatus(r, 'rejected')}>✗</Button>
            </div>
          ) : null} />
        </Card>
      )}

      <Modal isOpen={modal} onClose={() => setModal(false)} title="Demande de congé">
        <div className="space-y-4">
          <Select label="Type de congé" value={form.type_conge} onChange={v => setForm(p => ({...p, type_conge: v}))} options={LEAVE_TYPES.map(t => ({value: t.value, label: t.label}))} />
          <div className="grid grid-cols-2 gap-4">
            <Input label="Date début" type="date" value={form.date_debut} onChange={v => setForm(p => ({...p, date_debut: v}))} required />
            <Input label="Date fin" type="date" value={form.date_fin} onChange={v => setForm(p => ({...p, date_fin: v}))} required />
          </div>
          {form.date_debut && form.date_fin && (
            <div className="p-3 bg-blue-50 rounded-xl text-center">
              <span className="text-blue-600 font-medium">{workingDaysBetween(form.date_debut, form.date_fin)} jours ouvrés</span>
            </div>
          )}
          <TextArea label="Motif (optionnel)" value={form.motif} onChange={v => setForm(p => ({...p, motif: v}))} rows={2} />
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(false)} className="flex-1">Annuler</Button>
            <Button onClick={save} loading={saving} className="flex-1">Soumettre</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};

  const openNew = () => {
    setEditItem(null);
    setForm({reference: genCode('FAC'), projet_id: '', client_id: '', type_facture: 'standard', date_emission: today(), date_echeance: addDays(today(), 30), montant_ht: 0, taux_tva: 18, statut: 'draft', montant_encaisse: 0, date_encaissement: ''});
    setModal('facture');
  };

  const save = async () => {
    if (!form.client_id) return alert('Client requis');
    setSaving(true);
    try {
      const tva = form.montant_ht * form.taux_tva / 100;
      const data = {...form, montant_tva: tva, montant_total: parseFloat(form.montant_ht) + tva, projet_id: form.projet_id || null};
      if (editItem?.id) await supabase.from('factures').update(data).eq('id', editItem.id);
      else await supabase.from('factures').insert([{...data, organisation_id: org.id}]);
      setModal(null); loadData();
    } catch (e) { alert(e.message); }
    setSaving(false);
  };

  const updateStatus = async (f, statut) => { 
    const updates = {statut};
    if (statut === 'paid') {
      updates.montant_encaisse = f.montant_total;
      updates.date_encaissement = today();
    }
    await supabase.from('factures').update(updates).eq('id', f.id); 
    loadData(); 
  };

  // Encaissement partiel
  const openEncaissement = (f) => {
    setEditItem(f);
    setForm({montant_encaisse: f.montant_encaisse || 0, date_encaissement: f.date_encaissement || today()});
    setModal('encaissement');
  };

  const saveEncaissement = async () => {
    setSaving(true);
    try {
      const montant = parseFloat(form.montant_encaisse) || 0;
      let statut = editItem.statut;
      if (montant >= editItem.montant_total) statut = 'paid';
      else if (montant > 0) statut = 'partial';
      
      await supabase.from('factures').update({
        montant_encaisse: montant,
        date_encaissement: form.date_encaissement,
        statut
      }).eq('id', editItem.id);
      setModal(null); loadData();
    } catch(e) { alert(e.message); }
    setSaving(false);
  };

  const exportPDF = (f) => {
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF();
    
    doc.setFontSize(20);
    doc.text('FACTURE', 105, 25, {align: 'center'});
    
    doc.setFontSize(14);
    doc.text(f.reference || '', 105, 35, {align: 'center'});
    
    doc.setDrawColor(200);
    doc.line(20, 45, 190, 45);
    
    doc.setFontSize(10);
    doc.text('Date: ' + fmtDate(f.date_emission), 20, 55);
    doc.text('Echeance: ' + fmtDate(f.date_echeance), 20, 62);
    doc.text('Client: ' + (f.clients?.nom || '-'), 20, 69);
    if (f.projets?.nom) doc.text('Mission: ' + (f.projets?.code || '') + ' - ' + f.projets.nom, 20, 76);
    
    doc.line(20, 85, 190, 85);
    
    doc.setFontSize(11);
    const y1 = 100;
    doc.text('Montant HT:', 110, y1);
    doc.text(fmt(f.montant_ht || 0) + ' FCFA', 190, y1, {align: 'right'});
    
    doc.text('TVA (' + (f.taux_tva || 18) + '%):', 110, y1 + 10);
    doc.text(fmt(f.montant_tva || 0) + ' FCFA', 190, y1 + 10, {align: 'right'});
    
    doc.line(110, y1 + 15, 190, y1 + 15);
    
    doc.setFontSize(14);
    doc.text('TOTAL TTC:', 110, y1 + 25);
    doc.text(fmt(f.montant_total || 0) + ' FCFA', 190, y1 + 25, {align: 'right'});
    
    doc.save('Facture_' + f.reference + '.pdf');
  };

  const stats = {
    total: factures.reduce((s, f) => s + (f.montant_total || 0), 0), 
    encaisse: factures.reduce((s, f) => s + (f.montant_encaisse || 0), 0),
    enAttente: factures.filter(f => f.statut === 'sent').reduce((s, f) => s + (f.montant_total - (f.montant_encaisse || 0)), 0)
  };

  const filteredFactures = tab === 'toutes' ? factures : 
    tab === 'draft' ? factures.filter(f => f.statut === 'draft') :
    tab === 'sent' ? factures.filter(f => f.statut === 'sent') :
    tab === 'paid' ? factures.filter(f => f.statut === 'paid') : factures;

  return (
    <div>
      <PageHeader title="Facturation" subtitle={factures.length + ' factures'} 
        tabs={[
          {key: 'toutes', label: 'Toutes', count: factures.length},
          {key: 'draft', label: 'Brouillons', count: factures.filter(f => f.statut === 'draft').length},
          {key: 'sent', label: 'Envoyées', count: factures.filter(f => f.statut === 'sent').length},
          {key: 'paid', label: 'Payées', count: factures.filter(f => f.statut === 'paid').length}
        ]}
        activeTab={tab} onTabChange={setTab}
        action={<Button onClick={openNew} icon="➕">Nouvelle</Button>} 
      />
      <div className="grid grid-cols-3 gap-4 mb-6">
        <StatCard title="Total facturé" value={fmtMoney(stats.total)} icon="📄" color="blue" />
        <StatCard title="Encaissé" value={fmtMoney(stats.encaisse)} icon="✅" color="green" />
        <StatCard title="En attente" value={fmtMoney(stats.enAttente)} icon="⏳" color="amber" />
      </div>
      {loading ? <Loader /> : (
        <Card>
          <Table columns={[
            {header: 'Facture', render: r => <div><div className="font-medium">{r.reference}</div><div className="text-xs text-slate-400">{r.type_facture}</div></div>},
            {header: 'Client', render: r => r.clients?.nom || '-'},
            {header: 'Mission', render: r => r.projets?.code || '-'},
            {header: 'Montant', render: r => <span className="font-bold">{fmtMoney(r.montant_total)}</span>},
            {header: 'Encaissé', render: r => r.montant_encaisse > 0 ? <span className="text-green-600">{fmtMoney(r.montant_encaisse)}</span> : '-'},
            {header: 'Statut', render: r => <Badge color={INVOICE_STATUS[r.statut]?.color}>{INVOICE_STATUS[r.statut]?.label}</Badge>}
          ]} data={filteredFactures} actions={r => (
            <div className="flex gap-1">
              <Button variant="ghost" size="xs" onClick={() => exportPDF(r)} title="PDF">📄</Button>
              {r.statut === 'draft' && <Button variant="ghost" size="xs" onClick={() => updateStatus(r, 'sent')} title="Envoyer">📤</Button>}
              {(r.statut === 'sent' || r.statut === 'partial') && <Button variant="ghost" size="xs" onClick={() => openEncaissement(r)} title="Encaisser">💰</Button>}
              {r.statut === 'sent' && <Button variant="ghost" size="xs" onClick={() => updateStatus(r, 'paid')} title="Payé 100%">✅</Button>}
            </div>
          )} />
        </Card>
      )}

      {/* Modal Nouvelle Facture */}
      <Modal isOpen={modal === 'facture'} onClose={() => setModal(null)} title="Nouvelle facture" size="lg">
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4">
            <Input label="Référence" value={form.reference} onChange={v => setForm(p => ({...p, reference: v}))} />
            <Select label="Type" value={form.type_facture} onChange={v => setForm(p => ({...p, type_facture: v}))} options={[{value: 'standard', label: 'Standard'}, {value: 'acompte', label: 'Acompte'}, {value: 'solde', label: 'Solde'}, {value: 'avoir', label: 'Avoir'}]} />
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Select label="Client" value={form.client_id} onChange={v => setForm(p => ({...p, client_id: v}))} options={clients.map(c => ({value: c.id, label: c.nom}))} placeholder="Sélectionner" required />
            <Select label="Mission" value={form.projet_id} onChange={v => { const m = missions.find(x => x.id === v); setForm(p => ({...p, projet_id: v, client_id: m?.client_id || p.client_id})); }} options={missions.map(m => ({value: m.id, label: m.code + ' - ' + m.nom}))} placeholder="Sélectionner (optionnel)" />
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Input label="Date émission" type="date" value={form.date_emission} onChange={v => setForm(p => ({...p, date_emission: v}))} />
            <Input label="Date échéance" type="date" value={form.date_echeance} onChange={v => setForm(p => ({...p, date_echeance: v}))} />
          </div>
          <div className="grid grid-cols-3 gap-4">
            <Input label="Montant HT (FCFA)" type="number" value={form.montant_ht} onChange={v => setForm(p => ({...p, montant_ht: v}))} />
            <Input label="TVA %" type="number" value={form.taux_tva} onChange={v => setForm(p => ({...p, taux_tva: v}))} />
            <div><label className="block text-sm font-medium mb-1.5">Total TTC</label><div className="px-4 py-2.5 bg-green-50 rounded-xl font-bold text-green-700">{fmtMoney((form.montant_ht || 0) * (1 + (form.taux_tva || 0) / 100))}</div></div>
          </div>
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button><Button onClick={save} loading={saving} className="flex-1">Créer</Button></div>
        </div>
      </Modal>

      {/* Modal Encaissement */}
      <Modal isOpen={modal === 'encaissement'} onClose={() => setModal(null)} title={`Encaissement - ${editItem?.reference}`} size="sm">
        <div className="space-y-4">
          <div className="p-4 bg-slate-50 rounded-xl">
            <div className="flex justify-between mb-2"><span className="text-slate-500">Montant facture:</span><span className="font-bold">{fmtMoney(editItem?.montant_total)}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">Déjà encaissé:</span><span className="text-green-600">{fmtMoney(editItem?.montant_encaisse || 0)}</span></div>
          </div>
          <Input label="Montant encaissé (FCFA)" type="number" value={form.montant_encaisse} onChange={v => setForm(p => ({...p, montant_encaisse: v}))} />
          <Input label="Date encaissement" type="date" value={form.date_encaissement} onChange={v => setForm(p => ({...p, date_encaissement: v}))} />
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button><Button onClick={saveEncaissement} loading={saving} className="flex-1">Enregistrer</Button></div>
        </div>
      </Modal>
    </div>
  );
};

  const [saving, setSaving] = useState(false);

  useEffect(() => { loadData(); }, []);
