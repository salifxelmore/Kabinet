          <div className="grid grid-cols-2 gap-4">
            <Input label="Ville" value={form.ville || 'DAKAR'} onChange={v => setForm(p => ({...p, ville: v}))} />
            <Input label="Pays" value={form.pays || 'Sénégal'} onChange={v => setForm(p => ({...p, pays: v}))} />
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Input label="Email" type="email" value={form.email} onChange={v => setForm(p => ({...p, email: v}))} />
            <Input label="Téléphone" value={form.telephone} onChange={v => setForm(p => ({...p, telephone: v}))} />
          </div>
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button>
            <Button onClick={saveProspect} loading={saving} className="flex-1">Enregistrer</Button>
          </div>
        </div>
      </Modal>

      {/* MODAL DEMANDE ACCÈS GLOBAL */}
      <Modal isOpen={modal === 'demande_acces'} onClose={() => setModal(null)} title="🔓 Demander un accès global clients" size="md">
        <div className="space-y-4">
          <div className="p-4 bg-blue-50 rounded-xl text-blue-700 text-sm">
            <strong>ℹ️ Information :</strong> Cette demande vous permettra de voir temporairement tous les clients de l'organisation (2-4h) pour effectuer des vérifications KYC ou d'autres besoins ponctuels.
          </div>
          
          <TextArea 
            label="Motif de la demande *" 
            value={motifDemande} 
            onChange={setMotifDemande} 
            rows={3} 
            placeholder="Ex: Vérification KYC pour nouveau prospect, recherche de doublons..."
            required
          />
          
          <div className="p-4 bg-amber-50 rounded-xl text-amber-700 text-sm">
            <strong>⚠️ Note :</strong> Votre demande sera traitée par un administrateur. L'accès sera accordé pour une durée limitée (généralement 2 à 4 heures).
          </div>
          
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button>
            <Button onClick={demanderAccesGlobal} loading={saving} className="flex-1" disabled={!motifDemande.trim()}>Envoyer la demande</Button>
          </div>
        </div>
      </Modal>

      {/* MODAL GESTION DEMANDES (Admin) */}
      <Modal isOpen={modal === 'gestion_demandes'} onClose={() => setModal(null)} title="📬 Demandes d'accès global clients" size="lg">
        <div className="space-y-4">
          {demandesAttente.length === 0 ? (
            <div className="text-center py-8 text-slate-400">
              <div className="text-4xl mb-2">✅</div>
              <p>Aucune demande en attente</p>
            </div>
          ) : (
            demandesAttente.map(demande => (
              <div key={demande.id} className="p-4 bg-slate-50 rounded-xl border">
                <div className="flex items-start justify-between mb-3">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold text-sm">
                      {demande.collaborateurs?.prenom?.[0]}{demande.collaborateurs?.nom?.[0]}
                    </div>
                    <div>
                      <div className="font-medium">{demande.collaborateurs?.prenom} {demande.collaborateurs?.nom}</div>
                      <div className="text-xs text-slate-500">{new Date(demande.date_demande).toLocaleString('fr-FR')}</div>
                    </div>
                  </div>
                  <Badge color="amber">En attente</Badge>
                </div>
                
                <div className="mb-4 p-3 bg-white rounded-lg text-sm">
                  <div className="text-slate-500 mb-1">Motif :</div>
                  <div>{demande.motif || 'Non précisé'}</div>
                </div>
                
                <div className="flex items-center gap-4">
                  <div className="flex items-center gap-2">
                    <span className="text-sm text-slate-600">Durée :</span>
                    <Select 
                      value={dureeAcces.toString()} 
                      onChange={v => setDureeAcces(parseInt(v))}
                      options={[
                        {value: '1', label: '1 heure'},
                        {value: '2', label: '2 heures'},
                        {value: '3', label: '3 heures'},
                        {value: '4', label: '4 heures'}
                      ]}
                      className="w-28"
                    />
                  </div>
                  <div className="flex-1" />
                  <Button variant="danger" size="sm" onClick={() => rejeterDemande(demande)}>Rejeter</Button>
                  <Button variant="success" size="sm" onClick={() => approuverDemande(demande)} loading={saving}>Approuver</Button>
                </div>
              </div>
            ))
          )}
        </div>
      </Modal>
    </div>
  );
};
// ========== MISSIONS PAGE ==========
const MissionsPage = () => {
  const {org, collab, isManager, isAdmin, isCollaborateur, isSuperAdmin, userDeptId} = useApp();
  const [missions, setMissions] = useState([]);
  const [clients, setClients] = useState([]);
  const [depts, setDepts] = useState([]);
  const [managers, setManagers] = useState([]); // Collaborateurs grade >= Manager
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [modal, setModal] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [acomptes, setAcomptes] = useState([]);
  const [factures, setFactures] = useState([]);
  const [tachesMission, setTachesMission] = useState(null); // Mission sélectionnée pour voir les tâches
  const [mesMissionsIds, setMesMissionsIds] = useState([]); // IDs des missions sur lesquelles je suis staffé
  const [privileges, setPrivileges] = useState([]);
  
  // Permissions
  const canCreate = isManager && !isCollaborateur; // Seuls les managers+ peuvent créer
  const canEdit = isManager && !isCollaborateur; // Seuls les managers+ peuvent modifier
  const isJuniorSenior = isCollaborateur; // Junior/Senior ne voit que ses missions
  
  // Vérifier si accès global
  const gradeNiveau = collab?.grades?.niveau || 0;
  const isManagingPartner = gradeNiveau >= 6;
  const hasGlobalAccess = isManagingPartner || isSuperAdmin || isAdmin || privileges.some(p => p.collaborateur_id === collab?.id && p.type_privilege === 'acces_global');

  useEffect(() => { loadData(); }, []);

  const loadData = async () => {
    const [m, c, d, a, collabs, grades, f, t, affectations, privs] = await Promise.all([
      supabase.from('projets').select('*,clients(nom),departements:departement_id(nom),responsable:responsable_id(id,nom,prenom)').eq('organisation_id', org.id).order('created_at', {ascending: false}),
      supabase.from('clients').select('id,nom').eq('organisation_id', org.id).eq('est_prospect', false),
      supabase.from('departements').select('id,nom').eq('organisation_id', org.id),
      supabase.from('acomptes').select('*').eq('organisation_id', org.id),
      supabase.from('collaborateurs').select('*,grades:grade_id(nom,niveau)').eq('organisation_id', org.id).eq('actif', true),
      supabase.from('grades').select('*').eq('organisation_id', org.id),
      supabase.from('factures').select('id,projet_id,montant_ht,montant_total').eq('organisation_id', org.id),
      supabase.from('taches_projet').select('id,projet_id,statut').eq('organisation_id', org.id),
      supabase.from('affectations').select('projet_id').eq('collaborateur_id', collab?.id),
      supabase.from('privileges_speciaux').select('*').eq('organisation_id', org.id).eq('actif', true)
    ]);
    
    setPrivileges(privs.data || []);
    
    // Récupérer les IDs des missions où je suis staffé
    const missionsStaffees = [...new Set((affectations.data || []).map(a => a.projet_id))];
    setMesMissionsIds(missionsStaffees);
    
    // Calculer les stats de tâches par mission
    const tachesParMission = {};
    (t.data || []).forEach(tache => {
      if (!tachesParMission[tache.projet_id]) {
        tachesParMission[tache.projet_id] = { total: 0, done: 0 };
      }
      tachesParMission[tache.projet_id].total++;
      if (tache.statut === 'done') {
        tachesParMission[tache.projet_id].done++;
      }
    });
    
    // Filtrer les missions par département si pas d'accès global
    let missionsData = m.data || [];
    const hasAccess = isManagingPartner || isSuperAdmin || isAdmin || (privs.data || []).some(p => p.collaborateur_id === collab?.id && p.type_privilege === 'acces_global');
    
    if (!hasAccess && userDeptId) {
      // Filtrer par département OU missions internes (sans client = globales pour saisie temps)
      missionsData = missionsData.filter(mission => mission.departement_id === userDeptId || !mission.client_id);
    }
    
    // Enrichir les missions avec les stats de tâches
    const missionsAvecTaches = missionsData.map(mission => ({
      ...mission,
      taches_total: tachesParMission[mission.id]?.total || 0,
      taches_done: tachesParMission[mission.id]?.done || 0,
      taches_progress: tachesParMission[mission.id]?.total > 0 
        ? Math.round((tachesParMission[mission.id].done / tachesParMission[mission.id].total) * 100)
        : 0
    }));
    
    setMissions(missionsAvecTaches);
    setClients(c.data || []);
    setDepts(d.data || []);
    setAcomptes(a.data || []);
    setFactures(f.data || []);
    // Filtrer les collaborateurs avec grade >= Manager (niveau >= 3)
    const allCollabs = collabs.data || [];
    const mgrs = allCollabs.filter(c => c.grades?.niveau >= 3);
    setManagers(mgrs);
    setLoading(false);
  };

  const openNew = () => {
    setEditItem(null);
    // SuperAdmin peut créer directement en draft/active, les autres en pending_validation
    const defaultStatut = isSuperAdmin ? 'draft' : 'pending_validation';
    setForm({
      code: genCode('MIS'), nom: '', client_id: '', departement_id: '',
      type_facturation: 'regie', statut: defaultStatut, budget_montant: 0, budget_heures: 0,
      date_debut: today(), date_fin_prevue: '', description: '', facturable: true,
      responsable_id: ''
    });
    setModal('mission');
  };

  const openEdit = (m) => {
    setEditItem(m);
    setForm({...m, date_debut: m.date_debut?.split('T')[0] || '', date_fin_prevue: m.date_fin_prevue?.split('T')[0] || ''});
    setModal('mission');
  };
  
  // Approuver une mission (SuperAdmin uniquement)
  const approuverMission = async (mission) => {
    if (!confirm(`Approuver la mission "${mission.nom}" ?`)) return;
    try {
      await supabase.from('projets').update({
        statut: 'draft',
        updated_at: new Date().toISOString()
      }).eq('id', mission.id);
      loadData();
    } catch (e) {
      alert('Erreur: ' + e.message);
    }
  };
  
  // Rejeter une mission (SuperAdmin uniquement)
  const rejeterMission = async (mission) => {
    const motif = prompt('Motif du rejet (optionnel):');
    if (motif === null) return; // Annulé
    try {
      await supabase.from('projets').update({
        statut: 'cancelled',
        description: mission.description + (motif ? `\n\n❌ Rejetée: ${motif}` : '\n\n❌ Rejetée'),
        updated_at: new Date().toISOString()
      }).eq('id', mission.id);
      loadData();
    } catch (e) {
      alert('Erreur: ' + e.message);
    }
  };

  const save = async () => {
    if (!form.nom || !form.client_id) return alert('Client et nom requis');
    setSaving(true);
    try {
      // Pour les nouvelles missions créées par non-SuperAdmin, forcer pending_validation
      let statutToSave = form.statut;
      if (!editItem && !isSuperAdmin) {
        statutToSave = 'pending_validation';
      }
      
      // Ne garder que les champs valides pour la table projets
      const data = {
        code: form.code,
        nom: form.nom,
        client_id: form.client_id || null,
        departement_id: form.departement_id || null,
        responsable_id: form.responsable_id || null,
        type_facturation: form.type_facturation,
        statut: statutToSave,
        budget_montant: parseFloat(form.budget_montant) || 0,
        budget_heures: parseFloat(form.budget_heures) || 0,
        date_debut: form.date_debut || null,
        date_fin_prevue: form.date_fin_prevue || null,
        description: form.description || '',
        facturable: form.facturable !== false
      };
      
      if (editItem?.id) {
        const {error} = await supabase.from('projets').update(data).eq('id', editItem.id);
        if (error) throw error;
      } else {
        const {error} = await supabase.from('projets').insert([{...data, organisation_id: org.id}]);
        if (error) throw error;
      }
      setModal(null); 
      loadData();
    } catch (e) { 
      console.error('Save error:', e);
      alert('Erreur: ' + e.message); 
    }
    setSaving(false);
  };

  const openAcomptes = (m) => { setEditItem(m); setModal('acomptes'); };

  const deleteMission = async (m) => {
    // Vérifier s'il y a des heures saisies sur cette mission
    const {data: temps} = await supabase.from('saisies_temps').select('id').eq('projet_id', m.id);
    const hasTemps = temps && temps.length > 0;
    
    let confirmMsg = `Supprimer la mission "${m.nom}" ?`;
    if (hasTemps) {
      confirmMsg = `⚠️ ATTENTION: Cette mission a ${temps.length} saisie(s) de temps.\n\nSupprimer la mission "${m.nom}" ?\n\nToutes les heures et factures liées seront supprimées.`;
    }
    
    if (!confirm(confirmMsg)) return;
    
    // Supprimer les données liées
    await supabase.from('saisies_temps').delete().eq('projet_id', m.id);
    await supabase.from('acomptes').delete().eq('projet_id', m.id);
    await supabase.from('factures').delete().eq('projet_id', m.id);
    // Supprimer la mission
    await supabase.from('projets').delete().eq('id', m.id);
    
    loadData();
  };

  // Bloquer/Débloquer la saisie sur une mission clôturée
  const toggleSaisieBloquee = async (m) => {
    const newValue = !m.saisie_bloquee;
    const action = newValue ? 'bloquer' : 'débloquer';
    
    if (!confirm(`${newValue ? '🔒 Bloquer' : '🔓 Débloquer'} la saisie sur "${m.nom}" ?\n\n${newValue ? 'Les collaborateurs ne pourront plus saisir de temps sur cette mission.' : 'Les collaborateurs pourront à nouveau saisir du temps sur cette mission.'}`)) {
      return;
    }
    
    await supabase.from('projets').update({ saisie_bloquee: newValue }).eq('id', m.id);
    loadData();
  };

  const addAcompte = async () => {
    const missionAcomptes = acomptes.filter(a => a.projet_id === editItem.id);
    const totalAcomptes = missionAcomptes.reduce((s, a) => s + (a.montant || 0), 0);
    const reste = (editItem.budget_montant || 0) - totalAcomptes;
    const num = missionAcomptes.length + 1;
    
    const montant = parseFloat(prompt(`Montant de l'acompte ${num} (Reste: ${fmt(reste)} F):`, reste)) || 0;
    if (montant <= 0) return;
    
    await supabase.from('acomptes').insert([{
      organisation_id: org.id,
      projet_id: editItem.id,
      numero: num,
      montant,
      date_prevu: today(),
      statut: 'prevu'
    }]);
    
    const newTotal = totalAcomptes + montant;
    await supabase.from('projets').update({montant_facture: newTotal}).eq('id', editItem.id);
    loadData();
  };

  const getMissionAcomptes = (missionId) => acomptes.filter(a => a.projet_id === missionId);
  // Utiliser les factures réelles (HT) pour comparaison avec budget
  const getMissionFacturesHT = (missionId) => factures.filter(f => f.projet_id === missionId).reduce((s, f) => s + (parseFloat(f.montant_ht) || 0), 0);
  const getMissionTotalFacture = (m) => getMissionFacturesHT(m.id);
  const getMissionResteFacturer = (m) => (m.budget_montant || 0) - getMissionTotalFacture(m);
  const getMissionProgress = (m) => m.budget_montant > 0 ? Math.round((getMissionTotalFacture(m) / m.budget_montant) * 100) : 0;

  // Calcul dépassement délai
  const getDelaiStatus = (m) => {
    if (!m.date_fin_prevue) return null;
    const days = daysBetween(today(), m.date_fin_prevue);
    if (m.statut === 'completed') return {status: 'ok', label: 'Terminé'};
    if (days < 0) return {status: 'late', label: `${Math.abs(days)}j de retard`, color: 'red'};
    if (days <= 7) return {status: 'warning', label: `${days}j restants`, color: 'yellow'};
    return {status: 'ok', label: `${days}j restants`, color: 'green'};
  };

  // Pour les juniors/seniors, filtrer uniquement leurs missions staffées
  const missionsVisibles = isJuniorSenior 
    ? missions.filter(m => mesMissionsIds.includes(m.id))
    : missions;

  const filtered = missionsVisibles.filter(m => {
    if (search && !m.nom?.toLowerCase().includes(search.toLowerCase()) && !m.code?.toLowerCase().includes(search.toLowerCase())) return false;
    if (filterStatus && m.statut !== filterStatus) return false;
    return true;
  });

  const stats = {
    total: missionsVisibles.length,
    actives: missionsVisibles.filter(m => m.statut === 'active').length,
    budget: missionsVisibles.reduce((s, m) => s + (m.budget_montant || 0), 0),
    facture: missionsVisibles.reduce((s, m) => s + getMissionTotalFacture(m), 0),
    taches_total: missionsVisibles.reduce((s, m) => s + (m.taches_total || 0), 0),
    taches_done: missionsVisibles.reduce((s, m) => s + (m.taches_done || 0), 0)
  };
  const tachesProgress = stats.taches_total > 0 ? Math.round((stats.taches_done / stats.taches_total) * 100) : 0;
  
  const exportMissions = () => exportToExcel(filtered, [
    {header: 'Code', key: 'code'},
    {header: 'Nom', key: 'nom'},
    {header: 'Client', getValue: r => r.clients?.nom || ''},
    {header: 'Département', getValue: r => r.departements?.nom || ''},
    {header: 'Type', getValue: r => r.type_facturation === 'forfait' ? 'Forfait' : 'Régie'},
    {header: 'Budget (FCFA)', key: 'budget_montant'},
    {header: 'Budget (Heures)', key: 'budget_heures'},
    {header: 'Facturé', getValue: r => getMissionTotalFacture(r)},
    {header: 'Reste', getValue: r => getMissionResteFacturer(r)},
    {header: 'Tâches Total', getValue: r => r.taches_total || 0},
    {header: 'Tâches Terminées', getValue: r => r.taches_done || 0},
    {header: 'Avancement (%)', getValue: r => r.taches_progress || 0},
    {header: 'Date début', key: 'date_debut'},
    {header: 'Date fin prévue', key: 'date_fin_prevue'},
    {header: 'Statut', getValue: r => MISSION_STATUS[r.statut]?.label || ''}
  ], 'missions');
  
  // Compter les missions en attente de validation
  const missionsPendingValidation = missions.filter(m => m.statut === 'pending_validation');

  return (
    <div>
      <PageHeader 
        title={isJuniorSenior ? "Mes Missions" : "Missions"} 
        subtitle={isJuniorSenior 
          ? `${stats.actives} actives sur ${stats.total} • Tâches: ${stats.taches_done}/${stats.taches_total} (${tachesProgress}%)`
          : `${stats.actives} actives sur ${stats.total} • Budget: ${fmtMoney(stats.budget)} • Tâches: ${stats.taches_done}/${stats.taches_total} (${tachesProgress}%)`
        }
        action={canCreate ? (
          <div className="flex gap-2">
            <Button variant="secondary" size="sm" onClick={exportMissions} icon="📥">Export</Button>
            <Button onClick={openNew} icon="➕">Nouvelle mission</Button>
          </div>
        ) : null} 
      />

      {/* Alerte missions en attente de validation (SuperAdmin) */}
      {isSuperAdmin && missionsPendingValidation.length > 0 && (
        <div className="mb-4 p-4 bg-amber-50 border border-amber-200 rounded-xl">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="text-2xl">⏳</span>
              <div>
                <div className="font-medium text-amber-800">{missionsPendingValidation.length} mission(s) en attente de validation</div>
                <div className="text-sm text-amber-600">Cliquez sur une mission pour l'approuver ou la rejeter</div>
              </div>
            </div>
            <Button size="sm" variant="secondary" onClick={() => setFilterStatus('pending_validation')}>Voir les demandes</Button>
          </div>
        </div>
      )}

      {/* Info pour les créateurs de mission */}
      {!isSuperAdmin && canCreate && (
        <div className="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-xl text-sm text-blue-700">
          <span className="font-medium">ℹ️</span> Les nouvelles missions sont soumises à validation par l'administrateur avant d'être activées.
        </div>
      )}

      {loading ? <Loader /> : (
        <Card>
          <div className="flex flex-col sm:flex-row gap-4 mb-4">
            <SearchInput value={search} onChange={setSearch} placeholder="Rechercher..." className="flex-1" />
            <Select value={filterStatus} onChange={setFilterStatus} options={Object.entries(MISSION_STATUS).map(([k, v]) => ({value: k, label: v.label}))} placeholder="Tous statuts" className="w-40" />
          </div>

          {filtered.length === 0 && isJuniorSenior ? (
            <div className="text-center py-12 text-slate-400">
              <div className="text-4xl mb-4">📋</div>
              <p>Vous n'êtes staffé sur aucune mission pour le moment.</p>
              <p className="text-sm mt-2">Contactez votre manager pour être affecté à une mission.</p>
            </div>
          ) : (
          <Table columns={[
            {header: 'Mission', render: r => (
              <div>
                <div className="font-medium">{r.nom}</div>
                <div className="text-xs text-slate-400">{r.code}</div>
              </div>
            )},
            {header: 'Client', render: r => r.clients?.nom || '-'},
            {header: 'Responsable', render: r => r.responsable ? (
              <span className="text-sm">{r.responsable.prenom} {r.responsable.nom}</span>
            ) : <span className="text-slate-400">-</span>},
            {header: 'Type', render: r => <Badge>{r.type_facturation === 'forfait' ? 'Forfait' : 'Régie'}</Badge>},
            {header: 'Avancement', render: r => (
              <div className="min-w-[100px]">
                {r.taches_total > 0 ? (
                  <>
                    <div className="flex items-center justify-between text-xs mb-1">
                      <span className={cn(
                        "font-medium",
                        r.taches_progress === 100 ? "text-green-600" : 
                        r.taches_progress >= 50 ? "text-blue-600" : "text-amber-600"
                      )}>
                        {r.taches_progress}%
                      </span>
                      <span className="text-slate-400">{r.taches_done}/{r.taches_total}</span>
                    </div>
                    <ProgressBar 
                      value={r.taches_done} 
                      max={r.taches_total} 
                      color={r.taches_progress === 100 ? 'green' : r.taches_progress >= 50 ? 'blue' : 'amber'} 
                      size="sm" 
                      showLabel={false} 
                    />
                  </>
                ) : (
                  <span className="text-xs text-slate-400">Aucune tâche</span>
                )}
              </div>
            )},
            {header: 'Budget', render: r => (
              <div>
                <div className="font-medium">{fmtMoney(r.budget_montant)}</div>
                <ProgressBar value={getMissionTotalFacture(r)} max={r.budget_montant} color={getMissionProgress(r) >= 100 ? 'green' : 'blue'} size="sm" showLabel={false} />
                <div className="text-xs text-slate-400 mt-1">Reste: {fmtMoney(getMissionResteFacturer(r))}</div>
              </div>
            )},
            {header: 'Délai', render: r => {
              const d = getDelaiStatus(r);
              if (!d) return '-';
              return <Badge color={d.color}>{d.label}</Badge>;
            }},
            {header: 'Statut', render: r => (
              <div className="flex items-center gap-1">
                <Badge color={MISSION_STATUS[r.statut]?.color}>{MISSION_STATUS[r.statut]?.label}</Badge>
                {r.saisie_bloquee && <span title="Saisie bloquée" className="text-red-500">🔒</span>}
              </div>
            )}
          ]} data={filtered} actions={r => (
            <div className="flex gap-1">
              {/* Boutons d'approbation/rejet pour SuperAdmin sur missions pending */}
              {isSuperAdmin && r.statut === 'pending_validation' && (
                <>
                  <Button variant="success" size="xs" onClick={() => approuverMission(r)} title="Approuver">✓</Button>
                  <Button variant="danger" size="xs" onClick={() => rejeterMission(r)} title="Rejeter">✗</Button>
                </>
              )}
              <Button variant="ghost" size="xs" onClick={() => setTachesMission(r)} title="Tâches">📋</Button>
              {canEdit && r.statut !== 'pending_validation' && (
                <>
                  <Button variant="ghost" size="xs" onClick={() => openAcomptes(r)} title="Acomptes">💰</Button>
                  <Button variant="ghost" size="xs" onClick={() => openEdit(r)} title="Modifier">✏️</Button>
                  {r.statut === 'completed' && (
                    <Button 
                      variant="ghost" 
                      size="xs" 
                      onClick={() => toggleSaisieBloquee(r)} 
                      title={r.saisie_bloquee ? "Débloquer la saisie" : "Bloquer la saisie"}
                    >
                      {r.saisie_bloquee ? '🔓' : '🔒'}
                    </Button>
                  )}
                  <Button variant="ghost" size="xs" onClick={() => deleteMission(r)} title="Supprimer">🗑️</Button>
                </>
              )}
              {/* Pour les missions pending, seul le créateur peut voir/modifier */}
              {canEdit && r.statut === 'pending_validation' && (
                <>
                  <Button variant="ghost" size="xs" onClick={() => openEdit(r)} title="Modifier">✏️</Button>
                  <Button variant="ghost" size="xs" onClick={() => deleteMission(r)} title="Annuler">🗑️</Button>
                </>
              )}
            </div>
          )} />
          )}
        </Card>
      )}

      {/* MODAL MISSION */}
      <Modal isOpen={modal === 'mission'} onClose={() => setModal(null)} title={editItem ? 'Modifier mission' : 'Nouvelle mission'} size="lg">
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4">
            <Input label="Code" value={form.code} onChange={v => setForm(p => ({...p, code: v}))} />
            <Select label="Client" value={form.client_id} onChange={v => setForm(p => ({...p, client_id: v}))} options={clients.map(c => ({value: c.id, label: c.nom}))} placeholder="Sélectionner" required />
          </div>
          <Input label="Nom de la mission" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} required />
          <div className="grid grid-cols-2 gap-4">
            <Select label="Département" value={form.departement_id} onChange={v => setForm(p => ({...p, departement_id: v, responsable_id: ''}))} options={depts.map(d => ({value: d.id, label: d.nom}))} placeholder="Sélectionner" />
            <Select 
              label="Responsable (Manager+)" 
              value={form.responsable_id} 
              onChange={v => setForm(p => ({...p, responsable_id: v}))} 
              options={managers
                .filter(m => !form.departement_id || m.departement_id === form.departement_id)
                .map(m => ({value: m.id, label: `${m.prenom} ${m.nom}`}))} 
              placeholder={form.departement_id ? "Sélectionner" : "Choisir d'abord un département"} 
              disabled={!form.departement_id}
            />
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Select label="Type facturation" value={form.type_facturation} onChange={v => setForm(p => ({...p, type_facturation: v}))} options={BILLING_TYPES} />
            <Select label="Statut" value={form.statut} onChange={v => setForm(p => ({...p, statut: v}))} options={Object.entries(MISSION_STATUS).map(([k, v]) => ({value: k, label: v.label}))} />
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Input label="Budget (FCFA)" type="number" value={form.budget_montant} onChange={v => setForm(p => ({...p, budget_montant: v}))} placeholder="Montant HT prévu" />
            <Input label="Budget (Heures)" type="number" value={form.budget_heures} onChange={v => setForm(p => ({...p, budget_heures: v}))} placeholder="Nb heures prévues" />
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Input label="Date début" type="date" value={form.date_debut} onChange={v => setForm(p => ({...p, date_debut: v}))} />
            <Input label="Date fin prévue" type="date" value={form.date_fin_prevue} onChange={v => setForm(p => ({...p, date_fin_prevue: v}))} />
          </div>
          <TextArea label="Description" value={form.description} onChange={v => setForm(p => ({...p, description: v}))} rows={3} />
          <Checkbox label="Mission facturable" checked={form.facturable} onChange={v => setForm(p => ({...p, facturable: v}))} />
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button>
            <Button onClick={save} loading={saving} className="flex-1">Enregistrer</Button>
          </div>
        </div>
      </Modal>

      {/* MODAL ACOMPTES */}
      <Modal isOpen={modal === 'acomptes'} onClose={() => setModal(null)} title={`Acomptes - ${editItem?.nom}`} size="md">
        {editItem && (
          <div>
            <div className="p-3 sm:p-4 bg-slate-50 rounded-xl mb-4">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 text-center">
                <div><div className="text-xs sm:text-sm text-slate-500">Budget</div><div className="text-lg sm:text-xl font-bold">{fmtMoney(editItem.budget_montant)}</div></div>
                <div><div className="text-xs sm:text-sm text-slate-500">Facturé</div><div className="text-lg sm:text-xl font-bold text-green-600">{fmtMoney(getMissionTotalFacture(editItem))}</div></div>
                <div><div className="text-xs sm:text-sm text-slate-500">Reste</div><div className="text-lg sm:text-xl font-bold text-amber-600">{fmtMoney(getMissionResteFacturer(editItem))}</div></div>
              </div>
              <ProgressBar value={getMissionTotalFacture(editItem)} max={editItem.budget_montant} color="green" className="mt-4" />
            </div>

            <div className="space-y-2 mb-4">
              {getMissionAcomptes(editItem.id).map((a, i) => (
                <div key={a.id} className="flex items-center justify-between p-3 bg-white border rounded-xl">
                  <div>
                    <div className="font-medium">Acompte {a.numero}</div>
                    <div className="text-sm text-slate-400">{fmtDate(a.date_prevu)}</div>
                  </div>
                  <div className="text-right">
                    <div className="font-bold">{fmtMoney(a.montant)}</div>
                    <Badge color={a.statut === 'facture' ? 'green' : a.statut === 'prevu' ? 'blue' : 'gray'}>{a.statut}</Badge>
                  </div>
                </div>
              ))}
              {getMissionAcomptes(editItem.id).length === 0 && <p className="text-center text-slate-400 py-4">Aucun acompte</p>}
            </div>

            {getMissionResteFacturer(editItem) > 0 && (
              <Button onClick={addAcompte} className="w-full" icon="➕">Ajouter un acompte</Button>
            )}
          </div>
        )}
      </Modal>
      
      {/* Kanban des tâches */}
      {tachesMission && (
        <TachesKanban mission={tachesMission} onClose={() => setTachesMission(null)} />
      )}
    </div>
  );
};

// ========== TACHES - CONSTANTES ==========
const TACHE_STATUTS = {
  todo: { label: 'À faire', color: 'slate', icon: '📋' },
  in_progress: { label: 'En cours', color: 'blue', icon: '🔄' },
  review: { label: 'En révision', color: 'purple', icon: '👀' },
  done: { label: 'Terminé', color: 'green', icon: '✅' }
};

const TACHE_PRIORITES = {
  low: { label: 'Basse', color: 'slate', icon: '🔽' },
  medium: { label: 'Moyenne', color: 'amber', icon: '➡️' },
  high: { label: 'Haute', color: 'orange', icon: '🔼' },
  urgent: { label: 'Urgente', color: 'red', icon: '🔥' }
};

// ========== TACHES KANBAN COMPONENT ==========
const TachesKanban = ({ mission, onClose }) => {
  const {org, collab, user} = useApp();
  const [taches, setTaches] = useState([]);
  const [collaborateurs, setCollaborateurs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [draggedTask, setDraggedTask] = useState(null);
  const [viewMode, setViewMode] = useState('kanban'); // 'kanban' ou 'liste'
  
  // Commentaires
  const [commentaires, setCommentaires] = useState([]);
  const [selectedTache, setSelectedTache] = useState(null);
  const [newComment, setNewComment] = useState('');
  const [savingComment, setSavingComment] = useState(false);
  
  // Documents
  const [documents, setDocuments] = useState([]);
  const [uploading, setUploading] = useState(false);
  
  // Assignations multiples
  const [assignations, setAssignations] = useState([]);

  useEffect(() => { loadTaches(); }, [mission.id]);

  const loadTaches = async () => {
    const [t, c, com, docs, assign] = await Promise.all([
      supabase.from('taches_projet').select('*').eq('projet_id', mission.id).order('position'),
      supabase.from('collaborateurs').select('id,nom,prenom').eq('organisation_id', org.id).eq('actif', true),
      supabase.from('commentaires_tache').select('*,auteur:auteur_id(id,nom,prenom)').eq('organisation_id', org.id).order('created_at', {ascending: true}),
      supabase.from('documents_tache').select('*,auteur:auteur_id(id,nom,prenom)').eq('organisation_id', org.id).order('created_at', {ascending: false}),
      supabase.from('taches_assignees').select('*,collaborateur:collaborateur_id(id,nom,prenom)').eq('organisation_id', org.id)
    ]);
    setTaches(t.data || []);
    setCollaborateurs(c.data || []);
    setCommentaires(com.data || []);
    setDocuments(docs.data || []);
    setAssignations(assign.data || []);
    setLoading(false);
  };
  
  // Obtenir les collaborateurs assignés à une tâche
  const getAssigneesTache = (tacheId) => assignations
    .filter(a => a.tache_id === tacheId)
    .map(a => a.collaborateur)
    .filter(Boolean);
  
  // Obtenir les commentaires d'une tâche
  const getCommentairesTache = (tacheId) => commentaires.filter(c => c.tache_id === tacheId);
  
  // Obtenir les documents d'une tâche
  const getDocumentsTache = (tacheId) => documents.filter(d => d.tache_id === tacheId);
  
  // Toggle assignation d'un collaborateur
  const toggleAssignee = (collabId) => {
    const current = form.assignees || [];
    if (current.includes(collabId)) {
      setForm(p => ({...p, assignees: current.filter(id => id !== collabId)}));
    } else {
      setForm(p => ({...p, assignees: [...current, collabId]}));
    }
  };
  
  // Upload de document
  const uploadDocument = async (e) => {
    const file = e.target.files?.[0];
    if (!file || !selectedTache) return;
    
    // Limite de taille (10 Mo)
    if (file.size > 10 * 1024 * 1024) {
      alert('Le fichier est trop volumineux (max 10 Mo)');
      return;
    }
    
    setUploading(true);
    try {
      // Générer un nom unique
      const ext = file.name.split('.').pop();
      const fileName = `${org.id}/${mission.id}/${selectedTache.id}/${Date.now()}_${file.name}`;
      
      // Upload vers Supabase Storage
      const { data: uploadData, error: uploadError } = await supabase.storage
        .from('documents')
        .upload(fileName, file);
      
      if (uploadError) throw uploadError;
      
      // Obtenir l'URL publique
      const { data: urlData } = supabase.storage
        .from('documents')
        .getPublicUrl(fileName);
      
      // Enregistrer dans la base
      const {error: dbError} = await supabase.from('documents_tache').insert([{
        organisation_id: org.id,
        tache_id: selectedTache.id,
        auteur_id: collab?.id,
        nom_fichier: file.name,
        type_fichier: file.type || 'application/octet-stream',
        taille: file.size,
        url: urlData.publicUrl,
        storage_path: fileName
      }]);
      
      if (dbError) throw dbError;
      
      loadTaches();
    } catch(err) {
      console.error('Upload error:', err);
      alert('Erreur upload: ' + err.message);
    }
    setUploading(false);
    e.target.value = ''; // Reset input
  };
  
  // Supprimer un document
  const deleteDocument = async (doc) => {
    if (!confirm(`Supprimer "${doc.nom_fichier}" ?`)) return;
    
    try {
      // Supprimer du storage
      if (doc.storage_path) {
        await supabase.storage.from('documents').remove([doc.storage_path]);
      }
      // Supprimer de la base
      await supabase.from('documents_tache').delete().eq('id', doc.id);
      loadTaches();
    } catch(err) {
      alert('Erreur: ' + err.message);
    }
  };
  
  // Formater la taille du fichier
  const formatFileSize = (bytes) => {
    if (bytes < 1024) return bytes + ' o';
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' Ko';
    return (bytes / (1024 * 1024)).toFixed(1) + ' Mo';
  };
  
  // Icône selon le type de fichier
  const getFileIcon = (type) => {
    if (type?.startsWith('image/')) return '🖼️';
    if (type?.includes('pdf')) return '📕';
    if (type?.includes('word') || type?.includes('document')) return '📘';
    if (type?.includes('excel') || type?.includes('spreadsheet')) return '📗';
    if (type?.includes('powerpoint') || type?.includes('presentation')) return '📙';
    if (type?.includes('zip') || type?.includes('rar') || type?.includes('archive')) return '📦';
    return '📄';
  };
  
  // Ouvrir les détails d'une tâche (avec commentaires)
  const openTacheDetails = (tache) => {
    setSelectedTache(tache);
    setNewComment('');
    setModal('details');
  };
  
  // Ajouter un commentaire
  const addComment = async () => {
    if (!newComment.trim()) return;
    setSavingComment(true);
    try {
      const {error} = await supabase.from('commentaires_tache').insert([{
        organisation_id: org.id,
        tache_id: selectedTache.id,
        auteur_id: collab?.id,
        contenu: newComment.trim()
      }]);
      if (error) throw error;
      setNewComment('');
      loadTaches();
    } catch(e) {
      alert('Erreur: ' + e.message);
    }
    setSavingComment(false);
  };
  
  // Supprimer un commentaire
  const deleteComment = async (commentId) => {
    if (!confirm('Supprimer ce commentaire ?')) return;
    await supabase.from('commentaires_tache').delete().eq('id', commentId);
    loadTaches();
  };

  const openNew = (statut = 'todo') => {
    setEditItem(null);
    setForm({
      titre: '',
      description: '',
      statut: statut,
      priorite: 'medium',
      assignees: [], // Liste des IDs de collaborateurs assignés
      date_echeance: '',
      estimation_heures: ''
    });
    setModal('tache');
  };

  const openEdit = (t) => {
    setEditItem(t);
    // Récupérer les IDs des collaborateurs assignés
    const assigneeIds = getAssigneesTache(t.id).map(c => c.id);
    setForm({
      ...t,
      assignees: assigneeIds,
      date_echeance: t.date_echeance?.split('T')[0] || ''
    });
    setModal('tache');
  };

  const save = async () => {
    if (!form.titre) return alert('Titre requis');
    setSaving(true);
    try {
      const data = {
        titre: form.titre,
        description: form.description || '',
        statut: form.statut,
        priorite: form.priorite,
        date_echeance: form.date_echeance || null,
        estimation_heures: parseFloat(form.estimation_heures) || null
      };

      let tacheId = editItem?.id;

      if (editItem?.id) {
        const {error} = await supabase.from('taches_projet').update(data).eq('id', editItem.id);
        if (error) throw error;
      } else {
        // Position = dernier de la colonne
        const tachesColonne = taches.filter(t => t.statut === form.statut);
        const maxPos = Math.max(0, ...tachesColonne.map(t => t.position || 0));
        
        const {data: newTache, error} = await supabase.from('taches_projet').insert([{
          ...data,
          projet_id: mission.id,
          organisation_id: org.id,
          createur_id: collab?.id || null,
          position: maxPos + 1
        }]).select().single();
        if (error) throw error;
        tacheId = newTache.id;
      }
      
      // Gérer les assignations multiples
      if (tacheId) {
        // Supprimer les anciennes assignations
        await supabase.from('taches_assignees').delete().eq('tache_id', tacheId);
        
        // Ajouter les nouvelles assignations
        if (form.assignees && form.assignees.length > 0) {
          const assignationsToInsert = form.assignees.map(collabId => ({
            organisation_id: org.id,
            tache_id: tacheId,
            collaborateur_id: collabId
          }));
          const {error: assignError} = await supabase.from('taches_assignees').insert(assignationsToInsert);
          if (assignError) console.error('Erreur assignations:', assignError);
        }
      }
      
      setModal(null);
      loadTaches();
    } catch(e) {
      alert('Erreur: ' + e.message);
    }
    setSaving(false);
  };

  const deleteTache = async (t) => {
    if (!confirm(`Supprimer la tâche "${t.titre}" ?`)) return;
    // Supprimer aussi les assignations
    await supabase.from('taches_assignees').delete().eq('tache_id', t.id);
    await supabase.from('taches_projet').delete().eq('id', t.id);
    loadTaches();
  };

  // Drag & Drop
  const handleDragStart = (e, tache) => {
    setDraggedTask(tache);
    e.dataTransfer.effectAllowed = 'move';
  };

  const handleDragOver = (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  };

  const handleDrop = async (e, newStatut) => {
    e.preventDefault();
    if (!draggedTask || draggedTask.statut === newStatut) {
      setDraggedTask(null);
      return;
    }

    // Mettre à jour le statut
    const {error} = await supabase.from('taches_projet')
      .update({ statut: newStatut })
      .eq('id', draggedTask.id);

    if (!error) {
      setTaches(prev => prev.map(t => 
        t.id === draggedTask.id ? {...t, statut: newStatut} : t
      ));
    }
    setDraggedTask(null);
  };

  // Stats
  const stats = {
    total: taches.length,
    todo: taches.filter(t => t.statut === 'todo').length,
    in_progress: taches.filter(t => t.statut === 'in_progress').length,
    review: taches.filter(t => t.statut === 'review').length,
    done: taches.filter(t => t.statut === 'done').length,
    progress: taches.length > 0 ? Math.round((taches.filter(t => t.statut === 'done').length / taches.length) * 100) : 0
  };

  // Composant carte tâche
  const TacheCard = ({ tache }) => {
    const priorite = TACHE_PRIORITES[tache.priorite];
    const isOverdue = tache.date_echeance && new Date(tache.date_echeance) < new Date() && tache.statut !== 'done';
    const nbCommentaires = getCommentairesTache(tache.id).length;
    const nbDocuments = getDocumentsTache(tache.id).length;
    const assignees = getAssigneesTache(tache.id);
    
    return (
      <div
        draggable
        onDragStart={(e) => handleDragStart(e, tache)}
        onClick={() => openTacheDetails(tache)}
        className={cn(
          "bg-white rounded-lg border p-3 cursor-grab active:cursor-grabbing shadow-sm hover:shadow-md transition-all",
          isOverdue && "border-red-300 bg-red-50",
          draggedTask?.id === tache.id && "opacity-50"
        )}
      >
        <div className="flex items-start justify-between gap-2 mb-2">
          <h4 className="font-medium text-sm flex-1 line-clamp-2">{tache.titre}</h4>
          <button onClick={(e) => { e.stopPropagation(); openEdit(tache); }} className="text-slate-400 hover:text-slate-600 text-xs">✏️</button>
        </div>
        
        {tache.description && (
          <p className="text-xs text-slate-500 mb-2 line-clamp-2">{tache.description}</p>
        )}
        
        <div className="flex items-center gap-2 flex-wrap">
          <span className={cn("text-xs px-1.5 py-0.5 rounded", `bg-${priorite.color}-100 text-${priorite.color}-700`)}>
            {priorite.icon} {priorite.label}
          </span>
          
          {tache.date_echeance && (
            <span className={cn("text-xs", isOverdue ? "text-red-600 font-medium" : "text-slate-500")}>
              📅 {fmtDate(tache.date_echeance)}
            </span>
          )}
          
          {tache.estimation_heures && (
            <span className="text-xs text-slate-500">⏱️ {tache.estimation_heures}h</span>
          )}
          
          {nbCommentaires > 0 && (
            <span className="text-xs text-blue-500">💬 {nbCommentaires}</span>
          )}
          
          {nbDocuments > 0 && (
            <span className="text-xs text-green-500">📎 {nbDocuments}</span>
          )}
        </div>
        
        {assignees.length > 0 && (
          <div className="mt-2 pt-2 border-t flex items-center gap-1">
            <div className="flex -space-x-2">
              {assignees.slice(0, 4).map((person, idx) => (
                <div 
                  key={person.id} 
                  className="w-6 h-6 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white text-xs font-bold border-2 border-white"
                  title={`${person.prenom} ${person.nom}`}
                  style={{zIndex: 4 - idx}}
                >
                  {person.prenom?.[0]}{person.nom?.[0]}
                </div>
              ))}
              {assignees.length > 4 && (
                <div className="w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center text-slate-600 text-xs font-bold border-2 border-white">
                  +{assignees.length - 4}
                </div>
              )}
            </div>
            <span className="text-xs text-slate-500 ml-1">
              {assignees.length === 1 
                ? `${assignees[0].prenom} ${assignees[0].nom}`
                : `${assignees.length} personnes`
              }
            </span>
          </div>
        )}
      </div>
    );
  };

  // Colonne Kanban
  const KanbanColumn = ({ statut, config }) => {
    const columnTaches = taches.filter(t => t.statut === statut);
    
    return (
      <div
        onDragOver={handleDragOver}
        onDrop={(e) => handleDrop(e, statut)}

          <button

            <div className="text-center text-slate-400 text-sm py-8">

      </div>

// ========== STAFFING PAGE ==========
const StaffingPage = () => {
  const {org, collab, isManager, isAdmin, isSuperAdmin, userDeptId, gradeNiveau, isCollaborateur} = useApp();
  const [affectations, setAffectations] = useState([]);
  const [allCollaborateurs, setAllCollaborateurs] = useState([]); // Tous les collabs
  const [depts, setDepts] = useState([]);
  const [missions, setMissions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [weekStart, setWeekStart] = useState(getWeekStart());
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [filterDept, setFilterDept] = useState(''); // Filtre département
  const [missionDetail, setMissionDetail] = useState(null); // Modal détails mission
  const [congesApprouves, setCongesApprouves] = useState([]); // Congés validés
  
  // Permissions: Manager+ peut modifier, Junior/Senior lecture seule
  const canEdit = isManager && !isCollaborateur;
  // Super Admin peut voir tous les départements, Manager+ seulement le leur
  const canChooseDept = isSuperAdmin || isAdmin;
  // Junior/Senior ne voit que sa propre ligne (utilise isCollaborateur du contexte)
  const isJuniorSenior = isCollaborateur;

  useEffect(() => { loadData(); }, []);
  
  // Initialiser le filtre département pour les non-admin
  useEffect(() => {
    if (!canChooseDept && userDeptId && !isJuniorSenior) {
      setFilterDept(userDeptId);
    }
  }, [userDeptId, canChooseDept, isJuniorSenior]);

  const loadData = async () => {
    const [a, c, m, d, conges] = await Promise.all([
      supabase.from('affectations').select('*,collaborateurs(nom,prenom,departement_id),projets(id,nom,code,description,date_debut,date_fin_prevue,statut,budget_heures,budget_montant,clients(nom),responsable:responsable_id(id,nom,prenom))').eq('organisation_id', org.id),
      supabase.from('collaborateurs').select('*,grades:grade_id(nom,niveau),departements:departement_id(nom)').eq('organisation_id', org.id).eq('actif', true).order('nom'),
      supabase.from('projets').select('id,nom,code,description,date_debut,date_fin_prevue,statut,budget_heures,clients(nom)').eq('organisation_id', org.id).eq('statut', 'active'),
      supabase.from('departements').select('id,nom').eq('organisation_id', org.id).order('nom'),
      supabase.from('conges').select('*').eq('organisation_id', org.id).eq('statut', 'approved')
    ]);
    setAffectations(a.data || []);
    setAllCollaborateurs(c.data || []);
    setMissions(m.data || []);
    setDepts(d.data || []);
    
    // Mapper les congés avec collaborateur_id
    // Les congés ont utilisateur_id, on trouve le collaborateur via son user_id
    const allCollabs = c.data || [];
    const congesAvecCollab = (conges.data || []).map(cg => {
      // Trouver le collaborateur par user_id
      const collabOfConge = allCollabs.find(col => col.user_id === cg.utilisateur_id);
      return {
        ...cg,
        collaborateur_id_mapped: collabOfConge?.id || null
      };
    });
    setCongesApprouves(congesAvecCollab);
    setLoading(false);
  };
  
  // Filtrer les collaborateurs selon le profil
  const collaborateurs = allCollaborateurs.filter(c => {
    // Junior/Senior: uniquement sa propre ligne
    if (isJuniorSenior) {
      return c.id === collab?.id;
    }
    // Manager+: tous les collaborateurs (avec filtre département si actif)
    if (filterDept && c.departement_id !== filterDept) return false;
    return true;
  });

  const days = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven'].map((d, i) => ({label: d, date: addDays(weekStart, i)}));

  const getAffectation = (collabId, date) => affectations.find(a => a.collaborateur_id === collabId && a.date === date);

  const openNew = (collabId = '', date = '') => {
    if (!canEdit) return;
    setForm({collaborateur_id: collabId, projet_id: '', date: date || today(), heures: 8});
    setModal(true);
  };

  const saveAffectation = async () => {
    if (!canEdit) return;
    if (!form.collaborateur_id || !form.projet_id) return alert('Collaborateur et mission requis');
    setSaving(true);
    try {
      const existing = getAffectation(form.collaborateur_id, form.date);
      if (existing) await supabase.from('affectations').update(form).eq('id', existing.id);
      else await supabase.from('affectations').insert([{...form, organisation_id: org.id}]);
      setModal(false); loadData();
    } catch (e) { alert(e.message); }
    setSaving(false);
  };

  const deleteAffectation = async (a) => {
    if (!canEdit) return;
    await supabase.from('affectations').delete().eq('id', a.id);
    loadData();
  };

  // Calcul disponibilité
  const getCollabLoad = (collabId) => {
    const weekAff = affectations.filter(a => {
      if (a.collaborateur_id !== collabId) return false;
      return a.date >= weekStart && a.date <= addDays(weekStart, 4);
    });
    const heuresAffectees = weekAff.reduce((s, a) => s + (a.heures || 0), 0);
    
    // Ajouter les heures de congés (8h par jour de congé) - utiliser le mapping
    let heuresConges = 0;
    for (let i = 0; i < 5; i++) { // Lun à Ven
      const dateStr = addDays(weekStart, i);

};
// ========== TIMESHEET PAGE ==========
const TimesheetPage = () => {
  const {org, user, collab, isManager, isSuperAdmin, userDeptId} = useApp();
  const [weekStart, setWeekStart] = useState(getWeekStart());
  const [entries, setEntries] = useState([]);
  const [missions, setMissions] = useState([]);
  const [categories, setCategories] = useState([]);
  const [holidays, setHolidays] = useState([]);
  const [conges, setConges] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filterClient, setFilterClient] = useState('');
  const [filterSearch, setFilterSearch] = useState('');
  const [commentModal, setCommentModal] = useState(null);
  const [comment, setComment] = useState('');
  const [clients, setClients] = useState([]);
  const [showAddActivity, setShowAddActivity] = useState(false);
  const [activityName, setActivityName] = useState('');
  const [exportModal, setExportModal] = useState(false);
  const [exportRange, setExportRange] = useState({
    dateDebut: new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0], // 1er du mois
    dateFin: today()
  });
  const [exporting, setExporting] = useState(false);
  const [ytdStats, setYtdStats] = useState({ joursNonSaisis: [], totalJoursNonSaisis: 0 }); // Stats YTD

  const days = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map((d, i) => ({
    label: d, 
    date: addDays(weekStart, i),
    isWeekend: i >= 5
  }));

  useEffect(() => { loadData(); }, [weekStart]);

  const loadData = async () => {
    setLoading(true);
    const end = addDays(weekStart, 6);
    const [t, m, cat, h, cg, cl] = await Promise.all([
      supabase.from('saisies_temps').select('*,projets(nom,code,client_id,facturable)').eq('organisation_id', org.id).eq('utilisateur_id', user.id).gte('date', weekStart).lte('date', end),
      supabase.from('projets').select('*,clients(id,nom)').eq('organisation_id', org.id).in('statut', ['active', 'draft', 'completed']),
      supabase.from('categories_taches').select('*').eq('organisation_id', org.id),
      supabase.from('jours_feries').select('date,nom').eq('organisation_id', org.id),
      // Charger les congés approuvés de l'utilisateur (par utilisateur_id OU par collaborateur_id via user_id)
      supabase.from('conges').select('*').eq('organisation_id', org.id).eq('statut', 'approved'),
      supabase.from('clients').select('id,nom').eq('organisation_id', org.id)
    ]);
    setEntries(t.data || []);
    
    // Filtrer missions selon permissions et statut de blocage
    let filteredMissions = (m.data || []).filter(mission => {
      // Exclure les missions clôturées avec saisie bloquée (si le champ existe)
      if (mission.statut === 'completed' && mission.saisie_bloquee === true) return false;
      return true;
    });
    
    // Filtrer par département : missions du département OU missions internes (sans client)
    if (userDeptId) {
      filteredMissions = filteredMissions.filter(mission => 
        mission.departement_id === userDeptId || !mission.client_id
      );
    }
    setMissions(filteredMissions);
    
    setCategories(cat.data || []);
    setHolidays(h.data || []); // Garder les données complètes {date, nom}
    // Filtrer les congés pour l'utilisateur courant (par utilisateur_id, collab.user_id, ou collaborateur_id)
    const tousConges = cg.data || [];
    const mesConges = tousConges.filter(c => 
      c.utilisateur_id === user.id || 
      c.utilisateur_id === collab?.user_id ||
      c.collaborateur_id === collab?.id
    );
    setConges(mesConges);
    setClients(cl.data || []);
    
    // Calculer les heures manquantes YTD (depuis le 1er janvier jusqu'à aujourd'hui)
    const now = new Date();
    const ytdYear = now.getFullYear();
    const ytdStart = new Date(ytdYear, 0, 1); // 1er janvier de l'année en cours
    const ytdEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate()); // Aujourd'hui
    
    // Fonction pour formater une date en YYYY-MM-DD sans problème de timezone
    const formatDateLocal = (d) => {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };
    
    // Vérifier que ytdEnd est bien dans l'année en cours et après ytdStart
    if (ytdEnd < ytdStart) {
      // On est le 1er janvier, pas de jours à vérifier
      setYtdStats({ joursInccomplets: [], totalJoursInccomplets: 0, totalHeuresManquantes: 0 });
      setLoading(false);
      return;
    }
    
    // Récupérer toutes les saisies de l'année
    const {data: allYtdEntries} = await supabase.from('saisies_temps')
      .select('date, heures')
      .eq('utilisateur_id', user.id)
      .gte('date', formatDateLocal(ytdStart))
      .lte('date', formatDateLocal(ytdEnd));
    
    // Calculer les heures par jour
    const heuresParJourYtd = {};
    (allYtdEntries || []).forEach(e => {
      if (!heuresParJourYtd[e.date]) heuresParJourYtd[e.date] = 0;
      heuresParJourYtd[e.date] += parseFloat(e.heures) || 0;
    });
    
    // Parcourir tous les jours ouvrés depuis le début de l'année
    const joursInccomplets = []; // Jours avec moins de 8h
    const holidaysList = (h.data || []).map(x => x.date);
    const congesList = cg.data || [];
    let totalHeuresManquantes = 0;
    
    let currentDate = new Date(ytdStart.getTime()); // Clone pour éviter mutation
    while (currentDate <= ytdEnd) {
      const dateStr = formatDateLocal(currentDate);
      const dayOfWeek = currentDate.getDay(); // 0 = Dimanche, 6 = Samedi
      
      // Vérifier si c'est un jour ouvré (pas weekend, pas férié, pas en congé)
      const isWeekendDay = dayOfWeek === 0 || dayOfWeek === 6; // Dimanche ou Samedi
      const isHoliday = holidaysList.includes(dateStr);
      const isConge = congesList.some(c => dateStr >= c.date_debut && dateStr <= c.date_fin);
      
      if (!isWeekendDay && !isHoliday && !isConge) {
        // C'est un jour ouvré - vérifier si 8h sont saisies
        const heuresSaisies = heuresParJourYtd[dateStr] || 0;
        if (heuresSaisies < 8) {
          const heuresManquantes = 8 - heuresSaisies;
          joursInccomplets.push({
            date: dateStr,
            heuresSaisies,
            heuresManquantes
          });
          totalHeuresManquantes += heuresManquantes;
        }
      }
      
      currentDate.setDate(currentDate.getDate() + 1);
    }
    
    setYtdStats({
      joursInccomplets,
      totalJoursInccomplets: joursInccomplets.length,
      totalHeuresManquantes: Math.round(totalHeuresManquantes * 10) / 10
    });
    
    setLoading(false);
  };

  const getEntry = (projId, date) => entries.find(e => e.projet_id === projId && e.date === date);

  // Vérifier si une date est bloquée (weekend ou férié seulement, pas les congés)
  const isDateDisabled = (date, dayIndex) => {
    // Utiliser l'index pour le weekend (Lun=0, ..., Sam=5, Dim=6)
    if (dayIndex >= 5) return 'weekend';
    if (holidays.some(h => h.date === date)) return 'holiday';
    return false;
  };
  
  // Obtenir le nom du jour férié
  const getHolidayName = (date) => {
    const holiday = holidays.find(h => h.date === date);
    return holiday?.nom || 'Jour férié';
  };
  
  // Vérifier si le collaborateur est en congé ce jour
  const getCongeForDate = (date) => {
    return conges.find(c => date >= c.date_debut && date <= c.date_fin);
  };

  const updateEntry = async (projId, date, heures) => {
    // Trouver l'index du jour pour isDateDisabled
    const dayIndex = days.findIndex(d => d.date === date);
    if (dayIndex >= 0 && isDateDisabled(date, dayIndex)) return;
    const existing = getEntry(projId, date);
    const h = parseFloat(heures) || 0;
    const mission = missions.find(m => m.id === projId);
    
    if (existing) {
      if (h > 0) await supabase.from('saisies_temps').update({heures: h}).eq('id', existing.id);
      else await supabase.from('saisies_temps').delete().eq('id', existing.id);
    } else if (h > 0) {
      await supabase.from('saisies_temps').insert([{
        organisation_id: org.id, utilisateur_id: user.id, projet_id: projId,
        date, heures: h, facturable: mission?.facturable !== false
      }]);
    }
    loadData();
  };

  const openComment = (projId, date) => {
    const entry = getEntry(projId, date);
    setComment(entry?.commentaire || '');
    setCommentModal({projId, date, entryId: entry?.id});
  };

  const saveComment = async () => {
    if (!commentModal) return;
    const {projId, date, entryId} = commentModal;
    if (entryId) {
      await supabase.from('saisies_temps').update({commentaire: comment}).eq('id', entryId);
    } else {
      await supabase.from('saisies_temps').insert([{
        organisation_id: org.id, utilisateur_id: user.id, projet_id: projId,
        date, heures: 0, commentaire: comment, facturable: true
      }]);
    }
    setCommentModal(null);
    loadData();
  };

  // Filtrage missions
  const filteredMissions = missions.filter(m => {
    if (filterClient && m.client_id !== filterClient) return false;
    if (filterSearch && !m.nom.toLowerCase().includes(filterSearch.toLowerCase()) && !m.code.toLowerCase().includes(filterSearch.toLowerCase())) return false;
    return true;
  });

  // Séparation facturables / non-facturables
  const missionsFact = filteredMissions.filter(m => m.facturable !== false);
  const missionsNonFact = filteredMissions.filter(m => m.facturable === false);

  // Calculer les heures de congés de la semaine (pour affichage seulement, pas dans les totaux)
  const congesHeures = days.filter(d => !d.isWeekend && getCongeForDate(d.date)).length * 8;
  
  // Totaux - sans les congés
  const totalWeek = entries.reduce((s, e) => s + (e.heures || 0), 0);
  const totalFact = entries.filter(e => e.facturable).reduce((s, e) => s + (e.heures || 0), 0);
  const totalNonFact = entries.filter(e => !e.facturable).reduce((s, e) => s + (e.heures || 0), 0);
  
  // Calculer les heures par jour pour vérifier la limite de 8h (inclut les congés pour la validation)
  const getHeuresParJour = (date) => {
    const heuresEntries = entries.filter(e => e.date === date).reduce((s, e) => s + (e.heures || 0), 0);
    const heuresConge = getCongeForDate(date) ? 8 : 0;
    return heuresEntries + heuresConge;
  };
  
  // Vérifier si un jour dépasse 8h
  const joursEnExces = days.filter(d => !d.isWeekend && getHeuresParJour(d.date) > 8);

  const renderMissionRow = (m) => {
    const total = entries.filter(e => e.projet_id === m.id).reduce((s, e) => s + (e.heures || 0), 0);
    const isCompleted = m.statut === 'completed';
    return (
      <tr key={m.id} className={cn("border-b border-slate-50", isCompleted && "bg-green-50")}>
        <td className="px-4 py-2">
          <div className="flex items-center gap-2">
            <div className="font-medium text-sm">{m.nom}</div>
            {isCompleted && <span className="text-[10px] px-1.5 py-0.5 bg-green-200 text-green-700 rounded">Clôturée</span>}
          </div>
          <div className="text-xs text-slate-400">{m.code} • {m.clients?.nom || 'Interne'}</div>
        </td>
        {days.map((d, dayIndex) => {
          const disabled = isDateDisabled(d.date, dayIndex);
          const conge = getCongeForDate(d.date);
          const entry = getEntry(m.id, d.date);
          const heuresJour = getHeuresParJour(d.date);
          const depassement = heuresJour > 8;
          return (
            <td key={d.date} className={cn('px-1 py-2 text-center', disabled === 'weekend' && 'cell-weekend', disabled === 'holiday' && 'cell-holiday', conge && 'bg-amber-50', depassement && !disabled && !conge && 'bg-red-50')}>
              {disabled ? (
                <div 
                  className="w-14 h-10 flex items-center justify-center text-xs text-slate-400"
                  title={disabled === 'holiday' ? getHolidayName(d.date) : 'Weekend'}
                >
                  {disabled === 'holiday' ? '🎌' : '-'}
                </div>
              ) : conge ? (
                <div 
                  className="w-14 h-10 flex items-center justify-center text-xs text-amber-500"
                  title={`${conge.type_conge === 'conge_paye' ? 'Congé payé' : conge.type_conge === 'maladie' ? 'Arrêt maladie' : 'Absence'} - Pas de saisie`}
                >
                  🏖️
                </div>
              ) : (
                <div className="relative group">
                  <input type="number" min="0" max="24" step="0.5"
                    defaultValue={entry?.heures || ''}
                    onBlur={e => updateEntry(m.id, d.date, e.target.value)}
                    className={cn("w-14 px-2 py-1.5 border rounded-lg text-center text-sm focus:bg-white", depassement ? "bg-red-100 border-red-300" : "bg-slate-50")} />
                  <button onClick={() => openComment(m.id, d.date)}
                    className={cn('absolute -top-1 -right-1 w-4 h-4 rounded-full text-xs opacity-0 group-hover:opacity-100 transition-opacity',
                      entry?.commentaire ? 'bg-blue-500 text-white' : 'bg-slate-200 text-slate-500')}>
                    {entry?.commentaire ? '💬' : '+'}
                  </button>
                </div>
              )}
            </td>
          );
        })}
        <td className="px-4 py-2 text-right font-bold">{total || '-'}</td>
      </tr>
    );
  };
  
  // Export timesheet
  // Export rapide de la semaine courante
  const exportTimesheetWeek = () => {
    const data = [];
    missions.forEach(m => {
      days.forEach(d => {
        const e = getEntry(m.id, d.date);
        if (e && e.heures > 0) {
          data.push({
            mission_code: m.code,
            mission_nom: m.nom,
            client: m.clients?.nom || '',
            date: d.date,
            heures: e.heures,
            facturable: m.facturable !== false ? 'Oui' : 'Non',
            commentaire: e.commentaire || ''
          });
        }
      });
    });
    exportToExcel(data, [
      {header: 'Code mission', key: 'mission_code'},
      {header: 'Nom mission', key: 'mission_nom'},
      {header: 'Client', key: 'client'},
      {header: 'Date', key: 'date'},
      {header: 'Heures', key: 'heures'},
      {header: 'Facturable', key: 'facturable'},
      {header: 'Commentaire', key: 'commentaire'}
    ], 'timesheet_' + weekStart);
  };

  // Export avec plage de dates personnalisée
  const exportTimesheetRange = async () => {
    if (!exportRange.dateDebut || !exportRange.dateFin) {
      return alert('Veuillez sélectionner une plage de dates');
    }
    
    setExporting(true);
    try {
      // Charger toutes les entrées de la période
      const {data: allEntries, error} = await supabase
        .from('saisies_temps')
        .select('*, projets(nom, code, facturable, clients(nom))')
        .eq('organisation_id', org.id)
        .eq('utilisateur_id', user.id)
        .gte('date', exportRange.dateDebut)
        .lte('date', exportRange.dateFin)
        .order('date', {ascending: true});
      
      if (error) throw error;
      
      const exportData = (allEntries || []).filter(e => e.heures > 0).map(e => ({
        mission_code: e.projets?.code || '',
        mission_nom: e.projets?.nom || '',
        client: e.projets?.clients?.nom || '',
        date: e.date,
        heures: e.heures,
        facturable: e.projets?.facturable !== false ? 'Oui' : 'Non',
        commentaire: e.commentaire || ''
      }));
      
      if (exportData.length === 0) {
        alert('Aucune donnée à exporter pour cette période');
        setExporting(false);
        return;
      }
      
      // Calculer le total
      const totalHeures = exportData.reduce((s, e) => s + (e.heures || 0), 0);
      
      exportToExcel(exportData, [
        {header: 'Code mission', key: 'mission_code'},
        {header: 'Nom mission', key: 'mission_nom'},
        {header: 'Client', key: 'client'},
        {header: 'Date', key: 'date'},
        {header: 'Heures', key: 'heures'},
        {header: 'Facturable', key: 'facturable'},
        {header: 'Commentaire', key: 'commentaire'}
      ], `timesheet_${exportRange.dateDebut}_${exportRange.dateFin}`);
      
      alert(`✅ Export réussi !\n${exportData.length} entrées, ${totalHeures}h au total`);
      setExportModal(false);
    } catch(e) {
      alert('Erreur: ' + e.message);
    }
    setExporting(false);
  };

  return (
    <div>
      <PageHeader title="Saisie des temps" subtitle={`Semaine du ${fmtDate(weekStart)}`}
        action={<div className="flex gap-2">

          <Button variant="secondary" size="sm" onClick={() => setExportModal(true)} icon="📅">Export période</Button>
          <Button variant="secondary" size="sm" onClick={() => setWeekStart(addDays(weekStart, -7))}>←</Button>
          <Button variant="secondary" size="sm" onClick={() => setWeekStart(getWeekStart())}>Aujourd'hui</Button>
          <Button variant="secondary" size="sm" onClick={() => setWeekStart(addDays(weekStart, 7))}>→</Button>

      />

      {/* Alerte YTD - Heures manquantes */}
      {ytdStats.totalJoursInccomplets > 0 && (

              </div>
              <div className="text-sm text-amber-700 mt-1">
                Total heures manquantes : <span className="font-bold">{ytdStats.totalHeuresManquantes}h</span>

              </div>
              <details className="mt-2">

                    <tbody>

                        <tr key={j.date} className="border-t border-amber-100">
                          <td className="py-1">

                          <td className="py-1 text-right font-medium text-red-600">-{j.heuresManquantes}h</td>

                  {ytdStats.totalJoursInccomplets > 30 && (
                    <div className="mt-2 text-center text-amber-600">

                    </div>

              </div>
            </div>
          </div>
        </div>

              type="date"

              onChange={v => setExportRange(p => ({...p, dateDebut: v}))} 
            />
            <Input

          </div>
          
          {/* Raccourcis période */}
          <div className="flex flex-wrap gap-2">
            <button 
              onClick={() => {
                const now = new Date();
                setExportRange({
                  dateDebut: new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0],
                  dateFin: today()
                });
              }}
              className="px-3 py-1 text-xs bg-slate-100 hover:bg-slate-200 rounded-full"
            >
              Ce mois
            </button>
            <button 
              onClick={() => {
                const now = new Date();
                const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                const lastMonthEnd = new Date(now.getFullYear(), now.getMonth(), 0);
                setExportRange({
                  dateDebut: lastMonth.toISOString().split('T')[0],

              Mois dernier
            </button>

              onClick={() => {

                setExportRange({
                  dateDebut: new Date(now.getFullYear(), 0, 1).toISOString().split('T')[0],

                });
              }}
              className="px-3 py-1 text-xs bg-slate-100 hover:bg-slate-200 rounded-full"
            >
              Cette année
            </button>
            <button 
              onClick={() => {
                const now = new Date();
                const q = Math.floor(now.getMonth() / 3);
                setExportRange({
                  dateDebut: new Date(now.getFullYear(), q * 3, 1).toISOString().split('T')[0],
                  dateFin: today()
                });

              className="px-3 py-1 text-xs bg-slate-100 hover:bg-slate-200 rounded-full"
            >
              Ce trimestre

          </div>
          
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setExportModal(false)} className="flex-1">Annuler</Button>
            <Button onClick={exportTimesheetRange} loading={exporting} className="flex-1">📥 Exporter</Button>
          </div>
        </div>
      </Modal>

      {loading ? <Loader /> : (<>
        {/* Filtres */}
        <Card className="mb-4">
          <div className="flex flex-col sm:flex-row gap-4 items-end">
            <SearchInput value={filterSearch} onChange={setFilterSearch} placeholder="Rechercher une mission..." className="flex-1" />
            <Select value={filterClient} onChange={setFilterClient} options={clients.map(c => ({value: c.id, label: c.nom}))} placeholder="Tous les clients" className="w-48" />
            {(filterSearch || filterClient) && (
              <Button variant="ghost" size="sm" onClick={() => { setFilterSearch(''); setFilterClient(''); }}>🔄 Reset</Button>
            )}
          </div>
        </Card>

        {/* Tableau temps facturables */}
        <Card title="⏱️ Temps facturables" collapsible defaultOpen={true} className="mb-4">
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead>
                <tr className="border-b">
                  <th className="px-4 py-3 text-left w-64">Mission</th>
                  {days.map(d => {
                    const holiday = holidays.find(h => h.date === d.date);
                    const conge = getCongeForDate(d.date);
                    return (
                      <th key={d.date} className={cn('px-2 py-3 text-center w-16', d.isWeekend && 'bg-slate-50', conge && 'bg-amber-50')} title={holiday ? holiday.nom : conge ? 'Congé' : ''}>
                        {d.label}<br/><span className="text-xs text-slate-400">{d.date.split('-')[2]}</span>
                        {holiday && <span className="block text-xs" title={holiday.nom}>🎌</span>}

                      </th>

                  })}

                </tr>
              </thead>
              <tbody>
                {missionsFact.length === 0 ? (

        </Card>

        {/* Tableau temps non-facturables */}

          action={isSuperAdmin && <Button variant="secondary" size="xs" onClick={() => setShowAddActivity(true)}>➕ Activité</Button>}>
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead>
                <tr className="border-b">
                  <th className="px-4 py-3 text-left w-64">Activité</th>
                  {days.map(d => {
                    const holiday = holidays.find(h => h.date === d.date);
                    return (

                </tr>
              </thead>
              <tbody>
                {/* Ligne Congés si applicable */}
                {(() => {
                  const congesDays = days.filter(d => !d.isWeekend && getCongeForDate(d.date));
                  if (congesDays.length === 0) return null;
                  const totalConges = congesDays.length * 8;
                  return (
                    <tr className="border-b border-slate-50 bg-amber-50">
                      <td className="px-4 py-2">
                        <div className="font-medium text-sm text-amber-700">🏖️ Congés / Absences</div>

                      </td>
                      {days.map((d, dayIndex) => {
                        const conge = getCongeForDate(d.date);
                        const disabled = isDateDisabled(d.date, dayIndex);
                        return (
                          <td key={d.date} className={cn('px-1 py-2 text-center', disabled === 'weekend' && 'cell-weekend')}>
