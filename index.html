  const [modal, setModal] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);

  useEffect(() => { loadData(); }, []);

  const loadData = async () => {
    const [c, g, d] = await Promise.all([
      supabase.from('collaborateurs').select('*,grades:grade_id(nom,taux_journalier),departements:departement_id(nom)').eq('organisation_id', org.id).order('nom'),
      supabase.from('grades').select('*').eq('organisation_id', org.id).order('niveau', {ascending: false}),
      supabase.from('departements').select('*').eq('organisation_id', org.id).order('nom')
    ]);
    setCollaborateurs(c.data || []); setGrades(g.data || []); setDepts(d.data || []); setLoading(false);
  };

  // Collaborateur CRUD
  const openNewCollab = () => { setEditItem(null); setForm({code: genCode('EMP'), nom: '', prenom: '', email: '', telephone: '', departement_id: '', grade_id: '', date_entree: today(), actif: true}); setModal('collab'); };
  const openEditCollab = (c) => { setEditItem(c); setForm({...c, date_entree: c.date_entree?.split('T')[0]}); setModal('collab'); };
  
  // Créer un compte utilisateur pour le collaborateur
  const createUserAccount = async (email, prenom, nom, orgId) => {
    const DEFAULT_PASSWORD = 'Kabinet2024!';
    
    try {
      // 1. Créer le compte auth dans Supabase
      const {data: authData, error: authError} = await supabase.auth.signUp({
        email: email,
        password: DEFAULT_PASSWORD,
        options: {
          data: { prenom, nom },
          emailRedirectTo: window.location.origin
        }
      });
      
      if (authError) {
        // Si l'utilisateur existe déjà, on continue
        if (authError.message?.includes('already registered')) {
          console.log('Utilisateur auth déjà existant:', email);
          return {existing: true};
        }
        throw authError;
      }
      
      // 2. Créer l'entrée dans la table utilisateurs
      if (authData?.user) {
        const {error: userError} = await supabase.from('utilisateurs').insert([{
          auth_id: authData.user.id,
          email: email,
          prenom: prenom,
          nom: nom,
          role: 'Membre', // Rôle par défaut pour les collaborateurs
          organisation_id: orgId
        }]);
        
        if (userError) {
          console.error('Erreur création utilisateur:', userError);
          // Si erreur de contrainte, essayer avec 'Admin'
          if (userError.message?.includes('role_check')) {
            const {error: retryError} = await supabase.from('utilisateurs').insert([{
              auth_id: authData.user.id,
              email: email,
              prenom: prenom,
              nom: nom,
              role: 'Admin',
              organisation_id: orgId
            }]);
            if (retryError && !retryError.message?.includes('duplicate')) {
              console.error('Erreur retry création utilisateur:', retryError);
            }
          }
        }
      }
      
      return {success: true, password: DEFAULT_PASSWORD};
    } catch (e) {
      console.error('Erreur création compte:', e);
      return {error: e.message};
    }
  };
  
  const saveCollab = async () => {
    if (!form.nom || !form.prenom) return alert('Nom et prénom requis');
    if (!editItem && !form.email) return alert('Email requis pour créer un compte de connexion');
    
    setSaving(true);
    try {
      const grade = grades.find(g => g.id === form.grade_id);
      const data = {
        code: form.code,
        nom: form.nom,
        prenom: form.prenom,
        email: form.email || '',
        telephone: form.telephone || '',
        departement_id: form.departement_id || null,
        grade_id: form.grade_id || null,
        taux_journalier: grade?.taux_journalier || parseFloat(form.taux_journalier) || 0,
        date_entree: form.date_entree || null,
        actif: form.actif !== false,
        photo_url: form.photo_url || null
      };
      
      let result;
      if (editItem?.id) {
        // Modification
        result = await supabase.from('collaborateurs').update(data).eq('id', editItem.id);
      } else {
        // Création - d'abord créer le compte utilisateur
        if (form.email) {
          const accountResult = await createUserAccount(form.email, form.prenom, form.nom, org.id);
          
          if (accountResult.error) {
            throw new Error('Erreur création compte: ' + accountResult.error);
          }
          
          if (accountResult.success) {
            alert(`✅ Compte créé pour ${form.prenom} ${form.nom}\n\n📧 Email: ${form.email}\n🔑 Mot de passe: ${accountResult.password}\n\nLe collaborateur peut maintenant se connecter !`);
          } else if (accountResult.existing) {
            // Le compte existe déjà, on continue
            console.log('Compte existant, liaison avec collaborateur');
          }
        }
        
        // Créer le collaborateur
        result = await supabase.from('collaborateurs').insert([{...data, organisation_id: org.id}]);
      }
      
      if (result.error) throw result.error;
      setModal(null); loadData();
    } catch(e) { 
      console.error('Collab save error:', e);
      alert('Erreur: ' + e.message); 
    }
    setSaving(false);
  };
  
  // Réinitialiser le mot de passe d'un collaborateur
  const resetPassword = async (collab) => {
    if (!collab.email) return alert('Ce collaborateur n\'a pas d\'email');
    if (!confirm(`Réinitialiser le mot de passe de ${collab.prenom} ${collab.nom} ?\n\nUn email sera envoyé à ${collab.email}`)) return;
    
    try {
      const {error} = await supabase.auth.resetPasswordForEmail(collab.email, {
        redirectTo: window.location.origin + '/#'
      });
      
      if (error) throw error;
      alert(`✅ Email de réinitialisation envoyé à ${collab.email}`);
    } catch(e) {
      console.error('Reset password error:', e);
      alert('Erreur: ' + e.message);
    }
  };
  
  // Créer un compte pour un collaborateur existant (sans compte)
  const createAccountForExisting = async (collab) => {
    if (!collab.email) return alert('Ce collaborateur n\'a pas d\'email. Modifiez-le d\'abord.');
    if (!confirm(`Créer un compte de connexion pour ${collab.prenom} ${collab.nom} ?\n\nEmail: ${collab.email}`)) return;
    
    setSaving(true);
    try {
      const result = await createUserAccount(collab.email, collab.prenom, collab.nom, org.id);
      
      if (result.error) {
        throw new Error(result.error);
      }
      
      if (result.success) {
        alert(`✅ Compte créé !\n\n📧 Email: ${collab.email}\n🔑 Mot de passe: ${result.password}`);
      } else if (result.existing) {
        alert(`Ce compte existe déjà. Le collaborateur peut se connecter avec son email.`);
      }
    } catch(e) {
      alert('Erreur: ' + e.message);
    }
    setSaving(false);
  };

  // Passage de grade
  const openPassageGrade = (c) => {
    setEditItem(c);
    setForm({collaborateur_id: c.id, ancien_grade_id: c.grade_id, nouveau_grade_id: '', date_effet: today(), motif: ''});
    setModal('passage');
  };
  const savePassage = async () => {
    if (!form.nouveau_grade_id) return alert('Nouveau grade requis');
    setSaving(true);
    try {
      await supabase.from('passages_grade').insert([{...form, organisation_id: org.id}]);
      const grade = grades.find(g => g.id === form.nouveau_grade_id);
      await supabase.from('collaborateurs').update({grade_id: form.nouveau_grade_id, taux_journalier: grade?.taux_journalier}).eq('id', editItem.id);
      setModal(null); loadData();
    } catch(e) { alert(e.message); }
    setSaving(false);
  };

  const actifs = collaborateurs.filter(c => c.actif);
  
  const exportCollabs = () => exportToExcel(collaborateurs, [
    {header: 'Code', key: 'code'},
    {header: 'Prénom', key: 'prenom'},
    {header: 'Nom', key: 'nom'},
    {header: 'Email', key: 'email'},
    {header: 'Téléphone', key: 'telephone'},
    {header: 'Département', getValue: r => r.departements?.nom || ''},
    {header: 'Grade', getValue: r => r.grades?.nom || ''},
    {header: 'TJ', key: 'taux_journalier'},
    {header: 'Statut', getValue: r => r.actif ? 'Actif' : 'Inactif'}
  ], 'collaborateurs');

  return (
    <div>
      <PageHeader title="Équipe" subtitle={actifs.length + ' collaborateurs actifs'}
        tabs={[{key: 'collab', label: 'Collaborateurs', count: collaborateurs.length}, {key: 'grades', label: 'Passages de grade', icon: '🎖️'}]}
        activeTab={tab} onTabChange={setTab}
        action={<div className="flex gap-2">
          <Button variant="secondary" size="sm" onClick={exportCollabs} icon="📥">Export</Button>
          <Button onClick={openNewCollab} icon="➕">Collaborateur</Button>
        </div>}
      />

      {loading ? <Loader /> : (<>
        {tab === 'collab' && (
          <Card>
            <Table columns={[
              {header: 'Collaborateur', render: r => <div><div className="font-medium">{r.prenom} {r.nom}</div><div className="text-xs text-slate-400">{r.code}</div></div>},
              {header: 'Email', key: 'email'},
              {header: 'Département', render: r => r.departements?.nom || '-'},
              {header: 'Grade', render: r => <Badge color="blue">{r.grades?.nom || '-'}</Badge>},
              {header: 'TJ', render: r => r.taux_journalier ? fmt(r.taux_journalier) + ' F' : '-'},
              {header: 'Statut', render: r => <Badge color={r.actif ? 'green' : 'gray'}>{r.actif ? 'Actif' : 'Inactif'}</Badge>}
            ]} data={collaborateurs} actions={r => (
              <div className="flex gap-1">
                <Button variant="ghost" size="xs" onClick={() => createAccountForExisting(r)} title="Créer compte">🔑</Button>
                <Button variant="ghost" size="xs" onClick={() => resetPassword(r)} title="Réinitialiser mot de passe">📧</Button>
                <Button variant="ghost" size="xs" onClick={() => openPassageGrade(r)} title="Passage grade">🎖️</Button>
                <Button variant="ghost" size="xs" onClick={() => openEditCollab(r)} title="Modifier">✏️</Button>
              </div>
            )} />
          </Card>
        )}

        {tab === 'grades' && (
          <PromotionsTab org={org} collaborateurs={collaborateurs} grades={grades} />
        )}
      </>)}

      {/* Modal Collaborateur */}
      <Modal isOpen={modal === 'collab'} onClose={() => setModal(null)} title={editItem ? 'Modifier collaborateur' : 'Nouveau collaborateur'} size="lg">
        <div className="space-y-4">
          {!editItem && (
            <div className="p-3 bg-blue-50 border border-blue-200 rounded-xl text-blue-700 text-sm">
              <strong>💡 Création de compte automatique</strong><br/>
              Un compte de connexion sera créé avec le mot de passe par défaut : <code className="bg-blue-100 px-1 rounded">Kabinet2024!</code>
            </div>
          )}
          
          {/* Photo du collaborateur */}
          <div className="flex items-center gap-4">
            {form.photo_url ? (
              <img src={form.photo_url} alt="Photo" className="w-16 h-16 rounded-full object-cover border-2 border-slate-200" />
            ) : (
              <div className="w-16 h-16 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-xl font-bold">
                {form.prenom?.[0]}{form.nom?.[0]}
              </div>
            )}
            <div>
              <label className="text-sm font-medium text-slate-700">Photo (optionnel)</label>
              <input 
                type="file" 
                accept="image/*"
                onChange={async (e) => {
                  const file = e.target.files?.[0];
                  if (!file) return;
                  const fileName = `photos/${org.id}/${Date.now()}_${file.name}`;
                  const {error} = await supabase.storage.from('collaborateurs').upload(fileName, file);
                  if (error) { alert('Erreur: ' + error.message); return; }
                  const {data: urlData} = supabase.storage.from('collaborateurs').getPublicUrl(fileName);
                  setForm(p => ({...p, photo_url: urlData.publicUrl}));
                }}
                className="block text-sm file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-600 file:cursor-pointer"
              />
            </div>
          </div>
          
          <div className="grid grid-cols-3 gap-4">
            <Input label="Code" value={form.code} onChange={v => setForm(p => ({...p, code: v}))} />
            <Input label="Prénom" value={form.prenom} onChange={v => setForm(p => ({...p, prenom: v}))} required />
            <Input label="Nom" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} required />
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Input label="Email (servira à la connexion)" type="email" value={form.email} onChange={v => setForm(p => ({...p, email: v}))} required={!editItem} />
            <Input label="Téléphone" value={form.telephone} onChange={v => setForm(p => ({...p, telephone: v}))} />
          </div>
          <div className="grid grid-cols-3 gap-4">
            <Select label="Département" value={form.departement_id} onChange={v => setForm(p => ({...p, departement_id: v}))} options={depts.map(d => ({value: d.id, label: d.nom}))} placeholder="Sélectionner" />
            <Select label="Grade" value={form.grade_id} onChange={v => setForm(p => ({...p, grade_id: v}))} options={grades.map(g => ({value: g.id, label: g.nom + ' - ' + fmt(g.taux_journalier) + ' F'}))} placeholder="Sélectionner" />
            <Input label="Date entrée" type="date" value={form.date_entree} onChange={v => setForm(p => ({...p, date_entree: v}))} />
          </div>
          <Checkbox label="Collaborateur actif" checked={form.actif} onChange={v => setForm(p => ({...p, actif: v}))} />
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button><Button onClick={saveCollab} loading={saving} className="flex-1">{editItem ? 'Enregistrer' : 'Créer collaborateur'}</Button></div>
        </div>
      </Modal>

      {/* Modal Passage Grade */}
      <Modal isOpen={modal === 'passage'} onClose={() => setModal(null)} title={'Passage de grade - ' + editItem?.prenom + ' ' + editItem?.nom}>
        <div className="space-y-4">
          <div className="p-4 bg-slate-50 rounded-xl">
            <div className="text-sm text-slate-500">Grade actuel</div>
            <div className="font-bold">{grades.find(g => g.id === editItem?.grade_id)?.nom || 'Non défini'}</div>
          </div>
          <Select label="Nouveau grade" value={form.nouveau_grade_id} onChange={v => setForm(p => ({...p, nouveau_grade_id: v}))} options={grades.filter(g => g.id !== editItem?.grade_id).map(g => ({value: g.id, label: g.nom + ' - ' + fmt(g.taux_journalier) + ' F/j'}))} placeholder="Sélectionner" required />
          <Input label="Date d'effet" type="date" value={form.date_effet} onChange={v => setForm(p => ({...p, date_effet: v}))} />
          <TextArea label="Motif" value={form.motif} onChange={v => setForm(p => ({...p, motif: v}))} rows={2} placeholder="Promotion annuelle, performance..." />
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button><Button onClick={savePassage} loading={saving} className="flex-1">Valider passage</Button></div>
        </div>
      </Modal>
    </div>
  );
};

// ========== RAPPORTS PAGE ==========
const RapportsPage = () => {
  const {org} = useApp();
  const [data, setData] = useState({});
  const [loading, setLoading] = useState(true);
  const [period, setPeriod] = useState('month'); // month, quarter, year
  const [tab, setTab] = useState('global');

  useEffect(() => { loadData(); }, [period]);

  const getPeriodDates = () => {
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    
    if (period === 'month') {
      const start = new Date(year, month, 1);
      const end = new Date(year, month + 1, 0);
      return { start: start.toISOString().split('T')[0], end: end.toISOString().split('T')[0], label: 'Ce mois' };
    } else if (period === 'quarter') {
      const qMonth = Math.floor(month / 3) * 3;
      const start = new Date(year, qMonth, 1);
      const end = new Date(year, qMonth + 3, 0);
      return { start: start.toISOString().split('T')[0], end: end.toISOString().split('T')[0], label: 'Ce trimestre' };
    } else {
      const start = new Date(year, 0, 1);
      const end = new Date(year, 11, 31);
      return { start: start.toISOString().split('T')[0], end: end.toISOString().split('T')[0], label: 'Cette année' };
    }
  };

  const loadData = async () => {
    setLoading(true);
    const {start, end} = getPeriodDates();
    
    const [temps, factures, collabs, missions, clients, conges] = await Promise.all([
      supabase.from('saisies_temps').select('heures,facturable,date,projet_id').eq('organisation_id', org.id).gte('date', start).lte('date', end),
      supabase.from('factures').select('montant_total,montant_encaisse,statut,date_emission,client_id').eq('organisation_id', org.id),
      supabase.from('collaborateurs').select('*,grades:grade_id(taux_journalier)').eq('organisation_id', org.id).eq('actif', true),
      supabase.from('projets').select('*,clients(nom)').eq('organisation_id', org.id),
      supabase.from('clients').select('*').eq('organisation_id', org.id),
      supabase.from('conges').select('*').eq('organisation_id', org.id).eq('statut', 'approved')
    ]);

    const h = temps.data || [];
    const heuresTotal = h.reduce((s, t) => s + (t.heures || 0), 0);
    const heuresFact = h.filter(t => t.facturable).reduce((s, t) => s + (t.heures || 0), 0);
    const heuresNonFact = heuresTotal - heuresFact;
    
    const f = factures.data || [];
    const fPeriod = f.filter(x => x.date_emission >= start && x.date_emission <= end);
    const caTotal = fPeriod.reduce((s, x) => s + (x.montant_total || 0), 0);
    const caEncaisse = f.filter(x => x.statut === 'paid').reduce((s, x) => s + (x.montant_total || 0), 0);
    const caEnAttente = f.filter(x => x.statut === 'sent').reduce((s, x) => s + ((x.montant_total || 0) - (x.montant_encaisse || 0)), 0);
    
    const m = missions.data || [];
    const missionsActives = m.filter(x => x.statut === 'active').length;
    const budgetTotal = m.reduce((s, x) => s + (x.budget_montant || 0), 0);
    
    // Production valorisée (heures * taux moyen)
    const tauxMoyen = collabs.data?.length > 0 ? collabs.data.reduce((s, c) => s + (c.grades?.taux_journalier || 0), 0) / collabs.data.length / 8 : 0;
    const production = heuresFact * tauxMoyen;

    // Top clients par CA
    const clientsCA = {};
    f.forEach(fac => {
      if (fac.client_id) {
        clientsCA[fac.client_id] = (clientsCA[fac.client_id] || 0) + (fac.montant_total || 0);
      }
    });
    const topClients = Object.entries(clientsCA)
      .map(([id, ca]) => ({id, ca, nom: clients.data?.find(c => c.id === id)?.nom || 'Inconnu'}))
      .sort((a, b) => b.ca - a.ca)
      .slice(0, 5);

    // Top missions par heures
    const missionsHeures = {};
    h.forEach(t => {
      if (t.projet_id) {
        missionsHeures[t.projet_id] = (missionsHeures[t.projet_id] || 0) + (t.heures || 0);
      }
    });
    const topMissions = Object.entries(missionsHeures)
      .map(([id, heures]) => ({id, heures, nom: m.find(x => x.id === id)?.nom || 'Inconnue', code: m.find(x => x.id === id)?.code}))
      .sort((a, b) => b.heures - a.heures)
      .slice(0, 5);

    // Jours de congés
    const joursConges = (conges.data || []).reduce((s, c) => s + (c.nb_jours || 0), 0);

    setData({
      heuresTotal, heuresFact, heuresNonFact,
      tauxCharge: heuresTotal > 0 ? Math.round((heuresFact / heuresTotal) * 100) : 0,
      caTotal, caEncaisse, caEnAttente, budgetTotal, production,
      rentabilite: budgetTotal > 0 ? Math.round((caEncaisse / budgetTotal) * 100) : 0,
      missionsActives, totalMissions: m.length,
      nbCollabs: collabs.data?.length || 0,
      nbClients: clients.data?.length || 0,
      topClients, topMissions, joursConges, tauxMoyen
    });
    setLoading(false);
  };

  if (loading) return <Loader />;

  const {label} = getPeriodDates();

  return (
    <div>
      <PageHeader title="Rapports & Analyses" subtitle={label}
        tabs={[
          {key: 'global', label: 'Vue globale'},
          {key: 'temps', label: 'Temps'},
          {key: 'finance', label: 'Finance'},
          {key: 'clients', label: 'Clients'}
        ]}
        activeTab={tab} onTabChange={setTab}
        action={
          <div className="flex gap-2">
            <Select value={period} onChange={setPeriod} options={[
              {value: 'month', label: 'Ce mois'},
              {value: 'quarter', label: 'Ce trimestre'},
              {value: 'year', label: 'Cette année'}
            ]} className="w-40" />
          </div>
        }
      />
      
      {tab === 'global' && (<>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <StatCard title="Heures totales" value={fmt(data.heuresTotal) + 'h'} icon="⏱️" color="blue" />
          <StatCard title="Taux chargeabilité" value={data.tauxCharge + '%'} icon="📊" color="purple" trend={data.tauxCharge >= 75 ? 'up' : 'down'} />
          <StatCard title="CA facturé" value={fmtMoney(data.caTotal)} icon="📄" color="green" />
          <StatCard title="CA encaissé" value={fmtMoney(data.caEncaisse)} icon="💰" color="amber" />
        </div>

        <div className="grid lg:grid-cols-2 gap-6">
          <Card title="📈 Performance financière">
            <div className="space-y-4">
              <div>
                <div className="flex justify-between text-sm mb-1"><span>CA vs Budget</span><span className="font-medium">{data.rentabilite}%</span></div>
                <ProgressBar value={data.caEncaisse} max={data.budgetTotal} color={data.rentabilite >= 100 ? 'green' : 'blue'} />
                <div className="text-xs text-slate-400 mt-1">{fmtMoney(data.caEncaisse)} / {fmtMoney(data.budgetTotal)}</div>
              </div>
              <div>
                <div className="flex justify-between text-sm mb-1"><span>Production valorisée</span><span className="font-medium">{fmtMoney(data.production)}</span></div>
                <ProgressBar value={data.production} max={data.budgetTotal} color="purple" />
              </div>
              <div className="pt-2 border-t">
                <div className="flex justify-between text-sm"><span>En attente encaissement</span><span className="font-medium text-amber-600">{fmtMoney(data.caEnAttente)}</span></div>
              </div>
            </div>
          </Card>

          <Card title="🎯 Objectifs">
            <div className="grid grid-cols-2 gap-4">
              <div className="text-center p-4 bg-gradient-to-br from-blue-50 to-blue-100 rounded-xl">
                <div className={cn('text-3xl font-bold', data.tauxCharge >= 75 ? 'text-green-600' : 'text-blue-600')}>{data.tauxCharge}%</div>
                <div className="text-sm text-slate-600 font-medium">Chargeabilité</div>
                <div className="text-xs text-slate-400">Objectif: 75%</div>
                <div className="mt-2"><ProgressBar value={data.tauxCharge} max={100} color={data.tauxCharge >= 75 ? 'green' : 'blue'} size="sm" /></div>

              <div className="text-center p-4 bg-gradient-to-br from-green-50 to-green-100 rounded-xl">

// ========== MON PROFIL PAGE ==========
const MonProfilPage = () => {
  const {org, user, collab, reload} = useApp();
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [loading, setLoading] = useState(true);
  const [collabData, setCollabData] = useState(null);

  useEffect(() => { loadProfile(); }, []);

  const loadProfile = async () => {
    // Charger les données du collaborateur
    const {data} = await supabase.from('collaborateurs')
      .select('*,grades:grade_id(nom,niveau),departements:departement_id(nom)')
      .eq('email', user.email)
      .maybeSingle();
    
    if (data) {
      setCollabData(data);
      setForm({
        telephone: data.telephone || '',
        adresse: data.adresse || '',
        photo_url: data.photo_url || ''
      });
    }
    setLoading(false);
  };

  const saveProfile = async () => {
    if (!collabData?.id) return alert('Profil non trouvé');
    setSaving(true);
    try {
      const {error} = await supabase.from('collaborateurs').update({
        telephone: form.telephone || '',
        adresse: form.adresse || '',
        photo_url: form.photo_url || null
      }).eq('id', collabData.id);
      
      if (error) throw error;
      alert('✅ Profil mis à jour !');
      reload();
    } catch (e) {
      alert('Erreur: ' + e.message);
    }
    setSaving(false);
  };

  const uploadPhoto = async (file) => {
    if (!file) return;
    const fileName = `photos/${org.id}/${Date.now()}_${file.name}`;
    const {error} = await supabase.storage.from('collaborateurs').upload(fileName, file);
    if (error) { alert('Erreur upload: ' + error.message); return; }
    const {data: urlData} = supabase.storage.from('collaborateurs').getPublicUrl(fileName);
    setForm(p => ({...p, photo_url: urlData.publicUrl}));
  };

  if (loading) return <Loader text="Chargement..." />;

  return (
    <div>
      <PageHeader title="Mon profil" subtitle="Gérez vos informations personnelles" />
      
      <div className="grid lg:grid-cols-3 gap-6">
        {/* Carte profil */}
        <Card className="lg:col-span-1">
          <div className="text-center">
            {/* Photo */}
            <div className="relative inline-block mb-4">
              {form.photo_url ? (
                <img src={form.photo_url} alt="Photo" className="w-32 h-32 rounded-full object-cover border-4 border-white shadow-lg mx-auto" />
              ) : (
                <div className="w-32 h-32 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-4xl font-bold shadow-lg mx-auto">
                  {collabData?.prenom?.[0]}{collabData?.nom?.[0]}
                </div>
              )}
              <label className="absolute bottom-0 right-0 w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white cursor-pointer hover:bg-blue-600 shadow-lg">
                📷
                <input type="file" accept="image/*" className="hidden" onChange={(e) => uploadPhoto(e.target.files?.[0])} />
              </label>
            </div>
            
            <h2 className="text-xl font-bold text-slate-800">{collabData?.prenom} {collabData?.nom}</h2>
            <p className="text-slate-500">{collabData?.grades?.nom || 'Non défini'}</p>
            <Badge color="blue" className="mt-2">{collabData?.departements?.nom || 'Sans département'}</Badge>
            
            <div className="mt-6 pt-6 border-t border-slate-100 text-left space-y-3">
              <div className="flex items-center gap-3 text-sm">
                <span className="text-slate-400">📧</span>
                <span className="text-slate-600">{collabData?.email || '-'}</span>
              </div>
              <div className="flex items-center gap-3 text-sm">
                <span className="text-slate-400">🏢</span>
                <span className="text-slate-600">{org.nom}</span>
              </div>
              <div className="flex items-center gap-3 text-sm">
                <span className="text-slate-400">📅</span>
                <span className="text-slate-600">Depuis {collabData?.date_entree ? fmtDate(collabData.date_entree) : '-'}</span>
              </div>
            </div>
          </div>
        </Card>
        
        {/* Formulaire édition */}
        <Card title="✏️ Modifier mes informations" className="lg:col-span-2">
          <div className="space-y-6">
            {/* Infos non modifiables */}
            <div className="p-4 bg-slate-50 rounded-xl">
              <h4 className="font-medium text-slate-700 mb-3">Informations gérées par l'administration</h4>
              <div className="grid grid-cols-2 gap-4 text-sm">
                <div>
                  <span className="text-slate-400">Nom complet</span>
                  <p className="font-medium">{collabData?.prenom} {collabData?.nom}</p>
                </div>
                <div>
                  <span className="text-slate-400">Email</span>
                  <p className="font-medium">{collabData?.email}</p>
                </div>
                <div>
                  <span className="text-slate-400">Grade</span>
                  <p className="font-medium">{collabData?.grades?.nom || '-'}</p>
                </div>
                <div>
                  <span className="text-slate-400">Département</span>
                  <p className="font-medium">{collabData?.departements?.nom || '-'}</p>
                </div>
              </div>
            </div>
            
            {/* Infos modifiables */}
            <div>
              <h4 className="font-medium text-slate-700 mb-3">Informations modifiables</h4>
              <div className="space-y-4">
                <Input 
                  label="Téléphone" 
                  value={form.telephone} 
                  onChange={v => setForm(p => ({...p, telephone: v}))} 
                  placeholder="Ex: +221 77 123 45 67"
                />
                <TextArea 
                  label="Adresse" 
                  value={form.adresse} 
                  onChange={v => setForm(p => ({...p, adresse: v}))} 
                  placeholder="Ex: Dakar, Almadies"
                  rows={2}
                />
              </div>
            </div>
            
            <div className="flex justify-end pt-4 border-t">
              <Button onClick={saveProfile} loading={saving} icon="💾">
                Enregistrer les modifications
              </Button>
            </div>
          </div>
        </Card>
      </div>
    </div>
  );
};

// ========== PARAMETRES PAGE ==========
const ParametresPage = () => {
  const {org, abo, reload} = useApp();
  const [tab, setTab] = useState('org');
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [depts, setDepts] = useState([]);
  const [grades, setGrades] = useState([]);
  const [categories, setCategories] = useState([]);
  const [holidays, setHolidays] = useState([]);
  const [collaborateurs, setCollaborateurs] = useState([]);
  const [validateurs, setValidateurs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editModal, setEditModal] = useState(null);
  const [editForm, setEditForm] = useState({});

  useEffect(() => { setForm({nom: org.nom, adresse: org.adresse || '', ville: org.ville || '', email: org.email || '', telephone: org.telephone || '', logo_url: org.logo_url || ''}); loadParams(); }, [org]);

  const loadParams = async () => {
    const [d, g, c, h, col, val] = await Promise.all([
      supabase.from('departements').select('*').eq('organisation_id', org.id).order('nom'),
      supabase.from('grades').select('*').eq('organisation_id', org.id).order('niveau', {ascending: false}),
      supabase.from('categories_taches').select('*').eq('organisation_id', org.id).order('nom'),
      supabase.from('jours_feries').select('*').eq('organisation_id', org.id).order('date'),
      supabase.from('collaborateurs').select('*,grades:grade_id(nom,niveau),departements:departement_id(nom)').eq('organisation_id', org.id).eq('actif', true).order('nom'),
      supabase.from('validateurs_departement').select('*').eq('organisation_id', org.id)
    ]);
    setDepts(d.data || []); 
    setGrades(g.data || []); 
    setCategories(c.data || []); 
    setHolidays(h.data || []); 
    setCollaborateurs(col.data || []);
    
    // Enrichir les validateurs avec les noms des collaborateurs et départements
    const enrichedValidateurs = (val.data || []).map(v => ({
      ...v,
      collaborateur: (col.data || []).find(c => c.id === v.collaborateur_id),
      departement: (d.data || []).find(dept => dept.id === v.departement_id)
    }));
    setValidateurs(enrichedValidateurs);
    
    setLoading(false);
  };

  const saveOrg = async () => { setSaving(true); try { await supabase.from('organisations').update(form).eq('id', org.id); reload(); alert('Enregistré!'); } catch(e) { alert(e.message); } setSaving(false); };

  // Gestion des validateurs
  const addValidateur = async (type, deptId, collabId) => {
    if (!deptId || !collabId) return alert('Département et collaborateur requis');
    try {
      // Vérifier si déjà validateur
      const exists = validateurs.find(v => v.type_validation === type && v.departement_id === deptId && v.collaborateur_id === collabId);
      if (exists) return alert('Ce collaborateur est déjà validateur pour ce département');
      
      const {error} = await supabase.from('validateurs_departement').insert([{
        organisation_id: org.id,
        departement_id: deptId,
        collaborateur_id: collabId,
        type_validation: type // 'conges' ou 'frais'
      }]);
      if (error) throw error;
      loadParams();
      // Réinitialiser le formulaire
      setEditForm(p => ({...p, validateur_dept_conges: '', validateur_collab_conges: '', validateur_dept_frais: '', validateur_collab_frais: ''}));
      alert('Validateur ajouté avec succès !');
    } catch(e) { 
      console.error('Erreur ajout validateur:', e);
      alert('Erreur: ' + e.message); 
    }
  };
  
  const removeValidateur = async (id) => {
    if (!confirm('Retirer ce validateur ?')) return;
    try {
      const {error} = await supabase.from('validateurs_departement').delete().eq('id', id);
      if (error) throw error;
      loadParams();
    } catch(e) {
      console.error('Erreur suppression validateur:', e);
      alert('Erreur: ' + e.message);
    }
  };

  // CRUD générique
  const openEdit = (type, item = null) => {
    setEditModal(type);
    if (item) setEditForm({...item});
    else if (type === 'dept') setEditForm({code: '', nom: '', facturable: true, couleur: '#2563eb'});
    else if (type === 'grade') setEditForm({code: '', nom: '', niveau: 1, taux_journalier: 0, taux_cible: 80});
    else if (type === 'categorie') setEditForm({code: '', nom: '', facturable: true, couleur: '#2563eb'});
    else if (type === 'holiday') setEditForm({date: '', nom: ''});
    else if (type === 'validateur_conges') setEditForm({departement_id: '', collaborateur_id: '', type_validation: 'conges'});
    else if (type === 'validateur_frais') setEditForm({departement_id: '', collaborateur_id: '', type_validation: 'frais'});
  };

  const saveEdit = async () => {
    setSaving(true);
    try {
      let table;
      if (editModal === 'dept') table = 'departements';
      else if (editModal === 'grade') table = 'grades';
      else if (editModal === 'categorie') table = 'categories_taches';
      else if (editModal === 'holiday') table = 'jours_feries';
      else if (editModal === 'validateur_conges' || editModal === 'validateur_frais') table = 'validateurs_departement';
      
      if (editForm.id) {
        await supabase.from(table).update(editForm).eq('id', editForm.id);
      } else {
        await supabase.from(table).insert([{...editForm, organisation_id: org.id}]);
      }
      setEditModal(null); loadParams();
    } catch(e) { alert(e.message); }
    setSaving(false);
  };

  const deleteItem = async (table, id) => {
    if (!confirm('Supprimer cet élément ?')) return;
    await supabase.from(table).delete().eq('id', id);
    loadParams();
  };

  const exportData = async () => {
    const [c, p, t, f] = await Promise.all([
      supabase.from('clients').select('*').eq('organisation_id', org.id),
      supabase.from('projets').select('*').eq('organisation_id', org.id),
      supabase.from('saisies_temps').select('*').eq('organisation_id', org.id),
      supabase.from('factures').select('*').eq('organisation_id', org.id)
    ]);
    const data = {organisation: org, clients: c.data, projets: p.data, temps: t.data, factures: f.data, exportedAt: new Date().toISOString()};
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'kabinet_backup_' + today() + '.json'; a.click();
  };

  const joursRestants = abo?.date_fin ? Math.ceil((new Date(abo.date_fin) - new Date()) / (1000*60*60*24)) : 0;
  const isExpire = joursRestants <= 0;

  return (
    <div>
      <PageHeader title="Paramètres" />
      <Tabs tabs={[
        {key: 'org', label: '🏢 Organisation'}, 
        {key: 'abo', label: '💳 Abonnement'}, 
        {key: 'config', label: '⚙️ Configuration'}, 
        {key: 'validateurs', label: '✅ Validateurs'},
        {key: 'backup', label: '💾 Sauvegarde'}
      ]} active={tab} onChange={setTab} />

      <div className="mt-6">
        {tab === 'org' && (
          <Card title="Informations de l'organisation">
            <div className="space-y-4 max-w-xl">
              {/* Logo */}
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-2">Logo de l'organisation</label>
                <div className="flex items-center gap-4">
                  {form.logo_url ? (
                    <img src={form.logo_url} alt="Logo" className="w-20 h-20 rounded-xl object-cover border border-slate-200" />
                  ) : (
                    <div className="w-20 h-20 rounded-xl bg-slate-100 flex items-center justify-center text-3xl text-slate-400">🏢</div>
                  )}
                  <div>
                    <input 
                      type="file" 
                      accept="image/*"
                      onChange={async (e) => {
                        const file = e.target.files?.[0];
                        if (!file) return;
                        const fileName = `logos/${org.id}_${Date.now()}.${file.name.split('.').pop()}`;
                        const {error} = await supabase.storage.from('organisations').upload(fileName, file, {upsert: true});
                        if (error) { alert('Erreur: ' + error.message); return; }
                        const {data: urlData} = supabase.storage.from('organisations').getPublicUrl(fileName);
                        setForm(p => ({...p, logo_url: urlData.publicUrl}));
                      }}
                      className="text-sm file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-600 file:cursor-pointer"
                    />
                    <p className="text-xs text-slate-500 mt-1">PNG, JPG jusqu'à 2MB</p>
                  </div>
                </div>
              </div>
              <Input label="Nom du cabinet" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} />
              <Input label="Adresse" value={form.adresse} onChange={v => setForm(p => ({...p, adresse: v}))} />
              <div className="grid grid-cols-2 gap-4"><Input label="Ville" value={form.ville} onChange={v => setForm(p => ({...p, ville: v}))} /><Input label="Téléphone" value={form.telephone} onChange={v => setForm(p => ({...p, telephone: v}))} /></div>
              <Input label="Email" type="email" value={form.email} onChange={v => setForm(p => ({...p, email: v}))} />

// ========== ADMIN PAGE ==========
const AdminPage = () => {
  const {isSuperAdmin, setViewMode} = useApp();
  if (!isSuperAdmin) return <EmptyState icon="🔒" title="Accès refusé" description="Cette section est réservée aux super administrateurs." />;
  return (
    <div>
      <PageHeader title="Administration" />
      <Card>
        <div className="text-center py-8">
          <div className="text-5xl mb-4">🛡️</div>
          <h3 className="text-xl font-bold mb-2">Accès Super Admin</h3>
          <p className="text-slate-500 mb-6">Basculez vers l'interface d'administration globale pour gérer toutes les organisations, utilisateurs et abonnements.</p>
          <Button onClick={() => setViewMode('admin')} icon="🚀" size="lg">Ouvrir Admin Global</Button>
        </div>
      </Card>
    </div>
  );
};
// ========== ROOT APP ==========
const App = () => {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [page, setPage] = useState('landing');
  const [confirmEmail, setConfirmEmail] = useState('');

  useEffect(() => {
    supabase.auth.getSession().then(({data: {session}}) => {
      setUser(session?.user || null);
      setLoading(false);
    });
    const {data: {subscription}} = supabase.auth.onAuthStateChange((e, s) => setUser(s?.user || null));
    return () => subscription.unsubscribe();
  }, []);

  const logout = async () => {
    await supabase.auth.signOut();
    setUser(null);
    setPage('landing');
  };

  if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="loader"></div></div>;
  if (user) return <MainApp user={user} onLogout={logout} />;
  if (page === 'login') return <LoginPage onLogin={setUser} onRegister={() => setPage('register')} onBack={() => setPage('landing')} />;
  if (page === 'register') return <RegisterPage onLogin={() => setPage('login')} onBack={() => setPage('landing')} onConfirm={e => {setConfirmEmail(e); setPage('confirm');}} />;
  if (page === 'confirm') return <ConfirmPage email={confirmEmail} onLogin={() => setPage('login')} />;
  return <LandingPage onLogin={() => setPage('login')} onRegister={() => setPage('register')} />;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
