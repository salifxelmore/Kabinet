// Fonction d'export Excel générique
const exportToExcel = (data, columns, filename) => {
  if (!data || data.length === 0) {
    alert('Aucune donnée à exporter');
    return;
  }
  
  // Créer le contenu CSV
  const headers = columns.map(c => c.header).join(';');
  const rows = data.map(row => 
    columns.map(c => {
      let val = c.key ? row[c.key] : (c.getValue ? c.getValue(row) : '');
      if (val === null || val === undefined) val = '';
      // Échapper les guillemets et points-virgules
      val = String(val).replace(/"/g, '""');
      if (val.includes(';') || val.includes('"') || val.includes('\n')) {
        val = '"' + val + '"';
      }
      return val;
    }).join(';')
  ).join('\n');
  
  const csv = '\uFEFF' + headers + '\n' + rows; // BOM pour Excel
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename + '_' + today() + '.csv';
  a.click();
  URL.revokeObjectURL(url);
};

const getWeekStart = (date = new Date()) => {
  // Parser la date correctement en UTC pour éviter les décalages
  let d;
  if (typeof date === 'string') {
    const [year, month, day] = date.split('-').map(Number);
    d = new Date(year, month - 1, day, 12, 0, 0);
  } else {
    d = new Date(date);
    d.setHours(12, 0, 0, 0);
  }
  const day = d.getDay();
  // getDay(): 0=Dimanche, 1=Lundi, ..., 6=Samedi
  // On veut que la semaine commence le Lundi
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const dayNum = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${dayNum}`;
};

const addDays = (date, n) => {
  // Parser la date correctement pour éviter les décalages de fuseau horaire
  let d;
  if (typeof date === 'string') {
    const [year, month, day] = date.split('-').map(Number);
    d = new Date(year, month - 1, day, 12, 0, 0);
  } else {
    d = new Date(date);
    d.setHours(12, 0, 0, 0);
  }
  d.setDate(d.getDate() + n);
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const dayNum = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${dayNum}`;
};

const isWeekend = (date) => {
  let d;
  if (typeof date === 'string') {
    const [year, month, day] = date.split('-').map(Number);
    d = new Date(year, month - 1, day, 12, 0, 0);
  } else {
    d = new Date(date);
  }
  return d.getDay() === 0 || d.getDay() === 6;
};

const isHoliday = (date, holidays = []) => holidays.includes(date);

const daysBetween = (start, end) => {
  const s = new Date(start);
  const e = new Date(end);
  return Math.ceil((e - s) / (1000 * 60 * 60 * 24));
};

const workingDaysBetween = (start, end, holidays = []) => {
  let count = 0;
  let current = new Date(start);
  const endDate = new Date(end);
  while (current <= endDate) {
    const dateStr = current.toISOString().split('T')[0];
    if (!isWeekend(dateStr) && !isHoliday(dateStr, holidays)) {
      count++;
    }
    current.setDate(current.getDate() + 1);
  }
  return count;
};

const ChartComponent = ({type, data, options = {}, height = 300}) => {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || !data) return;
    if (chartRef.current) chartRef.current.destroy();
    
    const ctx = canvasRef.current.getContext('2d');
    chartRef.current = new Chart(ctx, {
      type,
      data,
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {position: 'bottom', labels: {padding: 20, usePointStyle: true}},
          ...options.plugins
        },
        ...options
      }
    });
    
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [type, data, options]);

  return <div style={{height}}><canvas ref={canvasRef}></canvas></div>;
};

const LoginPage = ({onLogin, onRegister, onBack}) => {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [resetMode, setResetMode] = useState(false);
  const [resetSent, setResetSent] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!email || !password) return setError('Email et mot de passe requis');
    setLoading(true); setError('');
    try {
      const {data, error: err} = await supabase.auth.signInWithPassword({email: email.toLowerCase().trim(), password});
      if (err) throw err;
      onLogin(data.user);
    } catch (e) {
      setError(e.message === 'Invalid login credentials' ? 'Email ou mot de passe incorrect' : e.message);
    }
    setLoading(false);
  };

  const handleResetPassword = async (e) => {
    e.preventDefault();
    if (!email) return setError('Veuillez entrer votre email');
    setLoading(true); setError('');
    try {
      const {error: err} = await supabase.auth.resetPasswordForEmail(email.toLowerCase().trim(), {
        redirectTo: window.location.origin
      });
      if (err) throw err;
      setResetSent(true);
    } catch (e) {
      setError(e.message);
    }
    setLoading(false);
  };

  return (
    <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-purple-50 flex items-center justify-center p-4">
      <div className="w-full max-w-md">
        <div className="text-center mb-8">
          <button onClick={onBack} className="text-slate-400 hover:text-slate-600 text-sm mb-6">← Retour à l'accueil</button>
          <div className="flex justify-center mb-4">
            <MissuraLogo size={72} />
          </div>
          <h1 className="text-2xl font-bold text-slate-800">{resetMode ? 'Réinitialiser le mot de passe' : 'Connexion'}</h1>
          {resetMode && <p className="text-slate-500 mt-2 text-sm">Entrez votre email pour recevoir un lien de réinitialisation</p>}
        </div>

        {resetSent ? (
          <div className="card p-6 text-center">
            <div className="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">✉️</div>
            <h3 className="text-lg font-bold text-slate-800 mb-2">Email envoyé !</h3>
            <p className="text-slate-500 mb-4">Vérifiez votre boîte mail pour réinitialiser votre mot de passe.</p>
            <Button onClick={() => {setResetMode(false); setResetSent(false);}} className="w-full">Retour à la connexion</Button>
          </div>
        ) : resetMode ? (
          <form onSubmit={handleResetPassword} className="card p-6 space-y-4">
            {error && <div className="p-3 bg-red-50 border border-red-100 rounded-xl text-red-600 text-sm">{error}</div>}
            <Input label="Email" type="email" value={email} onChange={setEmail} placeholder="votre@email.com" required />
            <Button type="submit" loading={loading} className="w-full">Envoyer le lien</Button>
            <button type="button" onClick={() => setResetMode(false)} className="w-full text-slate-500 hover:text-slate-700 text-sm">
              Retour à la connexion
            </button>
          </form>
        ) : (
          <form onSubmit={handleSubmit} className="card p-6 space-y-4">
            {error && <div className="p-3 bg-red-50 border border-red-100 rounded-xl text-red-600 text-sm">{error}</div>}
            <Input label="Email" type="email" value={email} onChange={setEmail} placeholder="votre@email.com" required />
            <Input label="Mot de passe" type="password" value={password} onChange={setPassword} placeholder="••••••••" required />
            <div className="flex justify-end">
              <button type="button" onClick={() => setResetMode(true)} className="text-blue-600 hover:underline text-sm">
                Mot de passe oublié ?
              </button>
            </div>
            <Button type="submit" loading={loading} className="w-full">Se connecter</Button>
          </form>
        )}
        
        {!resetMode && !resetSent && (
          <p className="text-center text-slate-500 mt-6">
            Pas encore de compte ? <button onClick={onRegister} className="text-blue-600 font-semibold hover:underline">S'inscrire</button>

  );

const RegisterPage = ({onLogin, onBack, onConfirm}) => {

  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const set = (k, v) => setForm(p => ({...p, [k]: v}));

  const handleSubmit = async () => {
    if (!form.cabinet || !form.nom || !form.prenom || !form.email || !form.password) return setError('Tous les champs sont requis');
    if (form.password.length < 6) return setError('Le mot de passe doit contenir au moins 6 caractères');
    setLoading(true); setError('');
    try {
      const {data: auth, error: e1} = await supabase.auth.signUp({email: form.email.toLowerCase().trim(), password: form.password});
      if (e1) throw e1;
      
      const {data: org, error: e2} = await supabase.from('organisations').insert([{nom: form.cabinet}]).select().single();
      if (e2) throw e2;
      
      await supabase.from('utilisateurs').insert([{
        organisation_id: org.id, auth_id: auth.user?.id, nom: form.nom, prenom: form.prenom,

const MainApp = ({user, onLogout}) => {
  const [userData, setUserData] = useState(null);
  const [collabData, setCollabData] = useState(null); // Collaborateur avec grade
  const [orgData, setOrgData] = useState(null);
  const [aboData, setAboData] = useState(null);
  const [loading, setLoading] = useState(true);
  // Récupérer la page sauvegardée ou 'dashboard' par défaut
  const [page, setPageState] = useState(() => {
    try {
      return localStorage.getItem('missura_current_page') || 'dashboard';
    } catch { return 'dashboard'; }
  });
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [viewMode, setViewMode] = useState('org'); // 'admin' ou 'org' - défaut: org
  const [userMenuOpen, setUserMenuOpen] = useState(false); // Menu utilisateur
  const isSuperAdmin = SUPER_ADMINS.includes(user?.email);
  
  // Wrapper pour setPage qui sauvegarde aussi dans localStorage
  const setPage = (newPage) => {
    setPageState(newPage);
    try {
      localStorage.setItem('missura_current_page', newPage);
    } catch {}
  };

  useEffect(() => { loadUser(); }, [user]);

  const loadUser = async () => {
    try {
      console.log('Loading user with auth_id:', user.id);
      // Requête simplifiée - charger utilisateur et organisation séparément
      const {data: u, error: userError} = await supabase.from('utilisateurs').select('*').eq('auth_id', user.id).single();
      console.log('User data:', u, 'Error:', userError);
      
      if (u && u.organisation_id) {
        // Charger l'organisation
        const {data: org} = await supabase.from('organisations').select('*').eq('id', u.organisation_id).single();
        // Charger l'abonnement
        const {data: a} = await supabase.from('abonnements').select('*').eq('organisation_id', u.organisation_id).order('created_at', {ascending: false}).limit(1).single();
        // Charger le collaborateur associé avec son grade
        const {data: collab} = await supabase.from('collaborateurs')
          .select('*,grades:grade_id(id,nom,niveau),departements:departement_id(id,nom)')
          .eq('organisation_id', u.organisation_id)
          .eq('email', user.email)
          .maybeSingle(); // maybeSingle au lieu de single pour éviter erreur si pas de collab
        
        setUserData(u);
        setOrgData(org);
        setAboData(a);
        setCollabData(collab);
        console.log('User loaded successfully:', u, org, a, 'Collab:', collab);
      } else if (isSuperAdmin) {
        console.log('Super admin without org, showing admin panel');
        setViewMode('admin');
      }
    } catch (e) { console.error('LoadUser error:', e); }
    setLoading(false);
  };

  if (loading) return <Loader text="Chargement..." />;
  
  // Si mode admin forcé (Super Admin uniquement)
  if (isSuperAdmin && viewMode === 'admin') {
    return <SuperAdminApp user={user} onLogout={onLogout} onSwitchToOrg={() => setViewMode('org')} hasOrg={!!userData} />;
  }
  
  // Si pas de données utilisateur et pas super admin
  if (!userData || !orgData) {
    if (isSuperAdmin) {
      return <SuperAdminApp user={user} onLogout={onLogout} onSwitchToOrg={() => setViewMode('org')} hasOrg={false} />;
    }
    return (
      <div className="min-h-screen flex items-center justify-center flex-col gap-4">
        <p className="text-slate-600">Erreur de chargement des données utilisateur.</p>
        <Button onClick={onLogout}>Déconnexion</Button>
      </div>
    );
  }

  // ========== SYSTÈME DE PERMISSIONS ==========
  // Niveaux: 1=Junior, 2=Senior, 3=Manager, 4=Senior Manager, 5=Associé
  
  // Fallback: si niveau pas défini, déterminer par le nom du grade
  const getGradeNiveau = () => {
    const niveau = collabData?.grades?.niveau;
    if (niveau && niveau > 0) return niveau;
    
    // Fallback basé sur le nom du grade
    const gradeName = (collabData?.grades?.nom || '').toLowerCase();
    if (gradeName.includes('junior') || gradeName.includes('stagiaire')) return 1;
    if (gradeName.includes('senior') && !gradeName.includes('manager')) return 2;
    if (gradeName.includes('manager') && !gradeName.includes('senior')) return 3;
    if (gradeName.includes('senior manager') || gradeName.includes('directeur')) return 4;
    if (gradeName.includes('associé') || gradeName.includes('partner') || gradeName.includes('associe')) return 5;
    
    return 0; // Pas de grade = pas de droits spéciaux
  };
  
  const gradeNiveau = getGradeNiveau();
  const userRole = (userData.role || '').toLowerCase();
  const isAdmin = userRole === 'admin' || isSuperAdmin;
  
  // IMPORTANT: Les permissions sont basées UNIQUEMENT sur le grade du collaborateur
  // isAdmin donne tous les droits, sinon c'est le niveau du grade qui compte
  const isAssocie = gradeNiveau >= 5 || isAdmin;
  const isManager = gradeNiveau >= 3 || isAdmin;
  const isSenior = gradeNiveau === 2;
  const isJunior = gradeNiveau === 1;
  const isCollaborateur = gradeNiveau > 0 && gradeNiveau <= 2 && !isAdmin; // Junior ou Senior sans droits admin
  const userDeptId = collabData?.departement_id;
  
  // Permissions par fonctionnalité
  const permissions = {
    dashboard: true, // Tout le monde (mais contenu différent)
    staffing: true, // Tout le monde (mais lecture seule pour junior/senior)
    timesheet: true, // Tout le monde
    conges: true, // Tout le monde
    frais: true, // Tout le monde
    profil: true, // Tout le monde peut voir son profil
    crm: isManager && !isCollaborateur, // Manager+ seulement
    missions: true, // Tout le monde (juniors/seniors voient seulement leurs missions staffées)
    facturation: isManager && !isCollaborateur, // Manager+ (leurs missions) et Associé+ (toutes)
    soustraitance: isManager && !isCollaborateur, // Manager+ seulement

const SuperAdminApp = ({user, onLogout, onSwitchToOrg, hasOrg = true}) => {
  const [orgs, setOrgs] = useState([]);
  const [users, setUsers] = useState([]);
  const [abos, setAbos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('orgs');
  const [editOrg, setEditOrg] = useState(null);
  const [editForm, setEditForm] = useState({plan: 'trial', date_fin: ''});
  const [saving, setSaving] = useState(false);
  const [linkModal, setLinkModal] = useState(false);
  const [selectedOrg, setSelectedOrg] = useState('');

  useEffect(() => { loadData(); }, []);

  const linkToOrg = async () => {
    if (!selectedOrg) return alert('Sélectionnez une organisation');
    setSaving(true);
    try {
      // Vérifier si l'utilisateur existe déjà
      const {data: existingUser} = await supabase.from('utilisateurs').select('id').eq('auth_id', user.id).maybeSingle();
      
      if (existingUser) {
        // Mettre à jour
        const {error} = await supabase.from('utilisateurs').update({organisation_id: selectedOrg}).eq('id', existingUser.id);
        if (error) throw error;
      } else {
        // Créer
        const {error} = await supabase.from('utilisateurs').insert([{
          auth_id: user.id,
          organisation_id: selectedOrg,
          email: user.email,
          nom: 'Admin',
          prenom: 'Super',
          role: 'Admin'
        }]);
        if (error) throw error;
      }
      setLinkModal(false);
      setSaving(false);
      // Forcer le rechargement complet de la page
      window.location.href = window.location.href;
    } catch(e) { 
      console.error(e);
      alert('Erreur: ' + e.message); 
      setSaving(false);
    }
  };

  const loadData = async () => {
    const [o, u, a] = await Promise.all([
      supabase.from('organisations').select('*').order('created_at', {ascending: false}),
      supabase.from('utilisateurs').select('*,organisations(nom)').order('created_at', {ascending: false}),
      supabase.from('abonnements').select('*,organisations(nom)').order('created_at', {ascending: false})
    ]);
    setOrgs(o.data || []);
    setUsers(u.data || []);
    setAbos(a.data || []);
    setLoading(false);
  };

  const getAbo = (orgId) => abos.find(a => a.organisation_id === orgId);
  
  const openEdit = (org) => {
    const a = getAbo(org.id);
    setEditOrg(org);
    setEditForm({plan: a?.plan || 'trial', date_fin: a?.date_fin?.split('T')[0] || ''});
  };

  const saveAbo = async () => {
    if (!editOrg) return;
    setSaving(true);
    try {
      const a = getAbo(editOrg.id);
      const data = {
        organisation_id: editOrg.id,
        plan: editForm.plan,
        statut: 'actif',
        date_debut: new Date().toISOString(),
        date_fin: editForm.date_fin ? new Date(editForm.date_fin).toISOString() : null,
        montant: PLANS[editForm.plan]?.prix || 0
      };
      if (a?.id) await supabase.from('abonnements').update(data).eq('id', a.id);
      else await supabase.from('abonnements').insert([data]);
      await loadData();
      setEditOrg(null);
    } catch (e) { alert(e.message); }
    setSaving(false);
  };

  const stats = {
    total: orgs.length,
    trial: abos.filter(a => a.plan === 'trial').length,
    standard: abos.filter(a => a.plan === 'standard').length,
    premium: abos.filter(a => a.plan === 'premium').length
  };

  return (
    <div className="min-h-screen bg-slate-50">
      <header className="bg-white border-b border-slate-100 px-6 py-4 flex items-center justify-between sticky top-0 z-30">
        <div className="flex items-center gap-3">
          <MissuraLogo size={40} />
          <div>
            <div className="font-bold text-slate-800">Missura</div>
            <div className="text-xs text-amber-600 font-medium">🛡️ Super Admin</div>
          </div>
        </div>
        <div className="flex items-center gap-4">
          <span className="text-sm text-slate-500 hidden sm:block">{user.email}</span>
          {hasOrg ? (
            <Button variant="primary" size="sm" onClick={onSwitchToOrg}>🏢 Mon Cabinet</Button>
          ) : (
            <Button variant="warning" size="sm" onClick={() => setLinkModal(true)}>🔗 Lier à un cabinet</Button>
          )}
          <Button variant="secondary" size="sm" onClick={onLogout}>Déconnexion</Button>
        </div>
      </header>

      <div className="max-w-7xl mx-auto p-6">
        <h1 className="text-2xl font-bold text-slate-800 mb-6">Administration Globale</h1>

        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <StatCard title="Organisations" value={stats.total} icon="🏢" color="blue" />
          <StatCard title="Essais" value={stats.trial} icon="🎁" color="amber" />
          <StatCard title="Standard" value={stats.standard} icon="⭐" color="green" />
          <StatCard title="Premium" value={stats.premium} icon="👑" color="purple" />
        </div>

        <Card>
          <Tabs tabs={[
            {key: 'orgs', label: 'Organisations', icon: '🏢', count: orgs.length},
            {key: 'users', label: 'Utilisateurs', icon: '👥', count: users.length},
            {key: 'abos', label: 'Abonnements', icon: '💳', count: abos.length}
          ]} active={tab} onChange={setTab} />
          
          <div className="p-4">
            {loading ? <Loader /> : (
              <>
                {tab === 'orgs' && (
                  <Table columns={[
                    {header: 'Cabinet', render: r => <div><div className="font-medium text-slate-800">{r.nom}</div><div className="text-xs text-slate-400">{fmtDate(r.created_at)}</div></div>},
                    {header: 'Plan', render: r => {
                      const a = getAbo(r.id);
                      const plan = PLANS[a?.plan] || PLANS.trial;
                      return <Badge color={plan.color}>{plan.icon} {plan.nom}</Badge>;
                    }},
                    {header: 'Expire', render: r => {
                      const a = getAbo(r.id);
                      if (!a?.date_fin) return '-';
                      const days = daysBetween(today(), a.date_fin);
                      return <span className={days < 0 ? 'text-red-500 font-medium' : days < 7 ? 'text-amber-500' : ''}>{fmtDate(a.date_fin)}</span>;
                    }}
                  ]} data={orgs} actions={r => (
                    <Button variant="ghost" size="xs" onClick={() => openEdit(r)}>✏️</Button>
                  )} />
                )}
                
                {tab === 'users' && (
                  <Table columns={[
                    {header: 'Utilisateur', render: r => <div><div className="font-medium text-slate-800">{r.prenom} {r.nom}</div><div className="text-xs text-slate-400">{r.email}</div></div>},
                    {header: 'Cabinet', render: r => r.organisations?.nom || '-'},
                    {header: 'Rôle', render: r => <Badge color={r.role === 'Admin' ? 'blue' : 'gray'}>{r.role}</Badge>},
                    {header: 'Créé', render: r => fmtDate(r.created_at)}
                  ]} data={users} />
                )}
                
                {tab === 'abos' && (
                  <Table columns={[
                    {header: 'Cabinet', render: r => r.organisations?.nom || '-'},
                    {header: 'Plan', render: r => <Badge color={PLANS[r.plan]?.color || 'gray'}>{PLANS[r.plan]?.nom || r.plan}</Badge>},
                    {header: 'Statut', render: r => <Badge color={r.statut === 'actif' ? 'green' : 'red'}>{r.statut}</Badge>},
                    {header: 'Période', render: r => <span className="text-sm">{fmtDate(r.date_debut)} → {fmtDate(r.date_fin)}</span>}
                  ]} data={abos} />
                )}
              </>
            )}
          </div>
        </Card>
      </div>

      <Modal isOpen={!!editOrg} onClose={() => setEditOrg(null)} title={`Modifier: ${editOrg?.nom}`} size="sm">
        <div className="space-y-4">
          <Select label="Plan" value={editForm.plan} onChange={v => setEditForm(p => ({...p, plan: v}))}
            options={Object.entries(PLANS).map(([k, v]) => ({value: k, label: `${v.icon} ${v.nom} - ${v.prix > 0 ? fmt(v.prix) + ' F/mois' : 'Gratuit'}`}))} />
          <Input label="Date d'expiration" type="date" value={editForm.date_fin} onChange={v => setEditForm(p => ({...p, date_fin: v}))} />
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setEditOrg(null)} className="flex-1">Annuler</Button>
            <Button onClick={saveAbo} loading={saving} className="flex-1">Enregistrer</Button>
          </div>
        </div>
      </Modal>

      <Modal isOpen={linkModal} onClose={() => setLinkModal(false)} title="Lier votre compte à un cabinet" size="sm">
        <div className="space-y-4">
          <p className="text-slate-600 text-sm">Votre compte Super Admin n'est pas encore lié à un cabinet. Sélectionnez le cabinet auquel vous souhaitez accéder :</p>
          <Select label="Cabinet" value={selectedOrg} onChange={setSelectedOrg} 
            options={orgs.map(o => ({value: o.id, label: o.nom}))} placeholder="Sélectionner un cabinet" />
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setLinkModal(false)} className="flex-1">Annuler</Button>
            <Button onClick={linkToOrg} loading={saving} className="flex-1">Lier mon compte</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};

const DashboardPage = () => {
  const {org, user, collab, isManager, isAdmin, isAssocie, isSuperAdmin, isCollaborateur, setPage, userDeptId} = useApp();
  const [stats, setStats] = useState({
    caFactureTTC: 0, facturesTotal: 0, caEncaisse: 0, tauxRecouvrement: 0,
    tauxCharge: 0, heuresFact: 0, heuresTotal: 0, projetsActifs: 0, projetsTotal: 0
  });
  const [myStats, setMyStats] = useState({});
  const [loading, setLoading] = useState(true);
  const [chartData, setChartData] = useState({});
  const [recentActivity, setRecentActivity] = useState([]);
  const [topMissions, setTopMissions] = useState([]);
  const [teamPerformance, setTeamPerformance] = useState([]);
  const [allCollaborateurs, setAllCollaborateurs] = useState([]);
  const [selectedCollabId, setSelectedCollabId] = useState(''); // Pour voir la perf d'un collab
  const [collabStats, setCollabStats] = useState(null); // Stats du collab sélectionné
  const [departements, setDepartements] = useState([]);
  const [privileges, setPrivileges] = useState([]);
  
  // Filtres période
  const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
  const [dateRange, setDateRange] = useState({ start: '', end: '' });
  const [filterMode, setFilterMode] = useState('year'); // 'year' ou 'range'
  const [filterDept, setFilterDept] = useState(''); // Filtre département

  // Vérifier si l'utilisateur a un accès global (Managing Partner niveau 6+ ou privilège spécial)
  const gradeNiveau = collab?.grades?.niveau || 0;
  const isManagingPartner = gradeNiveau >= 6;
  const hasGlobalAccess = isManagingPartner || isSuperAdmin || privileges.some(p => p.collaborateur_id === collab?.id && p.type_privilege === 'acces_global');
  
  // Pour les non-Managing Partners, forcer le filtre sur leur département
  const effectiveDeptFilter = hasGlobalAccess ? filterDept : userDeptId;

  useEffect(() => { loadPrivileges(); }, []);
  useEffect(() => { loadStats(); }, [selectedYear, dateRange, filterMode, filterDept, effectiveDeptFilter]);
  
  const loadPrivileges = async () => {
    const [depts, privs] = await Promise.all([
      supabase.from('departements').select('id,nom').eq('organisation_id', org.id).order('nom'),
      supabase.from('privileges_speciaux').select('*').eq('organisation_id', org.id).eq('actif', true)
    ]);
    setDepartements(depts.data || []);
    setPrivileges(privs.data || []);
  };
  
  // Calculer les dates de période
  const getPeriodDates = () => {
    if (filterMode === 'range' && dateRange.start && dateRange.end) {
      return { start: dateRange.start, end: dateRange.end };
    }
    return { 
      start: `${selectedYear}-01-01`, 
      end: `${selectedYear}-12-31` 
    };
  };

  const loadStats = async () => {
    const { start, end } = getPeriodDates();
    
    // Stats globales (pour managers+)
    if (isManager || isAdmin) {
      const [clients, projets, temps, factures, collabList, affectations, utilisateurs] = await Promise.all([
        supabase.from('clients').select('id, created_at, departement_id').eq('organisation_id', org.id),
        supabase.from('projets').select('id, nom, code, statut, budget_montant, montant_facture, budget_heures, departement_id, client_id, clients(nom)').eq('organisation_id', org.id),
        supabase.from('saisies_temps').select('*').eq('organisation_id', org.id),
        supabase.from('factures').select('*').eq('organisation_id', org.id),
        supabase.from('collaborateurs').select('id, nom, prenom, email, actif, grade_id, departement_id, user_id, grades(nom,niveau)').eq('organisation_id', org.id),
        supabase.from('affectations').select('*').eq('organisation_id', org.id),
        supabase.from('utilisateurs').select('id, auth_id, email, nom, prenom').eq('organisation_id', org.id)
      ]);
      
      let allTemps = temps.data || [];
      const allUsers = utilisateurs.data || [];
      let allCollabs = collabList.data || [];
      let allProjets = projets.data || [];
      let allFactures = factures.data || [];
      let allClients = clients.data || [];
      
      // ===== FILTRAGE PAR DÉPARTEMENT =====
      if (effectiveDeptFilter) {
        // Filtrer les collaborateurs par département
        allCollabs = allCollabs.filter(c => c.departement_id === effectiveDeptFilter);
        
        // Filtrer les clients par département
        allClients = allClients.filter(c => c.departement_id === effectiveDeptFilter || !c.departement_id);
        
        // Filtrer les projets : département du projet OU missions internes (sans client)
        allProjets = allProjets.filter(p => p.departement_id === effectiveDeptFilter || !p.client_id);
        
        // Obtenir les user_ids des collaborateurs du département
        const deptCollabEmails = allCollabs.map(c => c.email).filter(Boolean);
        const deptUtilisateurIds = allUsers.filter(u => deptCollabEmails.includes(u.email)).map(u => u.id);
        
        // Filtrer les temps par utilisateur du département
        allTemps = allTemps.filter(t => deptUtilisateurIds.includes(t.utilisateur_id));
        
        // Filtrer les factures par projet du département
        // Si le projet a un departement_id qui correspond, on garde la facture
        const deptProjetIds = allProjets.filter(p => p.departement_id === effectiveDeptFilter).map(p => p.id);
        
        // DEBUG: Afficher dans la console pour comprendre
        console.log('Dept filter:', effectiveDeptFilter);
        console.log('Projets avec ce dept:', allProjets.filter(p => p.departement_id === effectiveDeptFilter).map(p => ({nom: p.nom, dept: p.departement_id})));
        console.log('IDs projets:', deptProjetIds);
        console.log('Factures avant filtre:', allFactures.length);
        
        allFactures = allFactures.filter(f => deptProjetIds.includes(f.projet_id));
        
        console.log('Factures après filtre:', allFactures.length);
      }
      
      // Stocker les collaborateurs pour le sélecteur (filtrés si nécessaire)
      setAllCollaborateurs(allCollabs.filter(c => c.actif));
      
      // Filtrer les temps par période
      const tempsPeriode = allTemps.filter(t => t.date >= start && t.date <= end);

      const projetsActifs = allProjets.filter(p => p.statut === 'active') || [];
      const heuresTotal = tempsPeriode.reduce((s, t) => s + (parseFloat(t.heures) || 0), 0);
      const heuresFact = tempsPeriode.filter(t => t.facturable).reduce((s, t) => s + (parseFloat(t.heures) || 0), 0);
      
      // Filtrer les factures par période
      const facturesPeriode = allFactures.filter(f => {
        const dateF = f.date_emission || f.created_at?.split('T')[0];
        return dateF && dateF >= start && dateF <= end;
      });
      
      // CA Facturé sur la période (en HT pour comparaison avec budget)
      const caFactureHT = facturesPeriode.reduce((s, f) => s + (parseFloat(f.montant_ht) || 0), 0);
      const caFactureTTC = facturesPeriode.reduce((s, f) => s + (parseFloat(f.montant_total) || 0), 0);
      
      // CA Encaissé = somme de tous les montants_encaisse (TTC car c'est ce qui est payé)
      const caEncaisse = allFactures.reduce((s, f) => s + (parseFloat(f.montant_encaisse) || 0), 0);
      
      // CA en attente = Total facturé TTC - Total encaissé
      const caEnAttente = allFactures.reduce((s, f) => s + (parseFloat(f.montant_total) || 0), 0) - caEncaisse;
      
      // Budget total des missions (en HT)
      const budgetTotal = allProjets.reduce((s, p) => s + (parseFloat(p.budget_montant) || 0), 0) || 0;
      
      // Reste à facturer = Budget HT - CA Facturé HT (comparaison HT vs HT)
      const caFactureHTTotal = allFactures.reduce((s, f) => s + (parseFloat(f.montant_ht) || 0), 0);
      const resteFacturer = budgetTotal - caFactureHTTotal;
      
      // CA par mois (Janvier à Décembre de l'année sélectionnée)
      const now = new Date();
      const caParMois = [];
      
      for (let i = 0; i < 12; i++) {
        const date = new Date(selectedYear, i, 1);
        const mois = date.toLocaleDateString('fr-FR', {month: 'short'});
        const monthStart = date.toISOString().split('T')[0];
        const monthEnd = new Date(selectedYear, i + 1, 0).toISOString().split('T')[0];
        
        // Utiliser date_emission ou created_at
        const facturesDuMois = allFactures.filter(f => {
          const dateFacture = f.date_emission || f.created_at?.split('T')[0];
          return dateFacture && dateFacture >= monthStart && dateFacture <= monthEnd;
        });
        const montant = facturesDuMois.reduce((s, f) => s + (parseFloat(f.montant_total) || 0), 0);
        
        caParMois.push({mois: mois.charAt(0).toUpperCase() + mois.slice(1), montant, isFuture: selectedYear === now.getFullYear() && i > now.getMonth()});
      }
      
      // Top missions par budget - UNIQUEMENT les missions facturables avec client (exclure Formation, Réunion, etc.)
      const missionsAvecCA = allProjets
        .filter(p => {
          // Exclure si facturable est explicitement false
          if (p.facturable === false) return false;
          // Exclure si pas de client (missions internes)
          if (!p.client_id) return false;
          // Exclure les missions internes typiques par nom (sécurité supplémentaire)
          const nomLower = (p.nom || '').toLowerCase();
          if (nomLower.includes('formation') || nomLower.includes('réunion') || nomLower.includes('reunion') || 
              nomLower.includes('interne') || nomLower.includes('congé') || nomLower.includes('conge') ||
              nomLower.includes('absence') || nomLower.includes('maladie') || nomLower.includes('admin')) return false;
          return true;
        })
        .map(p => ({
          ...p,
          ca: allFactures.filter(f => f.projet_id === p.id).reduce((s, f) => s + (parseFloat(f.montant_ht) || 0), 0) || 0,
          heuresConsommees: tempsPeriode.filter(t => t.projet_id === p.id).reduce((s, t) => s + (parseFloat(t.heures) || 0), 0) || 0
        }))
        .sort((a, b) => (parseFloat(b.budget_montant) || 0) - (parseFloat(a.budget_montant) || 0))
        .slice(0, 5) || [];
      
      // Performance équipe - basée sur les utilisateurs qui ont saisi du temps
      const tempsByUser = {};
      tempsPeriode.forEach(t => {
        if (!tempsByUser[t.utilisateur_id]) {
          tempsByUser[t.utilisateur_id] = { heures: 0, heuresFact: 0 };
        }
        tempsByUser[t.utilisateur_id].heures += parseFloat(t.heures) || 0;
        if (t.facturable) {
          tempsByUser[t.utilisateur_id].heuresFact += parseFloat(t.heures) || 0;
        }
      });
      
      const teamPerf = Object.entries(tempsByUser).map(([userId, data]) => {
        // Trouver l'utilisateur
        const userInfo = allUsers.find(u => u.id === userId);
        // Essayer de trouver le collaborateur lié
        const collabInfo = allCollabs.find(c => c.email === userInfo?.email || c.utilisateur_id === userId);
        
        return {
          nom: collabInfo ? `${collabInfo.prenom} ${collabInfo.nom}` : (userInfo?.nom ? `${userInfo.prenom || ''} ${userInfo.nom}` : 'Utilisateur'),
          grade: collabInfo?.grades?.nom || '-',
          heures: data.heures,
          heuresFact: data.heuresFact,
          taux: data.heures > 0 ? Math.round((data.heuresFact / data.heures) * 100) : 0
        };
      }).sort((a, b) => b.heures - a.heures).slice(0, 8);

      setStats({
        clients: allClients.length,
        projetsActifs: projetsActifs.length,
        projetsTotal: allProjets.length,
        heuresTotal, heuresFact,
        tauxCharge: heuresTotal > 0 ? Math.round((heuresFact / heuresTotal) * 100) : 0,
        caEncaisse, caEnAttente, budgetTotal, caFacture: caFactureTTC, caFactureHT: caFactureHTTotal, resteFacturer,
        caFactureTTC: allFactures.reduce((s, f) => s + (parseFloat(f.montant_total) || 0), 0),
        facturesTotal: allFactures.length,
        tauxRecouvrement: (() => {
          const totalFacture = allFactures.reduce((s, f) => s + (parseFloat(f.montant_total) || 0), 0);
          return totalFacture > 0 ? Math.round((caEncaisse / totalFacture) * 100) : 0;
        })(),
        collaborateurs: allCollabs.filter(c => c.actif).length,
        facturesEnAttente: allFactures.filter(f => f.statut === 'sent' || f.statut === 'partial').length || 0,
        facturesPaid: allFactures.filter(f => f.statut === 'paid').length || 0
      });
      
      setChartData({caParMois});
      setTopMissions(missionsAvecCA);
      setTeamPerformance(teamPerf);
    }
    
    // Stats personnelles (pour tous)
    const [mesTemps, mesConges, mesFrais, mesMissions] = await Promise.all([
      supabase.from('saisies_temps').select('heures, facturable, projet_id, date').eq('utilisateur_id', user.id),
      supabase.from('conges').select('*').eq('utilisateur_id', user.id),
      supabase.from('notes_frais').select('*').eq('collaborateur_id', collab?.id),
      supabase.from('affectations').select('projet_id, projets(nom, code)').eq('collaborateur_id', collab?.id)
    ]);
    
    // Calculer les dates de période pour les stats personnelles
    let periodeStart, periodeEnd;
    if (filterMode === 'month') {
      const moisIdx = dateRange.month !== undefined ? dateRange.month : new Date().getMonth();
      periodeStart = new Date(selectedYear, moisIdx, 1).toISOString().split('T')[0];
      periodeEnd = new Date(selectedYear, moisIdx + 1, 0).toISOString().split('T')[0];
    } else if (filterMode === 'range' && dateRange.start && dateRange.end) {
      periodeStart = dateRange.start;
      periodeEnd = dateRange.end;
    } else {
      periodeStart = `${selectedYear}-01-01`;
      periodeEnd = `${selectedYear}-12-31`;
    }
    
    // Filtrer les temps selon la période
    const mesTempsFiltered = (mesTemps.data || []).filter(t => t.date && t.date >= periodeStart && t.date <= periodeEnd);
    
    const mesHeuresTotal = mesTempsFiltered.reduce((s, t) => s + (t.heures || 0), 0);
    const mesHeuresFact = mesTempsFiltered.filter(t => t.facturable).reduce((s, t) => s + (t.heures || 0), 0);
    const mesHeuresNonFact = mesHeuresTotal - mesHeuresFact;
    
    // Heures par mois (Jan à Déc) pour l'année sélectionnée
    const heuresParMois = [];
    for (let i = 0; i < 12; i++) {
      const monthStart = new Date(selectedYear, i, 1).toISOString().split('T')[0];
      const monthEnd = new Date(selectedYear, i + 1, 0).toISOString().split('T')[0];
      const mois = new Date(selectedYear, i, 1).toLocaleDateString('fr-FR', {month: 'short'});
      
      const tempsduMois = (mesTemps.data || []).filter(t => t.date && t.date >= monthStart && t.date <= monthEnd);
      const heuresFact = tempsduMois.filter(t => t.facturable).reduce((s, t) => s + (parseFloat(t.heures) || 0), 0);
      const heuresNonFact = tempsduMois.filter(t => !t.facturable).reduce((s, t) => s + (parseFloat(t.heures) || 0), 0);
      
      heuresParMois.push({
        mois: mois.charAt(0).toUpperCase() + mois.slice(1),
        facturable: heuresFact,
        nonFacturable: heuresNonFact,
        total: heuresFact + heuresNonFact
      });
    }
    
    // Missions uniques (sur la période)
    const missionIds = [...new Set(mesTempsFiltered.map(t => t.projet_id).filter(Boolean))];
    
    // Solde congés
    const congesApprouves = (mesConges.data || []).filter(c => c.statut === 'approved' && c.type_conge === 'conge_paye');
    const joursReportAnterieurs = (mesConges.data || []).find(c => c.type_conge === 'report_anterieur')?.nb_jours || 0;
    const dateEntree = collab?.date_entree ? new Date(collab.date_entree) : new Date(new Date().getFullYear(), 0, 1);
    const moisAnciennete = Math.floor((new Date() - dateEntree) / (1000 * 60 * 60 * 24 * 30));
    const joursAcquis = Math.min(moisAnciennete * 2, 24) + joursReportAnterieurs;
    const joursPris = congesApprouves.reduce((s, c) => s + (c.nb_jours || 0), 0);
    const soldeConges = joursAcquis - joursPris;
    
    // Notes de frais
    const fraisEnAttente = (mesFrais.data || []).filter(f => f.statut === 'submitted').reduce((s, f) => s + (f.montant || 0), 0);
    const fraisApprouves = (mesFrais.data || []).filter(f => f.statut === 'approved').reduce((s, f) => s + (f.montant || 0), 0);
    
    setMyStats({
      nbMissions: missionIds.length,
      heuresTotal: mesHeuresTotal,
      heuresFact: mesHeuresFact,
      heuresNonFact: mesHeuresNonFact,
      tauxCharge: mesHeuresTotal > 0 ? Math.round((mesHeuresFact / mesHeuresTotal) * 100) : 0,
      soldeConges,
      fraisEnAttente,
      fraisApprouves,
      nbFrais: (mesFrais.data || []).length,
      heuresParMois,
      missionsActuelles: mesMissions.data?.slice(0, 5) || []
    });
    
    setLoading(false);
  };

  // Charger les stats d'un collaborateur sélectionné
  const loadCollabStats = async (collabId) => {
    if (!collabId) {
      setCollabStats(null);
      return;
    }
    
    const { start, end } = getPeriodDates();
    const selectedCollab = allCollaborateurs.find(c => c.id === collabId);
    if (!selectedCollab) return;
    
    // Trouver l'utilisateur correspondant
    const {data: utilisateur} = await supabase.from('utilisateurs')
      .select('id, auth_id')
      .eq('email', selectedCollab.email)
      .single();
    
    if (!utilisateur) {
      setCollabStats({ error: 'Utilisateur non trouvé', collab: selectedCollab });
      return;
    }
    
    // Charger les temps du collaborateur
    const [tempsRes, affectRes, fraisRes, congesRes] = await Promise.all([
      supabase.from('saisies_temps').select('*, projets:projet_id(id, nom, code)').eq('utilisateur_id', utilisateur.id),
      supabase.from('affectations').select('*, projets:projet_id(id, nom, code, statut)').eq('collaborateur_id', collabId),
      supabase.from('notes_frais').select('*').eq('collaborateur_id', collabId),
      supabase.from('conges').select('*').eq('collaborateur_id', collabId)
    ]);
    
    const allTemps = tempsRes.data || [];
    const tempsPeriode = allTemps.filter(t => t.date >= start && t.date <= end);
    
    const heuresTotal = tempsPeriode.reduce((s, t) => s + (parseFloat(t.heures) || 0), 0);
    const heuresFact = tempsPeriode.filter(t => t.facturable).reduce((s, t) => s + (parseFloat(t.heures) || 0), 0);
    const heuresNonFact = heuresTotal - heuresFact;
    const tauxCharge = heuresTotal > 0 ? Math.round((heuresFact / heuresTotal) * 100) : 0;
    
    // Taux horaire du collab (depuis le grade)
    // Utiliser la config de l'organisation pour savoir si c'est taux journalier/8 ou taux horaire direct
    const {data: gradeData} = await supabase.from('grades').select('taux_journalier').eq('id', selectedCollab.grade_id).single();
    const tauxJour = parseFloat(gradeData?.taux_journalier) || 0;
    const tauxHoraire = (org.config_taux_type === 'horaire') ? tauxJour : (tauxJour / 8);
    
    // Production = heures facturables × taux horaire
    const production = heuresFact * tauxHoraire;
    
    // Missions actives
    const missionsActives = (affectRes.data || []).filter(a => a.projets?.statut === 'active');
    
    // Heures par mission
    const heuresParMission = {};
    tempsPeriode.forEach(t => {
      if (t.projet_id) {
        if (!heuresParMission[t.projet_id]) {
          heuresParMission[t.projet_id] = { heures: 0, heuresFact: 0, nom: t.projets?.nom || 'N/A', code: t.projets?.code || '' };
        }
        heuresParMission[t.projet_id].heures += parseFloat(t.heures) || 0;
        if (t.facturable) heuresParMission[t.projet_id].heuresFact += parseFloat(t.heures) || 0;
      }
    });
    const topMissions = Object.values(heuresParMission).sort((a, b) => b.heures - a.heures).slice(0, 5);
    
    // Heures par mois
    const heuresParMois = [];
    for (let i = 0; i < 12; i++) {
      const monthStart = new Date(selectedYear, i, 1).toISOString().split('T')[0];
      const monthEnd = new Date(selectedYear, i + 1, 0).toISOString().split('T')[0];
      const mois = new Date(selectedYear, i, 1).toLocaleDateString('fr-FR', {month: 'short'});
      
      const heuresMois = allTemps.filter(t => t.date >= monthStart && t.date <= monthEnd)
        .reduce((s, t) => s + (parseFloat(t.heures) || 0), 0);
      const heuresFactMois = allTemps.filter(t => t.date >= monthStart && t.date <= monthEnd && t.facturable)
        .reduce((s, t) => s + (parseFloat(t.heures) || 0), 0);
        
      heuresParMois.push({ mois: mois.charAt(0).toUpperCase() + mois.slice(1), total: heuresMois, facturable: heuresFactMois });
    }
    
    // Congés
    const congesApprouves = (congesRes.data || []).filter(c => c.statut === 'approved');
    const joursConges = congesApprouves.reduce((s, c) => s + (c.nb_jours || 0), 0);
    
    // Frais
    const fraisTotal = (fraisRes.data || []).reduce((s, f) => s + (parseFloat(f.montant) || 0), 0);
    
    setCollabStats({
      collab: selectedCollab,
      heuresTotal, heuresFact, heuresNonFact, tauxCharge,
      production, tauxHoraire, tauxJour,
      nbMissions: missionsActives.length,
      topMissions, heuresParMois,
      joursConges, fraisTotal
    });
  };
  
  // Charger stats collab quand sélection change
  useEffect(() => {
    if (selectedCollabId) {
      loadCollabStats(selectedCollabId);
    } else {
      setCollabStats(null);
    }
  }, [selectedCollabId, selectedYear]);

  if (loading) return <Loader text="Chargement du tableau de bord..." />;

  // Dashboard Collaborateur (Junior/Senior)
  if (isCollaborateur) {
    return (
      <div>
        <PageHeader title="Mon espace" subtitle={`Bienvenue, ${collab?.prenom || user.prenom} !`} />
        
        {/* Filtres période */}
        <div className="flex flex-wrap items-center gap-4 mb-6 p-4 bg-white rounded-xl shadow-sm">
          <div className="flex items-center gap-2">
            <span className="text-sm text-slate-600 font-medium">📅 Période :</span>
            <select 
              value={filterMode} 
              onChange={e => setFilterMode(e.target.value)}
              className="input py-1.5 text-sm"
            >
              <option value="year">Année complète</option>
              <option value="month">Mois</option>
              <option value="range">Plage de dates</option>
            </select>
          </div>
          
          {filterMode === 'year' && (
            <select 
              value={selectedYear} 
              onChange={e => setSelectedYear(parseInt(e.target.value))}
              className="input py-1.5 text-sm"
            >
              {[2024, 2025, 2026, 2027].map(y => (
                <option key={y} value={y}>{y}</option>
              ))}
            </select>
          )}
          
          {filterMode === 'month' && (
            <div className="flex items-center gap-2">
              <select 
                value={selectedYear} 
                onChange={e => setSelectedYear(parseInt(e.target.value))}
                className="input py-1.5 text-sm"
              >
                {[2024, 2025, 2026, 2027].map(y => (
                  <option key={y} value={y}>{y}</option>
                ))}
              </select>
              <select 
                value={dateRange.month || new Date().getMonth()} 
                onChange={e => setDateRange(d => ({...d, month: parseInt(e.target.value)}))}
                className="input py-1.5 text-sm"
              >
                {['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'].map((m, i) => (
                  <option key={i} value={i}>{m}</option>
                ))}
              </select>
            </div>
          )}
          
          {filterMode === 'range' && (
            <div className="flex items-center gap-2">
              <input 
                type="date" 
                value={dateRange.start}
                onChange={e => setDateRange(d => ({...d, start: e.target.value}))}
                className="input py-1.5 text-sm"
              />
              <span className="text-slate-400">→</span>
              <input 
                type="date"
                value={dateRange.end}
                onChange={e => setDateRange(d => ({...d, end: e.target.value}))}
                className="input py-1.5 text-sm"
              />
            </div>
          )}
          
          <div className="text-xs text-slate-500">
            {filterMode === 'year' ? `Année ${selectedYear}` : 
             filterMode === 'month' ? `${['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'][dateRange.month || new Date().getMonth()]} ${selectedYear}` :
             dateRange.start && dateRange.end ? `Du ${new Date(dateRange.start).toLocaleDateString('fr-FR')} au ${new Date(dateRange.end).toLocaleDateString('fr-FR')}` : 
             'Sélectionnez une plage'}
          </div>
        </div>
        
        {/* Stats personnelles */}
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <StatCard title="Missions actives" value={myStats.nbMissions} icon="📋" color="blue" />
          <StatCard title="Heures facturables" value={fmt(myStats.heuresFact) + 'h'} subtitle={`${myStats.tauxCharge}% du total`} icon="✅" color="green" />
          <StatCard title="Heures non fact." value={fmt(myStats.heuresNonFact) + 'h'} icon="⏱️" color="slate" />
          <StatCard title="Solde congés" value={myStats.soldeConges + 'j'} icon={myStats.soldeConges < 0 ? '⚠️' : '🏖️'} color={myStats.soldeConges < 0 ? 'red' : 'purple'} />
        </div>
        
        <div className="grid lg:grid-cols-2 gap-6">
          {/* Graphique heures par mois */}
          <Card title={`📊 Mes heures ${selectedYear} (Facturable vs Non-facturable)`}>
            <div className="h-64">
              <div className="flex items-end h-48 gap-1 px-2 border-b border-slate-200">
                {myStats.heuresParMois?.map((m, i) => {
                  const factH = m.facturable || 0;
                  const nonFactH = m.nonFacturable || 0;
                  const totalH = factH + nonFactH;
                  const maxH = Math.max(...(myStats.heuresParMois?.map(x => (x.facturable || 0) + (x.nonFacturable || 0)) || [1]), 1);
                  const heightPct = maxH > 0 ? (totalH / maxH) * 100 : 0;
                  const factPctOfTotal = totalH > 0 ? (factH / totalH) * 100 : 0;
                  
                  return (
                    <div key={i} className="flex-1 flex flex-col items-center justify-end h-full group relative">
                      {totalH > 0 && (
                        <div 
                          className="w-full flex flex-col rounded-t overflow-hidden"
                          style={{height: `${Math.max(heightPct, 8)}%`}}
                        >
                          {/* Non facturable en haut */}
                          {nonFactH > 0 && (
                            <div 
                              className="w-full bg-slate-300"
                              style={{flex: `${100 - factPctOfTotal} 0 0%`}}
                            ></div>
                          )}
                          {/* Facturable en bas */}
                          {factH > 0 && (
                            <div 
                              className="w-full bg-green-500"
                              style={{flex: `${factPctOfTotal} 0 0%`}}
                            ></div>
                          )}
                        </div>
                      )}
                      {/* Tooltip au survol */}
                      <div className="hidden group-hover:block absolute bottom-full mb-1 bg-slate-800 text-white text-xs px-2 py-1 rounded whitespace-nowrap z-10">
                        {fmt(factH)}h fact. / {fmt(nonFactH)}h non fact.
                      </div>
                    </div>
                  );
                })}
              </div>
              {/* Labels mois */}
              <div className="flex gap-1 px-2 mt-1">
                {myStats.heuresParMois?.map((m, i) => (
                  <div key={i} className="flex-1 text-center text-[10px] text-slate-400">{m.mois?.slice(0,3)}</div>
                ))}
              </div>
              {/* Légende */}
              <div className="flex justify-center gap-6 mt-3 text-xs">
                <div className="flex items-center gap-1"><div className="w-3 h-3 bg-green-500 rounded"></div>Facturable ({fmt(myStats.heuresFact)}h)</div>
                <div className="flex items-center gap-1"><div className="w-3 h-3 bg-slate-300 rounded"></div>Non facturable ({fmt(myStats.heuresNonFact)}h)</div>
              </div>
            </div>
          </Card>
          
          {/* Mes indicateurs */}
          <Card title="🎯 Taux de chargeabilité">
            <div className="flex items-center justify-center h-48">
              <div className="relative w-40 h-40">
                <svg className="w-full h-full transform -rotate-90">
                  <circle cx="80" cy="80" r="70" stroke="#e2e8f0" strokeWidth="12" fill="none" />
                  <circle 
                    cx="80" cy="80" r="70" 
                    stroke={myStats.tauxCharge >= 80 ? '#22c55e' : myStats.tauxCharge >= 60 ? '#f59e0b' : '#ef4444'}
                    strokeWidth="12" 
                    fill="none" 
                    strokeDasharray={`${(myStats.tauxCharge / 100) * 440} 440`}
                    strokeLinecap="round"
                  />
                </svg>
                <div className="absolute inset-0 flex flex-col items-center justify-center">
                  <div className="text-4xl font-bold text-slate-800">{myStats.tauxCharge}%</div>
                  <div className="text-sm text-slate-500">Facturable</div>
                </div>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-4 mt-4 pt-4 border-t">
              <div className="text-center">
                <div className="text-xl font-bold text-green-600">{fmt(myStats.heuresFact)}h</div>
                <div className="text-xs text-slate-500">Facturables</div>
              </div>
              <div className="text-center">
                <div className="text-xl font-bold text-slate-400">{fmt(myStats.heuresNonFact)}h</div>
                <div className="text-xs text-slate-500">Non facturables</div>
              </div>
            </div>
          </Card>
        </div>
        
        <div className="grid lg:grid-cols-3 gap-6 mt-6">
          {/* Mes missions */}
          <Card title="📋 Mes missions actuelles">
            {myStats.missionsActuelles?.length > 0 ? (
              <div className="space-y-3">
                {myStats.missionsActuelles.map((m, i) => (
                  <div key={i} className="flex items-center gap-3 p-3 bg-slate-50 rounded-xl">
                    <div className="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center text-blue-600 font-bold text-sm">
                      {m.projets?.code?.slice(0, 3)}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="font-medium text-sm truncate">{m.projets?.nom}</div>
                      <div className="text-xs text-slate-400">{m.projets?.code}</div>
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <div className="text-center text-slate-400 py-8">Aucune mission assignée</div>
            )}

          {/* Notes de frais */}

        {/* Taux chargeabilité global */}
        <Card title="📊 Chargeabilité globale">
          <div className="flex items-center justify-center py-4">
            <div className="relative w-32 h-32">
              <svg className="w-full h-full transform -rotate-90">
                <circle cx="64" cy="64" r="56" stroke="#e2e8f0" strokeWidth="12" fill="none" />

                  strokeWidth="12"

        {/* Actions rapides */}

};

// ========== CRM PAGE ==========
const CRMPage = () => {
  const {org, user, collab, isAdmin, isSuperAdmin, userDeptId} = useApp();
  const [tab, setTab] = useState('clients');
  const [clients, setClients] = useState([]);
  const [allClientsData, setAllClientsData] = useState([]); // Tous les clients non filtrés
  const [prospects, setProspects] = useState([]);
  const [contacts, setContacts] = useState([]);
  const [opportunites, setOpportunites] = useState([]);
  const [departements, setDepartements] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [filterType, setFilterType] = useState('');
  const [filterDept, setFilterDept] = useState(''); // Filtre département UI
  const [modal, setModal] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [privileges, setPrivileges] = useState([]);
  
  // Accès global temporaire clients
  const [accesGlobalActif, setAccesGlobalActif] = useState(null);
  const [demandeEnCours, setDemandeEnCours] = useState(null);
  const [demandesAttente, setDemandesAttente] = useState([]);
  const [motifDemande, setMotifDemande] = useState('');
  const [dureeAcces, setDureeAcces] = useState(2);
  
  // Vérifier si accès global permanent
  const gradeNiveau = collab?.grades?.niveau || 0;
  const isManager = gradeNiveau >= 3;
  const isManagingPartner = gradeNiveau >= 6;
  const hasGlobalAccessPermanent = isManagingPartner || isSuperAdmin || privileges.some(p => p.collaborateur_id === collab?.id && p.type_privilege === 'acces_global');
  
  // Accès global clients = permanent OU temporaire actif
  const hasClientGlobalAccess = hasGlobalAccessPermanent || (accesGlobalActif && new Date(accesGlobalActif.date_expiration) > new Date());
  
  // Temps restant pour l'accès temporaire
  const tempsRestant = accesGlobalActif ? Math.max(0, Math.floor((new Date(accesGlobalActif.date_expiration) - new Date()) / 60000)) : 0;
  
  // Filtre effectif (UI ou département utilisateur si pas d'accès global)
  const effectiveDeptFilter = hasClientGlobalAccess ? filterDept : (userDeptId || '');

  useEffect(() => { loadData(); }, []);
  
  // Recharger quand le filtre change
  useEffect(() => { if (!loading) loadData(); }, [filterDept, accesGlobalActif]);
  
  // Vérifier périodiquement si l'accès a expiré
  useEffect(() => {
    if (accesGlobalActif) {
      const interval = setInterval(() => {
        if (new Date(accesGlobalActif.date_expiration) <= new Date()) {
          setAccesGlobalActif(null);
          loadData();
        }
      }, 30000);
      return () => clearInterval(interval);
    }
  }, [accesGlobalActif]);

  const loadData = async () => {
    // Requêtes de base
    const [c, co, op, depts, privs] = await Promise.all([
      supabase.from('clients').select('*').eq('organisation_id', org.id).order('nom'),
      supabase.from('contacts').select('*,clients(nom)').eq('organisation_id', org.id).order('nom'),
      supabase.from('opportunites').select('*,clients(nom)').eq('organisation_id', org.id).order('created_at', {ascending: false}),
      supabase.from('departements').select('id,nom').eq('organisation_id', org.id),
      supabase.from('privileges_speciaux').select('*').eq('organisation_id', org.id).eq('actif', true)
    ]);
    
    // Requête séparée pour les demandes d'accès (peut échouer si table n'existe pas)
    let demandes = { data: [] };
    try {
      demandes = await supabase.from('demandes_acces_global_clients').select('*,collaborateurs:collaborateur_id(nom,prenom),approbateur:approuve_par(nom,prenom)').eq('organisation_id', org.id).order('date_demande', {ascending: false});
    } catch (e) {
      console.log('Table demandes_acces_global_clients non disponible');
    }
    
    setDepartements(depts.data || []);
    setPrivileges(privs.data || []);
    
    // Gérer les demandes d'accès global
    const toutesDemandesData = demandes?.data || [];
    
    const maDemandePending = toutesDemandesData.find(d => 
      d.collaborateur_id === collab?.id && d.statut === 'pending'
    );
    setDemandeEnCours(maDemandePending || null);
    
    const monAccesActif = toutesDemandesData.find(d => 
      d.collaborateur_id === collab?.id && 
      d.statut === 'approved' && 
      new Date(d.date_expiration) > new Date()
    );
    setAccesGlobalActif(monAccesActif || null);
    
    if (isSuperAdmin || isAdmin) {
      setDemandesAttente(toutesDemandesData.filter(d => d.statut === 'pending'));
    }
    
    // Données brutes
    const allClientsRaw = c.data || [];
    const allContactsRaw = co.data || [];
    const allOpportunitesRaw = op.data || [];
    
    setAllClientsData(allClientsRaw);
    
    // Créer un map client_id -> departement_id pour le filtrage
    const clientDeptMap = {};
    allClientsRaw.forEach(client => {
      clientDeptMap[client.id] = client.departement_id;
    });
    
    // Déterminer le filtre effectif
    const hasAccess = isManagingPartner || isSuperAdmin || 
      (privs.data || []).some(p => p.collaborateur_id === collab?.id && p.type_privilege === 'acces_global') ||
      (monAccesActif && new Date(monAccesActif.date_expiration) > new Date());
    
    const deptFilter = hasAccess ? filterDept : userDeptId;
    
    let filteredClients = [...allClientsRaw];
    let filteredContacts = [...allContactsRaw];
    let filteredOpportunites = [...allOpportunitesRaw];
    
    // Appliquer le filtre département
    if (deptFilter) {
      // Clients : département du client OU clients globaux (sans département)
      filteredClients = filteredClients.filter(x => x.departement_id === deptFilter || !x.departement_id);
      
      // Contacts : département du client associé (via le map)
      filteredContacts = filteredContacts.filter(ct => {
        const clientDept = clientDeptMap[ct.client_id];
        return clientDept === deptFilter || !clientDept;
      });
      
      // Opportunités : département du client associé (via le map)
      filteredOpportunites = filteredOpportunites.filter(opp => {
        const clientDept = clientDeptMap[opp.client_id];
        return clientDept === deptFilter || !clientDept;
      });
    }
    
    // Séparer clients et prospects
    setClients(filteredClients.filter(x => !x.est_prospect));
    setProspects(filteredClients.filter(x => x.est_prospect === true));
    setContacts(filteredContacts);
    setOpportunites(filteredOpportunites);
    setLoading(false);
  };
  
  // Demander un accès global temporaire
  const demanderAccesGlobal = async () => {
    if (!motifDemande.trim()) {
      alert('Veuillez indiquer le motif de votre demande');
      return;
    }
    setSaving(true);
    try {
      await supabase.from('demandes_acces_global_clients').insert([{
        organisation_id: org.id,
        collaborateur_id: collab.id,
        motif: motifDemande,
        statut: 'pending'
      }]);
      setMotifDemande('');
      setModal(null);
      loadData();
      alert('Demande envoyée ! Un administrateur va la traiter.');
    } catch (e) {
      alert('Erreur: ' + e.message);
    }
    setSaving(false);
  };
  
  // Approuver une demande (Admin)
  const approuverDemande = async (demande) => {
    setSaving(true);
    try {
      const dateExpiration = new Date();
      dateExpiration.setHours(dateExpiration.getHours() + dureeAcces);
      
      await supabase.from('demandes_acces_global_clients').update({
        statut: 'approved',
        approuve_par: collab.id,
        date_traitement: new Date().toISOString(),
        duree_heures: dureeAcces,
        date_expiration: dateExpiration.toISOString()
      }).eq('id', demande.id);
      
      setModal(null);
      loadData();
      alert(`Accès accordé pour ${dureeAcces}h`);
    } catch (e) {
      alert('Erreur: ' + e.message);
    }
    setSaving(false);
  };
  
  // Rejeter une demande (Admin)
  const rejeterDemande = async (demande, commentaire = '') => {
    if (!confirm('Rejeter cette demande ?')) return;
    setSaving(true);
    try {
      await supabase.from('demandes_acces_global_clients').update({
        statut: 'rejected',
        approuve_par: collab.id,
        date_traitement: new Date().toISOString(),
        commentaire_validateur: commentaire || 'Demande rejetée'
      }).eq('id', demande.id);
      loadData();
    } catch (e) {
      alert('Erreur: ' + e.message);
    }
    setSaving(false);
  };

  // CLIENT CRUD
  const openNewClient = () => { setEditItem(null); setForm({code: genCode('CLI'), type_client: 'entreprise', nom: '', denomination: '', ninea: '', adresse: '', ville: 'DAKAR', email: '', telephone: '', est_prospect: false, departement_id: userDeptId || ''}); setModal('client'); };
  const openEditClient = (c) => { setEditItem(c); setForm({...c}); setModal('client'); };
  const saveClient = async () => {
    if (!form.nom && !form.denomination) return alert('Nom requis');
    setSaving(true);
    try {
      const data = {...form, nom: form.denomination || form.nom};
      if (editItem?.id) await supabase.from('clients').update(data).eq('id', editItem.id);
      else await supabase.from('clients').insert([{...data, organisation_id: org.id}]);
      setModal(null); loadData();
    } catch (e) { alert(e.message); }
    setSaving(false);
  };
  const deleteClient = async (c) => { if (!confirm(`Supprimer "${c.nom}" ?`)) return; await supabase.from('clients').delete().eq('id', c.id); loadData(); };
  
  // PROSPECT CRUD
  const openNewProspect = () => { setEditItem(null); setForm({code: genCode('PRO'), type_client: 'entreprise', nom: '', denomination: '', ninea: '', adresse: '', ville: 'DAKAR', email: '', telephone: '', est_prospect: true, departement_id: userDeptId || ''}); setModal('prospect'); };
  const openEditProspect = (p) => { setEditItem(p); setForm({...p}); setModal('prospect'); };
  const saveProspect = async () => {
    if (!form.nom && !form.denomination) return alert('Nom requis');
    setSaving(true);
    try {
      const data = {...form, nom: form.denomination || form.nom, est_prospect: true};
      if (editItem?.id) await supabase.from('clients').update(data).eq('id', editItem.id);
      else await supabase.from('clients').insert([{...data, organisation_id: org.id}]);
      setModal(null); loadData();
    } catch (e) { alert(e.message); }
    setSaving(false);
  };
  const convertToClient = async (p) => {
    if (!confirm(`Convertir "${p.nom}" en client ?`)) return;
    await supabase.from('clients').update({est_prospect: false, code: genCode('CLI')}).eq('id', p.id);
    loadData();
  };

  // CONTACT CRUD
  const openNewContact = (clientId = '') => { setEditItem(null); setForm({client_id: clientId, nom: '', prenom: '', fonction: '', email: '', telephone: '', principal: false}); setModal('contact'); };
  const openEditContact = (c) => { setEditItem(c); setForm({...c}); setModal('contact'); };
  const saveContact = async () => {
    if (!form.nom || !form.client_id) return alert('Client et nom requis');
    setSaving(true);
    try {
      const data = {
        client_id: form.client_id,
        nom: form.nom,
        prenom: form.prenom || '',
        fonction: form.fonction || '',
        email: form.email || '',
        telephone: form.telephone || '',
        mobile: form.mobile || '',
        principal: form.principal || false
      };
      
      let result;
      if (editItem?.id) {
        result = await supabase.from('contacts').update(data).eq('id', editItem.id);
      } else {
        result = await supabase.from('contacts').insert([{...data, organisation_id: org.id}]);
      }
      
      if (result.error) throw result.error;
      setModal(null); loadData();
    } catch (e) { 
      console.error('Contact save error:', e);
      alert('Erreur: ' + e.message); 
    }
    setSaving(false);
  };
  const deleteContact = async (c) => { if (!confirm(`Supprimer "${c.prenom} ${c.nom}" ?`)) return; await supabase.from('contacts').delete().eq('id', c.id); loadData(); };

  // OPPORTUNITE CRUD
  const allClientsAndProspects = [...clients, ...prospects]; // Pour le select dans le modal
  const openNewOpp = () => { setEditItem(null); setForm({code: genCode('OPP'), nom: '', client_id: '', nouveau_prospect: false, prospect_nom: '', prospect_email: '', prospect_telephone: '', montant: 0, probabilite: 50, stage: 'prospect', date_cloture_prevue: ''}); setModal('opportunite'); };
  const openEditOpp = (o) => { setEditItem(o); setForm({...o, date_cloture_prevue: o.date_cloture_prevue?.split('T')[0] || '', nouveau_prospect: false}); setModal('opportunite'); };
  
  const saveOpp = async () => {
    setSaving(true);
    try {
      let clientId = form.client_id;
      
      // Si nouveau prospect, le créer d'abord
      if (form.nouveau_prospect && form.prospect_nom) {
        const prospectData = {
          code: genCode('PRO'),
          nom: form.prospect_nom,
          email: form.prospect_email || '',
          telephone: form.prospect_telephone || '',
          type_client: 'entreprise',
          ville: 'DAKAR',
          est_prospect: true,
          organisation_id: org.id
        };
        const {data: newProspect, error: prospectError} = await supabase.from('clients').insert([prospectData]).select().single();
        if (prospectError) throw prospectError;
        clientId = newProspect.id;
      }
      
      if (!form.nom || !clientId) return alert('Nom et client/prospect requis');
      
      const ref = form.code || genCode('OPP');
      const data = {
        reference: ref,
        nom: form.nom,
        client_id: clientId,
        description: form.description || '',
        montant: parseFloat(form.montant) || 0,
        probabilite: parseInt(form.probabilite) || 50,
        stage: form.stage || 'prospect',
        date_cloture_prevue: form.date_cloture_prevue || null
      };
      
      let result;
      if (editItem?.id) {
        data.reference = editItem.reference || ref;
        result = await supabase.from('opportunites').update(data).eq('id', editItem.id);
      } else {
        result = await supabase.from('opportunites').insert([{...data, organisation_id: org.id}]);
      }
      
      if (result.error) throw result.error;
      setModal(null); loadData();
    } catch (e) { 
      console.error('Opportunite save error:', e);
      alert('Erreur: ' + e.message); 
    }
    setSaving(false);
  };
  
  // Mettre à jour le stage d'une opportunité (avec conversion auto prospect -> client si gagné)
  const updateOppStage = async (o, stage) => { 
    try {
      // Important: inclure reference pour éviter l'erreur NOT NULL
      const {error} = await supabase.from('opportunites').update({
        stage,
        reference: o.reference || o.code || genCode('OPP')
      }).eq('id', o.id); 
      if (error) throw error;
      
      // Si l'opportunité passe à "gagne", convertir le prospect en client
      if (stage === 'gagne' && o.client_id) {
        // Vérifier si c'est un prospect
        const prospect = prospects.find(p => p.id === o.client_id);
        if (prospect) {
          await supabase.from('clients').update({
            est_prospect: false,
            code: genCode('CLI')
          }).eq('id', o.client_id);
          // Notification
          alert(`✅ Opportunité gagnée ! Le prospect "${prospect.nom}" a été converti en client.`);
        }
      }
      
      loadData(); 
    } catch(e) {
      console.error('Update stage error:', e);
      alert('Erreur: ' + e.message);
    }
  };

  const filteredClients = clients.filter(c => {
    const matchSearch = c.nom?.toLowerCase().includes(search.toLowerCase()) || c.ninea?.toLowerCase().includes(search.toLowerCase());
    const matchType = !filterType || c.type_client === filterType;
    return matchSearch && matchType;
  });
  const filteredProspects = prospects.filter(p => {
    const matchSearch = p.nom?.toLowerCase().includes(search.toLowerCase()) || p.email?.toLowerCase().includes(search.toLowerCase());
    const matchType = !filterType || p.type_client === filterType;
    return matchSearch && matchType;
  });
  const filteredContacts = contacts.filter(c => c.nom?.toLowerCase().includes(search.toLowerCase()) || c.prenom?.toLowerCase().includes(search.toLowerCase()));
  const oppActives = opportunites.filter(o => !['gagne', 'perdu'].includes(o.stage));
  const totalPipeline = oppActives.reduce((s, o) => s + (o.montant * o.probabilite / 100), 0);
  
  const exportClients = () => exportToExcel(clients, [
    {header: 'Code', key: 'code'},
    {header: 'Nom', key: 'nom'},
    {header: 'Type', getValue: r => CLIENT_TYPES.find(t => t.value === r.type_client)?.label || ''},
    {header: 'NINEA', key: 'ninea'},
    {header: 'Ville', key: 'ville'},
    {header: 'Email', key: 'email'},
    {header: 'Téléphone', key: 'telephone'}
  ], 'clients');

  return (
    <div>
      <PageHeader title="CRM" subtitle={`${clients.length} clients • ${prospects.length} prospects • ${contacts.length} contacts • ${opportunites.length} opportunités${effectiveDeptFilter ? ' • ' + (departements.find(d => d.id === effectiveDeptFilter)?.nom || '') : ''}`}
        tabs={[
          {key: 'clients', label: 'Clients', icon: '🏢', count: clients.length}, 
          {key: 'prospects', label: 'Prospects', icon: '🎯', count: prospects.length},
          {key: 'contacts', label: 'Contacts', icon: '👤', count: contacts.length}, 
          {key: 'opportunites', label: 'Opportunités', icon: '💰', count: opportunites.length}, 
          {key: 'pipeline', label: 'Pipeline', icon: '📊'}
        ]}
        activeTab={tab} onTabChange={setTab}
        action={<div className="flex gap-2 items-center">

          {tab === 'contacts' && <Button size="sm" onClick={() => openNewContact()} icon="➕">Contact</Button>}

        {tab === 'prospects' && (

                  <Button variant="ghost" size="xs" onClick={() => deleteClient(r)} title="Supprimer">🗑️</Button>
                </div>
              )} />
            )}

        )}

              {header: 'Téléphone', render: r => r.telephone || '-'},

                  {opportunites.filter(o => o.stage === 'gagne').map(o => (
                    <div key={o.id} className="bg-white p-2 rounded-lg text-sm flex justify-between items-center">
                      <div>
                        <div className="font-medium">{o.nom}</div>
                        <div className="text-xs text-slate-400">{o.clients?.nom}</div>
                      </div>
                      <span className="font-bold text-green-600">{fmtMoney(o.montant)}</span>
                    </div>
                  ))}

                </div>
              </Card>
              
              {/* Colonne Perdu */}
              <Card className="border-red-200 bg-red-50/50">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-red-700">✗ Perdus</h3>
                  <Badge color="red">{opportunites.filter(o => o.stage === 'perdu').length}</Badge>
                </div>
                <div className="text-lg font-bold text-red-600 mb-3">{fmtMoney(opportunites.filter(o => o.stage === 'perdu').reduce((s, o) => s + o.montant, 0))}</div>
                <div className="space-y-2 max-h-48 overflow-y-auto">
                  {opportunites.filter(o => o.stage === 'perdu').map(o => (
                    <div key={o.id} className="bg-white p-2 rounded-lg text-sm flex justify-between items-center">
                      <div>
                        <div className="font-medium">{o.nom}</div>
                        <div className="text-xs text-slate-400">{o.clients?.nom}</div>
                      </div>
                      <span className="font-bold text-red-600">{fmtMoney(o.montant)}</span>
                    </div>
                  ))}
                  {opportunites.filter(o => o.stage === 'perdu').length === 0 && <div className="text-center text-slate-400 py-4">Aucune opportunité perdue</div>}
                </div>
              </Card>
            </div>
          </div>
        )}

            <div className="grid grid-cols-2 gap-4"><Input label="Code" value={form.code} onChange={v => setForm(p => ({...p, code: v}))} /><Input label="NINEA" value={form.ninea} onChange={v => setForm(p => ({...p, ninea: v}))} /></div>

          </>) : (
            <div className="grid grid-cols-2 gap-4"><Input label="Code" value={form.code} onChange={v => setForm(p => ({...p, code: v}))} /><Input label="Nom" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} required /></div>

          <Select label="Département" value={form.departement_id} onChange={v => setForm(p => ({...p, departement_id: v}))} options={departements.map(d => ({value: d.id, label: d.nom}))} placeholder="Sélectionner un département" required />

          <div className="grid grid-cols-2 gap-4"><Input label="Ville" value={form.ville} onChange={v => setForm(p => ({...p, ville: v}))} /><Input label="Pays" value={form.pays || 'Sénégal'} onChange={v => setForm(p => ({...p, pays: v}))} /></div>

          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button><Button onClick={saveClient} loading={saving} className="flex-1">Enregistrer</Button></div>

      {/* MODAL CONTACT */}

          <Input label="Nom de l'opportunité" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} required placeholder="Ex: Audit comptable 2026" />
          
          {/* Choix Client existant ou Nouveau prospect */}
          {!editItem && (
            <div className="p-4 bg-slate-50 rounded-xl space-y-4">
              <div className="flex gap-4">

                </label>

                  <input type="radio" checked={form.nouveau_prospect} onChange={() => setForm(p => ({...p, nouveau_prospect: true, client_id: ''}))} className="w-4 h-4" />

                    <Input label="Email" type="email" value={form.prospect_email} onChange={v => setForm(p => ({...p, prospect_email: v}))} placeholder="contact@example.com" />
                    <Input label="Téléphone" value={form.prospect_telephone} onChange={v => setForm(p => ({...p, prospect_telephone: v}))} placeholder="+221 77 000 00 00" />
                  </div>
                </div>
