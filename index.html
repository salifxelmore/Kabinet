const Loader=()=><div className="flex items-center justify-center p-8"><div className="loader"/></div>;

const Badge=({children,color='gray',size='sm'})=>{
    const colors={gray:'bg-slate-100 text-slate-600',blue:'bg-blue-100 text-blue-600',green:'bg-emerald-100 text-emerald-600',red:'bg-red-100 text-red-600',yellow:'bg-amber-100 text-amber-600',purple:'bg-purple-100 text-purple-600'};
    return<span className={cn('rounded-full font-medium px-2.5 py-1 text-xs',colors[color])}>{children}</span>;
};

const Button=({children,onClick,variant='primary',size='md',disabled,loading,icon,className,type='button'})=>{
    const variants={
        primary:'gradient-primary text-white hover:shadow-lg hover:shadow-blue-500/25',
        secondary:'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 hover:border-slate-300',
        success:'bg-emerald-500 text-white hover:bg-emerald-600',
        danger:'bg-red-500 text-white hover:bg-red-600',
        ghost:'text-slate-600 hover:bg-slate-100',
    };
    const sizes={sm:'px-3 py-1.5 text-sm',md:'px-4 py-2.5',lg:'px-6 py-3 text-lg'};
    return(
        <button type={type} onClick={onClick} disabled={disabled||loading} className={cn('btn rounded-xl font-semibold flex items-center justify-center gap-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed',variants[variant],sizes[size],className)}>
            {loading?<div className="loader" style={{width:16,height:16,borderTopColor:'currentColor'}}/>:icon}{children}
        </button>
    );
};

const Input=({label,type='text',value,onChange,placeholder,required,error,className,...props})=>(
    <div className={className}>
        {label&&<label className="block text-sm font-medium text-slate-700 mb-1.5">{label}{required&&<span className="text-red-500 ml-1">*</span>}</label>}
        <input type={type} value={value||''} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className={cn('w-full px-4 py-2.5 bg-white border rounded-xl text-slate-800 placeholder-slate-400',error?'border-red-300':'border-slate-200')} {...props}/>
        {error&&<p className="text-red-500 text-xs mt-1">{error}</p>}
    </div>
);

const Select=({label,value,onChange,options,placeholder,required,className})=>(
    <div className={className}>
        {label&&<label className="block text-sm font-medium text-slate-700 mb-1.5">{label}{required&&<span className="text-red-500 ml-1">*</span>}</label>}
        <select value={value||''} onChange={e=>onChange(e.target.value)} className="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-800">
            {placeholder&&<option value="">{placeholder}</option>}
            {options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
    </div>
);

const TextArea=({label,value,onChange,placeholder,rows=3,className})=>(
    <div className={className}>
        {label&&<label className="block text-sm font-medium text-slate-700 mb-1.5">{label}</label>}
        <textarea value={value||''} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={rows} className="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 resize-none"/>
    </div>
);

const Modal=({isOpen,onClose,title,children,size='md'})=>{
    if(!isOpen)return null;
    const sizes={sm:'max-w-md',md:'max-w-2xl',lg:'max-w-4xl',xl:'max-w-6xl'};
    return(
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 animate-fade-in" onClick={onClose}>
            <div className={cn('bg-white rounded-2xl w-full overflow-hidden shadow-2xl',sizes[size])} onClick={e=>e.stopPropagation()}>
                <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100">
                    <h2 className="text-xl font-bold text-slate-800">{title}</h2>
                    <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-lg transition-colors text-slate-400 hover:text-slate-600">{Icons.close}</button>
                </div>
                <div className="p-6 max-h-[70vh] overflow-y-auto">{children}</div>
            </div>
        </div>
    );
};

const Card=({title,children,action,className})=>(
    <div className={cn('card overflow-hidden',className)}>
        {(title||action)&&(
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100">
                {title&&<h3 className="font-bold text-slate-800">{title}</h3>}
                {action}
            </div>
        )}
        <div className="p-6">{children}</div>
    </div>
);

const StatCard=({title,value,subtitle,icon,color='blue',trend})=>{
    const colors={blue:'bg-blue-500',green:'bg-emerald-500',purple:'bg-purple-500',amber:'bg-amber-500',red:'bg-red-500',cyan:'bg-cyan-500'};
    return(
        <div className="card stat-card p-6">
            <div className="flex items-start justify-between">
                <div>
                    <p className="text-slate-500 text-sm font-medium">{title}</p>
                    <p className="text-2xl font-bold text-slate-800 mt-1">{value}</p>
                    {subtitle&&<p className="text-slate-400 text-sm mt-1">{subtitle}</p>}
                    {trend!==undefined&&(
                        <div className={cn('flex items-center gap-1 mt-2 text-sm font-medium',trend>=0?'text-emerald-500':'text-red-500')}>
                            {trend>=0?Icons.arrowUp:Icons.arrowDown}<span>{Math.abs(trend)}%</span>
                        </div>
                    )}
                </div>
                <div className={cn('w-12 h-12 rounded-xl flex items-center justify-center text-white',colors[color])}>{icon}</div>
            </div>
        </div>
    );
};

const Table=({columns,data,onRowClick,emptyMessage='Aucune donnée'})=>(
    <div className="overflow-x-auto">
        <table className="w-full">
            <thead>
                <tr className="border-b border-slate-100">
                    {columns.map((col,i)=><th key={i} className={cn('px-4 py-3 text-left text-sm font-semibold text-slate-600',col.className)}>{col.header}</th>)}
                </tr>
            </thead>
            <tbody>
                {data.length===0?(
                    <tr><td colSpan={columns.length} className="px-4 py-12 text-center text-slate-400">{emptyMessage}</td></tr>
                ):(
                    data.map((row,i)=>(
                        <tr key={row.id||i} onClick={()=>onRowClick?.(row)} className={cn('border-b border-slate-50 table-row',onRowClick&&'cursor-pointer')}>
                            {columns.map((col,j)=><td key={j} className={cn('px-4 py-3 text-sm text-slate-600',col.className)}>{col.render?col.render(row):row[col.key]}</td>)}
                        </tr>
                    ))
                )}
            </tbody>
        </table>
    </div>
);

const LoginPage=({onLogin,onRegister,onBack})=>{
    const[email,setEmail]=useState('');
    const[password,setPassword]=useState('');
    const[loading,setLoading]=useState(false);
    const[error,setError]=useState('');

    const handleSubmit=async(e)=>{
        e.preventDefault();
        if(!email||!password){setError('Email et mot de passe requis');return;}
        setLoading(true);setError('');
        try{
            const{data,error:authError}=await supabase.auth.signInWithPassword({email:email.toLowerCase().trim(),password});
            if(authError)throw authError;
            onLogin(data.user);
        }catch(e){
            setError(e.message==='Invalid login credentials'?'Email ou mot de passe incorrect':e.message);
        }
        setLoading(false);
    };

    return(
        <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
            <div className="w-full max-w-md">
                <div className="text-center mb-8">
                    <button onClick={onBack} className="text-slate-400 hover:text-slate-600 mb-4 text-sm">← Retour à l'accueil</button>
                    <div className="w-16 h-16 gradient-primary rounded-2xl flex items-center justify-center text-white font-bold text-3xl shadow-lg shadow-blue-500/25 mx-auto mb-4">K</div>
                    <h1 className="text-2xl font-bold text-slate-800">Connexion</h1>
                    <p className="text-slate-500 mt-2">Accédez à votre espace KabiNet</p>
                </div>
                <form onSubmit={handleSubmit} className="card p-6 space-y-4">
                    {error&&<div className="p-3 bg-red-50 border border-red-100 rounded-xl text-red-600 text-sm">{error}</div>}
                    <Input label="Email" type="email" value={email} onChange={setEmail} placeholder="votre@email.com" required/>
                    <Input label="Mot de passe" type="password" value={password} onChange={setPassword} placeholder="••••••••" required/>

};

const RegisterPage=({onLogin,onBack,onNeedConfirm})=>{
    const[step,setStep]=useState(1);
    const[form,setForm]=useState({cabinet:'',nom:'',prenom:'',email:'',password:''});
    const[loading,setLoading]=useState(false);
    const[error,setError]=useState('');

    const handleChange=(k,v)=>setForm(p=>({...p,[k]:v}));

    const handleSubmit=async()=>{
        if(!form.cabinet||!form.nom||!form.prenom||!form.email||!form.password){setError('Tous les champs sont requis');return;}
        if(form.password.length<6){setError('Mot de passe: minimum 6 caractères');return;}
        setLoading(true);setError('');
        try{
            // 1. Créer le compte auth
            const{data:authData,error:authError}=await supabase.auth.signUp({
                email:form.email.toLowerCase().trim(),
                password:form.password,
                options:{data:{nom:form.nom,prenom:form.prenom,cabinet:form.cabinet}}
            });
            if(authError)throw authError;
            
            // 2. Créer l'organisation
            const{data:org,error:orgError}=await supabase.from('organisations').insert([{nom:form.cabinet}]).select().single();
            if(orgError)throw orgError;
            
            // 3. Créer l'utilisateur
            const{data:user,error:userError}=await supabase.from('utilisateurs').insert([{
                organisation_id:org.id,
                auth_id:authData.user?.id,
                nom:form.nom,
                prenom:form.prenom,
                email:form.email.toLowerCase().trim(),
                role:'Admin'
            }]).select().single();
            if(userError)throw userError;
            
            // 4. Créer l'abonnement trial
            const dateFin=new Date();dateFin.setDate(dateFin.getDate()+14);
            await supabase.from('abonnements').insert([{
                organisation_id:org.id,
                plan:'trial',
                statut:'actif',
                date_debut:new Date().toISOString(),
                date_fin:dateFin.toISOString()
            }]);
            
            // 5. Données initiales
            await initOrganisationData(org.id);
            
            onNeedConfirm(form.email);
        }catch(e){
            setError(e.message?.includes('already registered')?'Cet email est déjà utilisé':e.message);
        }
        setLoading(false);
    };

    return(
        <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
            <div className="w-full max-w-md">
                <div className="text-center mb-8">
                    <button onClick={onBack} className="text-slate-400 hover:text-slate-600 mb-4 text-sm">← Retour à l'accueil</button>
                    <div className="w-16 h-16 gradient-primary rounded-2xl flex items-center justify-center text-white font-bold text-3xl shadow-lg shadow-blue-500/25 mx-auto mb-4">K</div>
                    <h1 className="text-2xl font-bold text-slate-800">Créer votre compte</h1>
                    <p className="text-slate-500 mt-2">14 jours d'essai gratuit</p>
                </div>
                
                {/* Progress */}
                <div className="flex items-center justify-center gap-2 mb-6">
                    <div className={cn('w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm',step>=1?'gradient-primary text-white':'bg-slate-200 text-slate-500')}>1</div>
                    <div className={cn('w-12 h-1 rounded-full',step>=2?'gradient-primary':'bg-slate-200')}/>
                    <div className={cn('w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm',step>=2?'gradient-primary text-white':'bg-slate-200 text-slate-500')}>2</div>
                </div>

                <div className="card p-6 space-y-4">
                    {error&&<div className="p-3 bg-red-50 border border-red-100 rounded-xl text-red-600 text-sm">{error}</div>}
                    
                    {step===1&&(<>
                        <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1.5">🏢 Nom de votre cabinet</label>
                            <input type="text" value={form.cabinet} onChange={e=>handleChange('cabinet',e.target.value)} placeholder="Ex: Mon Cabinet Conseil SARL" className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400"/>
                        </div>
                        <Button onClick={()=>form.cabinet?setStep(2):setError('Nom du cabinet requis')} className="w-full">Continuer →</Button>
                    </>)}
                    
                    {step===2&&(<>
                        <div className="grid grid-cols-2 gap-3">
                            <Input label="Prénom" value={form.prenom} onChange={v=>handleChange('prenom',v)} placeholder="Jean" required/>
                            <Input label="Nom" value={form.nom} onChange={v=>handleChange('nom',v)} placeholder="Dupont" required/>
                        </div>
                        <Input label="Email" type="email" value={form.email} onChange={v=>handleChange('email',v)} placeholder="jean@cabinet.sn" required/>
                        <Input label="Mot de passe" type="password" value={form.password} onChange={v=>handleChange('password',v)} placeholder="Min. 6 caractères" required/>
                        <div className="flex gap-3">
                            <Button variant="secondary" onClick={()=>setStep(1)} className="flex-1">← Retour</Button>
                            <Button onClick={handleSubmit} loading={loading} className="flex-1">Créer mon compte</Button>
                        </div>
                    </>)}
                </div>
                <p className="text-center text-slate-500 mt-6">
                    Déjà inscrit ? <button onClick={onLogin} className="text-blue-600 font-semibold hover:underline">Se connecter</button>
                </p>
            </div>
        </div>
    );
};

// Initialiser les données d'organisation
async function initOrganisationData(orgId){
    const depts=[
        {code:'AUD',nom:'Audit',facturable:true,couleur:'#2563eb'},
        {code:'TAX',nom:'Tax & Legal',facturable:true,couleur:'#7c3aed'},
        {code:'CON',nom:'Consulting',facturable:true,couleur:'#059669'},
        {code:'OUT',nom:'Outsourcing',facturable:true,couleur:'#d97706'},
    ];
    await supabase.from('departements').insert(depts.map(d=>({...d,organisation_id:orgId})));
    
    const grades=[
        {code:'ASS',nom:'Associé',niveau:10,taux_journalier:1500000,taux_cible:40},
        {code:'DIR',nom:'Directeur',niveau:8,taux_journalier:900000,taux_cible:60},
        {code:'SM',nom:'Senior Manager',niveau:7,taux_journalier:650000,taux_cible:70},
        {code:'M',nom:'Manager',niveau:6,taux_journalier:450000,taux_cible:75},
        {code:'S',nom:'Senior',niveau:4,taux_journalier:250000,taux_cible:85},
        {code:'J',nom:'Junior',niveau:3,taux_journalier:150000,taux_cible:90},
    ];
    await supabase.from('grades').insert(grades.map(g=>({...g,organisation_id:orgId})));
    
    const cats=[
        {code:'AUDIT',nom:'Audit',facturable:true,couleur:'#2563eb'},
        {code:'CONSEIL',nom:'Conseil',facturable:true,couleur:'#059669'},
        {code:'ADMIN',nom:'Administratif',facturable:false,couleur:'#6b7280'},
    ];
    await supabase.from('categories_taches').insert(cats.map(c=>({...c,organisation_id:orgId})));
    
    const typesFrais=[
        {code:'AVION',nom:'Billet d\'avion',categorie:'transport'},
        {code:'TRAIN',nom:'Train',categorie:'transport'},
        {code:'TAXI',nom:'Taxi/VTC',categorie:'transport'},
        {code:'KM',nom:'Indemnités kilométriques',categorie:'transport',taux_km:150},
        {code:'HOTEL',nom:'Hôtel',categorie:'hebergement'},
        {code:'REPAS',nom:'Repas',categorie:'repas',montant_max:15000},
    ];
    await supabase.from('types_frais').insert(typesFrais.map(t=>({...t,organisation_id:orgId})));
}

const DashboardPage=()=>{
    const{org}=useApp();
    const[data,setData]=useState({projets:0,heures:0,taux:0,ca:0,enCours:0});
    const[loading,setLoading]=useState(true);
    
    useEffect(()=>{
        Promise.all([
            supabase.from('projets').select('id').eq('organisation_id',org.id).eq('statut','active'),
            supabase.from('saisies_temps').select('heures,facturable').eq('organisation_id',org.id),
            supabase.from('factures').select('montant_total,statut').eq('organisation_id',org.id),
        ]).then(([p,t,f])=>{
            const heures=t.data?.reduce((s,x)=>s+x.heures,0)||0;
            const hFact=t.data?.filter(x=>x.facturable).reduce((s,x)=>s+x.heures,0)||0;
            const ca=f.data?.filter(x=>x.statut==='paid').reduce((s,x)=>s+x.montant_total,0)||0;
            const enc=f.data?.filter(x=>['sent','overdue'].includes(x.statut)).reduce((s,x)=>s+x.montant_total,0)||0;
            setData({projets:p.data?.length||0,heures,taux:heures>0?Math.round(hFact/heures*100):0,ca,enCours:enc});
            setLoading(false);
        });
    },[]);
    
    if(loading)return<Loader/>;
    
    return(
        <div className="space-y-6 animate-fade-in">
            <div>
                <h1 className="text-2xl font-bold text-slate-800">Tableau de bord</h1>
                <p className="text-slate-500">Vue d'ensemble de votre activité</p>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                <StatCard title="Missions actives" value={data.projets} icon={Icons.projects} color="blue"/>
                <StatCard title="Heures saisies" value={fmt(data.heures)+'h'} icon={Icons.timesheet} color="cyan"/>
                <StatCard title="Taux de charge" value={data.taux+'%'} icon={Icons.reports} color="green"/>
                <StatCard title="CA Encaissé" value={fmtMoney(data.ca)} icon={Icons.invoices} color="purple"/>
                <StatCard title="En attente" value={fmtMoney(data.enCours)} icon={Icons.arrowUp} color="amber"/>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <Card title="Activité récente"><p className="text-slate-400 text-sm">Les dernières actions s'afficheront ici</p></Card>
                <Card title="À faire"><p className="text-slate-400 text-sm">Vos tâches en attente</p></Card>
            </div>
        </div>
    );
};

const ClientsPage=()=>{
    const{org}=useApp();
    const[clients,setClients]=useState([]);
    const[loading,setLoading]=useState(true);
    const[search,setSearch]=useState('');
    const[modalOpen,setModalOpen]=useState(false);
    const[editItem,setEditItem]=useState(null);
    
    useEffect(()=>{loadData();},[]);
    const loadData=async()=>{const{data}=await supabase.from('clients').select('*').eq('organisation_id',org.id).order('nom');setClients(data||[]);setLoading(false);};
    
    const filtered=clients.filter(c=>c.nom?.toLowerCase().includes(search.toLowerCase())||c.code?.toLowerCase().includes(search.toLowerCase()));
    
    const handleSave=async(form)=>{
        if(editItem?.id){await supabase.from('clients').update(form).eq('id',editItem.id);}
        else{await supabase.from('clients').insert([{...form,organisation_id:org.id}]);}
        setModalOpen(false);setEditItem(null);loadData();
    };
    
    return(
        <div className="space-y-6 animate-fade-in">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div><h1 className="text-2xl font-bold text-slate-800">Clients</h1><p className="text-slate-500">{clients.length} clients</p></div>
                <Button onClick={()=>{setEditItem(null);setModalOpen(true);}} icon={Icons.plus}>Nouveau client</Button>
            </div>
            <Card>
                <div className="mb-4">
                    <div className="relative">
                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">{Icons.search}</span>
                        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher..." className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800"/>
                    </div>
                </div>
                {loading?<Loader/>:<Table columns={[
                    {header:'Code',render:r=><span className="font-mono text-blue-600 text-xs bg-blue-50 px-2 py-1 rounded">{r.code}</span>},
                    {header:'Nom',render:r=><span className="font-medium text-slate-800">{r.nom}</span>},
                    {header:'Ville',key:'ville'},
                    {header:'Email',key:'email'},
                    {header:'',render:r=><button onClick={()=>{setEditItem(r);setModalOpen(true);}} className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-slate-600">{Icons.edit}</button>,className:'w-10'},
                ]} data={filtered}/>}
            </Card>
            <ClientModal isOpen={modalOpen} onClose={()=>{setModalOpen(false);setEditItem(null);}} client={editItem} onSave={handleSave}/>
        </div>
    );
};

const ClientModal=({isOpen,onClose,client,onSave})=>{
    const[form,setForm]=useState({});
    const[loading,setLoading]=useState(false);
    useEffect(()=>{setForm(client||{code:'CLI'+Date.now().toString().slice(-6),ville:'DAKAR'});},[client,isOpen]);
    const handleSubmit=async()=>{if(!form.nom){alert('Nom requis');return;}setLoading(true);await onSave(form);setLoading(false);};
    return(
        <Modal isOpen={isOpen} onClose={onClose} title={client?'Modifier le client':'Nouveau client'}>
            <div className="space-y-4">
                <div className="grid grid-cols-2 gap-4">
                    <Input label="Code" value={form.code} onChange={v=>setForm(p=>({...p,code:v}))}/>
                    <Input label="Nom" value={form.nom} onChange={v=>setForm(p=>({...p,nom:v}))} required/>
                </div>
                <div className="grid grid-cols-2 gap-4">
                    <Input label="Ville" value={form.ville} onChange={v=>setForm(p=>({...p,ville:v}))}/>
                    <Input label="Email" type="email" value={form.email} onChange={v=>setForm(p=>({...p,email:v}))}/>
                </div>
                <Input label="Téléphone" value={form.telephone} onChange={v=>setForm(p=>({...p,telephone:v}))}/>
                <TextArea label="Adresse" value={form.adresse} onChange={v=>setForm(p=>({...p,adresse:v}))}/>
                <div className="flex gap-3 pt-4">
                    <Button variant="secondary" onClick={onClose} className="flex-1">Annuler</Button>
                    <Button onClick={handleSubmit} loading={loading} className="flex-1">Enregistrer</Button>
                </div>
            </div>
        </Modal>
    );
};

const TimesheetPage=()=>{
    const{org,user}=useApp();
    const[weekStart,setWeekStart]=useState(getWeekStart());
    const[entries,setEntries]=useState([]);
    const[projects,setProjects]=useState([]);
    const[loading,setLoading]=useState(true);
    const weekDays=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map((d,i)=>({label:d,date:addDays(weekStart,i)}));
    
    useEffect(()=>{
        setLoading(true);
        const weekEnd=addDays(weekStart,6);
        Promise.all([
            supabase.from('saisies_temps').select('*,projets(nom,code)').eq('organisation_id',org.id).eq('utilisateur_id',user.id).gte('date',weekStart).lte('date',weekEnd),
            supabase.from('projets').select('id,nom,code').eq('organisation_id',org.id).eq('statut','active'),
        ]).then(([t,p])=>{setEntries(t.data||[]);setProjects(p.data||[]);setLoading(false);});
    },[weekStart]);
    
    const totalWeek=entries.reduce((s,e)=>s+e.heures,0);
    
    return(
        <div className="space-y-6 animate-fade-in">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div><h1 className="text-2xl font-bold text-slate-800">Saisie des temps</h1><p className="text-slate-500">Semaine du {fmtDate(weekStart)}</p></div>
                <div className="flex items-center gap-2">
                    <Button variant="secondary" onClick={()=>setWeekStart(addDays(weekStart,-7))}>←</Button>
                    <Button variant="secondary" onClick={()=>setWeekStart(getWeekStart())}>Aujourd'hui</Button>
                    <Button variant="secondary" onClick={()=>setWeekStart(addDays(weekStart,7))}>→</Button>
                </div>
            </div>
            <Card>
                {loading?<Loader/>:(
                    <div className="overflow-x-auto">
                        <table className="w-full">
                            <thead>
                                <tr className="border-b border-slate-100">
                                    <th className="px-4 py-3 text-left text-sm font-semibold text-slate-600 w-48">Projet</th>
                                    {weekDays.map(d=><th key={d.date} className="px-2 py-3 text-center text-sm font-semibold text-slate-600 w-20">{d.label}<br/><span className="text-xs text-slate-400 font-normal">{d.date.split('-')[2]}</span></th>)}
                                    <th className="px-4 py-3 text-right text-sm font-semibold text-slate-600">Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                {projects.map(p=>{
                                    const pEntries=entries.filter(e=>e.projet_id===p.id);
                                    const total=pEntries.reduce((s,e)=>s+e.heures,0);
                                    return(
                                        <tr key={p.id} className="border-b border-slate-50">
                                            <td className="px-4 py-2"><span className="font-medium text-slate-700 text-sm">{p.nom}</span></td>
                                            {weekDays.map(d=>{
                                                const entry=pEntries.find(e=>e.date===d.date);
                                                return<td key={d.date} className="px-2 py-2 text-center">
                                                    <input type="number" min="0" max="24" step="0.5" defaultValue={entry?.heures||''} placeholder="–" className="w-14 px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-center text-slate-700 text-sm"/>
                                                </td>;
                                            })}
                                            <td className="px-4 py-2 text-right font-bold text-slate-700">{total>0?total:'–'}</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                            <tfoot>
                                <tr className="bg-slate-50">
                                    <td className="px-4 py-3 font-bold text-slate-700">Total</td>
                                    {weekDays.map(d=>{
                                        const dayTotal=entries.filter(e=>e.date===d.date).reduce((s,e)=>s+e.heures,0);
                                        return<td key={d.date} className="px-2 py-3 text-center font-bold text-blue-600">{dayTotal>0?dayTotal:'–'}</td>;
                                    })}
                                    <td className="px-4 py-3 text-right font-bold text-xl text-blue-600">{totalWeek}h</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                )}
                <div className="flex justify-end gap-3 mt-6 pt-4 border-t border-slate-100">
                    <Button variant="secondary">Enregistrer</Button>
                    <Button>Soumettre</Button>
                </div>
            </Card>
        </div>
    );
};

// ===== APPLICATION =====
const App=()=>{
    const[user,setUser]=useState(null);
    const[loading,setLoading]=useState(true);
    const[page,setPage]=useState('landing');
    const[confirmEmail,setConfirmEmail]=useState('');
    
    useEffect(()=>{
        supabase.auth.getSession().then(({data:{session}})=>{setUser(session?.user||null);setLoading(false);});
        const{data:{subscription}}=supabase.auth.onAuthStateChange((e,session)=>{setUser(session?.user||null);});
        return()=>subscription.unsubscribe();
    },[]);
    
    const handleLogout=async()=>{await supabase.auth.signOut();setUser(null);setPage('landing');};
    
    if(loading)return<div className="min-h-screen bg-slate-50 flex items-center justify-center"><div className="loader"/></div>;
    if(user)return<MainApp user={user} onLogout={handleLogout}/>;
    
    if(page==='login')return<LoginPage onLogin={setUser} onRegister={()=>setPage('register')} onBack={()=>setPage('landing')}/>;
    if(page==='register')return<RegisterPage onLogin={()=>setPage('login')} onBack={()=>setPage('landing')} onNeedConfirm={email=>{setConfirmEmail(email);setPage('confirm');}}/>;
    if(page==='confirm')return<ConfirmEmailPage email={confirmEmail} onLogin={()=>setPage('login')}/>;
    return<LandingPage onLogin={()=>setPage('login')} onRegister={()=>setPage('register')}/>;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
