const EquipePage = () => {
  const {org} = useApp();
  const [collaborateurs, setCollaborateurs] = useState([]);
  const [grades, setGrades] = useState([]);
  const [depts, setDepts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('collab');
  const [modal, setModal] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);

  useEffect(() => { loadData(); }, []);

  const loadData = async () => {
    const [c, g, d] = await Promise.all([
      supabase.from('collaborateurs').select('*,grades:grade_id(nom,taux_journalier),departements:departement_id(nom)').eq('organisation_id', org.id).order('nom'),
      supabase.from('grades').select('*').eq('organisation_id', org.id).order('niveau', {ascending: false}),
      supabase.from('departements').select('*').eq('organisation_id', org.id).order('nom')
    ]);
    setCollaborateurs(c.data || []); setGrades(g.data || []); setDepts(d.data || []); setLoading(false);
  };

  // Collaborateur CRUD
  const openNewCollab = () => { setEditItem(null); setForm({code: genCode('EMP'), nom: '', prenom: '', email: '', telephone: '', departement_id: '', grade_id: '', date_entree: today(), actif: true}); setModal('collab'); };
  const openEditCollab = (c) => { setEditItem(c); setForm({...c, date_entree: c.date_entree?.split('T')[0]}); setModal('collab'); };
  
  // Créer un compte utilisateur pour le collaborateur
  const createUserAccount = async (email, prenom, nom, orgId) => {
    const DEFAULT_PASSWORD = 'Missura2026!';
    
    try {
      // 1. Créer le compte auth dans Supabase
      const {data: authData, error: authError} = await supabase.auth.signUp({
        email: email,
        password: DEFAULT_PASSWORD,
        options: {
          data: { prenom, nom },
          emailRedirectTo: window.location.origin
        }
      });
      
      if (authError) {
        // Si l'utilisateur existe déjà, on récupère son ID
        if (authError.message?.includes('already registered')) {
          console.log('Utilisateur auth déjà existant:', email);
          return {existing: true, password: DEFAULT_PASSWORD};
        }
        throw authError;
      }
      
      // 2. Retourner l'auth_id pour le stocker dans le collaborateur
      if (authData?.user) {
        return {success: true, password: DEFAULT_PASSWORD, authId: authData.user.id};
      }
      
      return {success: true, password: DEFAULT_PASSWORD};
    } catch (e) {
      console.error('Erreur création compte:', e);
      return {error: e.message};
    }
  };
  
  const saveCollab = async () => {
    if (!form.nom || !form.prenom) return alert('Nom et prénom requis');
    if (!editItem && !form.email) return alert('Email requis pour créer un compte de connexion');
    
    setSaving(true);
    try {
      const grade = grades.find(g => g.id === form.grade_id);
      const data = {
        code: form.code,
        nom: form.nom,
        prenom: form.prenom,
        email: form.email || '',
        telephone: form.telephone || '',
        departement_id: form.departement_id || null,
        grade_id: form.grade_id || null,
        taux_journalier: grade?.taux_journalier || parseFloat(form.taux_journalier) || 0,
        date_entree: form.date_entree || null,
        actif: form.actif !== false,
        photo_url: form.photo_url || null
      };
      
      let result;
      if (editItem?.id) {
        // Modification
        result = await supabase.from('collaborateurs').update(data).eq('id', editItem.id);
      } else {
        // Création - d'abord créer le compte utilisateur
        let authId = null;
        if (form.email) {
          const accountResult = await createUserAccount(form.email, form.prenom, form.nom, org.id);
          
          if (accountResult.error) {
            throw new Error('Erreur création compte: ' + accountResult.error);
          }
          
          // Récupérer l'authId si disponible
          authId = accountResult.authId || null;
          
          if (accountResult.success) {
            alert(`✅ Compte créé pour ${form.prenom} ${form.nom}\n\n📧 Email: ${form.email}\n🔑 Mot de passe: ${accountResult.password}\n\nLe collaborateur peut maintenant se connecter !`);
          } else if (accountResult.existing) {
            // Le compte existe déjà, on affiche quand même le mot de passe par défaut
            alert(`ℹ️ Un compte existe déjà pour ${form.email}\n\n🔑 Mot de passe par défaut: ${accountResult.password}\n\n(Si le mot de passe a été changé, utilisez "Mot de passe oublié")`);
          }
        }
        
        // Créer le collaborateur avec l'auth_id (user_id)
        result = await supabase.from('collaborateurs').insert([{
          ...data, 
          organisation_id: org.id,
          user_id: authId // Lien direct avec Supabase Auth
        }]);
      }
      
      if (result.error) throw result.error;
      setModal(null); loadData();
    } catch(e) { 
      console.error('Collab save error:', e);
      alert('Erreur: ' + e.message); 
    }
    setSaving(false);
  };
  
  // Réinitialiser le mot de passe d'un collaborateur
  const resetPassword = async (collab) => {
    if (!collab.email) return alert('Ce collaborateur n\'a pas d\'email');
    if (!confirm(`Réinitialiser le mot de passe de ${collab.prenom} ${collab.nom} ?\n\nUn email sera envoyé à ${collab.email}`)) return;
    
    try {
      const {error} = await supabase.auth.resetPasswordForEmail(collab.email, {
        redirectTo: window.location.origin
      });
      
      if (error) throw error;
      alert(`✅ Email de réinitialisation envoyé à ${collab.email}`);
    } catch(e) {
      console.error('Reset password error:', e);
      alert('Erreur: ' + e.message);
    }
  };
  
  // Créer un compte pour un collaborateur existant (sans compte)
  const createAccountForExisting = async (collab) => {
    if (!collab.email) return alert('Ce collaborateur n\'a pas d\'email. Modifiez-le d\'abord.');
    if (!confirm(`Créer un compte de connexion pour ${collab.prenom} ${collab.nom} ?\n\nEmail: ${collab.email}`)) return;
    
    setSaving(true);
    try {
      const result = await createUserAccount(collab.email, collab.prenom, collab.nom, org.id);
      
      if (result.error) {
        throw new Error(result.error);
      }
      
      if (result.success) {
        alert(`✅ Compte créé !\n\n📧 Email: ${collab.email}\n🔑 Mot de passe: ${result.password}`);
      } else if (result.existing) {
        alert(`Ce compte existe déjà. Le collaborateur peut se connecter avec son email.`);
      }
    } catch(e) {
      alert('Erreur: ' + e.message);
    }
    setSaving(false);
  };

  // Supprimer un collaborateur
  const deleteCollab = async (collab) => {
    const confirmMsg = `⚠️ Supprimer ${collab.prenom} ${collab.nom} ?\n\nCette action est irréversible.\nLe compte utilisateur associé ne sera pas supprimé (nécessite une intervention dans Supabase).`;
    if (!confirm(confirmMsg)) return;
    
    try {
      // Vérifier s'il y a des données liées
      const [temps, affectations, notes] = await Promise.all([
        supabase.from('saisies_temps').select('id').eq('utilisateur_id', collab.id).limit(1),
        supabase.from('affectations').select('id').eq('collaborateur_id', collab.id).limit(1),
        supabase.from('notes_frais').select('id').eq('collaborateur_id', collab.id).limit(1)
      ]);
      
      const hasData = (temps.data?.length > 0) || (affectations.data?.length > 0) || (notes.data?.length > 0);
      
      if (hasData) {
        if (!confirm('Ce collaborateur a des données associées (temps, affectations ou notes de frais).\n\nVoulez-vous plutôt le désactiver au lieu de le supprimer ?')) {
          // Supprimer quand même
          const {error} = await supabase.from('collaborateurs').delete().eq('id', collab.id);
          if (error) throw error;
          alert('✅ Collaborateur supprimé');
        } else {
          // Désactiver
          await supabase.from('collaborateurs').update({actif: false}).eq('id', collab.id);
          alert('✅ Collaborateur désactivé');
        }
      } else {
        // Pas de données, suppression directe
        const {error} = await supabase.from('collaborateurs').delete().eq('id', collab.id);
        if (error) throw error;
        alert('✅ Collaborateur supprimé');
      }
      
      // Supprimer aussi l'entrée dans utilisateurs si elle existe
      await supabase.from('utilisateurs').delete().eq('email', collab.email);
      
      loadData();
    } catch(e) {
      console.error('Delete collab error:', e);
      alert('Erreur: ' + e.message);
    }
  };

  // Passage de grade
  const openPassageGrade = (c) => {
    setEditItem(c);
    setForm({collaborateur_id: c.id, ancien_grade_id: c.grade_id, nouveau_grade_id: '', date_effet: today(), motif: ''});
    setModal('passage');
  };
  const savePassage = async () => {
    if (!form.nouveau_grade_id) return alert('Nouveau grade requis');
    setSaving(true);
    try {
      await supabase.from('passages_grade').insert([{...form, organisation_id: org.id}]);
      const grade = grades.find(g => g.id === form.nouveau_grade_id);
      await supabase.from('collaborateurs').update({grade_id: form.nouveau_grade_id, taux_journalier: grade?.taux_journalier}).eq('id', editItem.id);
      setModal(null); loadData();
    } catch(e) { alert(e.message); }
    setSaving(false);
  };

  const actifs = collaborateurs.filter(c => c.actif);
  
  const exportCollabs = () => exportToExcel(collaborateurs, [
    {header: 'Code', key: 'code'},
    {header: 'Prénom', key: 'prenom'},
    {header: 'Nom', key: 'nom'},
    {header: 'Email', key: 'email'},
    {header: 'Téléphone', key: 'telephone'},
    {header: 'Département', getValue: r => r.departements?.nom || ''},
    {header: 'Grade', getValue: r => r.grades?.nom || ''},
    {header: 'TJ', key: 'taux_journalier'},
    {header: 'Statut', getValue: r => r.actif ? 'Actif' : 'Inactif'}
  ], 'collaborateurs');

  return (
    <div>
      <PageHeader title="Équipe" subtitle={actifs.length + ' collaborateurs actifs'}
        tabs={[{key: 'collab', label: 'Collaborateurs', count: collaborateurs.length}, {key: 'grades', label: 'Passages de grade', icon: '🎖️'}]}
        activeTab={tab} onTabChange={setTab}
        action={<div className="flex gap-2">
          <Button variant="secondary" size="sm" onClick={exportCollabs} icon="📥">Export</Button>
          <Button onClick={openNewCollab} icon="➕">Collaborateur</Button>
        </div>}
      />

      {loading ? <Loader /> : (<>
        {tab === 'collab' && (
          <Card>
            <Table columns={[
              {header: 'Collaborateur', render: r => <div><div className="font-medium">{r.prenom} {r.nom}</div><div className="text-xs text-slate-400">{r.code}</div></div>},
              {header: 'Email', key: 'email'},
              {header: 'Département', render: r => r.departements?.nom || '-'},
              {header: 'Grade', render: r => <Badge color="blue">{r.grades?.nom || '-'}</Badge>},
              {header: 'TJ', render: r => r.taux_journalier ? fmt(r.taux_journalier) + ' F' : '-'},
              {header: 'Statut', render: r => <Badge color={r.actif ? 'green' : 'gray'}>{r.actif ? 'Actif' : 'Inactif'}</Badge>}
            ]} data={collaborateurs} actions={r => (
              <div className="flex gap-1">
                <Button variant="ghost" size="xs" onClick={() => createAccountForExisting(r)} title="Créer compte">🔑</Button>
                <Button variant="ghost" size="xs" onClick={() => resetPassword(r)} title="Réinitialiser mot de passe">📧</Button>
                <Button variant="ghost" size="xs" onClick={() => openPassageGrade(r)} title="Passage grade">🎖️</Button>
                <Button variant="ghost" size="xs" onClick={() => openEditCollab(r)} title="Modifier">✏️</Button>
                <Button variant="ghost" size="xs" onClick={() => deleteCollab(r)} title="Supprimer">🗑️</Button>
              </div>
            )} />
          </Card>
        )}

        {tab === 'grades' && (
          <PromotionsTab org={org} collaborateurs={collaborateurs} grades={grades} />
        )}
      </>)}

      {/* Modal Collaborateur */}
      <Modal isOpen={modal === 'collab'} onClose={() => setModal(null)} title={editItem ? 'Modifier collaborateur' : 'Nouveau collaborateur'} size="lg">
        <div className="space-y-4">
          {!editItem && (
            <div className="p-3 bg-blue-50 border border-blue-200 rounded-xl text-blue-700 text-sm">
              <strong>💡 Création de compte automatique</strong><br/>
              Un compte de connexion sera créé avec le mot de passe par défaut : <code className="bg-blue-100 px-1 rounded">Missura2024!</code>
            </div>
          )}
          
          {/* Photo du collaborateur */}
          <div className="flex items-center gap-4">
            {form.photo_url ? (
              <img src={form.photo_url} alt="Photo" className="w-16 h-16 rounded-full object-cover border-2 border-slate-200" />
            ) : (
              <div className="w-16 h-16 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-xl font-bold">
                {form.prenom?.[0]}{form.nom?.[0]}
              </div>
            )}
            <div>
              <label className="text-sm font-medium text-slate-700">Photo (optionnel)</label>
              <input 
                type="file" 
                accept="image/*"
                onChange={async (e) => {
                  const file = e.target.files?.[0];
                  if (!file) return;
                  const fileName = `photos/${org.id}/${Date.now()}_${file.name}`;
                  const {error} = await supabase.storage.from('collaborateurs').upload(fileName, file);
                  if (error) { alert('Erreur: ' + error.message); return; }
                  const {data: urlData} = supabase.storage.from('collaborateurs').getPublicUrl(fileName);
                  setForm(p => ({...p, photo_url: urlData.publicUrl}));
                }}
                className="block text-sm file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-600 file:cursor-pointer"
              />
            </div>
          </div>
          
          <div className="grid grid-cols-3 gap-4">
            <Input label="Code" value={form.code} onChange={v => setForm(p => ({...p, code: v}))} />
            <Input label="Prénom" value={form.prenom} onChange={v => setForm(p => ({...p, prenom: v}))} required />
            <Input label="Nom" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} required />
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Input label="Email (servira à la connexion)" type="email" value={form.email} onChange={v => setForm(p => ({...p, email: v}))} required={!editItem} />
            <Input label="Téléphone" value={form.telephone} onChange={v => setForm(p => ({...p, telephone: v}))} />
          </div>
          <div className="grid grid-cols-3 gap-4">
            <Select label="Département" value={form.departement_id} onChange={v => setForm(p => ({...p, departement_id: v}))} options={depts.map(d => ({value: d.id, label: d.nom}))} placeholder="Sélectionner" />
            <Select label="Grade" value={form.grade_id} onChange={v => setForm(p => ({...p, grade_id: v}))} options={grades.map(g => ({value: g.id, label: g.nom + ' - ' + fmt(g.taux_journalier) + ' F'}))} placeholder="Sélectionner" />
            <Input label="Date entrée" type="date" value={form.date_entree} onChange={v => setForm(p => ({...p, date_entree: v}))} />
          </div>
          <Checkbox label="Collaborateur actif" checked={form.actif} onChange={v => setForm(p => ({...p, actif: v}))} />
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button><Button onClick={saveCollab} loading={saving} className="flex-1">{editItem ? 'Enregistrer' : 'Créer collaborateur'}</Button></div>
        </div>
      </Modal>

      {/* Modal Passage Grade */}
      <Modal isOpen={modal === 'passage'} onClose={() => setModal(null)} title={'Passage de grade - ' + editItem?.prenom + ' ' + editItem?.nom}>
        <div className="space-y-4">
          <div className="p-4 bg-slate-50 rounded-xl">
            <div className="text-sm text-slate-500">Grade actuel</div>
            <div className="font-bold">{grades.find(g => g.id === editItem?.grade_id)?.nom || 'Non défini'}</div>
          </div>
          <Select label="Nouveau grade" value={form.nouveau_grade_id} onChange={v => setForm(p => ({...p, nouveau_grade_id: v}))} options={grades.filter(g => g.id !== editItem?.grade_id).map(g => ({value: g.id, label: g.nom + ' - ' + fmt(g.taux_journalier) + ' F/j'}))} placeholder="Sélectionner" required />
          <Input label="Date d'effet" type="date" value={form.date_effet} onChange={v => setForm(p => ({...p, date_effet: v}))} />
          <TextArea label="Motif" value={form.motif} onChange={v => setForm(p => ({...p, motif: v}))} rows={2} placeholder="Promotion annuelle, performance..." />
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button><Button onClick={savePassage} loading={saving} className="flex-1">Valider passage</Button></div>
        </div>
      </Modal>
    </div>
  );
};

// ========== RAPPORTS PAGE ==========
const RapportsPage = () => {
  const {org, collab, isAdmin, isSuperAdmin, userDeptId} = useApp();
  const [data, setData] = useState({});
  const [loading, setLoading] = useState(true);
  const [period, setPeriod] = useState('year'); // month, quarter, year
  const [tab, setTab] = useState('global');
  const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
  const [departements, setDepartements] = useState([]);
  const [filterDept, setFilterDept] = useState('');
  const [privileges, setPrivileges] = useState([]);
  
  // Vérifier si accès global
  const gradeNiveau = collab?.grades?.niveau || 0;
  const isManagingPartner = gradeNiveau >= 6;
  const hasGlobalAccess = isManagingPartner || isSuperAdmin || isAdmin || privileges.some(p => p.collaborateur_id === collab?.id && p.type_privilege === 'acces_global');
  const effectiveDeptFilter = hasGlobalAccess ? filterDept : userDeptId;

  useEffect(() => { loadDepts(); }, []);
  useEffect(() => { loadData(); }, [period, selectedYear, effectiveDeptFilter]);
  
  const loadDepts = async () => {
    const [depts, privs] = await Promise.all([
      supabase.from('departements').select('id,nom').eq('organisation_id', org.id).order('nom'),
      supabase.from('privileges_speciaux').select('*').eq('organisation_id', org.id).eq('actif', true)
    ]);
    setDepartements(depts.data || []);
    setPrivileges(privs.data || []);
  };

  const getPeriodDates = () => {
    const now = new Date();
    const year = selectedYear;
    const month = now.getMonth();
    
    if (period === 'month') {
      const start = new Date(year, month, 1);
      const end = new Date(year, month + 1, 0);
      return { start: start.toISOString().split('T')[0], end: end.toISOString().split('T')[0], label: 'Ce mois' };
    } else if (period === 'quarter') {
      const qMonth = Math.floor(month / 3) * 3;
      const start = new Date(year, qMonth, 1);
      const end = new Date(year, qMonth + 3, 0);
      return { start: start.toISOString().split('T')[0], end: end.toISOString().split('T')[0], label: 'Ce trimestre' };
    } else {
      const start = new Date(year, 0, 1);
      const end = new Date(year, 11, 31);
      return { start: start.toISOString().split('T')[0], end: end.toISOString().split('T')[0], label: `Année ${year}` };
    }
  };

  const loadData = async () => {
    setLoading(true);
    const {start, end} = getPeriodDates();
    
    const [temps, factures, collabs, missions, clients, conges, affectations, departements, utilisateurs] = await Promise.all([
      supabase.from('saisies_temps').select('*').eq('organisation_id', org.id),
      supabase.from('factures').select('*').eq('organisation_id', org.id),
      supabase.from('collaborateurs').select('*,grades:grade_id(nom,taux_journalier),departements:departement_id(nom)').eq('organisation_id', org.id).eq('actif', true),
      supabase.from('projets').select('*,clients(nom),departement_id').eq('organisation_id', org.id),
      supabase.from('clients').select('*').eq('organisation_id', org.id),
      supabase.from('conges').select('*').eq('organisation_id', org.id).eq('statut', 'approved'),
      supabase.from('affectations').select('*').eq('organisation_id', org.id),
      supabase.from('departements').select('*').eq('organisation_id', org.id),
      supabase.from('utilisateurs').select('id,auth_id,email').eq('organisation_id', org.id)
    ]);

    let allFactures = factures.data || [];
    let allTemps = temps.data || [];
    let allCollabs = collabs.data || [];
    let m = missions.data || [];
    const allUsers = utilisateurs.data || [];
    
    // ===== FILTRAGE PAR DÉPARTEMENT =====
    if (effectiveDeptFilter) {
      // Filtrer les collaborateurs par département
      allCollabs = allCollabs.filter(c => c.departement_id === effectiveDeptFilter);
      
      // Filtrer les missions : département OU missions internes (sans client = globales)
      m = m.filter(p => p.departement_id === effectiveDeptFilter || !p.client_id);
      
      // Obtenir les user_ids des collaborateurs du département
      const deptCollabEmails = allCollabs.map(c => c.email).filter(Boolean);
      const deptUtilisateurIds = allUsers.filter(u => deptCollabEmails.includes(u.email)).map(u => u.id);
      
      // Filtrer les temps par utilisateur du département
      allTemps = allTemps.filter(t => deptUtilisateurIds.includes(t.utilisateur_id));
      
      // Filtrer les factures par projet du département (exclure missions internes)
      const deptProjetIds = m.filter(p => p.client_id).map(p => p.id);
      allFactures = allFactures.filter(f => deptProjetIds.includes(f.projet_id));
    }
    
    // Mapping: Les saisies de temps utilisent utilisateur_id = ID de la table utilisateurs
    // Il faut lier utilisateurs -> collaborateurs via l'email
    const userIdToCollabId = {};
    allUsers.forEach(u => {
      // Trouver le collaborateur avec le même email
      const collab = allCollabs.find(c => c.email === u.email);
      if (collab) {
        userIdToCollabId[u.id] = collab.id;
      }
    });
    
    // Créer aussi un mapping inverse : collab.id -> user.id pour filtrer les temps
    const collabIdToUserId = {};
    allUsers.forEach(u => {
      const collab = allCollabs.find(c => c.email === u.email);
      if (collab) {
        collabIdToUserId[collab.id] = u.id;
      }
    });
    
    // Filtrer par période - utiliser date_emission ou created_at
    const tPeriod = allTemps.filter(t => t.date >= start && t.date <= end);
    const fPeriod = allFactures.filter(f => {
      const dateFacture = f.date_emission || f.created_at?.split('T')[0];
      return dateFacture && dateFacture >= start && dateFacture <= end;
    });
    
    const heuresTotal = tPeriod.reduce((s, t) => s + (parseFloat(t.heures) || 0), 0);
    const heuresFact = tPeriod.filter(t => t.facturable).reduce((s, t) => s + (parseFloat(t.heures) || 0), 0);
    const heuresNonFact = heuresTotal - heuresFact;
    
    // CA Total facturé TTC (pour affichage) et HT (pour comparaison budget)
    const caTotal = allFactures.reduce((s, x) => s + (parseFloat(x.montant_total) || 0), 0);
    const caTotalHT = allFactures.reduce((s, x) => s + (parseFloat(x.montant_ht) || 0), 0);
    
    // CA Encaissé = somme de tous les montants_encaisse (TTC)
    const caEncaisse = allFactures.reduce((s, x) => s + (parseFloat(x.montant_encaisse) || 0), 0);
    
    // CA En attente = Total facturé TTC - Total encaissé
    const caEnAttente = caTotal - caEncaisse;
    
    const missionsActives = m.filter(x => x.statut === 'active').length;
    const budgetTotal = m.reduce((s, x) => s + (parseFloat(x.budget_montant) || 0), 0);
    
    // Reste à facturer = Budget HT - CA Facturé HT
    const resteAFacturer = budgetTotal - caTotalHT;
    
    // Production valorisée - utiliser la config de l'organisation pour le type de taux
    const diviseur = (org.config_taux_type === 'horaire') ? 1 : 8;
    const tauxMoyen = allCollabs.length > 0 ? allCollabs.reduce((s, c) => s + (parseFloat(c.grades?.taux_journalier) || 0), 0) / allCollabs.length / diviseur : 0;
    const production = heuresFact * tauxMoyen;

    // CA par mois (Janvier à Décembre)
    const caParMois = [];
    const heuresParMois = [];
    for (let i = 0; i < 12; i++) {
      const monthStart = new Date(selectedYear, i, 1).toISOString().split('T')[0];
      const monthEnd = new Date(selectedYear, i + 1, 0).toISOString().split('T')[0];
      const moisLabel = new Date(selectedYear, i, 1).toLocaleDateString('fr-FR', {month: 'short'});
      
      // Utiliser date_emission ou created_at
      const montantCA = allFactures.filter(x => {
        const dateFacture = x.date_emission || x.created_at?.split('T')[0];
        return dateFacture && dateFacture >= monthStart && dateFacture <= monthEnd;
      }).reduce((s, x) => s + (parseFloat(x.montant_total) || 0), 0);
      caParMois.push({mois: moisLabel.charAt(0).toUpperCase() + moisLabel.slice(1), montant: montantCA, isFuture: i > new Date().getMonth() && selectedYear === new Date().getFullYear()});
      
      const heuresMois = allTemps.filter(t => t.date >= monthStart && t.date <= monthEnd)
        .reduce((s, t) => s + (parseFloat(t.heures) || 0), 0);
      const heuresFactMois = allTemps.filter(t => t.date >= monthStart && t.date <= monthEnd && t.facturable)
        .reduce((s, t) => s + (parseFloat(t.heures) || 0), 0);
      heuresParMois.push({mois: moisLabel.charAt(0).toUpperCase() + moisLabel.slice(1), total: heuresMois, facturable: heuresFactMois});
    }

    // Top clients par CA
    const clientsCA = {};
    allFactures.forEach(fac => {
      if (fac.client_id) {
        clientsCA[fac.client_id] = (clientsCA[fac.client_id] || 0) + (parseFloat(fac.montant_total) || 0);
      }
    });
    const topClients = Object.entries(clientsCA)
      .map(([id, ca]) => ({id, ca, nom: clients.data?.find(c => c.id === id)?.nom || 'Inconnu'}))
      .sort((a, b) => b.ca - a.ca)
      .slice(0, 10);

    // Top missions par heures (uniquement temps facturables sur missions facturables)
    const missionsHeures = {};
    tPeriod.filter(t => t.facturable).forEach(t => {
      if (t.projet_id) {
        missionsHeures[t.projet_id] = (missionsHeures[t.projet_id] || 0) + (parseFloat(t.heures) || 0);
      }
    });
    const topMissions = Object.entries(missionsHeures)
      .map(([id, heures]) => {
        const mission = m.find(x => x.id === id);
        // Ne garder que les missions facturables (pas Formation, Déplacement, etc.)
        if (!mission || mission.facturable === false) return null;
        const budgetHeures = parseFloat(mission?.budget_heures) || 0;
        const budgetMontant = parseFloat(mission?.budget_montant) || 0;
        const consomme = budgetHeures > 0 ? Math.round((heures / budgetHeures) * 100) : 0;
        return {
          id, 
          heures, 
          nom: mission?.nom || 'Inconnue', 
          code: mission?.code, 
          budget: budgetHeures,
          budgetMontant,
          consomme
        };
      })
      .filter(x => x !== null) // Retirer les missions non facturables
      .sort((a, b) => b.heures - a.heures)
      .slice(0, 10);

    // Performance par utilisateur qui a saisi du temps
    // D'abord, grouper les temps par utilisateur_id
    const tempsByUser = {};
    tPeriod.forEach(t => {
      if (!tempsByUser[t.utilisateur_id]) {
        tempsByUser[t.utilisateur_id] = { heures: 0, heuresFact: 0 };
      }
      tempsByUser[t.utilisateur_id].heures += parseFloat(t.heures) || 0;
      if (t.facturable) {
        tempsByUser[t.utilisateur_id].heuresFact += parseFloat(t.heures) || 0;
      }
    });
    
    // Créer la liste de performance
    const collabPerf = Object.entries(tempsByUser).map(([userId, data]) => {
      // Trouver l'utilisateur
      const user = allUsers.find(u => u.id === userId);
      // Essayer de trouver le collaborateur lié (par email ou utilisateur_id)
      const collab = (collabs.data || []).find(c => c.email === user?.email || c.utilisateur_id === userId);
      
      return {
        id: userId,
        nom: collab ? `${collab.prenom} ${collab.nom}` : (user?.nom ? `${user.prenom || ''} ${user.nom}` : 'Utilisateur'),
        grade: collab?.grades?.nom || '-',
        dept: collab?.departements?.nom || '-',
        heures: data.heures,
        heuresFact: data.heuresFact,
        taux: data.heures > 0 ? Math.round((data.heuresFact / data.heures) * 100) : 0,
        production: data.heuresFact * (parseFloat(collab?.grades?.taux_journalier) || 0) / ((org.config_taux_type === 'horaire') ? 1 : 8)
      };
    }).sort((a, b) => b.heures - a.heures);

    // Performance par département - basé sur les collaborateurs qui ont du temps
    const deptPerf = (departements.data || []).map(d => {
      const deptCollabs = collabs.data?.filter(c => c.departement_id === d.id) || [];
      
      // Chercher les temps des utilisateurs liés à ce département
      let heures = 0;
      let hFact = 0;
      
      // Pour chaque utilisateur qui a saisi du temps
      Object.entries(tempsByUser).forEach(([userId, data]) => {
        const user = allUsers.find(u => u.id === userId);
        const collab = deptCollabs.find(c => c.email === user?.email || c.utilisateur_id === userId);
        if (collab) {
          heures += data.heures;
          hFact += data.heuresFact;
        }
      });
      
      return {
        id: d.id,
        nom: d.nom,
        nbCollabs: deptCollabs.length,
        heures,
        heuresFact: hFact,
        taux: heures > 0 ? Math.round((hFact / heures) * 100) : 0

    };

    // Calculs additionnels

    const productiviteMoyenne = collabs.data?.length > 0 ? heuresTotal / collabs.data.length : 0;

// ========== MON PROFIL PAGE ==========
const MonProfilPage = () => {
  const {org, user, collab, reload} = useApp();
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [loading, setLoading] = useState(true);
  const [collabData, setCollabData] = useState(null);

  useEffect(() => { loadProfile(); }, []);

  const loadProfile = async () => {
    // Charger les données du collaborateur
    const {data} = await supabase.from('collaborateurs')
      .select('*,grades:grade_id(nom,niveau),departements:departement_id(nom)')
      .eq('email', user.email)
      .maybeSingle();
    
    if (data) {
      setCollabData(data);
      setForm({
        telephone: data.telephone || '',
        adresse: data.adresse || '',
        photo_url: data.photo_url || ''
      });
    }
    setLoading(false);
  };

  const saveProfile = async () => {
    if (!collabData?.id) return alert('Profil non trouvé');
    setSaving(true);
    try {
      const {error} = await supabase.from('collaborateurs').update({
        telephone: form.telephone || '',
        adresse: form.adresse || '',
        photo_url: form.photo_url || null
      }).eq('id', collabData.id);
      
      if (error) throw error;
      alert('✅ Profil mis à jour !');
      reload();
    } catch (e) {
      alert('Erreur: ' + e.message);
    }
    setSaving(false);
  };

  const uploadPhoto = async (file) => {
    if (!file) return;
    const fileName = `photos/${org.id}/${Date.now()}_${file.name}`;
    const {error} = await supabase.storage.from('collaborateurs').upload(fileName, file);
    if (error) { alert('Erreur upload: ' + error.message); return; }
    const {data: urlData} = supabase.storage.from('collaborateurs').getPublicUrl(fileName);
    setForm(p => ({...p, photo_url: urlData.publicUrl}));
  };

  if (loading) return <Loader text="Chargement..." />;

  // Si pas de profil collaborateur
  if (!collabData) {
    return (
      <div>
        <PageHeader title="Mon profil" subtitle="Gérez vos informations personnelles" />
        <Card>
          <div className="text-center py-12">
            <div className="text-6xl mb-4">👤</div>
            <h3 className="text-xl font-semibold text-slate-700 mb-2">Profil non configuré</h3>
            <p className="text-slate-500 mb-6 max-w-md mx-auto">
              Votre compte utilisateur n'est pas encore associé à une fiche collaborateur. 
              Contactez votre administrateur ou créez votre fiche dans la section Équipe.
            </p>
            <div className="p-4 bg-blue-50 rounded-xl inline-block text-left">
              <div className="text-sm text-blue-800">
                <strong>Email connecté :</strong> {user.email}
              </div>
              <div className="text-xs text-blue-600 mt-2">
                💡 L'administrateur doit créer un collaborateur avec cet email exact.
              </div>
            </div>
          </div>
        </Card>
      </div>
    );
  }

  return (
    <div>
      <PageHeader title="Mon profil" subtitle="Gérez vos informations personnelles" />
      
      <div className="grid lg:grid-cols-3 gap-6">
        {/* Carte profil */}
        <Card className="lg:col-span-1">
          <div className="text-center">
            {/* Photo */}
            <div className="relative inline-block mb-4">
              {form.photo_url ? (
                <img src={form.photo_url} alt="Photo" className="w-32 h-32 rounded-full object-cover border-4 border-white shadow-lg mx-auto" />
              ) : (
                <div className="w-32 h-32 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-4xl font-bold shadow-lg mx-auto">
                  {collabData?.prenom?.[0]}{collabData?.nom?.[0]}
                </div>
              )}
              <label className="absolute bottom-0 right-0 w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white cursor-pointer hover:bg-blue-600 shadow-lg">
                📷
                <input type="file" accept="image/*" className="hidden" onChange={(e) => uploadPhoto(e.target.files?.[0])} />
              </label>
            </div>
            
            <h2 className="text-xl font-bold text-slate-800">{collabData?.prenom} {collabData?.nom}</h2>
            <p className="text-slate-500">{collabData?.grades?.nom || 'Non défini'}</p>
            <Badge color="blue" className="mt-2">{collabData?.departements?.nom || 'Sans département'}</Badge>
            
            <div className="mt-6 pt-6 border-t border-slate-100 text-left space-y-3">
              <div className="flex items-center gap-3 text-sm">
                <span className="text-slate-400">📧</span>
                <span className="text-slate-600">{collabData?.email || '-'}</span>
              </div>
              <div className="flex items-center gap-3 text-sm">
                <span className="text-slate-400">🏢</span>
                <span className="text-slate-600">{org.nom}</span>
              </div>
              <div className="flex items-center gap-3 text-sm">
                <span className="text-slate-400">📅</span>
                <span className="text-slate-600">Depuis {collabData?.date_entree ? fmtDate(collabData.date_entree) : '-'}</span>
              </div>
            </div>
          </div>
        </Card>
        
        {/* Formulaire édition */}
        <Card title="✏️ Modifier mes informations" className="lg:col-span-2">
          <div className="space-y-6">
            {/* Infos non modifiables */}
            <div className="p-4 bg-slate-50 rounded-xl">
              <h4 className="font-medium text-slate-700 mb-3">Informations gérées par l'administration</h4>
              <div className="grid grid-cols-2 gap-4 text-sm">
                <div>
                  <span className="text-slate-400">Nom complet</span>
                  <p className="font-medium">{collabData?.prenom} {collabData?.nom}</p>
                </div>
                <div>
                  <span className="text-slate-400">Email</span>
                  <p className="font-medium">{collabData?.email}</p>
                </div>
                <div>
                  <span className="text-slate-400">Grade</span>
                  <p className="font-medium">{collabData?.grades?.nom || '-'}</p>
                </div>
                <div>
                  <span className="text-slate-400">Département</span>
                  <p className="font-medium">{collabData?.departements?.nom || '-'}</p>
                </div>
              </div>
            </div>
            
            {/* Infos modifiables */}
            <div>
              <h4 className="font-medium text-slate-700 mb-3">Informations modifiables</h4>
              <div className="space-y-4">
                <Input 
                  label="Téléphone" 
                  value={form.telephone} 
                  onChange={v => setForm(p => ({...p, telephone: v}))} 
                  placeholder="Ex: +221 77 123 45 67"
                />
                <TextArea 
                  label="Adresse" 
                  value={form.adresse} 
                  onChange={v => setForm(p => ({...p, adresse: v}))} 
                  placeholder="Ex: Dakar, Almadies"
                  rows={2}
                />
              </div>
            </div>
            
            <div className="flex justify-end pt-4 border-t">
              <Button onClick={saveProfile} loading={saving} icon="💾">
                Enregistrer les modifications
              </Button>
            </div>
          </div>
        </Card>
      </div>
    </div>
  );
