const cn = (...c) => c.filter(Boolean).join(' ');
const fmt = n => new Intl.NumberFormat('fr-FR').format(n || 0);
const fmtMoney = n => fmt(n) + ' FCFA';
const fmtDate = d => d ? new Date(d).toLocaleDateString('fr-FR') : '';
const today = () => new Date().toISOString().split('T')[0];
const genCode = (p) => p + Date.now().toString().slice(-6);
const getWeekStart = () => { const d = new Date(); const day = d.getDay(); const diff = d.getDate() - day + (day === 0 ? -6 : 1); return new Date(d.setDate(diff)).toISOString().split('T')[0]; };
const addDays = (date, n) => { const d = new Date(date); d.setDate(d.getDate() + n); return d.toISOString().split('T')[0]; };

const Loader = () => <div className="flex justify-center p-8"><div className="loader"></div></div>;
const Badge = ({children, color = 'gray'}) => { const colors = {gray: 'bg-slate-100 text-slate-600', blue: 'bg-blue-100 text-blue-600', green: 'bg-emerald-100 text-emerald-600', red: 'bg-red-100 text-red-600', yellow: 'bg-amber-100 text-amber-600', purple: 'bg-purple-100 text-purple-600'}; return <span className={cn('text-xs px-2 py-0.5 rounded-full font-medium', colors[color])}>{children}</span>; };
const Button = ({children, onClick, variant = 'primary', loading, disabled, icon, className, type = 'button'}) => { const variants = {primary: 'gradient-primary text-white hover:shadow-lg', secondary: 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-50', danger: 'bg-red-500 text-white hover:bg-red-600', ghost: 'text-slate-600 hover:bg-slate-100'}; return <button type={type} onClick={onClick} disabled={disabled || loading} className={cn('px-4 py-2.5 rounded-xl font-semibold flex items-center justify-center gap-2 transition-all disabled:opacity-50', variants[variant], className)}>{loading ? <div className="loader" style={{width: 16, height: 16}}></div> : icon}{children}</button>; };
const Input = ({label, type = 'text', value, onChange, placeholder, required, disabled, className, ...props}) => <div className={className}>{label && <label className="block text-sm font-medium text-slate-700 mb-1.5">{label}{required && <span className="text-red-500">*</span>}</label>}<input type={type} value={value ?? ''} onChange={e => onChange(type === 'number' ? parseFloat(e.target.value) || 0 : e.target.value)} placeholder={placeholder} disabled={disabled} className="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl disabled:bg-slate-50" {...props} /></div>;
const Select = ({label, value, onChange, options = [], placeholder, className}) => <div className={className}>{label && <label className="block text-sm font-medium text-slate-700 mb-1.5">{label}</label>}<select value={value ?? ''} onChange={e => onChange(e.target.value)} className="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl">{placeholder && <option value="">{placeholder}</option>}{options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}</select></div>;
const Modal = ({isOpen, onClose, title, children, size = 'md'}) => { if (!isOpen) return null; const sizes = {sm: 'max-w-md', md: 'max-w-2xl', lg: 'max-w-4xl'}; return <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50" onClick={onClose}><div className={cn('bg-white rounded-2xl w-full max-h-[90vh] overflow-auto', sizes[size])} onClick={e => e.stopPropagation()}><div className="flex items-center justify-between px-6 py-4 border-b"><h2 className="text-xl font-bold">{title}</h2><button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-lg text-xl">×</button></div><div className="p-6">{children}</div></div></div>; };
const Card = ({title, children, action, className}) => <div className={cn('card', className)}>{title && <div className="flex items-center justify-between px-6 py-4 border-b"><h3 className="font-bold">{title}</h3>{action}</div>}<div className="p-6">{children}</div></div>;
const StatCard = ({title, value, icon, color = 'blue'}) => { const colors = {blue: 'bg-blue-500', green: 'bg-emerald-500', purple: 'bg-purple-500', amber: 'bg-amber-500'}; return <div className="card p-6"><div className="flex justify-between"><div><p className="text-slate-500 text-sm">{title}</p><p className="text-2xl font-bold mt-1">{value}</p></div><div className={cn('w-12 h-12 rounded-xl flex items-center justify-center text-white text-xl', colors[color])}>{icon}</div></div></div>; };
const Table = ({columns, data, loading, empty = 'Aucune donnée'}) => { if (loading) return <Loader />; return <div className="overflow-x-auto"><table className="w-full"><thead><tr className="border-b">{columns.map((c, i) => <th key={i} className="px-4 py-3 text-left text-sm font-semibold text-slate-600">{c.header}</th>)}</tr></thead><tbody>{data.length === 0 ? <tr><td colSpan={columns.length} className="px-4 py-12 text-center text-slate-400">{empty}</td></tr> : data.map((r, i) => <tr key={r.id || i} className="border-b border-slate-50 hover:bg-slate-50">{columns.map((c, j) => <td key={j} className="px-4 py-3 text-sm">{c.render ? c.render(r) : r[c.key]}</td>)}</tr>)}</tbody></table></div>; };

const LandingPage = ({onLogin, onRegister}) => (
  <div className="min-h-screen bg-white">

        <div className="flex gap-3"><button onClick={onLogin} className="px-4 py-2 text-slate-600 font-medium">Connexion</button><button onClick={onRegister} className="px-5 py-2.5 gradient-primary text-white rounded-xl font-semibold">S'inscrire</button></div>
      </div>
    </header>
    <section className="pt-32 pb-20 px-4 text-center">
      <h1 className="text-4xl md:text-5xl font-bold mb-6">Gérez votre cabinet<br /><span className="text-blue-600">en toute simplicité</span></h1>
      <p className="text-xl text-slate-500 mb-8 max-w-2xl mx-auto">KabiNet centralise vos missions, équipes, temps et facturation.</p>
      <div className="flex flex-col sm:flex-row justify-center gap-4">
        <button onClick={onRegister} className="px-8 py-4 gradient-primary text-white rounded-xl font-bold text-lg">🚀 Essai gratuit 14 jours</button>
        <button onClick={onLogin} className="px-8 py-4 bg-slate-100 rounded-xl font-bold text-lg">Se connecter</button>
      </div>
    </section>
    <section className="py-20 px-4 bg-slate-50">
      <div className="max-w-6xl mx-auto grid md:grid-cols-3 gap-6">
        {[{i: '📊', t: 'Dashboard', d: 'Vue temps réel'}, {i: '⏱️', t: 'Timesheet', d: 'Saisie des temps'}, {i: '💰', t: 'Facturation', d: 'Génération auto'}, {i: '👥', t: 'Équipe', d: 'Gestion RH'}, {i: '📋', t: 'Missions', d: 'Forfait/Régie'}, {i: '📈', t: 'Rapports', d: 'KPIs et analyses'}].map((f, i) => <div key={i} className="card p-6"><div className="text-3xl mb-4">{f.i}</div><h3 className="font-bold mb-2">{f.t}</h3><p className="text-slate-500 text-sm">{f.d}</p></div>)}
      </div>
    </section>
    <footer className="py-8 px-4 border-t text-center text-slate-400 text-sm">© 2025 KabiNet</footer>
  </div>
);

const LoginPage = ({onLogin, onRegister, onBack}) => {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const handleSubmit = async (e) => { e.preventDefault(); if (!email || !password) return setError('Champs requis'); setLoading(true); setError(''); try { const {data, error: err} = await supabase.auth.signInWithPassword({email: email.toLowerCase().trim(), password}); if (err) throw err; onLogin(data.user); } catch (e) { setError(e.message === 'Invalid login credentials' ? 'Identifiants incorrects' : e.message); } setLoading(false); };
  return (
    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
      <div className="w-full max-w-md">
        <div className="text-center mb-8"><button onClick={onBack} className="text-slate-400 text-sm mb-4">← Retour</button><div className="w-16 h-16 gradient-primary rounded-2xl flex items-center justify-center text-white font-bold text-3xl mx-auto mb-4">K</div><h1 className="text-2xl font-bold">Connexion</h1></div>
        <form onSubmit={handleSubmit} className="card p-6 space-y-4">{error && <div className="p-3 bg-red-50 text-red-600 rounded-xl text-sm">{error}</div>}<Input label="Email" type="email" value={email} onChange={setEmail} required /><Input label="Mot de passe" type="password" value={password} onChange={setPassword} required /><Button type="submit" loading={loading} className="w-full">Se connecter</Button></form>
        <p className="text-center mt-6 text-slate-500">Pas de compte? <button onClick={onRegister} className="text-blue-600 font-semibold">S'inscrire</button></p>
      </div>
    </div>
  );
};

const RegisterPage = ({onLogin, onBack, onConfirm}) => {
  const [step, setStep] = useState(1);
  const [form, setForm] = useState({cabinet: '', nom: '', prenom: '', email: '', password: ''});
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const set = (k, v) => setForm(p => ({...p, [k]: v}));
  const handleSubmit = async () => { if (!form.cabinet || !form.nom || !form.prenom || !form.email || !form.password) return setError('Tous les champs requis'); if (form.password.length < 6) return setError('Mot de passe: min 6 caractères'); setLoading(true); setError(''); try { const {data: auth, error: e1} = await supabase.auth.signUp({email: form.email.toLowerCase().trim(), password: form.password}); if (e1) throw e1; const {data: org, error: e2} = await supabase.from('organisations').insert([{nom: form.cabinet}]).select().single(); if (e2) throw e2; await supabase.from('utilisateurs').insert([{organisation_id: org.id, auth_id: auth.user?.id, nom: form.nom, prenom: form.prenom, email: form.email.toLowerCase().trim(), role: 'Admin'}]); const fin = new Date(); fin.setDate(fin.getDate() + 14); await supabase.from('abonnements').insert([{organisation_id: org.id, plan: 'trial', statut: 'actif', date_debut: new Date().toISOString(), date_fin: fin.toISOString()}]); await initOrgData(org.id); onConfirm(form.email); } catch (e) { setError(e.message?.includes('already registered') ? 'Email déjà utilisé' : e.message); } setLoading(false); };
  return (
    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
      <div className="w-full max-w-md">
        <div className="text-center mb-8"><button onClick={onBack} className="text-slate-400 text-sm mb-4">← Retour</button><div className="w-16 h-16 gradient-primary rounded-2xl flex items-center justify-center text-white font-bold text-3xl mx-auto mb-4">K</div><h1 className="text-2xl font-bold">Créer un compte</h1><p className="text-slate-500">14 jours d'essai gratuit</p></div>
        <div className="card p-6 space-y-4">{error && <div className="p-3 bg-red-50 text-red-600 rounded-xl text-sm">{error}</div>}{step === 1 && <><Input label="🏢 Nom du cabinet" value={form.cabinet} onChange={v => set('cabinet', v)} placeholder="Mon Cabinet SARL" /><Button onClick={() => form.cabinet ? setStep(2) : setError('Nom requis')} className="w-full">Continuer →</Button></>}{step === 2 && <><div className="grid grid-cols-2 gap-3"><Input label="Prénom" value={form.prenom} onChange={v => set('prenom', v)} /><Input label="Nom" value={form.nom} onChange={v => set('nom', v)} /></div><Input label="Email" type="email" value={form.email} onChange={v => set('email', v)} /><Input label="Mot de passe" type="password" value={form.password} onChange={v => set('password', v)} placeholder="Min. 6 caractères" /><div className="flex gap-3"><Button variant="secondary" onClick={() => setStep(1)} className="flex-1">← Retour</Button><Button onClick={handleSubmit} loading={loading} className="flex-1">Créer</Button></div></>}</div>
        <p className="text-center mt-6 text-slate-500">Déjà inscrit? <button onClick={onLogin} className="text-blue-600 font-semibold">Connexion</button></p>
      </div>
    </div>
  );
};

const ConfirmPage = ({email, onLogin}) => <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4 text-center"><div><div className="text-6xl mb-4">📧</div><h1 className="text-2xl font-bold mb-2">Vérifiez votre email</h1><p className="text-slate-500 mb-4">Confirmation envoyée à <b className="text-blue-600">{email}</b></p><Button onClick={onLogin}>Aller à la connexion</Button></div></div>;

async function initOrgData(orgId) {
  await supabase.from('departements').insert([{code: 'AUD', nom: 'Audit', facturable: true, organisation_id: orgId}, {code: 'TAX', nom: 'Tax & Legal', facturable: true, organisation_id: orgId}, {code: 'CON', nom: 'Consulting', facturable: true, organisation_id: orgId}]);
  await supabase.from('grades').insert([{code: 'ASS', nom: 'Associé', niveau: 10, taux_journalier: 1500000, organisation_id: orgId}, {code: 'M', nom: 'Manager', niveau: 6, taux_journalier: 450000, organisation_id: orgId}, {code: 'S', nom: 'Senior', niveau: 4, taux_journalier: 250000, organisation_id: orgId}, {code: 'J', nom: 'Junior', niveau: 3, taux_journalier: 150000, organisation_id: orgId}]);
  await supabase.from('categories_taches').insert([{code: 'AUDIT', nom: 'Audit', facturable: true, organisation_id: orgId}, {code: 'CONSEIL', nom: 'Conseil', facturable: true, organisation_id: orgId}, {code: 'ADMIN', nom: 'Administratif', facturable: false, organisation_id: orgId}]);
  await supabase.from('types_frais').insert([{code: 'TAXI', nom: 'Taxi', organisation_id: orgId}, {code: 'HOTEL', nom: 'Hôtel', organisation_id: orgId}, {code: 'REPAS', nom: 'Repas', organisation_id: orgId}]);
}

const MainApp = ({user, onLogout}) => {
  const [userData, setUserData] = useState(null);
  const [orgData, setOrgData] = useState(null);
  const [aboData, setAboData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [page, setPage] = useState('dashboard');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const isSuperAdmin = SUPER_ADMINS.includes(user?.email);
  
  useEffect(() => { loadUser(); }, [user]);
  const loadUser = async () => { try { const {data: u} = await supabase.from('utilisateurs').select('*,organisations(*)').eq('auth_id', user.id).single(); const {data: a} = await supabase.from('abonnements').select('*').eq('organisation_id', u?.organisation_id).order('created_at', {ascending: false}).limit(1).single(); setUserData(u); setOrgData(u?.organisations); setAboData(a); } catch (e) { console.error(e); } setLoading(false); };
  
  if (loading) return <Loader />;
  if (isSuperAdmin && !userData) return <SuperAdminApp user={user} onLogout={onLogout} />;
  if (!userData || !orgData) return <div className="min-h-screen flex items-center justify-center">Erreur de chargement. <button onClick={onLogout} className="ml-2 text-blue-600 underline">Déconnexion</button></div>;
  
  const nav = [{k: 'dashboard', l: 'Dashboard', i: '📊'}, {k: 'clients', l: 'Clients', i: '🏢'}, {k: 'projects', l: 'Missions', i: '📋'}, {k: 'timesheet', l: 'Temps', i: '⏱️'}, {k: 'invoices', l: 'Factures', i: '💰'}, {k: 'expenses', l: 'Frais', i: '💳'}, {k: 'team', l: 'Équipe', i: '👥'}, {k: 'reports', l: 'Rapports', i: '📈'}, {k: 'settings', l: 'Paramètres', i: '⚙️'}];
  if (isSuperAdmin) nav.push({k: 'admin', l: 'Admin', i: '🛡️'});
  const ctx = {user: userData, org: orgData, abo: aboData, reload: loadUser, isSuperAdmin};
  
  return (
    <AppContext.Provider value={ctx}>
      <div className="min-h-screen bg-slate-50 flex">
        {sidebarOpen && <div className="fixed inset-0 bg-black/30 z-40 lg:hidden" onClick={() => setSidebarOpen(false)}></div>}
        <aside className={cn('sidebar w-64 bg-white border-r flex flex-col fixed lg:relative h-screen z-50', sidebarOpen && 'open')}>
          <div className="p-4 border-b flex items-center gap-3"><div className="w-10 h-10 gradient-primary rounded-xl flex items-center justify-center text-white font-bold">K</div><div><div className="font-bold">KabiNet</div><div className="text-xs text-slate-400 truncate max-w-[140px]">{orgData.nom}</div></div></div>
          <nav className="flex-1 p-3 space-y-1">{nav.map(n => <button key={n.k} onClick={() => {setPage(n.k); setSidebarOpen(false);}} className={cn('nav-item w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-left', page === n.k ? 'active font-medium' : 'text-slate-600')}><span>{n.i}</span>{n.l}</button>)}</nav>
          <div className="p-4 border-t"><div className="flex items-center gap-3 mb-3"><div className="w-10 h-10 gradient-primary rounded-full flex items-center justify-center text-white font-bold text-sm">{userData.prenom?.[0]}{userData.nom?.[0]}</div><div className="flex-1 min-w-0"><div className="text-sm font-medium truncate">{userData.prenom} {userData.nom}</div><div className="text-xs text-slate-400">{userData.role}</div></div></div><button onClick={onLogout} className="w-full flex items-center gap-2 px-4 py-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-xl">🚪 Déconnexion</button></div>
        </aside>
        <main className="flex-1">
          <header className="lg:hidden flex items-center justify-between p-4 bg-white border-b sticky top-0 z-30"><button onClick={() => setSidebarOpen(true)} className="p-2 text-2xl">☰</button><div className="font-bold">KabiNet</div><div className="w-10"></div></header>
          <div className="p-4 lg:p-8">
            {page === 'dashboard' && <DashboardPage />}
            {page === 'clients' && <ClientsPage />}
            {page === 'projects' && <ProjectsPage />}
            {page === 'timesheet' && <TimesheetPage />}
            {page === 'invoices' && <InvoicesPage />}
            {page === 'expenses' && <ExpensesPage />}
            {page === 'team' && <TeamPage />}
            {page === 'reports' && <ReportsPage />}
            {page === 'settings' && <SettingsPage />}
            {page === 'admin' && <AdminPage />}
          </div>
        </main>
      </div>
    </AppContext.Provider>
  );
};

const SuperAdminApp = ({user, onLogout}) => {
  const [orgs, setOrgs] = useState([]);
  const [users, setUsers] = useState([]);
  const [abos, setAbos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('orgs');
  const [editOrg, setEditOrg] = useState(null);
  const [editForm, setEditForm] = useState({plan: 'trial', date_fin: ''});
  const [saving, setSaving] = useState(false);
  
  useEffect(() => { loadData(); }, []);
  const loadData = async () => { const [o, u, a] = await Promise.all([supabase.from('organisations').select('*').order('created_at', {ascending: false}), supabase.from('utilisateurs').select('*,organisations(nom)').order('created_at', {ascending: false}), supabase.from('abonnements').select('*,organisations(nom)').order('created_at', {ascending: false})]); setOrgs(o.data || []); setUsers(u.data || []); setAbos(a.data || []); setLoading(false); };
  const getAbo = (orgId) => abos.find(a => a.organisation_id === orgId);
  const openEdit = (org) => { const a = getAbo(org.id); setEditOrg(org); setEditForm({plan: a?.plan || 'trial', date_fin: a?.date_fin?.split('T')[0] || ''}); };
  const saveAbo = async () => { if (!editOrg) return; setSaving(true); try { const a = getAbo(editOrg.id); const data = {organisation_id: editOrg.id, plan: editForm.plan, statut: 'actif', date_debut: new Date().toISOString(), date_fin: editForm.date_fin ? new Date(editForm.date_fin).toISOString() : null, montant: PLANS[editForm.plan]?.prix || 0}; if (a?.id) await supabase.from('abonnements').update(data).eq('id', a.id); else await supabase.from('abonnements').insert([data]); await loadData(); setEditOrg(null); } catch (e) { alert(e.message); } setSaving(false); };
  
  return (
    <div className="min-h-screen bg-slate-50">
      <header className="bg-white border-b px-6 py-4 flex items-center justify-between"><div className="flex items-center gap-3"><div className="w-10 h-10 gradient-primary rounded-xl flex items-center justify-center text-white font-bold">K</div><div><div className="font-bold">KabiNet</div><div className="text-xs text-amber-600">🛡️ Super Admin</div></div></div><div className="flex items-center gap-4"><span className="text-sm text-slate-500">{user.email}</span><Button variant="secondary" onClick={onLogout}>Déconnexion</Button></div></header>

const TimesheetPage = () => {
  const {org, user} = useApp();
  const [weekStart, setWeekStart] = useState(getWeekStart());
  const [entries, setEntries] = useState([]);
  const [projects, setProjects] = useState([]);
  const [loading, setLoading] = useState(true);
  const days = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map((d, i) => ({label: d, date: addDays(weekStart, i)}));
  useEffect(() => { load(); }, [weekStart]);
  const load = async () => { setLoading(true); const end = addDays(weekStart, 6); const [t, p] = await Promise.all([supabase.from('saisies_temps').select('*').eq('organisation_id', org.id).eq('utilisateur_id', user.id).gte('date', weekStart).lte('date', end), supabase.from('projets').select('id,nom,code').eq('organisation_id', org.id).eq('statut', 'active')]); setEntries(t.data || []); setProjects(p.data || []); setLoading(false); };
  const getEntry = (projId, date) => entries.find(e => e.projet_id === projId && e.date === date);
  const updateEntry = async (projId, date, heures) => { const existing = getEntry(projId, date); const h = parseFloat(heures) || 0; if (existing) { if (h > 0) await supabase.from('saisies_temps').update({heures: h}).eq('id', existing.id); else await supabase.from('saisies_temps').delete().eq('id', existing.id); } else if (h > 0) { await supabase.from('saisies_temps').insert([{organisation_id: org.id, utilisateur_id: user.id, projet_id: projId, date, heures: h, facturable: true}]); } load(); };
  const totalWeek = entries.reduce((s, e) => s + (e.heures || 0), 0);
  return <div><div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6"><div><h1 className="text-2xl font-bold">Saisie des temps</h1><p className="text-slate-500">Semaine du {fmtDate(weekStart)}</p></div><div className="flex gap-2"><Button variant="secondary" onClick={() => setWeekStart(addDays(weekStart, -7))}>←</Button><Button variant="secondary" onClick={() => setWeekStart(getWeekStart())}>Aujourd'hui</Button><Button variant="secondary" onClick={() => setWeekStart(addDays(weekStart, 7))}>→</Button></div></div><Card>{loading ? <Loader /> : <div className="overflow-x-auto"><table className="w-full"><thead><tr className="border-b"><th className="px-4 py-3 text-left w-48">Projet</th>{days.map(d => <th key={d.date} className="px-2 py-3 text-center w-16">{d.label}<br /><span className="text-xs text-slate-400">{d.date.split('-')[2]}</span></th>)}<th className="px-4 py-3 text-right">Total</th></tr></thead><tbody>{projects.length === 0 ? <tr><td colSpan={9} className="px-4 py-8 text-center text-slate-400">Aucune mission active. Créez d'abord une mission.</td></tr> : projects.map(p => { const total = entries.filter(e => e.projet_id === p.id).reduce((s, e) => s + (e.heures || 0), 0); return <tr key={p.id} className="border-b border-slate-50"><td className="px-4 py-2 text-sm font-medium">{p.nom}</td>{days.map(d => <td key={d.date} className="px-1 py-2 text-center"><input type="number" min="0" max="24" step="0.5" defaultValue={getEntry(p.id, d.date)?.heures || ''} onBlur={e => updateEntry(p.id, d.date, e.target.value)} className="w-14 px-2 py-1.5 bg-slate-50 border rounded-lg text-center text-sm" /></td>)}<td className="px-4 py-2 text-right font-bold">{total || '-'}</td></tr>; })}</tbody><tfoot><tr className="bg-slate-50"><td className="px-4 py-3 font-bold">Total</td>{days.map(d => { const t = entries.filter(e => e.date === d.date).reduce((s, e) => s + (e.heures || 0), 0); return <td key={d.date} className="px-2 py-3 text-center font-bold text-blue-600">{t || '-'}</td>; })}<td className="px-4 py-3 text-right font-bold text-xl text-blue-600">{totalWeek}h</td></tr></tfoot></table></div>}</Card></div>;
};

  const openNew = () => { setForm({code: genCode('EMP'), nom: '', prenom: '', email: '', departement_id: '', grade_id: '', date_entree: today(), actif: true}); setModal(true); };
  const save = async () => { if (!form.nom || !form.prenom) return alert('Nom et prénom requis'); setSaving(true); try { const grade = grades.find(g => g.id === form.grade_id); await supabase.from('collaborateurs').insert([{...form, organisation_id: org.id, taux_journalier: grade?.taux_journalier || 0}]); setModal(false); load(); } catch (e) { alert(e.message); } setSaving(false); };
  return <div><div className="flex justify-between items-center mb-6"><div><h1 className="text-2xl font-bold">Équipe</h1><p className="text-slate-500">{items.length} collaborateurs</p></div><Button onClick={openNew} icon="➕">Nouveau</Button></div><Card><Table loading={loading} columns={[{header: 'Nom', render: r => <b>{r.prenom} {r.nom}</b>}, {header: 'Email', key: 'email'}, {header: 'Département', render: r => r.departements?.nom || '-'}, {header: 'Grade', render: r => r.grades?.nom || '-'}, {header: 'TJ', render: r => r.taux_journalier ? fmt(r.taux_journalier) + ' F' : '-'}, {header: 'Statut', render: r => <Badge color={r.actif ? 'green' : 'gray'}>{r.actif ? 'Actif' : 'Inactif'}</Badge>}]} data={items} /></Card><Modal isOpen={modal} onClose={() => setModal(false)} title="Nouveau collaborateur" size="lg"><div className="space-y-4"><div className="grid grid-cols-3 gap-4"><Input label="Code" value={form.code} onChange={v => setForm(p => ({...p, code: v}))} /><Input label="Prénom" value={form.prenom} onChange={v => setForm(p => ({...p, prenom: v}))} required /><Input label="Nom" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} required /></div><div className="grid grid-cols-2 gap-4"><Input label="Email" type="email" value={form.email} onChange={v => setForm(p => ({...p, email: v}))} /><Input label="Téléphone" value={form.telephone} onChange={v => setForm(p => ({...p, telephone: v}))} /></div><div className="grid grid-cols-3 gap-4"><Select label="Département" value={form.departement_id} onChange={v => setForm(p => ({...p, departement_id: v}))} options={depts.map(d => ({value: d.id, label: d.nom}))} placeholder="Sélectionner" /><Select label="Grade" value={form.grade_id} onChange={v => setForm(p => ({...p, grade_id: v}))} options={grades.map(g => ({value: g.id, label: g.nom + ' - ' + fmt(g.taux_journalier) + ' F'}))} placeholder="Sélectionner" /><Input label="Date entrée" type="date" value={form.date_entree} onChange={v => setForm(p => ({...p, date_entree: v}))} /></div><div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(false)} className="flex-1">Annuler</Button><Button onClick={save} loading={saving} className="flex-1">Créer</Button></div></div></Modal></div>;
};

const ReportsPage = () => {
  const {org} = useApp();
  const [data, setData] = useState({heures: 0, heuresFact: 0, facture: 0, encaisse: 0});
  const [loading, setLoading] = useState(true);
  useEffect(() => { Promise.all([supabase.from('saisies_temps').select('heures,facturable').eq('organisation_id', org.id), supabase.from('factures').select('montant_total,statut').eq('organisation_id', org.id)]).then(([t, f]) => { const h = t.data || []; const fa = f.data || []; setData({heures: h.reduce((s, x) => s + (x.heures || 0), 0), heuresFact: h.filter(x => x.facturable).reduce((s, x) => s + (x.heures || 0), 0), facture: fa.reduce((s, x) => s + (x.montant_total || 0), 0), encaisse: fa.filter(x => x.statut === 'paid').reduce((s, x) => s + (x.montant_total || 0), 0)}); setLoading(false); }); }, []);
  if (loading) return <Loader />;
  const taux = data.heures > 0 ? Math.round(data.heuresFact / data.heures * 100) : 0;
  return <div><h1 className="text-2xl font-bold mb-6">Rapports</h1><div className="grid md:grid-cols-4 gap-4 mb-6"><StatCard title="Heures totales" value={fmt(data.heures) + 'h'} icon="⏱️" color="blue" /><StatCard title="Heures facturables" value={fmt(data.heuresFact) + 'h'} icon="💼" color="green" /><StatCard title="Taux chargeabilité" value={taux + '%'} icon="📊" color="purple" /><StatCard title="CA encaissé" value={fmtMoney(data.encaisse)} icon="💰" color="amber" /></div><Card title="Détails"><p className="text-slate-500">Rapports détaillés à venir...</p></Card></div>;
};

const SettingsPage = () => {
  const {org, abo, reload} = useApp();
  const [tab, setTab] = useState('org');
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [depts, setDepts] = useState([]);
  const [grades, setGrades] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => { setForm({nom: org.nom, adresse: org.adresse || '', ville: org.ville || '', email: org.email || '', telephone: org.telephone || ''}); loadParams(); }, [org]);
  const loadParams = async () => { const [d, g] = await Promise.all([supabase.from('departements').select('*').eq('organisation_id', org.id).order('nom'), supabase.from('grades').select('*').eq('organisation_id', org.id).order('niveau', {ascending: false})]); setDepts(d.data || []); setGrades(g.data || []); setLoading(false); };
  const saveOrg = async () => { setSaving(true); try { await supabase.from('organisations').update(form).eq('id', org.id); reload(); alert('Enregistré!'); } catch (e) { alert(e.message); } setSaving(false); };
  const exportData = async () => { const [c, p, t, f] = await Promise.all([supabase.from('clients').select('*').eq('organisation_id', org.id), supabase.from('projets').select('*').eq('organisation_id', org.id), supabase.from('saisies_temps').select('*').eq('organisation_id', org.id), supabase.from('factures').select('*').eq('organisation_id', org.id)]); const data = {organisation: org, clients: c.data, projets: p.data, temps: t.data, factures: f.data, exportedAt: new Date().toISOString()}; const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'kabinet_backup_' + org.nom.replace(/\s+/g, '_') + '_' + today() + '.json'; a.click(); };
  const joursRestants = abo?.date_fin ? Math.ceil((new Date(abo.date_fin) - new Date()) / (1000 * 60 * 60 * 24)) : 0;
  const isExpire = joursRestants <= 0 && abo?.plan !== 'premium';
  return <div><h1 className="text-2xl font-bold mb-6">Paramètres</h1><div className="flex gap-2 mb-6 border-b overflow-x-auto">{[{k: 'org', l: '🏢 Organisation'}, {k: 'abo', l: '💳 Abonnement'}, {k: 'params', l: '⚙️ Configuration'}, {k: 'backup', l: '💾 Sauvegarde'}].map(t => <button key={t.k} onClick={() => setTab(t.k)} className={cn('px-4 py-3 font-medium -mb-px whitespace-nowrap', tab === t.k ? 'border-b-2 border-blue-500 text-blue-600' : 'text-slate-500')}>{t.l}</button>)}</div>{tab === 'org' && <Card title="Informations de l'organisation"><div className="space-y-4 max-w-xl"><Input label="Nom du cabinet" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} /><Input label="Adresse" value={form.adresse} onChange={v => setForm(p => ({...p, adresse: v}))} /><div className="grid grid-cols-2 gap-4"><Input label="Ville" value={form.ville} onChange={v => setForm(p => ({...p, ville: v}))} /><Input label="Téléphone" value={form.telephone} onChange={v => setForm(p => ({...p, telephone: v}))} /></div><Input label="Email" type="email" value={form.email} onChange={v => setForm(p => ({...p, email: v}))} /><Button onClick={saveOrg} loading={saving}>💾 Enregistrer</Button></div></Card>}{tab === 'abo' && <Card title="Abonnement"><div className="max-w-2xl"><div className={cn('p-6 rounded-2xl mb-6', isExpire ? 'bg-red-50 border-2 border-red-200' : 'bg-blue-50 border-2 border-blue-200')}><div className="flex items-center justify-between mb-4"><div><span className="text-3xl mr-3">{PLANS[abo?.plan]?.icon || '🎁'}</span><span className="text-2xl font-bold">{PLANS[abo?.plan]?.nom || 'Essai'}</span></div><Badge color={isExpire ? 'red' : 'green'}>{isExpire ? 'Expiré' : 'Actif'}</Badge></div>{abo?.date_fin && <div className="flex justify-between text-sm"><span className="text-slate-600">Expire le: <b>{fmtDate(abo.date_fin)}</b></span><span className={isExpire ? 'text-red-600 font-bold' : 'text-slate-600'}>{isExpire ? 'Expiré' : joursRestants + ' jours restants'}</span></div>}</div><h3 className="font-bold mb-4">Changer de plan</h3><div className="grid md:grid-cols-3 gap-4">{Object.entries(PLANS).map(([k, p]) => <div key={k} className={cn('p-4 rounded-xl border-2', abo?.plan === k ? 'border-blue-500 bg-blue-50' : 'border-slate-200')}><div className="text-2xl mb-2">{p.icon}</div><div className="font-bold">{p.nom}</div><div className="text-slate-500 text-sm">{p.prix ? fmt(p.prix) + ' F/mois' : 'Gratuit'}</div>{abo?.plan === k ? <Badge color="blue">Plan actuel</Badge> : <a href={'https://wa.me/221781234567?text=Bonjour, je souhaite passer au plan ' + p.nom} target="_blank" className="mt-3 block text-center text-sm text-blue-600 hover:underline">Contacter</a>}</div>)}</div></div></Card>}{tab === 'params' && <div className="space-y-6"><Card title="Départements">{loading ? <Loader /> : <Table columns={[{header: 'Code', render: r => <span className="font-mono text-xs bg-slate-100 px-2 py-1 rounded">{r.code}</span>}, {header: 'Nom', render: r => <b>{r.nom}</b>}, {header: 'Facturable', render: r => <Badge color={r.facturable ? 'green' : 'gray'}>{r.facturable ? 'Oui' : 'Non'}</Badge>}]} data={depts} />}</Card><Card title="Grades">{loading ? <Loader /> : <Table columns={[{header: 'Code', key: 'code'}, {header: 'Nom', render: r => <b>{r.nom}</b>}, {header: 'Niveau', key: 'niveau'}, {header: 'Taux journalier', render: r => fmtMoney(r.taux_journalier)}]} data={grades} />}</Card></div>}{tab === 'backup' && <Card title="Sauvegarde et Import"><div className="max-w-xl space-y-6"><div className="p-6 bg-slate-50 rounded-xl"><h3 className="font-bold mb-2">📥 Exporter les données</h3><p className="text-slate-500 text-sm mb-4">Téléchargez une sauvegarde complète de vos données au format JSON.</p><Button onClick={exportData} variant="secondary" icon="⬇️">Exporter en JSON</Button></div><div className="p-6 bg-slate-50 rounded-xl"><h3 className="font-bold mb-2">📤 Importer des données</h3><p className="text-slate-500 text-sm mb-4">L'import en masse depuis Excel sera disponible prochainement.</p><Button variant="secondary" disabled icon="⬆️">Import Excel (bientôt)</Button></div></div></Card>}</div>;
};

const AdminPage = () => {
  const {isSuperAdmin} = useApp();
  if (!isSuperAdmin) return <div className="text-center py-20"><div className="text-6xl mb-4">🔒</div><h2 className="text-xl font-bold">Accès refusé</h2><p className="text-slate-500">Réservé aux super admins</p></div>;
  return <div><h1 className="text-2xl font-bold mb-6">Administration</h1><Card><p className="text-slate-500">Pour accéder à l'admin global, déconnectez-vous puis reconnectez-vous sans organisation liée.</p></Card></div>;
};

const App = () => {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [page, setPage] = useState('landing');
  const [confirmEmail, setConfirmEmail] = useState('');
  useEffect(() => { supabase.auth.getSession().then(({data: {session}}) => { setUser(session?.user || null); setLoading(false); }); const {data: {subscription}} = supabase.auth.onAuthStateChange((e, s) => setUser(s?.user || null)); return () => subscription.unsubscribe(); }, []);
  const logout = async () => { await supabase.auth.signOut(); setUser(null); setPage('landing'); };
  if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="loader"></div></div>;
  if (user) return <MainApp user={user} onLogout={logout} />;
  if (page === 'login') return <LoginPage onLogin={setUser} onRegister={() => setPage('register')} onBack={() => setPage('landing')} />;
  if (page === 'register') return <RegisterPage onLogin={() => setPage('login')} onBack={() => setPage('landing')} onConfirm={e => {setConfirmEmail(e); setPage('confirm');}} />;
  if (page === 'confirm') return <ConfirmPage email={confirmEmail} onLogin={() => setPage('login')} />;
  return <LandingPage onLogin={() => setPage('login')} onRegister={() => setPage('register')} />;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
