                              </div>
                            ) : (
                              <div className="w-14 h-10 flex items-center justify-center text-xs text-slate-300">-</div>
                            )}
                          </td>
                        );
                      })}
                      <td className="px-4 py-2 text-right font-bold text-amber-700">{totalConges}h</td>
                    </tr>
                  );
                })()}
                {missionsNonFact.length === 0 && !days.some(d => !d.isWeekend && getCongeForDate(d.date)) ? (
                  <tr><td colSpan={9} className="px-4 py-8 text-center text-slate-400">
                    <div>Aucune activité non-facturable</div>
                    <div className="text-xs mt-2">Les activités internes sont créées par l'administrateur</div>
                  </td></tr>
                ) : missionsNonFact.map(renderMissionRow)}
              </tbody>
            </table>
          </div>
        </Card>

        {/* Alerte dépassement 8h */}
        {joursEnExces.length > 0 && (
          <div className="mt-4 p-4 bg-red-50 border border-red-200 rounded-xl animate-fade-up">
            <div className="flex items-start gap-3">
              <div className="text-2xl">⚠️</div>
              <div>
                <div className="font-bold text-red-700">Attention : Dépassement des 8 heures journalières</div>
                <div className="text-sm text-red-600 mt-1">
                  Vous avez saisi plus de 8 heures sur {joursEnExces.length} jour(s) :
                </div>
                <div className="flex flex-wrap gap-2 mt-2">
                  {joursEnExces.map(d => (
                    <span key={d.date} className="px-2 py-1 bg-red-100 text-red-700 rounded text-sm font-medium">
                      {d.label} {d.date.split('-')[2]} : {getHeuresParJour(d.date)}h
                    </span>
                  ))}
                </div>
                <div className="text-xs text-red-500 mt-2">
                  Veuillez corriger vos saisies. Le maximum autorisé est de 8 heures par jour ouvré.
                </div>
              </div>
            </div>
          </div>
        )}

        {/* Totaux */}
        <Card className="mt-4">
          <div className="flex justify-between items-center flex-wrap gap-4">
            <div>
              <span className="text-slate-500">Total semaine:</span>
              <span className={cn("text-2xl font-bold ml-2", joursEnExces.length > 0 && "text-red-600")}>{totalWeek}h</span>
            </div>
            <div className="flex gap-6 flex-wrap">
              <div><span className="text-slate-500">Facturable:</span><span className="font-bold text-green-600 ml-2">{totalFact}h</span></div>
              <div><span className="text-slate-500">Non-fact:</span><span className="font-bold text-slate-400 ml-2">{totalNonFact}h</span></div>
              {congesHeures > 0 && <div><span className="text-slate-500">Congés:</span><span className="font-bold text-amber-500 ml-2">{congesHeures}h</span></div>}
              <div><span className="text-slate-500">Taux:</span><span className="font-bold text-blue-600 ml-2">{totalWeek > 0 ? Math.round((totalFact / totalWeek) * 100) : 0}%</span></div>
            </div>
          </div>
        </Card>
      </>)}

      {/* Modal commentaire */}
      <Modal isOpen={!!commentModal} onClose={() => setCommentModal(null)} title="Commentaire" size="sm">
        <div className="space-y-4">
          <TextArea label="Décrivez votre activité" value={comment} onChange={setComment} rows={4} placeholder="Ex: Préparation des états financiers..." />
          <div className="flex gap-3">
            <Button variant="secondary" onClick={() => setCommentModal(null)} className="flex-1">Annuler</Button>
            <Button onClick={saveComment} className="flex-1">Enregistrer</Button>
          </div>
        </div>
      </Modal>

      {/* Modal Nouvelle activité non-facturable */}
      <Modal isOpen={showAddActivity} onClose={() => setShowAddActivity(false)} title="Nouvelle activité non-facturable">
        <div className="space-y-4">
          <p className="text-sm text-slate-500">Créez une activité interne pour y saisir du temps non-facturable (Formation, Admin, Réunions internes...)</p>
          <Input label="Nom de l'activité" value={activityName} onChange={setActivityName} placeholder="Ex: Formation Power BI, Réunion équipe..." required />
          <div className="flex gap-3">
            <Button variant="secondary" onClick={() => setShowAddActivity(false)} className="flex-1">Annuler</Button>
            <Button onClick={async () => {
              if (!activityName) return alert('Nom requis');
              const {error} = await supabase.from('projets').insert([{
                organisation_id: org.id,
                code: genCode('INT'),
                nom: activityName,
                type_facturation: 'regie',
                statut: 'active',
                facturable: false,
                budget_montant: 0
              }]);
              if (error) { alert('Erreur: ' + error.message); return; }
              setShowAddActivity(false);
              setActivityName('');
              loadData();
            }} className="flex-1">Créer</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};

// ========== CONGES PAGE ==========
const CongesPage = () => {
  const {org, user, collab, isManager, isAdmin, userDeptId} = useApp();
  const [conges, setConges] = useState([]);
  const [validateurs, setValidateurs] = useState([]);
  const [collaborateurs, setCollaborateurs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null); // 'conge' ou 'solde_collab'
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [tab, setTab] = useState('mes');
  const [selectedCollab, setSelectedCollab] = useState(null);
  
  // Vérifier si l'utilisateur est validateur congés
  const [isValidateur, setIsValidateur] = useState(false);

  useEffect(() => { loadData(); }, []);

  const loadData = async () => {
    // Charger les congés et collaborateurs
    const [congesRes, validRes, collabsRes] = await Promise.all([
      supabase.from('conges').select('*').eq('organisation_id', org.id).order('date_debut', {ascending: false}),
      supabase.from('validateurs_departement').select('*').eq('organisation_id', org.id).eq('type_validation', 'conges'),
      supabase.from('collaborateurs').select('id,nom,prenom,email,departement_id,actif,user_id').eq('organisation_id', org.id).eq('actif', true)
    ]);
    
    if (congesRes.error) console.error('Conges error:', congesRes.error);
    
    // Les collaborateurs ont maintenant directement leur user_id (auth_id de Supabase)
    setCollaborateurs(collabsRes.data || []);
    
    // Enrichir les congés avec les infos collaborateur
    const congesEnrichis = (congesRes.data || []).map(c => {
      // Trouver le collaborateur correspondant par user_id ou par email
      const collab = (collabsRes.data || []).find(col => 
        (col.user_id && col.user_id === c.utilisateur_id) || 
        (col.email && col.email === c.utilisateur_email)
      );
      return {
        ...c,
        collaborateurs: collab || null
      };
    });
    
    setConges(congesEnrichis);
    setValidateurs(validRes.data || []);
    
    // Vérifier si l'utilisateur courant est validateur
    const isVal = (validRes.data || []).some(v => v.collaborateur_id === collab?.id);
    setIsValidateur(isVal || isAdmin);
    
    // ====== GESTION DU REPORT AUTOMATIQUE PAR ANNÉE ======
    const anneeEnCours = new Date().getFullYear();
    const mesCongesData = (congesRes.data || []).filter(c => c.utilisateur_id === user.id);
    
    // Chercher le report de l'année en cours
    const reportAnneeEnCours = mesCongesData.find(c => 
      c.type_conge === 'report_anterieur' && 
      c.annee_reference === anneeEnCours
    );
    
    // Chercher un import manuel initial (sans année de référence ou avec annee_reference null)
    const importInitial = mesCongesData.find(c => 
      c.type_conge === 'report_anterieur' && 
      !c.annee_reference
    );
    
    // Si pas de report pour l'année en cours, vérifier s'il faut en créer un automatiquement
    if (!reportAnneeEnCours && user.id) {
      const anneePrecedente = anneeEnCours - 1;
      
      // Calculer le solde de l'année précédente
      // 1. Report de l'année précédente (ou import initial)
      const reportAnneePrecedente = mesCongesData.find(c => 
        c.type_conge === 'report_anterieur' && 
        c.annee_reference === anneePrecedente
      );
      const soldeReportPrec = reportAnneePrecedente?.nb_jours || importInitial?.nb_jours || 0;
      
      // 2. Jours acquis l'année précédente (24 jours max)
      const joursAcquisPrec = 24;
      
      // 3. Jours pris l'année précédente (congés approuvés dont la date_debut est dans l'année précédente)
      const congesPrisAnnePrec = mesCongesData.filter(c => 
        c.statut === 'approved' && 
        c.type_conge === 'conge_paye' &&
        c.date_debut && 
        new Date(c.date_debut).getFullYear() === anneePrecedente
      );
      const joursPrisPrec = congesPrisAnnePrec.reduce((s, c) => s + (c.nb_jours || 0), 0);
      
      // 4. Solde à reporter = Report précédent + Acquis - Pris
      const soldeAReporter = soldeReportPrec + joursAcquisPrec - joursPrisPrec;
      
      // Créer le report automatique seulement si on a des données de l'année précédente
      // et que le solde est différent de 0 ou qu'il y a eu des congés pris
      const aDesCongesAnneePrecedente = congesPrisAnnePrec.length > 0 || reportAnneePrecedente || importInitial;
      
      if (aDesCongesAnneePrecedente && soldeAReporter !== 0) {
        try {
          await supabase.from('conges').insert([{
            organisation_id: org.id,
            utilisateur_id: user.id,
            type_conge: 'report_anterieur',
            date_debut: `${anneeEnCours}-01-01`,
            date_fin: `${anneeEnCours}-01-01`,
            nb_jours: Math.max(0, soldeAReporter), // Pas de report négatif
            motif: `Report automatique de ${anneePrecedente}`,
            statut: 'approved',
            annee_reference: anneeEnCours
          }]);
          // Recharger les données après création du report
          const {data: newConges} = await supabase.from('conges').select('*').eq('organisation_id', org.id).order('date_debut', {ascending: false});
          const newCongesEnrichis = (newConges || []).map(c => {
            const collab = (collabsRes.data || []).find(col => col.id === c.utilisateur_id || col.email === c.utilisateur_email);
            return {...c, collaborateurs: collab || null};
          });
          setConges(newCongesEnrichis);
        } catch(e) {
          console.error('Erreur création report automatique:', e);
        }
      }
    }
    
    setLoading(false);
  };

  const openNew = () => {
    setForm({utilisateur_id: user.id, type_conge: 'conge_paye', date_debut: '', date_fin: '', motif: ''});
    setModal('conge');
  };

  const save = async () => {
    if (!form.date_debut || !form.date_fin) return alert('Dates requises');
    
    // Vérifier le solde si c'est un congé payé
    if (form.type_conge === 'conge_paye') {
      const jours = workingDaysBetween(form.date_debut, form.date_fin);
      if (jours > soldeConges) {
        if (!confirm(`⚠️ Vous demandez ${jours} jours mais votre solde est de ${soldeConges} jours.\n\nContinuer quand même ?`)) {
          return;
        }
      }
    }
    
    setSaving(true);
    try {
      const jours = workingDaysBetween(form.date_debut, form.date_fin);
      const {error} = await supabase.from('conges').insert([{
        organisation_id: org.id, 
        utilisateur_id: user.id,
        type_conge: form.type_conge,
        date_debut: form.date_debut,
        date_fin: form.date_fin,
        nb_jours: jours, 
        motif: form.motif,
        statut: 'pending'
      }]);
      if (error) throw error;
      setModal(false); loadData();
    } catch (e) { alert('Erreur: ' + e.message); }
    setSaving(false);
  };

  const updateStatus = async (conge, statut) => {
    await supabase.from('conges').update({statut, date_validation: new Date().toISOString()}).eq('id', conge.id);
    loadData();
  };
  
  const deleteConge = async (c) => {
    if (c.statut === 'approved' && c.type_conge !== 'report_anterieur') return alert('Impossible de supprimer un congé déjà approuvé');
    if (c.type_conge === 'report_anterieur') {
      if (!confirm('⚠️ Supprimer le solde antérieur importé ? Cette action est irréversible.')) return;
    } else {
      if (!confirm('Supprimer cette demande de congé ?')) return;
    }
    await supabase.from('conges').delete().eq('id', c.id);
    loadData();
  };

  // Fonction pour vérifier si un congé appartient à l'utilisateur connecté
  const isMyConge = (c) => {
    if (c.utilisateur_id === user.id) return true;
    if (collab?.email && c.utilisateur_email === collab.email) return true;
    return false;
  };

  const mesConges = conges.filter(c => isMyConge(c) && c.type_conge !== 'report_anterieur');
  // Congés à valider: seulement si l'utilisateur est validateur
  // Et uniquement pour les collaborateurs de son département (si validateur département) ou tous (si admin)
  const congesAValider = isValidateur ? conges.filter(c => {
    if (c.statut !== 'pending') return false;
    if (isAdmin) return true; // Admin voit tous les pending
    // Validateur département: voir seulement les congés de son département
    const validDepts = validateurs.filter(v => v.collaborateur_id === collab?.id).map(v => v.departement_id);
    return validDepts.includes(c.collaborateurs?.departement_id);
  }) : [];
  
  // ====== CALCUL DU SOLDE DE CONGÉS - ANNÉE CIVILE ======
  const anneeEnCours = new Date().getFullYear();
  const maintenant = new Date();
  
  // Récupérer le report de l'année en cours (par user.id ou par email)
  const reportAnneeEnCours = conges.find(c => 
    c.type_conge === 'report_anterieur' && 
    isMyConge(c) &&
    c.annee_reference === anneeEnCours
  );
  // Ou l'import initial (sans année de référence)
  const importInitial = conges.find(c => 
    c.type_conge === 'report_anterieur' && 
    isMyConge(c) &&
    !c.annee_reference
  );
  const joursReportAnterieurs = reportAnneeEnCours?.nb_jours || importInitial?.nb_jours || 0;
  
  // Calcul des jours acquis depuis le 1er janvier de l'année en cours
  // Règle: +1 jour au 15 du mois, +1 jour au dernier jour du mois (total 2j/mois)
  const calculerJoursAcquis = () => {
    const jour = maintenant.getDate();
    const mois = maintenant.getMonth(); // 0 = janvier
    
    // Jours acquis des mois précédents (2j par mois complet)
    let jours = mois * 2;
    
    // Jours du mois en cours
    if (jour >= 15) jours += 1; // +1j à partir du 15
    
    // Vérifier si on est au dernier jour du mois
    const dernierJourDuMois = new Date(anneeEnCours, mois + 1, 0).getDate();
    if (jour >= dernierJourDuMois) jours += 1; // +1j au dernier jour
    
    return Math.min(jours, 24); // Max 24j/an
  };
  const joursAcquisAnnee = calculerJoursAcquis();
  
  // Pour l'affichage du sous-titre (ex: "15 jan = 1j, 31 jan = 2j")
  const prochainGain = (() => {
    const jour = maintenant.getDate();
    const dernierJourDuMois = new Date(anneeEnCours, maintenant.getMonth() + 1, 0).getDate();
    if (jour < 15) return `+1j le 15`;
    if (jour < dernierJourDuMois) return `+1j le ${dernierJourDuMois}`;
    return '';
  })();
  
  // Jours pris cette année (congés approuvés dont la date_debut est dans l'année en cours)
  const congesApprouves = mesConges.filter(c => 
    c.statut === 'approved' && 
    c.type_conge === 'conge_paye' &&
    c.date_debut &&
    new Date(c.date_debut).getFullYear() === anneeEnCours
  );
  const joursPris = congesApprouves.reduce((s, c) => s + (c.nb_jours || 0), 0);
  
  // Solde = Report antérieur + Acquis cette année - Pris cette année
  const soldeConges = joursReportAnterieurs + joursAcquisAnnee - joursPris;
  
  // Jours en attente de validation
  const joursEnAttente = mesConges.filter(c => 
    c.statut === 'pending' && 
    c.type_conge === 'conge_paye' &&
    c.date_debut &&
    new Date(c.date_debut).getFullYear() === anneeEnCours
  ).reduce((s, c) => s + (c.nb_jours || 0), 0);

  // Tabs dynamiques selon permissions
  const tabs = [
    {key: 'mes', label: 'Mes congés', count: mesConges.length}
  ];
  // Onglet "À valider" uniquement pour les validateurs
  if (isValidateur) {
    tabs.push({key: 'valider', label: 'À valider', count: congesAValider.length, icon: '🔔'});
  }
  // Onglet "Tous" uniquement pour validateurs et admin (ils voient seulement leur département)
  if (isValidateur || isAdmin) {
    // Filtrer par département pour les validateurs non-admin
    const congesDept = isAdmin ? conges : conges.filter(c => {
      const collabConge = collaborateurs.find(col => col.user_id === c.utilisateur_id);
      return collabConge?.departement_id === userDeptId;
    });
    tabs.push({key: 'tous', label: 'Tous', count: congesDept.length});
  }
  if (isAdmin) {
    tabs.push({key: 'soldes', label: 'Soldes équipe', icon: '⚙️'});
  }
  
  // Fonction pour calculer le solde d'un collaborateur
  const getCollabSolde = (collabData) => {
    // Chercher les congés de ce collaborateur par user_id OU par email
    const matchCollab = (c) => {
      if (collabData.user_id && c.utilisateur_id === collabData.user_id) return true;
      if (collabData.email && c.utilisateur_email === collabData.email) return true;
      return false;
    };
    
    // Report de l'année en cours pour ce collaborateur
    const reportCollab = conges.find(c => 
      c.type_conge === 'report_anterieur' && 
      matchCollab(c) &&
      c.annee_reference === anneeEnCours
    );
    const report = reportCollab?.nb_jours || 0;
    
    // Jours acquis (même calcul que pour l'utilisateur courant)
    const acquis = joursAcquisAnnee;
    
    // Jours pris cette année
    const congesPrisCollab = conges.filter(c => 
      matchCollab(c) &&
      c.statut === 'approved' && 
      c.type_conge === 'conge_paye' &&
      c.date_debut &&
      new Date(c.date_debut).getFullYear() === anneeEnCours
    );
    const pris = congesPrisCollab.reduce((s, c) => s + (c.nb_jours || 0), 0);
    
    return { report, acquis, pris, solde: report + acquis - pris };
  };
  
  // Ouvrir le modal pour modifier le solde d'un collaborateur
  const openSoldeCollab = (collabData) => {
    const soldeData = getCollabSolde(collabData);
    setSelectedCollab(collabData);
    setForm({ solde_anterieur: soldeData.report });
    setModal('solde_collab');
  };
  
  // Sauvegarder le solde d'un collaborateur
  const saveSoldeCollab = async () => {
    if (!selectedCollab?.email) {
      alert('Email du collaborateur manquant.');
      return;
    }
    
    const solde = parseFloat(form.solde_anterieur) || 0;
    if (solde < 0) return alert('Le solde ne peut pas être négatif');
    
    setSaving(true);
    try {
      // Chercher s'il existe déjà un report pour cette année et ce collaborateur (par user_id ou email)
      let existingQuery = supabase.from('conges')
        .select('id')
        .eq('type_conge', 'report_anterieur')
        .eq('annee_reference', anneeEnCours);
      
      // Chercher par user_id si disponible, sinon par email
      if (selectedCollab.user_id) {
        existingQuery = existingQuery.eq('utilisateur_id', selectedCollab.user_id);
      } else {
        existingQuery = existingQuery.eq('utilisateur_email', selectedCollab.email);
      }
      
      const {data: existing} = await existingQuery.single();
      
      if (existing) {
        // Mettre à jour
        const {error} = await supabase.from('conges').update({
          nb_jours: solde,
          motif: `Modifié par admin le ${fmtDate(today())}`,
          utilisateur_email: selectedCollab.email,
          utilisateur_id: selectedCollab.user_id || null
        }).eq('id', existing.id);
        if (error) throw error;
      } else {
        // Créer - utiliser user_id si disponible, sinon juste l'email
        const {error} = await supabase.from('conges').insert([{
          organisation_id: org.id,
          utilisateur_id: selectedCollab.user_id || null,
          utilisateur_email: selectedCollab.email,
          type_conge: 'report_anterieur',
          date_debut: `${anneeEnCours}-01-01`,
          date_fin: `${anneeEnCours}-01-01`,
          nb_jours: solde,
          motif: `Saisi par admin le ${fmtDate(today())}`,
          statut: 'approved',
          annee_reference: anneeEnCours
        }]);
        if (error) throw error;
      }
      
      setModal(null);
      setSelectedCollab(null);
      loadData();
      alert(`Solde de ${selectedCollab.prenom} ${selectedCollab.nom} mis à jour !`);
    } catch(e) { 
      console.error('Erreur save solde collab:', e);
      alert('Erreur: ' + e.message); 
    }
    setSaving(false);
  };

  return (
    <div>
      {!collab && (
        <div className="mb-4 p-4 bg-amber-50 border border-amber-200 rounded-xl text-amber-800">
          <div className="flex items-start gap-3">
            <span className="text-2xl">⚠️</span>
            <div>
              <div className="font-semibold">Profil collaborateur non configuré</div>
              <div className="text-sm mt-1">Pour demander des congés, vous devez d'abord avoir une fiche collaborateur. 
                {isAdmin && <span> Allez dans <strong>Équipe → Nouveau collaborateur</strong> et ajoutez-vous avec votre email de connexion.</span>}
              </div>
            </div>
          </div>
        </div>
      )}
      <PageHeader title="Congés & Absences" 
        subtitle={`Solde ${anneeEnCours}: ${soldeConges} jours ${soldeConges < 0 ? '(anticipation)' : 'disponibles'}`}
        tabs={tabs}
        activeTab={tab} onTabChange={setTab}
        action={<Button onClick={openNew} icon="➕" disabled={!collab}>Demander congé</Button>}
      />

      {/* Carte récapitulative du solde */}
      {tab === 'mes' && (
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 sm:gap-4 mb-6">
          <StatCard title={`Report ${anneeEnCours}`} value={joursReportAnterieurs + 'j'} icon="📥" color="slate" subtitle="Solde année préc." />
          <StatCard title="Acquis en cours" value={joursAcquisAnnee + 'j'} icon="📅" color="blue" subtitle={prochainGain || 'Max atteint'} />
          <StatCard title={`Pris en ${anneeEnCours}`} value={joursPris + 'j'} icon="🏖️" color="amber" />
          <StatCard title="En attente" value={joursEnAttente + 'j'} icon="⏳" color="purple" />
          <StatCard title="Solde disponible" value={soldeConges + 'j'} icon={soldeConges < 0 ? '⚠️' : '✅'} color={soldeConges < 0 ? 'red' : 'green'} />
        </div>
      )}

      {/* Onglet Soldes équipe (Admin seulement) */}
      {tab === 'soldes' && isAdmin && (
        <Card title={`Soldes congés ${anneeEnCours}`} subtitle="Gérez les soldes d'ouverture de chaque collaborateur">
          <div className="mb-4 p-4 bg-blue-50 rounded-xl text-blue-700 text-sm">
            <strong>💡 Astuce :</strong> Cliquez sur "Modifier" pour saisir le solde d'ouverture {anneeEnCours} (jours non consommés en {anneeEnCours - 1}).
            Les années suivantes, le report sera calculé automatiquement.
          </div>
          <Table 
            columns={[
              {header: 'Collaborateur', render: r => (
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white text-sm font-bold">
                    {r.prenom?.[0]}{r.nom?.[0]}
                  </div>
                  <div>
                    <div className="font-medium">{r.prenom} {r.nom}</div>
                    <div className="text-xs text-slate-400">{r.email}</div>
                  </div>
                </div>
              )},
              {header: `Report ${anneeEnCours}`, render: r => {
                const s = getCollabSolde(r);
                return <span className={cn('font-medium', s.report > 0 ? 'text-slate-700' : 'text-slate-400')}>{s.report}j</span>;
              }},
              {header: 'Acquis', render: r => {
                const s = getCollabSolde(r);
                return <span className="text-blue-600">{s.acquis}j</span>;
              }},
              {header: 'Pris', render: r => {
                const s = getCollabSolde(r);
                return <span className="text-amber-600">{s.pris}j</span>;
              }},
              {header: 'Solde', render: r => {
                const s = getCollabSolde(r);
                return (
                  <span className={cn('font-bold', s.solde < 0 ? 'text-red-500' : s.solde > 0 ? 'text-green-600' : 'text-slate-400')}>
                    {s.solde}j
                  </span>
                );
              }}
            ]} 
            data={collaborateurs}
            actions={r => (
              <Button variant="secondary" size="xs" onClick={() => openSoldeCollab(r)} icon="✏️">
                Modifier
              </Button>
            )}
            empty="Aucun collaborateur actif"
          />
        </Card>
      )}

      {loading ? <Loader /> : tab !== 'soldes' && (
        <Card>
          <Table columns={[
            {header: 'Type', render: r => { const t = LEAVE_TYPES.find(l => l.value === r.type_conge); return <Badge color={t?.color}>{t?.label}</Badge>; }},
            {header: 'Période', render: r => <span>{fmtDate(r.date_debut)} → {fmtDate(r.date_fin)}</span>},
            {header: 'Jours', render: r => <span className="font-medium">{r.nb_jours}j</span>},
            {header: 'Statut', render: r => <Badge color={LEAVE_STATUS[r.statut]?.color}>{LEAVE_STATUS[r.statut]?.label}</Badge>},
            {header: 'Motif', render: r => <span className="text-sm text-slate-500 truncate max-w-xs">{r.motif || '-'}</span>}
          ]} data={(() => {
            if (tab === 'mes') return mesConges;
            if (tab === 'valider') return congesAValider;
            // Onglet "Tous" - filtrer par département pour les validateurs non-admin
            const congesTous = conges.filter(c => c.type_conge !== 'report_anterieur');
            if (isAdmin) return congesTous;
            // Pour les validateurs, filtrer par département
            return congesTous.filter(c => {
              const collabConge = collaborateurs.find(col => col.user_id === c.utilisateur_id);
              return collabConge?.departement_id === userDeptId;
            });
          })()}
          actions={r => (
            <div className="flex gap-1">
              {tab === 'valider' && r.statut === 'pending' && (<>
                <Button variant="success" size="xs" onClick={() => updateStatus(r, 'approved')} title="Approuver">✓</Button>
                <Button variant="danger" size="xs" onClick={() => updateStatus(r, 'rejected')} title="Refuser">✗</Button>
              </>)}
              {r.statut === 'pending' && r.utilisateur_id === user.id && (
                <Button variant="ghost" size="xs" onClick={() => deleteConge(r)} title="Annuler">🗑️</Button>
              )}
            </div>
          )} />
        </Card>
      )}

      <Modal isOpen={modal === 'conge'} onClose={() => setModal(null)} title="Demande de congé">
        <div className="space-y-4">
          <Select label="Type de congé" value={form.type_conge} onChange={v => setForm(p => ({...p, type_conge: v}))} options={LEAVE_TYPES.map(t => ({value: t.value, label: t.label}))} />
          <div className="grid grid-cols-2 gap-4">
            <Input label="Date début" type="date" value={form.date_debut} onChange={v => setForm(p => ({...p, date_debut: v}))} required />
            <Input label="Date fin" type="date" value={form.date_fin} onChange={v => setForm(p => ({...p, date_fin: v}))} required />
          </div>
          {form.date_debut && form.date_fin && (
            <div className="p-3 bg-blue-50 rounded-xl text-center">
              <span className="text-blue-600 font-medium">{workingDaysBetween(form.date_debut, form.date_fin)} jours ouvrés</span>
              {form.type_conge === 'conge_paye' && workingDaysBetween(form.date_debut, form.date_fin) > soldeConges && (
                <div className="text-red-500 text-sm mt-1">⚠️ Dépasse votre solde de {soldeConges}j</div>
              )}
            </div>
          )}
          <TextArea label="Motif (optionnel)" value={form.motif} onChange={v => setForm(p => ({...p, motif: v}))} rows={2} />
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button>
            <Button onClick={save} loading={saving} className="flex-1">Soumettre</Button>
          </div>
        </div>
      </Modal>

      {/* Modal Solde collaborateur (Admin) */}
      <Modal isOpen={modal === 'solde_collab'} onClose={() => {setModal(null); setSelectedCollab(null);}} title={`Solde congés - ${selectedCollab?.prenom} ${selectedCollab?.nom}`} size="sm">
        <div className="space-y-4">
          {selectedCollab && (
            <>
              <div className="flex items-center gap-4 p-4 bg-slate-50 rounded-xl">
                <div className="w-14 h-14 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white text-xl font-bold">
                  {selectedCollab.prenom?.[0]}{selectedCollab.nom?.[0]}
                </div>
                <div>
                  <div className="font-bold text-lg">{selectedCollab.prenom} {selectedCollab.nom}</div>
                  <div className="text-sm text-slate-500">{selectedCollab.email}</div>
                </div>
              </div>
              
              {!selectedCollab.user_id && (
                <div className="p-4 bg-blue-50 border border-blue-200 rounded-xl text-blue-700 text-sm">
                  <strong>ℹ️ Info :</strong> Ce collaborateur n'a pas encore de compte utilisateur. 
                  Le solde sera lié à son email et sera automatiquement associé à son compte lorsqu'il se connectera.
                </div>
              )}
              
              <div className="p-4 bg-slate-50 rounded-xl text-slate-600 text-sm">
                Entrez le solde de congés reporté de {anneeEnCours - 1} (jours non consommés).
              </div>
              
              <Input 
                label={`Solde d'ouverture ${anneeEnCours} (jours)`}
                type="number" 
                value={form.solde_anterieur} 
                onChange={v => setForm(p => ({...p, solde_anterieur: v}))} 
                placeholder="Ex: 12"
                min={0}
                required 
              />
              
              {/* Récapitulatif */}
              {(() => {
                const s = getCollabSolde(selectedCollab);
                const nouveauSolde = (parseFloat(form.solde_anterieur) || 0) + s.acquis - s.pris;
                return (
                  <div className="p-4 bg-slate-50 rounded-xl space-y-2 text-sm">
                    <div className="flex justify-between">

};
// ========== FACTURATION PAGE ==========
const FacturationPage = () => {
  const {org, collab, isAssocie, isAdmin, isSuperAdmin, userDeptId} = useApp();
  const [factures, setFactures] = useState([]);
  const [allMissions, setAllMissions] = useState([]);
  const [clients, setClients] = useState([]);
  const [departements, setDepartements] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [tab, setTab] = useState('toutes');
  const [filterDept, setFilterDept] = useState(''); // Filtre département
  const [privileges, setPrivileges] = useState([]);
  
  // Vérifier accès global
  const gradeNiveau = collab?.grades?.niveau || 0;
  const isManagingPartner = gradeNiveau >= 6;
  const hasGlobalAccess = isManagingPartner || isSuperAdmin || isAdmin || privileges.some(p => p.collaborateur_id === collab?.id && p.type_privilege === 'acces_global');
  
  // Associé+ voit tout, Manager voit seulement ses missions
  const canViewAll = isAssocie || isAdmin || hasGlobalAccess;
  
  // Filtre effectif
  const effectiveDeptFilter = hasGlobalAccess ? filterDept : userDeptId;

  useEffect(() => { loadData(); }, []);
  useEffect(() => { if (!loading) loadData(); }, [filterDept]);

  const loadData = async () => {
    const [f, m, c, depts, privs] = await Promise.all([
      supabase.from('factures').select('*,clients(nom,departement_id),projets(nom,code,responsable_id,departement_id)').eq('organisation_id', org.id).order('date_emission', {ascending: false}),
      supabase.from('projets').select('*,clients(nom),departements:departement_id(nom)').eq('organisation_id', org.id),
      supabase.from('clients').select('id,nom,departement_id').eq('organisation_id', org.id),
      supabase.from('departements').select('id,nom').eq('organisation_id', org.id),
      supabase.from('privileges_speciaux').select('*').eq('organisation_id', org.id).eq('actif', true)
    ]);
    
    setDepartements(depts.data || []);
    setPrivileges(privs.data || []);
    
    const hasAccess = isManagingPartner || isSuperAdmin || isAdmin || (privs.data || []).some(p => p.collaborateur_id === collab?.id && p.type_privilege === 'acces_global');
    const deptFilter = hasAccess ? filterDept : userDeptId;
    
    // Filtrer les factures
    let filteredFactures = f.data || [];
    
    // Filtrer par département (via projet ou client)
    if (deptFilter) {
      filteredFactures = filteredFactures.filter(fac => {
        const projetDept = fac.projets?.departement_id;
        const clientDept = fac.clients?.departement_id;
        return projetDept === deptFilter || clientDept === deptFilter || (!projetDept && !clientDept);
      });
    }
    
    // Filtrer pour les managers (seulement leurs missions) si pas d'accès global
    if (!hasAccess && collab?.id) {
      filteredFactures = filteredFactures.filter(fac => 
        !fac.projet_id || fac.projets?.responsable_id === collab.id
      );
    }
    
    // Filtrer les missions par département
    let filteredMissions = m.data || [];
    if (deptFilter) {
      filteredMissions = filteredMissions.filter(mission => 
        mission.departement_id === deptFilter || !mission.departement_id
      );
    }
    
    // Filtrer les clients par département
    let filteredClients = c.data || [];
    if (deptFilter) {
      filteredClients = filteredClients.filter(client => 
        client.departement_id === deptFilter || !client.departement_id
      );
    }
    
    setFactures(filteredFactures);
    setAllMissions(filteredMissions);
    setClients(filteredClients);
    setLoading(false);
  };
  
  // Missions filtrées pour le select (Manager = ses missions, Associé+ = toutes)
  const missions = canViewAll 
    ? allMissions 
    : allMissions.filter(m => m.responsable_id === collab?.id);

  const openNew = () => {
    setEditItem(null);
    setForm({reference: genCode('FAC'), projet_id: '', client_id: '', type_facture: 'standard', date_emission: today(), date_echeance: addDays(today(), 30), montant_ht: 0, taux_tva: 18, statut: 'draft', montant_encaisse: 0, date_encaissement: ''});
    setModal('facture');
  };

  const save = async () => {
    if (!form.client_id) return alert('Client requis');
    setSaving(true);
    try {
      const montantHT = parseFloat(form.montant_ht) || 0;
      const tauxTVA = parseFloat(form.taux_tva) || 18;
      const tva = montantHT * tauxTVA / 100;
      
      const data = {
        reference: form.reference,
        client_id: form.client_id,
        projet_id: form.projet_id || null,
        type_facture: form.type_facture || 'standard',
        date_emission: form.date_emission,
        date_echeance: form.date_echeance,
        montant_ht: montantHT,
        taux_tva: tauxTVA,
        montant_tva: tva,
        montant_total: montantHT + tva,
        statut: form.statut || 'draft'
      };
      
      let result;
      if (editItem?.id) {
        result = await supabase.from('factures').update(data).eq('id', editItem.id);
      } else {
        result = await supabase.from('factures').insert([{...data, organisation_id: org.id}]);
      }
      
      if (result.error) throw result.error;
      setModal(null); loadData();
    } catch (e) { 
      console.error('Facture save error:', e);
      alert('Erreur: ' + e.message); 
    }
    setSaving(false);
  };

  const updateStatus = async (f, statut) => { 
    // Confirmation selon le statut
    const messages = {
      'sent': `Envoyer la facture ${f.reference} au client ?`,
      'paid': `Marquer la facture ${f.reference} comme entièrement payée (${fmtMoney(f.montant_total)}) ?`
    };
    
    if (messages[statut] && !confirm(messages[statut])) return;
    
    const updates = {statut};
    if (statut === 'paid') {
      updates.montant_encaisse = f.montant_total;
      updates.date_encaissement = today();
    }
    await supabase.from('factures').update(updates).eq('id', f.id); 
    loadData(); 
  };

  // Encaissement partiel
  const openEncaissement = (f) => {
    setEditItem(f);
    setForm({montant_encaisse: f.montant_encaisse || 0, date_encaissement: f.date_encaissement || today()});

  };

  const saveEncaissement = async () => {
    setSaving(true);
    try {
      const montant = parseFloat(form.montant_encaisse) || 0;
      let statut = editItem.statut;
      if (montant >= editItem.montant_total) statut = 'paid';
      else if (montant > 0) statut = 'partial';
      
      await supabase.from('factures').update({
        montant_encaisse: montant,
        date_encaissement: form.date_encaissement,
        statut

      setModal(null); loadData();

    setSaving(false);

  // Supprimer une facture
  const deleteFacture = async (f) => {
    const confirmMsg = f.statut === 'paid'

      : `Supprimer la facture ${f.reference} (${fmtMoney(f.montant_total)}) ?\n\nCette action est irréversible.`;
    
    if (!confirm(confirmMsg)) return;
    
    try {
      await supabase.from('factures').delete().eq('id', f.id);

      alert('Erreur: ' + e.message);
    }

  // Modifier une facture
  const openEditFacture = (f) => {
    setEditItem(f);
    setForm({
      reference: f.reference || '',
      type_facture: f.type_facture || 'standard',

      taux_tva: f.taux_tva || 18,

  };

  const exportPDF = (f) => {
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF();
    
    // Couleurs

    doc.save('Facture_' + String(f.reference) + '.pdf');
  };
  
  // Fonction pour convertir un nombre en lettres (simplifié)
  const nombreEnLettres = (n) => {
    if (!n || n === 0) return 'zéro franc CFA';
    
    const unites = ['', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf'];
    const dizaines = ['', '', 'vingt', 'trente', 'quarante', 'cinquante', 'soixante', 'soixante', 'quatre-vingt', 'quatre-vingt'];
    
    const convertirMoinsDeMillle = (num) => {
      if (num < 20) return unites[num];
      if (num < 100) {
        const d = Math.floor(num / 10);
        const u = num % 10;
        if (d === 7 || d === 9) return dizaines[d] + (u === 1 ? '-et-' : '-') + unites[10 + u];
        return dizaines[d] + (u === 1 && d !== 8 ? '-et-' : (u > 0 ? '-' : '')) + unites[u];
      }
      const c = Math.floor(num / 100);
      const r = num % 100;
      return (c === 1 ? 'cent' : unites[c] + ' cent') + (r > 0 ? ' ' + convertirMoinsDeMillle(r) : (c > 1 && r === 0 ? 's' : ''));
    };
    
    const num = Math.round(parseFloat(n));
    if (num >= 1000000000) return fmtSimple(num) + ' francs CFA';
    
    let result = '';
    const milliards = Math.floor(num / 1000000000);
    const millions = Math.floor((num % 1000000000) / 1000000);
    const milliers = Math.floor((num % 1000000) / 1000);
    const reste = num % 1000;
    
    if (milliards > 0) result += convertirMoinsDeMillle(milliards) + ' milliard' + (milliards > 1 ? 's' : '') + ' ';
    if (millions > 0) result += convertirMoinsDeMillle(millions) + ' million' + (millions > 1 ? 's' : '') + ' ';
    if (milliers > 0) result += (milliers === 1 ? 'mille' : convertirMoinsDeMillle(milliers) + ' mille') + ' ';
    if (reste > 0) result += convertirMoinsDeMillle(reste);
    
    return result.trim() + ' francs CFA';

    {header: 'Montant HT', key: 'montant_ht'},
    {header: 'TVA', key: 'montant_tva'},
    {header: 'Montant TTC', key: 'montant_total'},
    {header: 'Encaissé', key: 'montant_encaisse'},
    {header: 'Statut', getValue: r => INVOICE_STATUS[r.statut]?.label || ''}
  ], 'factures');

  return (
    <div>
      <PageHeader title="Facturation" subtitle={`${factures.length} factures${effectiveDeptFilter ? ' • ' + (departements.find(d => d.id === effectiveDeptFilter)?.nom || '') : ''}`} 
        tabs={[
          {key: 'toutes', label: 'Toutes', count: factures.length},
          {key: 'draft', label: 'Brouillons', count: factures.filter(f => f.statut === 'draft').length},
          {key: 'sent', label: 'Envoyées', count: factures.filter(f => f.statut === 'sent').length},
          {key: 'partial', label: 'Partielles', count: factures.filter(f => f.statut === 'partial').length},
          {key: 'paid', label: 'Payées', count: factures.filter(f => f.statut === 'paid').length}
        ]}
        activeTab={tab} onTabChange={setTab}
        action={<div className="flex gap-2 items-center">
          {/* Filtre département pour les utilisateurs avec accès global */}
          {hasGlobalAccess && departements.length > 0 && (
            <Select 
              value={filterDept} 
              onChange={setFilterDept} 
              options={[
                {value: '', label: '🏢 Tous dép.'},
                ...departements.map(d => ({value: d.id, label: d.nom}))

          )}
          <Button variant="secondary" size="sm" onClick={exportFactures} icon="📥">Export</Button>
          <Button onClick={openNew} icon="➕">Nouvelle</Button>
        </div>} 
      />
      
      {/* Info département pour non-global */}
      {!hasGlobalAccess && userDeptId && (
        <div className="mb-4 p-2 bg-blue-50 border border-blue-200 rounded-lg flex items-center gap-2 text-sm">
          <span className="text-blue-500">🔒</span>
          <span className="text-blue-700">Factures du département <b>{departements.find(d => d.id === userDeptId)?.nom || '-'}</b></span>

      <TabContent tabKey={tab}>

        <div className="card-animate"><StatCard title="Total facturé" value={fmtMoney(stats.total)} icon="📄" color="blue" /></div>
        <div className="card-animate"><StatCard title="Encaissé" value={fmtMoney(stats.encaisse)} icon="✅" color="green" /></div>
        <div className="card-animate"><StatCard title="En attente" value={fmtMoney(stats.enAttente)} icon="⏳" color="amber" /></div>
      </div>
      
      {/* Alerte si factures sans mission */}
      {(() => {
        const facturesSansMission = factures.filter(f => !f.projet_id);
        if (facturesSansMission.length > 0) {
          const totalSansMission = facturesSansMission.reduce((s, f) => s + (parseFloat(f.montant_ht) || 0), 0);
          return (

      })()}
      
      {loading ? <Loader /> : (

            {header: 'Montant TTC', render: r => <span className="text-slate-500">{fmtMoney(r.montant_total)}</span>},
            {header: 'Encaissé', render: r => r.montant_encaisse > 0 ? <span className="text-green-600">{fmtMoney(r.montant_encaisse)}</span> : '-'},
            {header: 'Statut', render: r => <Badge color={INVOICE_STATUS[r.statut]?.color}>{INVOICE_STATUS[r.statut]?.label}</Badge>}
          ]} data={filteredFactures} actions={r => (
            <div className="flex gap-1">
              <Button variant="ghost" size="xs" onClick={() => exportPDF(r)} title="Télécharger PDF">📄</Button>
              <Button variant="ghost" size="xs" onClick={() => sendByEmail(r)} title="Envoyer par email">📧</Button>
              {r.statut === 'draft' && <Button variant="ghost" size="xs" onClick={() => updateStatus(r, 'sent')} title="Marquer envoyée">📤</Button>}
              {(r.statut === 'sent' || r.statut === 'partial') && <Button variant="ghost" size="xs" onClick={() => openEncaissement(r)} title="Encaisser">💰</Button>}
              {(r.statut === 'sent' || r.statut === 'partial') && <Button variant="ghost" size="xs" onClick={() => updateStatus(r, 'paid')} title="Payé 100%">✅</Button>}
              <Button variant="ghost" size="xs" onClick={() => openEditFacture(r)} title="Modifier">✏️</Button>
              <Button variant="ghost" size="xs" onClick={() => deleteFacture(r)} title="Supprimer">🗑️</Button>
            </div>
          )} />
        </Card>
      )}
      </TabContent>

      {/* Modal Nouvelle Facture */}
      <Modal isOpen={modal === 'facture'} onClose={() => {setModal(null); setEditItem(null);}} title={editItem ? 'Modifier facture' : 'Nouvelle facture'} size="lg">
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4">
            <Input label="Référence" value={form.reference} onChange={v => setForm(p => ({...p, reference: v}))} />
            <Select label="Type" value={form.type_facture} onChange={v => setForm(p => ({...p, type_facture: v}))} options={[{value: 'standard', label: 'Standard'}, {value: 'acompte', label: 'Acompte'}, {value: 'solde', label: 'Solde'}, {value: 'avoir', label: 'Avoir'}]} />
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Select label="Client" value={form.client_id} onChange={v => setForm(p => ({...p, client_id: v, projet_id: ''}))} options={clients.map(c => ({value: c.id, label: c.nom}))} placeholder="Sélectionner" required />
            <Select label="Mission" value={form.projet_id} onChange={v => { 
              const m = missions.find(x => x.id === v); 
              setForm(p => ({...p, projet_id: v, client_id: m?.client_id || p.client_id})); 
            }} options={missions.filter(m => !form.client_id || m.client_id === form.client_id).map(m => ({value: m.id, label: m.code + ' - ' + m.nom + ' (' + (m.departements?.nom || 'Sans dept') + ')'}))} placeholder="Sélectionner (optionnel)" />
          </div>
          
          {/* Affichage du budget restant si mission sélectionnée */}
          {form.projet_id && (() => {
            const mission = missions.find(m => m.id === form.projet_id);
            if (!mission) return null;
            const facturesMission = factures.filter(f => f.projet_id === form.projet_id && f.id !== editItem?.id);
            const dejaFacture = facturesMission.reduce((s, f) => s + (f.montant_ht || 0), 0);
            const budgetRestant = (mission.budget_montant || 0) - dejaFacture;
            const isDepassement = (parseFloat(form.montant_ht) || 0) > budgetRestant;
            
            return (
              <div className={cn('p-3 sm:p-4 rounded-xl', isDepassement ? 'bg-red-50 border border-red-200' : 'bg-blue-50')}>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 text-center text-sm">
                  <div>
                    <div className="text-slate-500 text-xs sm:text-sm">Budget mission</div>
                    <div className="font-bold text-base sm:text-lg">{fmtMoney(mission.budget_montant)}</div>
                  </div>
                  <div>
                    <div className="text-slate-500 text-xs sm:text-sm">Déjà facturé</div>
                    <div className="font-bold text-base sm:text-lg text-amber-600">{fmtMoney(dejaFacture)}</div>
                  </div>
                  <div>
                    <div className="text-slate-500 text-xs sm:text-sm">Reste à facturer</div>
                    <div className={cn('font-bold text-base sm:text-lg', budgetRestant >= 0 ? 'text-green-600' : 'text-red-600')}>{fmtMoney(budgetRestant)}</div>
                  </div>
                </div>
                {isDepassement && (
                  <div className="mt-3 p-2 bg-red-100 rounded-lg text-red-700 text-sm text-center">
                    ⚠️ Attention: Dépassement de {fmtMoney((parseFloat(form.montant_ht) || 0) - budgetRestant)} par rapport au budget restant
                  </div>
                )}
              </div>
            );
          })()}
          
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
            <Input label="Date émission" type="date" value={form.date_emission} onChange={v => setForm(p => ({...p, date_emission: v}))} />
            <Input label="Date échéance" type="date" value={form.date_echeance} onChange={v => setForm(p => ({...p, date_echeance: v}))} />
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">
            <Input label="Montant HT (FCFA)" type="number" value={form.montant_ht} onChange={v => setForm(p => ({...p, montant_ht: v}))} />
            <Input label="TVA %" type="number" value={form.taux_tva} onChange={v => setForm(p => ({...p, taux_tva: v}))} />
            <div><label className="block text-sm font-medium mb-1.5">Total TTC</label><div className="px-4 py-2.5 bg-green-50 rounded-xl font-bold text-green-700">{fmtMoney((form.montant_ht || 0) * (1 + (form.taux_tva || 0) / 100))}</div></div>
          </div>
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button><Button onClick={save} loading={saving} className="flex-1">Créer</Button></div>
        </div>
      </Modal>

      {/* Modal Encaissement */}
      <Modal isOpen={modal === 'encaissement'} onClose={() => setModal(null)} title={`Encaissement - ${editItem?.reference}`} size="sm">
        <div className="space-y-4">
          <div className="p-4 bg-slate-50 rounded-xl">
            <div className="flex justify-between mb-2"><span className="text-slate-500">Montant facture:</span><span className="font-bold">{fmtMoney(editItem?.montant_total)}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">Déjà encaissé:</span><span className="text-green-600">{fmtMoney(editItem?.montant_encaisse || 0)}</span></div>
          </div>
          <Input label="Montant encaissé (FCFA)" type="number" value={form.montant_encaisse} onChange={v => setForm(p => ({...p, montant_encaisse: v}))} />
          <Input label="Date encaissement" type="date" value={form.date_encaissement} onChange={v => setForm(p => ({...p, date_encaissement: v}))} />
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button><Button onClick={saveEncaissement} loading={saving} className="flex-1">Enregistrer</Button></div>
        </div>
      </Modal>
    </div>
  );
};

// ========== NOTES DE FRAIS PAGE ==========
const EXPENSE_TYPES = [
  {value: 'transport', label: 'Transport', icon: '🚗'},
  {value: 'repas', label: 'Repas', icon: '🍽️'},
  {value: 'hebergement', label: 'Hébergement', icon: '🏨'},
  {value: 'fournitures', label: 'Fournitures', icon: '📎'},
  {value: 'communication', label: 'Communication', icon: '📱'},
  {value: 'autre', label: 'Autre', icon: '📦'}
];

const EXPENSE_STATUS = {
  draft: {label: 'Brouillon', color: 'gray'},
  submitted: {label: 'Soumise', color: 'blue'},
  approved: {label: 'Approuvée', color: 'green'},
  rejected: {label: 'Refusée', color: 'red'},
  paid: {label: 'Remboursée', color: 'purple'}
};

const NotesFraisPage = () => {
  const {org, user, collab, isManager, isAdmin, userDeptId} = useApp();
  const [notes, setNotes] = useState([]);
  const [missions, setMissions] = useState([]);
  const [validateurs, setValidateurs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [tab, setTab] = useState('mes');
  
  // Vérifier si l'utilisateur est validateur notes de frais
  const [isValidateur, setIsValidateur] = useState(false);

  useEffect(() => { loadData(); }, []);

  const loadData = async () => {
    const [n, m, v] = await Promise.all([
      supabase.from('notes_frais').select('*,projets(nom,code),collaborateurs(nom,prenom,departement_id)').eq('organisation_id', org.id).order('date_frais', {ascending: false}),
      supabase.from('projets').select('id,nom,code').eq('organisation_id', org.id),
      supabase.from('validateurs_departement').select('*').eq('organisation_id', org.id).eq('type_validation', 'frais')
    ]);
    setNotes(n.data || []);
    setMissions(m.data || []);
    setValidateurs(v.data || []);
    
    // Vérifier si l'utilisateur courant est validateur
    const isVal = (v.data || []).some(val => val.collaborateur_id === collab?.id);
    setIsValidateur(isVal || isAdmin);
    
    setLoading(false);
  };

  const openNew = () => {
    setEditItem(null);
    setForm({
      reference: genCode('NDF'),
      collaborateur_id: collab?.id,
      projet_id: '',
      type_frais: 'transport',
      date_frais: today(),
      description: '',
      montant: 0,
      justificatif_url: null,
      statut: 'draft'
    });
    setModal('note');
  };

  const openEdit = (n) => {
    setEditItem(n);
    setForm({...n, date_frais: n.date_frais?.split('T')[0] || ''});
    setModal('note');
  };

  const save = async () => {
    if (!form.montant || form.montant <= 0) return alert('Montant requis');
    setSaving(true);
    try {
      const data = {
        reference: form.reference,
        titre: form.description || form.type_frais || 'Note de frais',
        collaborateur_id: collab?.id || null,
        projet_id: form.projet_id || null,
        type_frais: form.type_frais,
        date_frais: form.date_frais,
        description: form.description || '',
        montant: parseFloat(form.montant) || 0,
        justificatif_url: form.justificatif_url || null,
        statut: form.statut || 'draft'
      };

      let result;
      if (editItem?.id) {
        result = await supabase.from('notes_frais').update(data).eq('id', editItem.id);
      } else {
        result = await supabase.from('notes_frais').insert([{...data, organisation_id: org.id}]);
      }

      if (result.error) throw result.error;
      setModal(null);
      loadData();
    } catch (e) {
      console.error('Note frais error:', e);
      alert('Erreur: ' + e.message);
    }
    setSaving(false);
  };

  const submitNote = async (n) => {
    if (!confirm('Soumettre cette note de frais pour validation ?')) return;
    await supabase.from('notes_frais').update({statut: 'submitted'}).eq('id', n.id);
    loadData();
  };

  const approveNote = async (n) => {
    if (!confirm(`Approuver la note ${n.reference} de ${fmtMoney(n.montant)} ?`)) return;
    await supabase.from('notes_frais').update({statut: 'approved', date_validation: today()}).eq('id', n.id);
    loadData();
  };

  const rejectNote = async (n) => {
    const motif = prompt('Motif du refus :');
    if (!motif) return;
    await supabase.from('notes_frais').update({statut: 'rejected', motif_refus: motif}).eq('id', n.id);
    loadData();
  };

  const markPaid = async (n) => {
    if (!confirm(`Marquer la note ${n.reference} comme remboursée ?`)) return;
    await supabase.from('notes_frais').update({statut: 'paid', date_remboursement: today()}).eq('id', n.id);
    loadData();
  };

  const deleteNote = async (n) => {
    if (n.statut !== 'draft') return alert('Seules les notes en brouillon peuvent être supprimées');
    if (!confirm('Supprimer cette note de frais ?')) return;
    await supabase.from('notes_frais').delete().eq('id', n.id);
    loadData();
  };

  const mesNotes = notes.filter(n => n.collaborateur_id === collab?.id);
  
  // Notes à valider: seulement si l'utilisateur est validateur
  const notesAValider = isValidateur ? notes.filter(n => {
    if (n.statut !== 'submitted') return false;
    if (isAdmin) return true;
    // Validateur département: voir seulement les notes de son département
    const validDepts = validateurs.filter(v => v.collaborateur_id === collab?.id).map(v => v.departement_id);
    return validDepts.includes(n.collaborateurs?.departement_id);
  }) : [];
  
  const notesApprouvees = notes.filter(n => n.statut === 'approved');

  const stats = {
    totalMes: mesNotes.reduce((s, n) => s + (n.montant || 0), 0),
    enAttente: mesNotes.filter(n => n.statut === 'submitted').reduce((s, n) => s + (n.montant || 0), 0),
    approuve: mesNotes.filter(n => n.statut === 'approved').reduce((s, n) => s + (n.montant || 0), 0),
    rembourse: mesNotes.filter(n => n.statut === 'paid').reduce((s, n) => s + (n.montant || 0), 0)
  };

  const displayNotes = tab === 'mes' ? mesNotes : tab === 'valider' ? notesAValider : tab === 'approuvees' ? notesApprouvees : notes;

  const exportNotes = () => exportToExcel(displayNotes, [
    {header: 'Référence', key: 'reference'},
    {header: 'Date', key: 'date_frais'},
    {header: 'Type', getValue: r => EXPENSE_TYPES.find(t => t.value === r.type_frais)?.label || ''},
    {header: 'Mission', getValue: r => r.projets?.code || ''},
    {header: 'Description', key: 'description'},
    {header: 'Montant', key: 'montant'},
    {header: 'Justificatif', getValue: r => r.justificatif_url ? 'Oui' : 'Non'},
    {header: 'Statut', getValue: r => EXPENSE_STATUS[r.statut]?.label || ''}
  ], 'notes_frais');
  
  // Tabs dynamiques selon permissions
  const tabsList = [
    {key: 'mes', label: 'Mes notes', count: mesNotes.length}
  ];
  if (isValidateur) {
    tabsList.push({key: 'valider', label: 'À valider', count: notesAValider.length, icon: '🔔'});
  }
  if (isManager || isAdmin) {
    tabsList.push({key: 'approuvees', label: 'À rembourser', count: notesApprouvees.length});
    tabsList.push({key: 'toutes', label: 'Toutes', count: notes.length});
  }

  return (
    <div>
      {!collab && (
        <div className="mb-4 p-4 bg-amber-50 border border-amber-200 rounded-xl text-amber-800">
          <div className="flex items-start gap-3">
            <span className="text-2xl">⚠️</span>
            <div>
              <div className="font-semibold">Profil collaborateur non configuré</div>
              <div className="text-sm mt-1">Pour créer des notes de frais, vous devez d'abord avoir une fiche collaborateur. 
                {isAdmin && <span> Allez dans <strong>Équipe → Nouveau collaborateur</strong> et ajoutez-vous avec votre email de connexion.</span>}
              </div>
            </div>
          </div>
        </div>
      )}
      <PageHeader title="Notes de Frais" subtitle={`${mesNotes.length} notes • ${fmtMoney(stats.totalMes)} total`}
        tabs={tabsList}
        activeTab={tab} onTabChange={setTab}
        action={<div className="flex gap-2">
          <Button variant="secondary" size="sm" onClick={exportNotes} icon="📥">Export</Button>
          <Button onClick={openNew} icon="➕" disabled={!collab}>Nouvelle note</Button>
        </div>}
      />

      {tab === 'mes' && (
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6">
          <StatCard title="Total soumis" value={fmtMoney(stats.totalMes)} icon="📋" color="blue" />
          <StatCard title="En attente" value={fmtMoney(stats.enAttente)} icon="⏳" color="amber" />
          <StatCard title="Approuvé" value={fmtMoney(stats.approuve)} icon="✅" color="green" />
          <StatCard title="Remboursé" value={fmtMoney(stats.rembourse)} icon="💰" color="purple" />
        </div>
      )}

      {loading ? <Loader /> : (
        <Card>
          <Table columns={[
            {header: 'Référence', render: r => <div><div className="font-medium">{r.reference}</div><div className="text-xs text-slate-400">{fmtDate(r.date_frais)}</div></div>},
            {header: 'Type', render: r => {
              const t = EXPENSE_TYPES.find(x => x.value === r.type_frais);
              return <span>{t?.icon} {t?.label}</span>;
            }},
            {header: 'Mission', render: r => r.projets?.code || <span className="text-slate-400">-</span>},
            {header: 'Description', render: r => <span className="text-sm truncate max-w-xs">{r.description || '-'}</span>},
            {header: 'Montant', render: r => <span className="font-bold">{fmtMoney(r.montant)}</span>},
            {header: 'Justif.', render: r => r.justificatif_url ? (
              <a href={r.justificatif_url} target="_blank" className="text-blue-600 hover:underline">📎 Voir</a>
            ) : <Badge color="gray">-</Badge>},
            {header: 'Statut', render: r => <Badge color={EXPENSE_STATUS[r.statut]?.color}>{EXPENSE_STATUS[r.statut]?.label}</Badge>}
          ]} data={displayNotes} actions={r => (
            <div className="flex gap-1">
              {r.statut === 'draft' && r.collaborateur_id === collab?.id && (<>
                <Button variant="ghost" size="xs" onClick={() => openEdit(r)} title="Modifier">✏️</Button>
                <Button variant="ghost" size="xs" onClick={() => submitNote(r)} title="Soumettre">📤</Button>
                <Button variant="ghost" size="xs" onClick={() => deleteNote(r)} title="Supprimer">🗑️</Button>
              </>)}
              {r.statut === 'submitted' && tab === 'valider' && (<>
                <Button variant="success" size="xs" onClick={() => approveNote(r)} title="Approuver">✓</Button>
                <Button variant="danger" size="xs" onClick={() => rejectNote(r)} title="Refuser">✗</Button>
              </>)}
              {r.statut === 'approved' && tab === 'approuvees' && (
                <Button variant="ghost" size="xs" onClick={() => markPaid(r)} title="Marquer remboursé">💰</Button>
              )}
            </div>
          )} empty="Aucune note de frais" />
        </Card>
      )}

      {/* Modal Note de frais */}
      <Modal isOpen={modal === 'note'} onClose={() => setModal(null)} title={editItem ? 'Modifier note de frais' : 'Nouvelle note de frais'}>
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4">
            <Input label="Référence" value={form.reference} onChange={v => setForm(p => ({...p, reference: v}))} disabled={!!editItem} />
            <Input label="Date" type="date" value={form.date_frais} onChange={v => setForm(p => ({...p, date_frais: v}))} required />
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Select label="Type de frais" value={form.type_frais} onChange={v => setForm(p => ({...p, type_frais: v}))} options={EXPENSE_TYPES.map(t => ({value: t.value, label: t.icon + ' ' + t.label}))} />
            <Select label="Mission (optionnel)" value={form.projet_id} onChange={v => setForm(p => ({...p, projet_id: v}))} options={missions.map(m => ({value: m.id, label: m.code + ' - ' + m.nom}))} placeholder="Non lié à une mission" />
          </div>
          <Input label="Description" value={form.description} onChange={v => setForm(p => ({...p, description: v}))} placeholder="Ex: Taxi client SONATEL, Déjeuner équipe projet..." />
          <div className="grid grid-cols-2 gap-4">
            <Input label="Montant (FCFA)" type="number" value={form.montant} onChange={v => setForm(p => ({...p, montant: v}))} required />
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1">Justificatif (image/PDF)</label>
              <input 
                type="file" 
                accept="image/*,.pdf"
                onChange={async (e) => {
                  const file = e.target.files?.[0];
                  if (!file) return;
                  // Upload vers Supabase Storage
                  const fileName = `${org.id}/${user.id}/${Date.now()}_${file.name}`;
                  const {data, error} = await supabase.storage.from('justificatifs').upload(fileName, file);
                  if (error) {
                    alert('Erreur upload: ' + error.message);
                    return;
                  }
                  const {data: urlData} = supabase.storage.from('justificatifs').getPublicUrl(fileName);
                  setForm(p => ({...p, justificatif_url: urlData.publicUrl}));
                  alert('✅ Fichier uploadé !');
                }}
                className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-600 file:cursor-pointer"
              />
              {form.justificatif_url && (
                <a href={form.justificatif_url} target="_blank" className="text-xs text-blue-600 hover:underline mt-1 block">📎 Voir le fichier</a>
              )}
            </div>
          </div>
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button>
            <Button onClick={save} loading={saving} className="flex-1">{editItem ? 'Modifier' : 'Créer'}</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};

// ========== SOUS-TRAITANCE PAGE ==========
const SoustraitancePage = () => {
  const {org} = useApp();
  const [prestataires, setPrestataires] = useState([]);
  const [missions, setMissions] = useState([]);
  const [contrats, setContrats] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('presta');
  const [modal, setModal] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);

  useEffect(() => { loadData(); }, []);
  const loadData = async () => {
    const [p, m, c] = await Promise.all([
      supabase.from('prestataires').select('*').eq('organisation_id', org.id).order('nom'),
      supabase.from('projets').select('id,nom,code').eq('organisation_id', org.id),
      supabase.from('contrats_soustraitance').select('*,prestataires(nom),projets(nom,code)').eq('organisation_id', org.id)
    ]);
    setPrestataires(p.data || []); setMissions(m.data || []); setContrats(c.data || []); setLoading(false);
  };

  // Prestataire CRUD
  const openNewPresta = () => { setEditItem(null); setForm({code: genCode('PRE'), nom: '', prenom: '', type: 'entreprise', ninea: '', adresse: '', email: '', telephone: '', rib: '', specialite: ''}); setModal('presta'); };
  const openEditPresta = (p) => { setEditItem(p); setForm({...p}); setModal('presta'); };
  const savePresta = async () => {
    if (!form.nom) return alert('Nom requis');
    setSaving(true);
    try {
      if (editItem?.id) await supabase.from('prestataires').update(form).eq('id', editItem.id);
      else await supabase.from('prestataires').insert([{...form, organisation_id: org.id}]);

const IntercoPage = () => {

  const [missions, setMissions] = useState([]);

  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);

  useEffect(() => { loadData(); }, []);
  const loadData = async () => {
    const [t, d, m] = await Promise.all([
      supabase.from('transactions_interco').select('*').eq('organisation_id', org.id).order('created_at', {ascending: false}),
      supabase.from('departements').select('*').eq('organisation_id', org.id),
      supabase.from('projets').select('id,nom,code').eq('organisation_id', org.id)
    ]);
    setTransactions(t.data || []); setDepts(d.data || []); setMissions(m.data || []); setLoading(false);
  };

  const openNew = () => { 
    setEditItem(null);
    setForm({dept_vendeur: '', dept_acheteur: '', projet_id: '', description: '', montant: 0, date: today()}); 
    setModal(true); 
  };
  
  const openEdit = (t) => {
    setEditItem(t);
    setForm({
      dept_vendeur: t.dept_vendeur || '',
      dept_acheteur: t.dept_acheteur || '',
      projet_id: t.projet_id || '',
      description: t.description || '',
      montant: t.montant || 0,
      date: t.date || today()
    });
    setModal(true);
  };
  
  const save = async () => {
    if (!form.dept_vendeur || !form.dept_acheteur) return alert('Départements requis');

    try { 
      const data = {
        dept_vendeur: form.dept_vendeur,
        dept_acheteur: form.dept_acheteur,
        projet_id: form.projet_id || null,
        description: form.description || '',

        date: form.date
      };
      
      let result;
      if (editItem?.id) {
        result = await supabase.from('transactions_interco').update(data).eq('id', editItem.id);
      } else {
        result = await supabase.from('transactions_interco').insert([{...data, organisation_id: org.id}]);

      if (result.error) throw result.error;
      setModal(false); loadData(); 
    }
    catch(e) { alert('Erreur: ' + e.message); }
    setSaving(false);
  };
  
  const deleteTransaction = async (t) => {
    if (!confirm('Supprimer cette transaction ?')) return;
    await supabase.from('transactions_interco').delete().eq('id', t.id);

  };

  const totalVentes = transactions.reduce((s, t) => s + (t.montant || 0), 0);

            {header: 'Acheteur', getValue: r => depts.find(d => d.id === r.dept_acheteur)?.nom || ''},
            {header: 'Description', key: 'description'},
            {header: 'Montant', key: 'montant'},
            {header: 'Date', key: 'date'}
          ], 'interco')}>📥 Export</Button>
          <Button onClick={openNew} icon="➕">Transaction</Button>
        </div>} 
      />
      {loading ? <Loader /> : (
        <Card>
          <Table columns={[
            {header: 'Vendeur', render: r => <Badge color="green">{depts.find(d => d.id === r.dept_vendeur)?.nom || '-'}</Badge>},
            {header: 'Acheteur', render: r => <Badge color="blue">{depts.find(d => d.id === r.dept_acheteur)?.nom || '-'}</Badge>},
            {header: 'Mission', render: r => {
              const m = missions.find(x => x.id === r.projet_id);
              return m ? <span className="text-sm">{m.code}</span> : '-';
            }},
            {header: 'Description', key: 'description'},
            {header: 'Montant', render: r => <span className="font-bold">{fmtMoney(r.montant)}</span>},
            {header: 'Date', render: r => fmtDate(r.date)}
          ]} data={transactions} actions={r => (
            <div className="flex gap-1">
              <Button variant="ghost" size="xs" onClick={() => openEdit(r)}>✏️</Button>
              <Button variant="ghost" size="xs" onClick={() => deleteTransaction(r)}>🗑️</Button>
            </div>
          )} empty="Aucune transaction interco" />
        </Card>
      )}
      <Modal isOpen={modal} onClose={() => setModal(false)} title={editItem ? 'Modifier transaction' : 'Nouvelle transaction interco'}>
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4">
            <Select label="Département vendeur" value={form.dept_vendeur} onChange={v => setForm(p => ({...p, dept_vendeur: v}))} options={depts.map(d => ({value: d.id, label: d.nom}))} placeholder="Sélectionner" required />

          <Input label="Description" value={form.description} onChange={v => setForm(p => ({...p, description: v}))} placeholder="Ex: Heures de conseil, Formation..." />
          <div className="grid grid-cols-2 gap-4">
            <Input label="Montant (FCFA)" type="number" value={form.montant} onChange={v => setForm(p => ({...p, montant: v}))} />

const PromotionsTab = ({org, collaborateurs, grades}) => {
  const [passages, setPassages] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);

  useEffect(() => { loadPassages(); }, []);

  const loadPassages = async () => {
    const {data} = await supabase.from('passages_grade').select('*').eq('organisation_id', org.id).order('date_effet', {ascending: false});
    setPassages(data || []);
    setLoading(false);
  };

  const openNew = () => {
    setForm({collaborateur_id: '', ancien_grade_id: '', nouveau_grade_id: '', date_effet: today(), motif: ''});
    setModal(true);
  };

  const handleCollabChange = (collabId) => {
    const collab = collaborateurs.find(c => c.id === collabId);
    setForm(p => ({...p, collaborateur_id: collabId, ancien_grade_id: collab?.grade_id || ''}));
  };

  const save = async () => {
    if (!form.collaborateur_id || !form.nouveau_grade_id) return alert('Collaborateur et nouveau grade requis');
    setSaving(true);
    try {
      // Enregistrer le passage
      const {error: e1} = await supabase.from('passages_grade').insert([{
        organisation_id: org.id,
        collaborateur_id: form.collaborateur_id,
        ancien_grade_id: form.ancien_grade_id || null,
        nouveau_grade_id: form.nouveau_grade_id,
        date_effet: form.date_effet,
        motif: form.motif
      }]);
      if (e1) throw e1;

      // Mettre à jour le grade du collaborateur
      const grade = grades.find(g => g.id === form.nouveau_grade_id);
      const {error: e2} = await supabase.from('collaborateurs').update({
        grade_id: form.nouveau_grade_id, 
        taux_journalier: grade?.taux_journalier || 0
      }).eq('id', form.collaborateur_id);
      if (e2) throw e2;

      setModal(false); 
      loadPassages();
    } catch(e) { alert('Erreur: ' + e.message); }
    setSaving(false);
  };

  const getCollab = (id) => collaborateurs.find(c => c.id === id);
  const getGrade = (id) => grades.find(g => g.id === id);

  if (loading) return <Loader />;

  return (
    <div className="space-y-4">
      <Card>
        <div className="flex justify-between items-center mb-4">
          <h3 className="font-semibold">Historique des promotions</h3>
          <Button onClick={openNew} icon="➕" size="sm">Nouvelle promotion</Button>
        </div>

        {passages.length === 0 ? (
          <EmptyState icon="🎖️" title="Aucune promotion" description="Enregistrez les passages de grade ici" />
        ) : (
          <Table columns={[
            {header: 'Collaborateur', render: r => {
              const c = getCollab(r.collaborateur_id);
              return c ? <span className="font-medium">{c.prenom} {c.nom}</span> : '-';
            }},
            {header: 'Ancien grade', render: r => {
              const g = getGrade(r.ancien_grade_id);
              return g ? <Badge color="gray">{g.nom}</Badge> : <span className="text-slate-400">-</span>;
            }},
            {header: '', render: () => <span className="text-green-500">→</span>},
            {header: 'Nouveau grade', render: r => {
              const g = getGrade(r.nouveau_grade_id);
              return g ? <Badge color="green">{g.nom}</Badge> : '-';
            }},
            {header: 'Date effet', render: r => fmtDate(r.date_effet)},
            {header: 'Motif', render: r => <span className="text-sm text-slate-500">{r.motif || '-'}</span>}
          ]} data={passages} />
        )}
      </Card>

      {/* Statistiques */}
      <div className="grid grid-cols-3 gap-4">
        <StatCard title="Promotions ce mois" value={passages.filter(p => p.date_effet?.startsWith(today().substring(0, 7))).length} icon="🎖️" color="green" />
        <StatCard title="Total promotions" value={passages.length} icon="📈" color="blue" />
        <StatCard title="Collaborateurs promouvables" value={collaborateurs.filter(c => c.actif).length} icon="👥" color="purple" />
      </div>

      {/* Modal nouvelle promotion */}
      <Modal isOpen={modal} onClose={() => setModal(false)} title="Nouvelle promotion" size="md">
        <div className="space-y-4">
          <Select label="Collaborateur" value={form.collaborateur_id} onChange={handleCollabChange} 
            options={collaborateurs.filter(c => c.actif).map(c => ({value: c.id, label: c.prenom + ' ' + c.nom}))} 
            placeholder="Sélectionner" required />
          
          {form.collaborateur_id && (
            <div className="p-4 bg-slate-50 rounded-xl">
              <div className="text-sm text-slate-500">Grade actuel</div>
              <div className="font-bold">{getGrade(form.ancien_grade_id)?.nom || 'Non défini'}</div>
            </div>
          )}

          <Select label="Nouveau grade" value={form.nouveau_grade_id} onChange={v => setForm(p => ({...p, nouveau_grade_id: v}))} 
            options={grades.filter(g => g.id !== form.ancien_grade_id).map(g => ({value: g.id, label: g.nom + ' (' + fmt(g.taux_journalier) + ' F/j)'}))} 
            placeholder="Sélectionner" required />

          <Input label="Date d'effet" type="date" value={form.date_effet} onChange={v => setForm(p => ({...p, date_effet: v}))} />
          <TextArea label="Motif" value={form.motif} onChange={v => setForm(p => ({...p, motif: v}))} rows={2} placeholder="Promotion annuelle, performance exceptionnelle..." />

          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(false)} className="flex-1">Annuler</Button>
            <Button onClick={save} loading={saving} className="flex-1">Valider promotion</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};
