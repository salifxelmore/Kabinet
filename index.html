  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [uploading, setUploading] = useState(false);
  
  // Config vidéo
  const [videoConfig, setVideoConfig] = useState({video_demo_url: ''});
  const [savingVideo, setSavingVideo] = useState(false);

  useEffect(() => { loadLogos(); loadConfig(); }, []);

  const loadLogos = async () => {
    const {data} = await supabase.from('landing_logos').select('*').order('position');
    setLogos(data || []);
    setLoading(false);
  };
  
  const loadConfig = async () => {
    const {data} = await supabase.from('landing_config').select('*').single();
    if (data) setVideoConfig(data);
  };
  
  const saveVideoConfig = async () => {
    setSavingVideo(true);
    try {
      // Vérifier si une config existe déjà
      const {data: existing} = await supabase.from('landing_config').select('id').single();
      
      if (existing?.id) {
        await supabase.from('landing_config').update({video_demo_url: videoConfig.video_demo_url}).eq('id', existing.id);
      } else {
        await supabase.from('landing_config').insert([{video_demo_url: videoConfig.video_demo_url}]);
      }
      alert('Configuration enregistrée !');
    } catch(e) {
      alert('Erreur: ' + e.message);
    }
    setSavingVideo(false);
  };

  const openNew = () => {
    setEditItem(null);
    setForm({
      nom: '',
      description: '',
      logo_url: '',
      position: logos.length + 1,
      actif: true
    });
    setModal(true);
  };

  const openEdit = (item) => {
    setEditItem(item);
    setForm({...item});
    setModal(true);
  };

  const uploadLogo = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    
    if (file.size > 2 * 1024 * 1024) {
      alert('Le fichier est trop volumineux (max 2 Mo)');
      return;
    }
    
    setUploading(true);
    try {
      const ext = file.name.split('.').pop();
      const fileName = `landing-logos/${Date.now()}_${Math.random().toString(36).substr(2, 9)}.${ext}`;
      
      const {error: uploadError} = await supabase.storage
        .from('documents')
        .upload(fileName, file);
      
      if (uploadError) throw uploadError;
      
      const {data: urlData} = supabase.storage
        .from('documents')
        .getPublicUrl(fileName);
      
      setForm(p => ({...p, logo_url: urlData.publicUrl}));
    } catch(err) {
      alert('Erreur upload: ' + err.message);
    }
    setUploading(false);
  };

  const save = async () => {
    if (!form.nom) return alert('Nom requis');
    setSaving(true);
    try {
      const data = {
        nom: form.nom,
        description: form.description || '',
        logo_url: form.logo_url || '',
        position: parseInt(form.position) || 1,
        actif: form.actif !== false
      };

      if (editItem?.id) {
        const {error} = await supabase.from('landing_logos').update(data).eq('id', editItem.id);
        if (error) throw error;
      } else {
        const {error} = await supabase.from('landing_logos').insert([data]);
        if (error) throw error;
      }
      setModal(false);
      loadLogos();
    } catch(e) {
      alert('Erreur: ' + e.message);
    }
    setSaving(false);
  };

  const deleteLogo = async (item) => {
    if (!confirm(`Supprimer "${item.nom}" ?`)) return;
    await supabase.from('landing_logos').delete().eq('id', item.id);
    loadLogos();
  };

  const toggleActif = async (item) => {
    await supabase.from('landing_logos').update({actif: !item.actif}).eq('id', item.id);
    loadLogos();
  };

  // Générer un logo SVG par défaut basé sur le nom
  const generateDefaultLogo = (nom) => {
    const colors = ['#3B82F6', '#10B981', '#8B5CF6', '#F59E0B', '#EF4444', '#0EA5E9', '#EC4899', '#14B8A6'];
    const color = colors[nom.length % colors.length];
    const initials = nom.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
    return `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="8" fill="${color}" opacity="0.2"/><rect x="4" y="4" width="32" height="32" rx="6" fill="${color}"/><text x="20" y="26" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">${initials}</text></svg>`)}`;
  };

  return (
    <div className="space-y-6">
      {/* Configuration Vidéo Démo */}
      <Card title="🎬 Vidéo de démonstration">
        <div className="max-w-2xl space-y-4">
          <div className="p-4 bg-amber-50 rounded-xl">
            <div className="flex items-start gap-3">
              <span className="text-xl">💡</span>
              <div className="text-sm text-amber-700">
                <p className="font-medium mb-1">Cette vidéo s'affichera quand les visiteurs cliquent sur "Voir la démo".</p>
                <p>Vous pouvez utiliser une URL YouTube ou un lien direct vers un fichier vidéo (.mp4).</p>
              </div>
            </div>
          </div>
          
          <Input 
            label="URL de la vidéo démo" 
            value={videoConfig.video_demo_url || ''} 
            onChange={v => setVideoConfig(p => ({...p, video_demo_url: v}))} 
            placeholder="https://www.youtube.com/watch?v=... ou https://exemple.com/demo.mp4"
          />
          
          {/* Prévisualisation */}
          {videoConfig.video_demo_url && (
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-2">Prévisualisation</label>
              {videoConfig.video_demo_url.includes('youtube.com') || videoConfig.video_demo_url.includes('youtu.be') ? (
                <div className="relative pt-[56.25%] bg-black rounded-xl overflow-hidden">
                  <iframe 
                    className="absolute inset-0 w-full h-full"
                    src={`https://www.youtube.com/embed/${videoConfig.video_demo_url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/)?.[1] || ''}`}
                    title="Prévisualisation"
                    frameBorder="0"
                    allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  ></iframe>
                </div>
              ) : (
                <video 
                  className="w-full rounded-xl max-h-[300px]" 
                  controls
                  src={videoConfig.video_demo_url}
                >
                  Votre navigateur ne supporte pas la lecture vidéo.
                </video>
              )}
            </div>
          )}
          
          <Button onClick={saveVideoConfig} loading={savingVideo} icon="💾">
            Enregistrer la vidéo
          </Button>
        </div>
      </Card>
      
      {/* Logos clients */}
      <Card title="🏢 Logos des clients (Landing Page)" 
        action={<Button onClick={openNew} icon="➕">Ajouter un client</Button>}>
        
        <div className="mb-6 p-4 bg-blue-50 rounded-xl">
          <div className="flex items-start gap-3">
            <span className="text-xl">💡</span>
            <div className="text-sm text-blue-700">
              <p className="font-medium mb-1">Ces logos s'afficheront sur la landing page dans la section "Conçu pour les cabinets de conseil africains".</p>
              <p>Vous pouvez uploader le logo de vos vrais clients ou utiliser le logo généré automatiquement.</p>
            </div>
          </div>
        </div>

        {loading ? <Loader /> : (
          <>
            {logos.length === 0 ? (
              <EmptyState 
                icon="🏢" 
                title="Aucun logo configuré" 
                description="Ajoutez les logos de vos clients pour les afficher sur la landing page."
                action={<Button onClick={openNew} icon="➕">Ajouter un client</Button>}
              />
            ) : (
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                {logos.map(logo => (
                  <div 
                    key={logo.id} 
                    className={cn(
                      "p-4 rounded-xl border-2 transition-all",
                      logo.actif ? "border-slate-200 bg-white" : "border-dashed border-slate-300 bg-slate-50 opacity-60"
                    )}
                  >
                    <div className="flex items-center gap-3 mb-3">
                      <img 
                        src={logo.logo_url || generateDefaultLogo(logo.nom)} 
                        alt={logo.nom} 
                        className="w-10 h-10 rounded-lg object-contain"
                      />
                      <div className="flex-1 min-w-0">
                        <div className="font-bold text-sm truncate">{logo.nom}</div>
                        <div className="text-xs text-slate-400 truncate">{logo.description || '-'}</div>
                      </div>
                    </div>
                    <div className="flex items-center justify-between">
                      <Badge color={logo.actif ? 'green' : 'slate'}>
                        {logo.actif ? 'Actif' : 'Masqué'}
                      </Badge>
                      <div className="flex gap-1">
                        <Button variant="ghost" size="xs" onClick={() => toggleActif(logo)} title={logo.actif ? 'Masquer' : 'Afficher'}>
                          {logo.actif ? '👁️' : '👁️‍🗨️'}
                        </Button>
                        <Button variant="ghost" size="xs" onClick={() => openEdit(logo)}>✏️</Button>
                        <Button variant="ghost" size="xs" onClick={() => deleteLogo(logo)}>🗑️</Button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </>
        )}
      </Card>

      {/* Prévisualisation */}
      {logos.filter(l => l.actif).length > 0 && (
        <Card title="Prévisualisation">
          <div className="p-6 bg-slate-50 rounded-xl">
            <p className="text-center text-slate-400 text-sm mb-6">Conçu pour les cabinets de conseil africains</p>
            <div className="flex flex-wrap justify-center items-center gap-8">
              {logos.filter(l => l.actif).map(logo => (
                <div key={logo.id} className="flex items-center gap-2 opacity-70 hover:opacity-100 transition-opacity">
                  <img 
                    src={logo.logo_url || generateDefaultLogo(logo.nom)} 
                    alt={logo.nom} 
                    className="w-9 h-9 rounded-lg object-contain"
                  />
                  <div>
                    <div className="text-lg font-bold text-slate-700 tracking-tight">{logo.nom}</div>
                    <div className="text-[10px] text-slate-400 -mt-1 uppercase">{logo.description}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </Card>
      )}

      {/* Modal */}
      <Modal isOpen={modal} onClose={() => setModal(false)} title={editItem ? 'Modifier le client' : 'Ajouter un client'}>
        <div className="space-y-4">
          <Input 
            label="Nom du cabinet" 
            value={form.nom} 
            onChange={v => setForm(p => ({...p, nom: v}))} 
            placeholder="Ex: FIDECA" 
            required 
          />
          <Input 
            label="Description / Spécialité" 
            value={form.description} 
            onChange={v => setForm(p => ({...p, description: v}))} 
            placeholder="Ex: Expertise Comptable" 
          />
          
          {/* Upload logo */}
          <div>
            <label className="block text-sm font-medium text-slate-700 mb-2">Logo (optionnel)</label>
            <div className="flex items-center gap-4">
              <img 
                src={form.logo_url || (form.nom ? generateDefaultLogo(form.nom) : 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" rx="8" fill="%23e2e8f0"/></svg>')} 
                alt="Logo" 
                className="w-16 h-16 rounded-xl object-contain border border-slate-200 bg-white"
              />
              <div className="flex-1">
                <input 
                  type="file" 
                  accept="image/*"
                  onChange={uploadLogo}
                  disabled={uploading}
                  className="text-sm file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-600 file:cursor-pointer"
                />
                <p className="text-xs text-slate-500 mt-1">
                  {uploading ? '⏳ Upload en cours...' : 'PNG, JPG (max 2MB) - Laissez vide pour un logo auto-généré'}
                </p>
                {form.logo_url && (
                  <button 
                    onClick={() => setForm(p => ({...p, logo_url: ''}))} 
                    className="text-xs text-red-500 hover:underline mt-1"
                  >
                    Supprimer le logo uploadé
                  </button>
                )}
              </div>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-4">
            <Input 
              label="Position" 
              type="number" 
              value={form.position} 
              onChange={v => setForm(p => ({...p, position: v}))} 
              min={1}
            />
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-2">Statut</label>
              <Checkbox 
                label="Afficher sur la landing page" 
                checked={form.actif !== false} 
                onChange={v => setForm(p => ({...p, actif: v}))} 
              />
            </div>
          </div>
          
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(false)} className="flex-1">Annuler</Button>
            <Button onClick={save} loading={saving} className="flex-1">{editItem ? 'Enregistrer' : 'Ajouter'}</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};

// ========== AUDIT LOGS PAGE ==========
const AuditLogsPage = () => {
  const {org} = useApp();
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filters, setFilters] = useState({
    action: '',
    table_name: '',
    user_id: '',
    date_from: '',
    date_to: ''
  });
  const [users, setUsers] = useState([]);
  const [tables, setTables] = useState([]);
  const [selectedLog, setSelectedLog] = useState(null);
  const [page, setPage] = useState(0);
  const pageSize = 50;

  useEffect(() => { loadLogs(); loadFiltersData(); }, []);

  const loadFiltersData = async () => {
    // Charger les utilisateurs uniques
    const {data: logsData} = await supabase
      .from('audit_logs')
      .select('user_id, table_name')
      .eq('organisation_id', org.id);
    
    if (logsData) {
      const uniqueUsers = [...new Set(logsData.map(l => l.user_id).filter(Boolean))];
      const uniqueTables = [...new Set(logsData.map(l => l.table_name).filter(Boolean))];
      setTables(uniqueTables.sort());
      
      // Charger les noms des collaborateurs
      if (uniqueUsers.length > 0) {
        const {data: collabs} = await supabase
          .from('collaborateurs')
          .select('user_id, nom, prenom')
          .in('user_id', uniqueUsers);
        setUsers(collabs || []);
      }
    }
  };

  const loadLogs = async () => {
    setLoading(true);
    let query = supabase
      .from('audit_logs')
      .select('*', {count: 'exact'})
      .eq('organisation_id', org.id)
      .order('created_at', {ascending: false})
      .range(page * pageSize, (page + 1) * pageSize - 1);
    
    if (filters.action) query = query.eq('action', filters.action);
    if (filters.table_name) query = query.eq('table_name', filters.table_name);
    if (filters.user_id) query = query.eq('user_id', filters.user_id);
    if (filters.date_from) query = query.gte('created_at', filters.date_from);
    if (filters.date_to) query = query.lte('created_at', filters.date_to + 'T23:59:59');
    
    const {data, count} = await query;
    setLogs(data || []);
    setLoading(false);
  };

  useEffect(() => { loadLogs(); }, [filters, page]);

  const getUserName = (userId) => {
    const user = users.find(u => u.user_id === userId);
    return user ? `${user.prenom} ${user.nom}` : userId?.substring(0, 8) || 'Système';
  };

  const getActionBadge = (action) => {
    const styles = {
      'INSERT': {color: 'green', label: 'Création'},
      'UPDATE': {color: 'blue', label: 'Modification'},
      'DELETE': {color: 'red', label: 'Suppression'}
    };
    const s = styles[action] || {color: 'slate', label: action};
    return <Badge color={s.color}>{s.label}</Badge>;
  };

  const getTableLabel = (table) => {
    const labels = {
      'clients': 'Clients',
      'collaborateurs': 'Collaborateurs',
      'projets': 'Missions',
      'factures': 'Factures',
      'conges': 'Congés',
      'notes_frais': 'Notes de frais',
      'saisies_temps': 'Temps',
      'opportunites': 'Opportunités'
    };
    return labels[table] || table;
  };

  const formatDateTime = (dt) => {
    if (!dt) return '-';
    const d = new Date(dt);
    return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
  };

  const getChangeSummary = (log) => {
    if (log.action === 'INSERT') {
      const name = log.new_data?.nom || log.new_data?.code || log.new_data?.libelle || '';
      return name ? `"${name}"` : 'Nouvel enregistrement';
    }
    if (log.action === 'DELETE') {
      const name = log.old_data?.nom || log.old_data?.code || log.old_data?.libelle || '';
      return name ? `"${name}"` : 'Enregistrement supprimé';
    }
    if (log.action === 'UPDATE' && log.old_data && log.new_data) {
      const changes = [];
      Object.keys(log.new_data).forEach(key => {
        if (JSON.stringify(log.old_data[key]) !== JSON.stringify(log.new_data[key])) {
          if (!['updated_at', 'created_at'].includes(key)) {
            changes.push(key);
          }
        }
      });
      return changes.length > 0 ? `Champs: ${changes.slice(0, 3).join(', ')}${changes.length > 3 ? '...' : ''}` : 'Mise à jour';
    }
    return '-';
  };

  const clearFilters = () => {
    setFilters({action: '', table_name: '', user_id: '', date_from: '', date_to: ''});
    setPage(0);
  };

  return (
    <div>
      <PageHeader 
        title="Audit Logs" 
        subtitle={`Historique des actions • ${logs.length} entrées`}
        action={
          <Button variant="secondary" size="sm" onClick={() => exportToExcel(logs, [
            {header: 'Date', getValue: r => formatDateTime(r.created_at)},
            {header: 'Utilisateur', getValue: r => getUserName(r.user_id)},
            {header: 'Action', key: 'action'},
            {header: 'Table', getValue: r => getTableLabel(r.table_name)},
            {header: 'Détails', getValue: r => getChangeSummary(r)}
          ], 'audit-logs')}>
            📥 Export Excel
          </Button>
        }
      />

      {/* Filtres */}
      <Card className="mb-6">
        <div className="flex flex-wrap gap-4 items-end">
          <Select 
            label="Action" 
            value={filters.action} 
            onChange={v => { setFilters(p => ({...p, action: v})); setPage(0); }}
            options={[
              {value: '', label: 'Toutes'},
              {value: 'INSERT', label: '🟢 Création'},
              {value: 'UPDATE', label: '🔵 Modification'},
              {value: 'DELETE', label: '🔴 Suppression'}
            ]}
            className="w-40"
          />
          <Select 
            label="Table" 
            value={filters.table_name} 
            onChange={v => { setFilters(p => ({...p, table_name: v})); setPage(0); }}
            options={[{value: '', label: 'Toutes'}, ...tables.map(t => ({value: t, label: getTableLabel(t)}))]}
            className="w-40"
          />
          <Select 
            label="Utilisateur" 
            value={filters.user_id} 
            onChange={v => { setFilters(p => ({...p, user_id: v})); setPage(0); }}
            options={[{value: '', label: 'Tous'}, ...users.map(u => ({value: u.user_id, label: `${u.prenom} ${u.nom}`}))]}
            className="w-48"
          />
          <Input 
            label="Du" 
            type="date" 
            value={filters.date_from} 
            onChange={v => { setFilters(p => ({...p, date_from: v})); setPage(0); }}
            className="w-36"
          />
          <Input 
            label="Au" 
            type="date" 
            value={filters.date_to} 
            onChange={v => { setFilters(p => ({...p, date_to: v})); setPage(0); }}
            className="w-36"
          />
          <Button variant="ghost" size="sm" onClick={clearFilters}>✕ Effacer</Button>
        </div>
      </Card>

      {/* Table des logs */}
      {loading ? <Loader /> : (
        <Card>
          {logs.length === 0 ? (
            <EmptyState 
              icon="📋" 
              title="Aucun log trouvé" 
              description="Les actions sur les données seront enregistrées ici automatiquement."
            />
          ) : (
            <>
              <Table 
                columns={[
                  {header: 'Date', render: r => (
                    <span className="text-sm text-slate-600">{formatDateTime(r.created_at)}</span>
                  )},
                  {header: 'Utilisateur', render: r => (
                    <span className="font-medium">{getUserName(r.user_id)}</span>
                  )},
                  {header: 'Action', render: r => getActionBadge(r.action)},
                  {header: 'Table', render: r => (
                    <span className="text-sm bg-slate-100 px-2 py-1 rounded">{getTableLabel(r.table_name)}</span>
                  )},
                  {header: 'Résumé', render: r => (
                    <span className="text-sm text-slate-500">{getChangeSummary(r)}</span>
                  )}
                ]}
                data={logs}
                actions={r => (
                  <Button variant="ghost" size="xs" onClick={() => setSelectedLog(r)}>🔍</Button>
                )}
              />
              
              {/* Pagination */}
              <div className="flex items-center justify-between mt-4 pt-4 border-t">
                <span className="text-sm text-slate-500">
                  Page {page + 1} • {logs.length} résultats affichés
                </span>
                <div className="flex gap-2">
                  <Button 
                    variant="secondary" 
                    size="sm" 
                    onClick={() => setPage(p => Math.max(0, p - 1))}
                    disabled={page === 0}
                  >
                    ← Précédent
                  </Button>
                  <Button 
                    variant="secondary" 
                    size="sm" 
                    onClick={() => setPage(p => p + 1)}
                    disabled={logs.length < pageSize}
                  >
                    Suivant →
                  </Button>
                </div>
              </div>
            </>
          )}
        </Card>
      )}

      {/* Modal détail */}
      <Modal isOpen={!!selectedLog} onClose={() => setSelectedLog(null)} title="Détail de l'action" size="lg">
        {selectedLog && (
          <div className="space-y-4">
            {/* Info générales */}
            <div className="grid grid-cols-2 gap-4 p-4 bg-slate-50 rounded-xl">
              <div>
                <p className="text-xs text-slate-500">Date</p>
                <p className="font-medium">{formatDateTime(selectedLog.created_at)}</p>
              </div>
              <div>
                <p className="text-xs text-slate-500">Utilisateur</p>
                <p className="font-medium">{getUserName(selectedLog.user_id)}</p>
              </div>
              <div>
                <p className="text-xs text-slate-500">Action</p>
                {getActionBadge(selectedLog.action)}
              </div>
              <div>
                <p className="text-xs text-slate-500">Table</p>
                <p className="font-medium">{getTableLabel(selectedLog.table_name)}</p>
              </div>
              <div className="col-span-2">
                <p className="text-xs text-slate-500">ID Enregistrement</p>
                <p className="font-mono text-sm">{selectedLog.record_id}</p>
              </div>
            </div>

            {/* Données avant/après */}
            {selectedLog.action === 'UPDATE' && selectedLog.old_data && selectedLog.new_data && (
              <div>
                <h4 className="font-bold text-sm mb-2">🔄 Modifications</h4>
                <div className="bg-slate-900 rounded-xl p-4 overflow-auto max-h-64">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="text-slate-400 text-left">
                        <th className="pb-2">Champ</th>
                        <th className="pb-2">Avant</th>
                        <th className="pb-2">Après</th>
                      </tr>
                    </thead>
                    <tbody>
                      {Object.keys(selectedLog.new_data)
                        .filter(key => JSON.stringify(selectedLog.old_data[key]) !== JSON.stringify(selectedLog.new_data[key]))
                        .filter(key => !['updated_at', 'created_at'].includes(key))
                        .map(key => (
                          <tr key={key} className="border-t border-slate-700">
                            <td className="py-2 text-blue-400 font-mono">{key}</td>
                            <td className="py-2 text-red-400">{JSON.stringify(selectedLog.old_data[key])}</td>
                            <td className="py-2 text-green-400">{JSON.stringify(selectedLog.new_data[key])}</td>
                          </tr>
                        ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {selectedLog.action === 'INSERT' && selectedLog.new_data && (
              <div>
                <h4 className="font-bold text-sm mb-2">🟢 Données créées</h4>
                <pre className="bg-slate-900 text-green-400 rounded-xl p-4 text-xs overflow-auto max-h-64">
                  {JSON.stringify(selectedLog.new_data, null, 2)}
                </pre>
              </div>
            )}

            {selectedLog.action === 'DELETE' && selectedLog.old_data && (
              <div>
                <h4 className="font-bold text-sm mb-2">🔴 Données supprimées</h4>
                <pre className="bg-slate-900 text-red-400 rounded-xl p-4 text-xs overflow-auto max-h-64">
                  {JSON.stringify(selectedLog.old_data, null, 2)}
                </pre>
              </div>
            )}
          </div>
        )}
      </Modal>
    </div>
  );
};

// ========== PARAMETRES PAGE ==========
const ParametresPage = () => {
  const {org, abo, reload} = useApp();
  const [tab, setTab] = useState('org');
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [depts, setDepts] = useState([]);
  const [grades, setGrades] = useState([]);
  const [categories, setCategories] = useState([]);
  const [holidays, setHolidays] = useState([]);
  const [collaborateurs, setCollaborateurs] = useState([]);
  const [validateurs, setValidateurs] = useState([]);
  const [privileges, setPrivileges] = useState([]);
  const [budgets, setBudgets] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editModal, setEditModal] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());

  useEffect(() => { setForm({nom: org.nom, adresse: org.adresse || '', ville: org.ville || '', email: org.email || '', telephone: org.telephone || '', logo_url: org.logo_url || ''}); loadParams(); }, [org]);

  const loadParams = async () => {
    const [d, g, c, h, col, val, priv, budg] = await Promise.all([
      supabase.from('departements').select('*').eq('organisation_id', org.id).order('nom'),
      supabase.from('grades').select('*').eq('organisation_id', org.id).order('niveau', {ascending: false}),
      supabase.from('categories_taches').select('*').eq('organisation_id', org.id).order('nom'),
      supabase.from('jours_feries').select('*').eq('organisation_id', org.id).order('date'),
      supabase.from('collaborateurs').select('*,grades:grade_id(nom,niveau),departements:departement_id(nom)').eq('organisation_id', org.id).eq('actif', true).order('nom'),
      supabase.from('validateurs_departement').select('*').eq('organisation_id', org.id),
      supabase.from('privileges_speciaux').select('*').eq('organisation_id', org.id).eq('actif', true),
      supabase.from('budgets_departement').select('*').eq('organisation_id', org.id)
    ]);
    setDepts(d.data || []); 
    setGrades(g.data || []); 
    setCategories(c.data || []); 
    setHolidays(h.data || []); 
    setCollaborateurs(col.data || []);
    setPrivileges(priv.data || []);
    setBudgets(budg.data || []);
    
    // Enrichir les validateurs avec les noms des collaborateurs et départements
    const enrichedValidateurs = (val.data || []).map(v => ({
      ...v,
      collaborateur: (col.data || []).find(c => c.id === v.collaborateur_id),
      departement: (d.data || []).find(dept => dept.id === v.departement_id)
    }));
    setValidateurs(enrichedValidateurs);
    
    setLoading(false);
  };

  const saveOrg = async () => { setSaving(true); try { await supabase.from('organisations').update(form).eq('id', org.id); reload(); alert('Enregistré!'); } catch(e) { alert(e.message); } setSaving(false); };

  // Gestion des validateurs
  const addValidateur = async (type, deptId, collabId) => {
    if (!deptId || !collabId) return alert('Département et collaborateur requis');
    try {
      // Vérifier si déjà validateur
      const exists = validateurs.find(v => v.type_validation === type && v.departement_id === deptId && v.collaborateur_id === collabId);
      if (exists) return alert('Ce collaborateur est déjà validateur pour ce département');
      
      const {error} = await supabase.from('validateurs_departement').insert([{
        organisation_id: org.id,
        departement_id: deptId,
        collaborateur_id: collabId,
        type_validation: type // 'conges' ou 'frais'
      }]);
      if (error) throw error;
      loadParams();
      // Réinitialiser le formulaire
      setEditForm(p => ({...p, validateur_dept_conges: '', validateur_collab_conges: '', validateur_dept_frais: '', validateur_collab_frais: ''}));
      alert('Validateur ajouté avec succès !');
    } catch(e) { 
      console.error('Erreur ajout validateur:', e);
      alert('Erreur: ' + e.message); 
    }
  };
  
  const removeValidateur = async (id) => {
    if (!confirm('Retirer ce validateur ?')) return;
    try {
      const {error} = await supabase.from('validateurs_departement').delete().eq('id', id);
      if (error) throw error;
      loadParams();
    } catch(e) {
      console.error('Erreur suppression validateur:', e);
      alert('Erreur: ' + e.message);
    }
  };

  // CRUD générique
  const openEdit = (type, item = null) => {
    setEditModal(type);
    if (item) setEditForm({...item});
    else if (type === 'dept') setEditForm({code: '', nom: '', facturable: true, couleur: '#2563eb'});
    else if (type === 'grade') setEditForm({code: '', nom: '', niveau: 1, taux_journalier: 0, taux_cible: 80});
    else if (type === 'categorie') setEditForm({code: '', nom: '', facturable: true, couleur: '#2563eb'});
    else if (type === 'holiday') setEditForm({date: '', nom: ''});
    else if (type === 'validateur_conges') setEditForm({departement_id: '', collaborateur_id: '', type_validation: 'conges'});
    else if (type === 'validateur_frais') setEditForm({departement_id: '', collaborateur_id: '', type_validation: 'frais'});
  };

  const saveEdit = async () => {
    setSaving(true);
    try {
      let table;
      if (editModal === 'dept') table = 'departements';
      else if (editModal === 'grade') table = 'grades';
      else if (editModal === 'categorie') table = 'categories_taches';
      else if (editModal === 'holiday') table = 'jours_feries';
      else if (editModal === 'validateur_conges' || editModal === 'validateur_frais') table = 'validateurs_departement';
      
      if (editForm.id) {
        await supabase.from(table).update(editForm).eq('id', editForm.id);
      } else {
        await supabase.from(table).insert([{...editForm, organisation_id: org.id}]);
      }
      setEditModal(null); loadParams();
    } catch(e) { alert(e.message); }
    setSaving(false);
  };

  const deleteItem = async (table, id) => {
    if (!confirm('Supprimer cet élément ?')) return;
    await supabase.from(table).delete().eq('id', id);
    loadParams();
  };

  const exportData = async () => {
    const [c, p, t, f] = await Promise.all([
      supabase.from('clients').select('*').eq('organisation_id', org.id),
      supabase.from('projets').select('*').eq('organisation_id', org.id),
      supabase.from('saisies_temps').select('*').eq('organisation_id', org.id),
      supabase.from('factures').select('*').eq('organisation_id', org.id)
    ]);
    const data = {organisation: org, clients: c.data, projets: p.data, temps: t.data, factures: f.data, exportedAt: new Date().toISOString()};
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'missura_backup_' + today() + '.json'; a.click();
  };

  const joursRestants = abo?.date_fin ? Math.ceil((new Date(abo.date_fin) - new Date()) / (1000*60*60*24)) : 0;
  const isExpire = joursRestants <= 0;

  return (
    <div>
      <PageHeader title="Paramètres" />
      <Tabs tabs={[
        {key: 'org', label: '🏢 Organisation'}, 
        {key: 'abo', label: '💳 Abonnement'}, 
        {key: 'config', label: '⚙️ Configuration'}, 
        {key: 'validateurs', label: '✅ Validateurs'},
        {key: 'privileges', label: '🔐 Privilèges'},
        {key: 'budgets', label: '🎯 Budgets'},
        {key: 'landing', label: '🌐 Landing Page'},
        {key: 'backup', label: '💾 Sauvegarde'}
      ]} active={tab} onChange={setTab} />

      <div className="mt-6">
        {tab === 'org' && (
          <Card title="Informations de l'organisation">
            <div className="space-y-4 max-w-xl">
              {/* Logo */}
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-2">Logo de l'organisation</label>
                <div className="flex items-center gap-4">
                  {form.logo_url ? (
                    <img src={form.logo_url} alt="Logo" className="w-20 h-20 rounded-xl object-cover border border-slate-200" />
                  ) : (
                    <div className="w-20 h-20 rounded-xl bg-slate-100 flex items-center justify-center text-3xl text-slate-400">🏢</div>
                  )}
                  <div>
                    <input 
                      type="file" 
                      accept="image/*"
                      onChange={async (e) => {
                        const file = e.target.files?.[0];
                        if (!file) return;
                        const fileName = `logos/${org.id}_${Date.now()}.${file.name.split('.').pop()}`;
                        const {error} = await supabase.storage.from('organisations').upload(fileName, file, {upsert: true});
                        if (error) { alert('Erreur: ' + error.message); return; }
                        const {data: urlData} = supabase.storage.from('organisations').getPublicUrl(fileName);
                        setForm(p => ({...p, logo_url: urlData.publicUrl}));
                      }}
                      className="text-sm file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-600 file:cursor-pointer"
                    />
                    <p className="text-xs text-slate-500 mt-1">PNG, JPG jusqu'à 2MB</p>
                  </div>
                </div>
              </div>
              <Input label="Nom du cabinet" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} />
              <Input label="Adresse" value={form.adresse} onChange={v => setForm(p => ({...p, adresse: v}))} />
              <div className="grid grid-cols-2 gap-4"><Input label="Ville" value={form.ville} onChange={v => setForm(p => ({...p, ville: v}))} /><Input label="Téléphone" value={form.telephone} onChange={v => setForm(p => ({...p, telephone: v}))} /></div>
              <Input label="Email" type="email" value={form.email} onChange={v => setForm(p => ({...p, email: v}))} />
              <Button onClick={saveOrg} loading={saving} icon="💾">Enregistrer</Button>
            </div>
          </Card>
        )}

        {tab === 'abo' && (
          <Card title="Abonnement">
            <div className="max-w-2xl">
              <div className={cn('p-6 rounded-2xl mb-6', isExpire ? 'bg-red-50 border-2 border-red-200' : 'bg-blue-50 border-2 border-blue-200')}>
                <div className="flex items-center justify-between mb-4">
                  <div><span className="text-3xl mr-3">{PLANS[abo?.plan]?.icon}</span><span className="text-2xl font-bold">{PLANS[abo?.plan]?.nom}</span></div>
                  <Badge color={isExpire ? 'red' : 'green'}>{isExpire ? 'Expiré' : 'Actif'}</Badge>
                </div>
                {abo?.date_fin && <div className="flex justify-between text-sm"><span>Expire: <b>{fmtDate(abo.date_fin)}</b></span><span className={isExpire ? 'text-red-600 font-bold' : ''}>{isExpire ? 'Expiré' : joursRestants + ' jours restants'}</span></div>}
              </div>
              <h3 className="font-bold mb-4">Plans disponibles</h3>
              <div className="grid grid-cols-3 gap-4">
                {Object.entries(PLANS).map(([k, p]) => (
                  <div key={k} className={cn('p-4 rounded-xl border-2', abo?.plan === k ? 'border-blue-500 bg-blue-50' : 'border-slate-200')}>
                    <div className="text-2xl mb-2">{p.icon}</div><div className="font-bold">{p.nom}</div><div className="text-slate-500 text-sm">{p.prix ? fmt(p.prix) + ' F/mois' : 'Gratuit'}</div>
                    {abo?.plan === k && <Badge color="blue" className="mt-2">Actuel</Badge>}
                  </div>
                ))}
              </div>
            </div>
          </Card>
        )}

        {tab === 'config' && loading ? <Loader /> : tab === 'config' && (
          <div className="space-y-6">
            {/* Configuration calcul production */}
            <Card title="📊 Calcul de production" collapsible defaultOpen={true}>
              <p className="text-sm text-slate-500 mb-4">
                Configurez comment le système calcule la production des collaborateurs.
              </p>
              <div className="grid md:grid-cols-2 gap-6">
                <div className="p-4 bg-slate-50 rounded-xl">
                  <h4 className="font-semibold text-slate-700 mb-2">Type de taux</h4>
                  <p className="text-xs text-slate-500 mb-3">
                    Le taux utilisé pour calculer la production (Heures × Taux)
                  </p>
                  <Select 
                    value={org.config_taux_type || 'journalier'} 
                    onChange={async (v) => {
                      await supabase.from('organisations').update({config_taux_type: v}).eq('id', org.id);
                      reload();
                    }}
                    options={[
                      {value: 'journalier', label: 'Taux journalier ÷ 8h'},
                      {value: 'horaire', label: 'Taux horaire direct'}
                    ]} 
                  />
                  <div className="mt-3 p-3 bg-white rounded-lg text-xs text-slate-600">
                    {(org.config_taux_type || 'journalier') === 'journalier' ? (
                      <>
                        <b>Taux journalier ÷ 8h :</b><br/>
                        Ex: Taux jour = 400 000 FCFA → Taux horaire = 50 000 FCFA/h<br/>
                        Production = 37h × 50 000 = 1 850 000 FCFA
                      </>
                    ) : (
                      <>
                        <b>Taux horaire direct :</b><br/>
                        Le taux configuré dans les grades est déjà le taux horaire.<br/>
                        Production = Heures × Taux horaire
                      </>
                    )}
                  </div>
                </div>
                <div className="p-4 bg-blue-50 rounded-xl">
                  <h4 className="font-semibold text-blue-700 mb-2">💡 Conseil</h4>
                  <p className="text-sm text-blue-600">
                    La plupart des cabinets utilisent le <b>taux journalier</b> dans leurs fiches de grade, 
                    puis le système divise par 8h pour obtenir le taux horaire.<br/><br/>
                    Si vous avez déjà configuré des <b>taux horaires</b> dans vos grades, 
                    sélectionnez "Taux horaire direct".
                  </p>
                </div>
              </div>
            </Card>
            
            {/* Départements */}
            <Card title="Départements" collapsible defaultOpen={false} action={<Button size="xs" onClick={() => openEdit('dept')}>➕</Button>}>
              <Table columns={[
                {header: 'Code', render: r => <span className="font-mono text-xs bg-slate-100 px-2 py-1 rounded">{r.code}</span>},
                {header: 'Nom', render: r => <b>{r.nom}</b>},
                {header: 'Facturable', render: r => <Badge color={r.facturable ? 'green' : 'gray'}>{r.facturable ? 'Oui' : 'Non'}</Badge>}
              ]} data={depts} actions={r => (
                <div className="flex gap-1"><Button variant="ghost" size="xs" onClick={() => openEdit('dept', r)}>✏️</Button><Button variant="ghost" size="xs" onClick={() => deleteItem('departements', r.id)}>🗑️</Button></div>
              )} />
            </Card>

            {/* Grades */}
            <Card title="Grades" collapsible defaultOpen={false} action={<Button size="xs" onClick={() => openEdit('grade')}>➕</Button>}>
              <div className="mb-4 p-3 bg-amber-50 border border-amber-200 rounded-lg text-sm text-amber-800">
                <b>💡 Niveaux recommandés :</b> 1-2 = Junior/Senior, 3-4 = Manager/Senior Manager, 5+ = Associé/Partner
              </div>
              <Table columns={[
                {header: 'Code', key: 'code'},
                {header: 'Nom', render: r => <b>{r.nom}</b>},
                {header: 'Niveau', render: r => <Badge color={r.niveau >= 3 ? 'green' : 'gray'}>{r.niveau}</Badge>},
                {header: 'Taux journalier', render: r => fmtMoney(r.taux_journalier)},
                {header: 'Cible', render: r => (r.taux_cible || 0) + '%'}
              ]} data={grades} actions={r => (
                <div className="flex gap-1"><Button variant="ghost" size="xs" onClick={() => openEdit('grade', r)}>✏️</Button><Button variant="ghost" size="xs" onClick={() => deleteItem('grades', r.id)}>🗑️</Button></div>
              )} />
            </Card>

            {/* Catégories */}
            <Card title="Catégories de tâches" collapsible defaultOpen={false} action={<Button size="xs" onClick={() => openEdit('categorie')}>➕</Button>}>
              <Table columns={[
                {header: 'Code', key: 'code'},
                {header: 'Nom', render: r => <b>{r.nom}</b>},
                {header: 'Facturable', render: r => <Badge color={r.facturable ? 'green' : 'gray'}>{r.facturable ? 'Oui' : 'Non'}</Badge>}
              ]} data={categories} actions={r => (
                <div className="flex gap-1"><Button variant="ghost" size="xs" onClick={() => openEdit('categorie', r)}>✏️</Button><Button variant="ghost" size="xs" onClick={() => deleteItem('categories_taches', r.id)}>🗑️</Button></div>
              )} />
            </Card>

            {/* Jours fériés */}
            <Card title="Jours fériés" collapsible defaultOpen={false} action={<Button size="xs" onClick={() => openEdit('holiday')}>➕</Button>}>
              <Table columns={[
                {header: 'Date', render: r => fmtDate(r.date)},
                {header: 'Nom', render: r => <b>{r.nom}</b>}

                <Button variant="ghost" size="xs" onClick={() => deleteItem('jours_feries', r.id)}>🗑️</Button>
              )} />
            </Card>
            
            {/* Validateurs Congés */}
            <Card title="🏖️ Validateurs Congés" collapsible defaultOpen={false} action={<Button size="xs" onClick={() => openEdit('validateur_conges')}>➕</Button>}>
              <p className="text-sm text-slate-500 mb-4">Désignez les collaborateurs qui peuvent valider les demandes de congés par département.</p>
              {validateurs.filter(v => v.type_validation === 'conges').length === 0 ? (
                <div className="text-center py-8 text-slate-400">Aucun validateur configuré</div>
              ) : (
                <Table columns={[
                  {header: 'Département', render: r => <Badge color="blue">{r.departement?.nom || 'Tous'}</Badge>},
                  {header: 'Validateur', render: r => <span className="font-medium">{r.collaborateur?.prenom} {r.collaborateur?.nom}</span>}
                ]} data={validateurs.filter(v => v.type_validation === 'conges')} actions={r => (
                  <Button variant="ghost" size="xs" onClick={() => deleteItem('validateurs_departement', r.id)}>🗑️</Button>
                )} />
              )}
            </Card>
            
            {/* Validateurs Notes de frais */}
            <Card title="🧾 Validateurs Notes de frais" collapsible defaultOpen={false} action={<Button size="xs" onClick={() => openEdit('validateur_frais')}>➕</Button>}>
              <p className="text-sm text-slate-500 mb-4">Désignez les collaborateurs qui peuvent valider les notes de frais par département.</p>
              {validateurs.filter(v => v.type_validation === 'frais').length === 0 ? (
                <div className="text-center py-8 text-slate-400">Aucun validateur configuré</div>
              ) : (
                <Table columns={[
                  {header: 'Département', render: r => <Badge color="purple">{r.departement?.nom || 'Tous'}</Badge>},
                  {header: 'Validateur', render: r => <span className="font-medium">{r.collaborateur?.prenom} {r.collaborateur?.nom}</span>}
                ]} data={validateurs.filter(v => v.type_validation === 'frais')} actions={r => (
                  <Button variant="ghost" size="xs" onClick={() => deleteItem('validateurs_departement', r.id)}>🗑️</Button>
                )} />
              )}
            </Card>
          </div>
        )}

        {tab === 'validateurs' && loading ? <Loader /> : tab === 'validateurs' && (
          <div className="space-y-6">
            {/* Validateurs Congés */}
            <Card title="🏖️ Validateurs des Congés" collapsible defaultOpen={true}>
              <p className="text-sm text-slate-500 mb-4">Ces personnes peuvent approuver les demandes de congés des collaborateurs de leur département. Seuls les Managers et grades supérieurs peuvent être validateurs.</p>
              
              {/* Formulaire ajout */}
              <div className="flex gap-4 mb-4 p-4 bg-slate-50 rounded-xl">
                <Select 
                  value={editForm.validateur_dept_conges || ''} 
                  onChange={v => setEditForm(p => ({...p, validateur_dept_conges: v, validateur_collab_conges: ''}))} 
                  options={depts.map(d => ({value: d.id, label: d.nom}))} 
                  placeholder="1. Département" 
                  className="w-48" 
                />
                <Select 
                  value={editForm.validateur_collab_conges || ''} 
                  onChange={v => setEditForm(p => ({...p, validateur_collab_conges: v}))} 
                  options={collaborateurs
                    .filter(c => c.grades?.niveau >= 3 && (!editForm.validateur_dept_conges || c.departement_id === editForm.validateur_dept_conges))
                    .map(c => ({value: c.id, label: `${c.prenom} ${c.nom} (${c.grades?.nom || '-'})`}))} 
                  placeholder={editForm.validateur_dept_conges ? "2. Manager+" : "Sélectionner d'abord un département"} 
                  className="flex-1"
                  disabled={!editForm.validateur_dept_conges}
                />
                <Button onClick={() => addValidateur('conges', editForm.validateur_dept_conges, editForm.validateur_collab_conges)} icon="➕" disabled={!editForm.validateur_dept_conges || !editForm.validateur_collab_conges}>Ajouter</Button>

              <Table columns={[
                {header: 'Département', render: r => <b>{r.departement?.nom || '-'}</b>},
                {header: 'Validateur', render: r => `${r.collaborateur?.prenom || ''} ${r.collaborateur?.nom || ''}`}
              ]} data={validateurs.filter(v => v.type_validation === 'conges')} actions={r => (
                <Button variant="ghost" size="xs" onClick={() => removeValidateur(r.id)}>🗑️</Button>

                <div className="text-center py-8 text-slate-400">Aucun validateur configuré pour les congés</div>
              )}
            </Card>
            
            {/* Validateurs Notes de frais */}

                  value={editForm.validateur_dept_frais || ''}

                  placeholder="1. Département" 
                  className="w-48" 
                />

                  value={editForm.validateur_collab_frais || ''}

                    .filter(c => c.grades?.niveau >= 3 && (!editForm.validateur_dept_frais || c.departement_id === editForm.validateur_dept_frais))

                />

              </div>
              
              {/* Liste validateurs frais */}
              <Table columns={[
                {header: 'Département', render: r => <b>{r.departement?.nom || '-'}</b>},

              </div>

// ========== ADMIN PAGE ==========
const AdminPage = () => {
  const {isSuperAdmin, setViewMode} = useApp();
  if (!isSuperAdmin) return <EmptyState icon="🔒" title="Accès refusé" description="Cette section est réservée aux super administrateurs." />;
  return (
    <div>
      <PageHeader title="Administration" />
      <Card>
        <div className="text-center py-8">
          <div className="text-5xl mb-4">🛡️</div>
          <h3 className="text-xl font-bold mb-2">Accès Super Admin</h3>
          <p className="text-slate-500 mb-6">Basculez vers l'interface d'administration globale pour gérer toutes les organisations, utilisateurs et abonnements.</p>
          <Button onClick={() => setViewMode('admin')} icon="🚀" size="lg">Ouvrir Admin Global</Button>
        </div>
      </Card>
    </div>
  );
};
// ========== ROOT APP ==========
const App = () => {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [page, setPage] = useState('landing');
  const [confirmEmail, setConfirmEmail] = useState('');

  useEffect(() => {
    supabase.auth.getSession().then(({data: {session}}) => {
      setUser(session?.user || null);
      setLoading(false);
      // Nettoyer le hash de l'URL si l'utilisateur est connecté
      if (session?.user && window.location.hash) {
        history.replaceState(null, '', window.location.pathname);
      }
    });
    const {data: {subscription}} = supabase.auth.onAuthStateChange((e, s) => {
      setUser(s?.user || null);
      // Nettoyer le hash quand on se connecte
      if (s?.user && window.location.hash) {
        history.replaceState(null, '', window.location.pathname);
      }
    });
    return () => subscription.unsubscribe();
  }, []);

  const logout = async () => {
    await supabase.auth.signOut();
    setUser(null);
    setPage('landing');
  };

  if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="loader"></div></div>;
  if (user) return <MainApp user={user} onLogout={logout} />;
  if (page === 'login') return <LoginPage onLogin={setUser} onRegister={() => setPage('register')} onBack={() => setPage('landing')} />;
  if (page === 'register') return <RegisterPage onLogin={() => setPage('login')} onBack={() => setPage('landing')} onConfirm={e => {setConfirmEmail(e); setPage('confirm');}} />;
  if (page === 'confirm') return <ConfirmPage email={confirmEmail} onLogin={() => setPage('login')} />;
  return <LandingPage onLogin={() => setPage('login')} onRegister={() => setPage('register')} />;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
