// ========== STAFFING PAGE ==========
const StaffingPage = () => {
  const {org, collab, isManager, isAdmin, isSuperAdmin, userDeptId, gradeNiveau, isCollaborateur} = useApp();
  const [affectations, setAffectations] = useState([]);
  const [allCollaborateurs, setAllCollaborateurs] = useState([]); // Tous les collabs
  const [depts, setDepts] = useState([]);
  const [missions, setMissions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [weekStart, setWeekStart] = useState(getWeekStart());
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [filterDept, setFilterDept] = useState(''); // Filtre département
  
  // Permissions: Manager+ peut modifier, Junior/Senior lecture seule
  const canEdit = isManager && !isCollaborateur;
  // Super Admin peut voir tous les départements, Manager+ seulement le leur
  const canChooseDept = isSuperAdmin || isAdmin;
  // Junior/Senior ne voit que sa propre ligne (utilise isCollaborateur du contexte)
  const isJuniorSenior = isCollaborateur;

  useEffect(() => { loadData(); }, []);
  
  // Initialiser le filtre département pour les non-admin
  useEffect(() => {
    if (!canChooseDept && userDeptId && !isJuniorSenior) {
      setFilterDept(userDeptId);
    }
  }, [userDeptId, canChooseDept, isJuniorSenior]);

  const loadData = async () => {
    const [a, c, m, d] = await Promise.all([
      supabase.from('affectations').select('*,collaborateurs(nom,prenom,departement_id),projets(nom,code,clients(nom))').eq('organisation_id', org.id),
      supabase.from('collaborateurs').select('*,grades:grade_id(nom,niveau),departements:departement_id(nom)').eq('organisation_id', org.id).eq('actif', true).order('nom'),
      supabase.from('projets').select('id,nom,code,clients(nom)').eq('organisation_id', org.id).eq('statut', 'active'),
      supabase.from('departements').select('id,nom').eq('organisation_id', org.id).order('nom')
    ]);
    setAffectations(a.data || []);
    setAllCollaborateurs(c.data || []);
    setMissions(m.data || []);
    setDepts(d.data || []);
    setLoading(false);
  };
  
  // Filtrer les collaborateurs selon le profil
  const collaborateurs = allCollaborateurs.filter(c => {
    // Junior/Senior: uniquement sa propre ligne
    if (isJuniorSenior) {
      return c.id === collab?.id;
    }
    // Manager+: tous les collaborateurs (avec filtre département si actif)
    if (filterDept && c.departement_id !== filterDept) return false;
    return true;
  });

  const days = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven'].map((d, i) => ({label: d, date: addDays(weekStart, i)}));

  const getAffectation = (collabId, date) => affectations.find(a => a.collaborateur_id === collabId && a.date === date);

  const openNew = (collabId = '', date = '') => {
    if (!canEdit) return;
    setForm({collaborateur_id: collabId, projet_id: '', date: date || today(), heures: 8});
    setModal(true);
  };

  const saveAffectation = async () => {
    if (!canEdit) return;
    if (!form.collaborateur_id || !form.projet_id) return alert('Collaborateur et mission requis');
    setSaving(true);
    try {
      const existing = getAffectation(form.collaborateur_id, form.date);
      if (existing) await supabase.from('affectations').update(form).eq('id', existing.id);
      else await supabase.from('affectations').insert([{...form, organisation_id: org.id}]);
      setModal(false); loadData();
    } catch (e) { alert(e.message); }
    setSaving(false);
  };

  const deleteAffectation = async (a) => {
    if (!canEdit) return;
    await supabase.from('affectations').delete().eq('id', a.id);
    loadData();
  };

  // Calcul disponibilité
  const getCollabLoad = (collabId) => {
    const weekAff = affectations.filter(a => {
      if (a.collaborateur_id !== collabId) return false;
      return a.date >= weekStart && a.date <= addDays(weekStart, 4);
    });
    return weekAff.reduce((s, a) => s + (a.heures || 0), 0);
  };
  
  // Export staffing
  const exportStaffing = () => {
    const data = [];
    collaborateurs.forEach(c => {
      days.forEach(d => {
        const aff = getAffectation(c.id, d.date);
        if (aff) {
          data.push({
            collaborateur: `${c.prenom} ${c.nom}`,
            date: d.date,
            mission_code: aff.projets?.code || '',
            mission_nom: aff.projets?.nom || '',
            client: aff.projets?.clients?.nom || '',
            heures: aff.heures
          });
        }
      });
    });
    exportToExcel(data, [
      {header: 'Collaborateur', key: 'collaborateur'},
      {header: 'Date', key: 'date'},
      {header: 'Code mission', key: 'mission_code'},
      {header: 'Nom mission', key: 'mission_nom'},
      {header: 'Client', key: 'client'},
      {header: 'Heures', key: 'heures'}
    ], 'staffing_' + weekStart);
  };

  return (
    <div>
      <PageHeader title={isJuniorSenior ? "Mon planning" : "Staffing"} subtitle={isJuniorSenior ? "Vos affectations de la semaine" : (canEdit ? "Planning des affectations" : "Lecture seule")}
        action={<div className="flex gap-2">
          {!isJuniorSenior && <Button variant="secondary" size="sm" onClick={exportStaffing} icon="📥">Export</Button>}
          <Button variant="secondary" onClick={() => setWeekStart(addDays(weekStart, -7))}>← Sem. préc.</Button>
          <Button variant="secondary" onClick={() => setWeekStart(getWeekStart())}>Aujourd'hui</Button>
          <Button variant="secondary" onClick={() => setWeekStart(addDays(weekStart, 7))}>Sem. suiv. →</Button>
          {canEdit && !isJuniorSenior && <Button onClick={() => openNew()} icon="➕">Affecter</Button>}
        </div>}
      />
      
      {/* Filtre département - uniquement pour managers+ */}
      {canEdit && !isJuniorSenior && (
        <div className="mb-4 flex items-center gap-4">
          <span className="text-sm font-medium text-slate-600">Département :</span>
          {canChooseDept ? (
            <div className="flex gap-2 items-center">
              <Select 
                value={filterDept} 
                onChange={setFilterDept} 
                options={depts.map(d => ({value: d.id, label: d.nom}))} 
                placeholder="Tous les départements" 
                className="w-64" 
              />
              {filterDept && <Button variant="ghost" size="sm" onClick={() => setFilterDept('')}>🔄 Tous</Button>}
            </div>
          ) : (
            <Badge color="blue">{depts.find(d => d.id === filterDept)?.nom || 'Mon département'}</Badge>
          )}
        </div>
      )}
      
      {isJuniorSenior && (
        <div className="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-xl text-blue-700 text-sm">
          📅 Voici vos affectations pour la semaine. Contactez votre manager pour toute modification.
        </div>
      )}

      {loading ? <Loader /> : (
        <Card title={`Semaine du ${fmtDate(weekStart)}`}>
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead>
                <tr className="border-b">
                  <th className="px-4 py-3 text-left w-48">Collaborateur</th>
                  {days.map(d => <th key={d.date} className="px-2 py-3 text-center w-32">{d.label}<br/><span className="text-xs text-slate-400">{d.date.split('-')[2]}</span></th>)}
                  <th className="px-4 py-3 text-center w-24">Charge</th>
                </tr>
              </thead>
              <tbody>
                {collaborateurs.length === 0 ? (
                  <tr>
                    <td colSpan={7} className="text-center py-12 text-slate-400">
                      <div className="text-4xl mb-4">👤</div>
                      <p>Aucun Manager ou grade supérieur dans {filterDept ? 'ce département' : 'l\'organisation'}</p>
                      <p className="text-sm mt-2">Le staffing ne concerne que les Manager, Senior Manager et Associés</p>
                    </td>
                  </tr>
                ) : collaborateurs.map(c => {
                  const load = getCollabLoad(c.id);
                  const loadPercent = Math.round((load / 40) * 100);
                  return (
                    <tr key={c.id} className="border-b border-slate-50">
                      <td className="px-4 py-2">
                        <div className="font-medium">{c.prenom} {c.nom}</div>
                        <div className="text-xs text-slate-400">{c.grades?.nom} • {c.departements?.nom || '-'}</div>
                      </td>
                      {days.map(d => {
                        const aff = getAffectation(c.id, d.date);
                        return (
                          <td key={d.date} className="px-1 py-2 text-center">
                            {aff ? (
                              <div 
                                className={cn("bg-blue-100 text-blue-700 rounded-lg p-2 text-xs", canEdit && "cursor-pointer hover:bg-blue-200")} 
                                onClick={() => canEdit && deleteAffectation(aff)} 
                                title={canEdit ? `${aff.projets?.nom} - ${aff.projets?.clients?.nom || 'Sans client'}\nCliquer pour supprimer` : `${aff.projets?.nom}`}
                              >
                                <div className="font-medium truncate" title={aff.projets?.nom}>{aff.projets?.code}</div>
                                <div className="text-[10px] text-blue-500 truncate">{aff.projets?.clients?.nom || '-'}</div>
                                <div>{aff.heures}h</div>
                              </div>
                            ) : (
                              canEdit ? (
                                <button onClick={() => openNew(c.id, d.date)} className="w-full h-14 border-2 border-dashed border-slate-200 rounded-lg hover:border-blue-400 hover:bg-blue-50 transition-colors text-slate-400">+</button>
                              ) : (
                                <div className="w-full h-14 border-2 border-dashed border-slate-100 rounded-lg text-slate-300 flex items-center justify-center">-</div>
                              )
                            )}
                          </td>
                        );
                      })}
                      <td className="px-4 py-2 text-center">
                        <div className={cn('font-bold', loadPercent > 100 ? 'text-red-500' : loadPercent >= 80 ? 'text-green-500' : 'text-slate-400')}>
                          {load}h / 40h
                        </div>
                        <ProgressBar value={load} max={40} color={loadPercent > 100 ? 'red' : 'green'} size="sm" showLabel={false} />
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      <Modal isOpen={modal} onClose={() => setModal(false)} title="Nouvelle affectation" size="sm">
        <div className="space-y-4">
          <Select label="Collaborateur" value={form.collaborateur_id} onChange={v => setForm(p => ({...p, collaborateur_id: v}))} options={collaborateurs.map(c => ({value: c.id, label: `${c.prenom} ${c.nom}`}))} placeholder="Sélectionner" required />
          <Select label="Mission" value={form.projet_id} onChange={v => setForm(p => ({...p, projet_id: v}))} options={missions.map(m => ({value: m.id, label: `${m.code} - ${m.nom}`}))} placeholder="Sélectionner" required />
          <div className="grid grid-cols-2 gap-4">
            <Input label="Date" type="date" value={form.date} onChange={v => setForm(p => ({...p, date: v}))} />
            <Input label="Heures" type="number" value={form.heures} onChange={v => setForm(p => ({...p, heures: v}))} min={1} max={12} />
          </div>
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(false)} className="flex-1">Annuler</Button>
            <Button onClick={saveAffectation} loading={saving} className="flex-1">Enregistrer</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};
// ========== TIMESHEET PAGE ==========
const TimesheetPage = () => {
  const {org, user, collab, isManager, userDeptId} = useApp();
  const [weekStart, setWeekStart] = useState(getWeekStart());
  const [entries, setEntries] = useState([]);
  const [missions, setMissions] = useState([]);
  const [categories, setCategories] = useState([]);
  const [holidays, setHolidays] = useState([]);
  const [conges, setConges] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filterClient, setFilterClient] = useState('');
  const [filterSearch, setFilterSearch] = useState('');
  const [commentModal, setCommentModal] = useState(null);
  const [comment, setComment] = useState('');
  const [clients, setClients] = useState([]);
  const [showAddActivity, setShowAddActivity] = useState(false);
  const [activityName, setActivityName] = useState('');

  const days = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map((d, i) => ({
    label: d, 
    date: addDays(weekStart, i),
    isWeekend: i >= 5
  }));

  useEffect(() => { loadData(); }, [weekStart]);

  const loadData = async () => {
    setLoading(true);
    const end = addDays(weekStart, 6);
    const [t, m, cat, h, cg, cl] = await Promise.all([
      supabase.from('saisies_temps').select('*,projets(nom,code,client_id,facturable)').eq('organisation_id', org.id).eq('utilisateur_id', user.id).gte('date', weekStart).lte('date', end),
      supabase.from('projets').select('*,clients(id,nom)').eq('organisation_id', org.id).in('statut', ['active', 'draft']),
      supabase.from('categories_taches').select('*').eq('organisation_id', org.id),
      supabase.from('jours_feries').select('date,nom').eq('organisation_id', org.id),
      supabase.from('conges').select('*').eq('collaborateur_id', user.id).eq('statut', 'approved'),
      supabase.from('clients').select('id,nom').eq('organisation_id', org.id)
    ]);
    setEntries(t.data || []);
    
    // Filtrer missions selon permissions
    let filteredMissions = m.data || [];
    if (!isManager && userDeptId) {
      // Junior/Senior: uniquement missions de leur département ou sans département
      filteredMissions = filteredMissions.filter(mission => 
        !mission.departement_id || mission.departement_id === userDeptId
      );
    }
    setMissions(filteredMissions);
    
    setCategories(cat.data || []);
    setHolidays((h.data || []).map(x => x.date));
    setConges(cg.data || []);
    setClients(cl.data || []);
    setLoading(false);
  };

  const getEntry = (projId, date) => entries.find(e => e.projet_id === projId && e.date === date);

  const isDateDisabled = (date) => {
    if (isWeekend(date)) return 'weekend';
    if (holidays.includes(date)) return 'holiday';
    const conge = conges.find(c => date >= c.date_debut && date <= c.date_fin);
    if (conge) return 'conge';
    return false;
  };

  const updateEntry = async (projId, date, heures) => {
    if (isDateDisabled(date)) return;
    const existing = getEntry(projId, date);
    const h = parseFloat(heures) || 0;
    const mission = missions.find(m => m.id === projId);
    
    if (existing) {
      if (h > 0) await supabase.from('saisies_temps').update({heures: h}).eq('id', existing.id);
      else await supabase.from('saisies_temps').delete().eq('id', existing.id);
    } else if (h > 0) {
      await supabase.from('saisies_temps').insert([{
        organisation_id: org.id, utilisateur_id: user.id, projet_id: projId,
        date, heures: h, facturable: mission?.facturable !== false
      }]);
    }
    loadData();
  };

  const openComment = (projId, date) => {
    const entry = getEntry(projId, date);
    setComment(entry?.commentaire || '');
    setCommentModal({projId, date, entryId: entry?.id});
  };

  const saveComment = async () => {
    if (!commentModal) return;
    const {projId, date, entryId} = commentModal;
    if (entryId) {
      await supabase.from('saisies_temps').update({commentaire: comment}).eq('id', entryId);
    } else {
      await supabase.from('saisies_temps').insert([{
        organisation_id: org.id, utilisateur_id: user.id, projet_id: projId,
        date, heures: 0, commentaire: comment, facturable: true
      }]);
    }
    setCommentModal(null);
    loadData();
  };

  // Filtrage missions
  const filteredMissions = missions.filter(m => {
    if (filterClient && m.client_id !== filterClient) return false;
    if (filterSearch && !m.nom.toLowerCase().includes(filterSearch.toLowerCase()) && !m.code.toLowerCase().includes(filterSearch.toLowerCase())) return false;
    return true;
  });

  // Séparation facturables / non-facturables
  const missionsFact = filteredMissions.filter(m => m.facturable !== false);
  const missionsNonFact = filteredMissions.filter(m => m.facturable === false);

  const totalWeek = entries.reduce((s, e) => s + (e.heures || 0), 0);
  const totalFact = entries.filter(e => e.facturable).reduce((s, e) => s + (e.heures || 0), 0);

  const renderMissionRow = (m) => {
    const total = entries.filter(e => e.projet_id === m.id).reduce((s, e) => s + (e.heures || 0), 0);
    return (
      <tr key={m.id} className="border-b border-slate-50">
        <td className="px-4 py-2">
          <div className="font-medium text-sm">{m.nom}</div>
          <div className="text-xs text-slate-400">{m.code} • {m.clients?.nom || 'Interne'}</div>
        </td>
        {days.map(d => {
          const disabled = isDateDisabled(d.date);
          const entry = getEntry(m.id, d.date);
          return (
            <td key={d.date} className={cn('px-1 py-2 text-center', disabled === 'weekend' && 'cell-weekend', disabled === 'holiday' && 'cell-holiday', disabled === 'conge' && 'bg-pink-50')}>
              {disabled ? (
                <div className="w-14 h-10 flex items-center justify-center text-xs text-slate-400">
                  {disabled === 'holiday' ? '🎌' : disabled === 'conge' ? '🏖️' : '-'}
                </div>
              ) : (
                <div className="relative group">
                  <input type="number" min="0" max="24" step="0.5"
                    defaultValue={entry?.heures || ''}
                    onBlur={e => updateEntry(m.id, d.date, e.target.value)}
                    className="w-14 px-2 py-1.5 bg-slate-50 border rounded-lg text-center text-sm focus:bg-white" />
                  <button onClick={() => openComment(m.id, d.date)}
                    className={cn('absolute -top-1 -right-1 w-4 h-4 rounded-full text-xs opacity-0 group-hover:opacity-100 transition-opacity',
                      entry?.commentaire ? 'bg-blue-500 text-white' : 'bg-slate-200 text-slate-500')}>
                    {entry?.commentaire ? '💬' : '+'}
                  </button>
                </div>
              )}
            </td>
          );
        })}
        <td className="px-4 py-2 text-right font-bold">{total || '-'}</td>
      </tr>
    );
  };
  
  // Export timesheet
  const exportTimesheet = () => {
    const data = [];
    missions.forEach(m => {
      days.forEach(d => {
        const e = getEntry(m.id, d.date);
        if (e && e.heures > 0) {
          data.push({
            mission_code: m.code,
            mission_nom: m.nom,
            client: m.clients?.nom || '',
            date: d.date,
            heures: e.heures,
            commentaire: e.commentaire || ''
          });
        }
      });
    });
    exportToExcel(data, [
      {header: 'Code mission', key: 'mission_code'},
      {header: 'Nom mission', key: 'mission_nom'},
      {header: 'Client', key: 'client'},

// ========== CONGES PAGE ==========
const CongesPage = () => {
  const {org, user, collab, isManager, isAdmin, userDeptId} = useApp();
  const [conges, setConges] = useState([]);
  const [validateurs, setValidateurs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null); // 'conge' ou 'import'
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [tab, setTab] = useState('mes');
  const [soldeAnterieur, setSoldeAnterieur] = useState(0);
  const [importDone, setImportDone] = useState(false);
  
  // Vérifier si l'utilisateur est validateur congés
  const [isValidateur, setIsValidateur] = useState(false);

  useEffect(() => { loadData(); }, []);

  const loadData = async () => {
    const [congesRes, validRes] = await Promise.all([
      supabase.from('conges').select('*,collaborateurs:utilisateur_id(nom,prenom,departement_id)').eq('organisation_id', org.id).order('date_debut', {ascending: false}),
      supabase.from('validateurs_departement').select('*').eq('organisation_id', org.id).eq('type_validation', 'conges')
    ]);
    
    if (congesRes.error) console.error('Conges error:', congesRes.error);
    setConges(congesRes.data || []);
    setValidateurs(validRes.data || []);
    
    // Vérifier si l'utilisateur courant est validateur
    const isVal = (validRes.data || []).some(v => v.collaborateur_id === collab?.id);
    setIsValidateur(isVal || isAdmin);
    
    // Vérifier si un import a déjà été fait (chercher un congé de type 'report_anterieur')
    const hasImport = (congesRes.data || []).some(c => c.type_conge === 'report_anterieur' && c.utilisateur_id === user.id);
    setImportDone(hasImport);
    
    // Récupérer le solde antérieur s'il existe
    const importConge = (congesRes.data || []).find(c => c.type_conge === 'report_anterieur' && c.utilisateur_id === user.id);
    if (importConge) setSoldeAnterieur(importConge.nb_jours || 0);
    
    setLoading(false);
  };

  const openNew = () => {
    setForm({utilisateur_id: user.id, type_conge: 'conge_paye', date_debut: '', date_fin: '', motif: ''});
    setModal('conge');
  };
  
  const openImport = () => {
    setForm({solde_anterieur: 0});
    setModal('import');
  };
  
  const saveImport = async () => {
    const solde = parseFloat(form.solde_anterieur) || 0;
    if (solde <= 0) return alert('Le solde doit être positif');
    
    setSaving(true);
    try {
      // Créer un "congé" fictif de type report pour stocker le solde antérieur
      // On utilise nb_jours négatif pour représenter un crédit
      const {error} = await supabase.from('conges').insert([{
        organisation_id: org.id,
        utilisateur_id: user.id,
        type_conge: 'report_anterieur',
        date_debut: today(),
        date_fin: today(),
        nb_jours: solde, // Positif = crédit de jours
        motif: 'Import solde antérieur',
        statut: 'approved'
      }]);
      if (error) throw error;
      setModal(null);
      loadData();
      alert('Solde antérieur importé avec succès !');
    } catch(e) { alert('Erreur: ' + e.message); }
    setSaving(false);
  };

  const save = async () => {
    if (!form.date_debut || !form.date_fin) return alert('Dates requises');
    
    // Vérifier le solde si c'est un congé payé
    if (form.type_conge === 'conge_paye') {
      const jours = workingDaysBetween(form.date_debut, form.date_fin);
      if (jours > soldeConges) {
        if (!confirm(`⚠️ Vous demandez ${jours} jours mais votre solde est de ${soldeConges} jours.\n\nContinuer quand même ?`)) {
          return;
        }
      }
    }
    
    setSaving(true);
    try {
      const jours = workingDaysBetween(form.date_debut, form.date_fin);
      const {error} = await supabase.from('conges').insert([{
        organisation_id: org.id, 
        utilisateur_id: user.id,
        type_conge: form.type_conge,
        date_debut: form.date_debut,
        date_fin: form.date_fin,
        nb_jours: jours, 
        motif: form.motif,
        statut: 'pending'
      }]);
      if (error) throw error;
      setModal(false); loadData();
    } catch (e) { alert('Erreur: ' + e.message); }
    setSaving(false);
  };

  const updateStatus = async (conge, statut) => {
    await supabase.from('conges').update({statut, date_validation: new Date().toISOString()}).eq('id', conge.id);
    loadData();
  };
  
  const deleteConge = async (c) => {
    if (c.statut === 'approved' && c.type_conge !== 'report_anterieur') return alert('Impossible de supprimer un congé déjà approuvé');
    if (c.type_conge === 'report_anterieur') {
      if (!confirm('⚠️ Supprimer le solde antérieur importé ? Cette action est irréversible.')) return;
    } else {
      if (!confirm('Supprimer cette demande de congé ?')) return;
    }
    await supabase.from('conges').delete().eq('id', c.id);
    loadData();
  };

  const mesConges = conges.filter(c => c.utilisateur_id === user.id && c.type_conge !== 'report_anterieur');
  // Congés à valider: seulement si l'utilisateur est validateur
  // Et uniquement pour les collaborateurs de son département (si validateur département) ou tous (si admin)
  const congesAValider = isValidateur ? conges.filter(c => {
    if (c.statut !== 'pending') return false;
    if (isAdmin) return true; // Admin voit tous les pending
    // Validateur département: voir seulement les congés de son département
    const validDepts = validateurs.filter(v => v.collaborateur_id === collab?.id).map(v => v.departement_id);
    return validDepts.includes(c.collaborateurs?.departement_id);
  }) : [];
  
  const congesApprouves = mesConges.filter(c => c.statut === 'approved' && c.type_conge === 'conge_paye');
  
  // Récupérer le solde antérieur importé
  const importConge = conges.find(c => c.type_conge === 'report_anterieur' && c.utilisateur_id === user.id);
  const joursReportAnterieurs = importConge?.nb_jours || 0;

  // Calcul du solde de congés
  // Acquisition: 2 jours par mois d'ancienneté (24 jours/an)
  // On utilise la date d'entrée de l'utilisateur ou défaut au 1er janvier de l'année
  const dateEntree = user.date_entree ? new Date(user.date_entree) : new Date(new Date().getFullYear(), 0, 1);
  const maintenant = new Date();
  const moisAnciennete = Math.floor((maintenant - dateEntree) / (1000 * 60 * 60 * 24 * 30));
  const joursAcquis = Math.min(moisAnciennete * 2, 24) + joursReportAnterieurs; // Acquis + report antérieur
  const joursPris = congesApprouves.reduce((s, c) => s + (c.nb_jours || 0), 0);
  const soldeConges = Math.max(0, joursAcquis - joursPris);
  const joursEnAttente = mesConges.filter(c => c.statut === 'pending' && c.type_conge === 'conge_paye').reduce((s, c) => s + (c.nb_jours || 0), 0);

  // Tabs dynamiques selon permissions
  const tabs = [
    {key: 'mes', label: 'Mes congés', count: mesConges.length}
  ];
  if (isValidateur) {
    tabs.push({key: 'valider', label: 'À valider', count: congesAValider.length, icon: '🔔'});
  }
  if (isManager || isAdmin) {
    tabs.push({key: 'tous', label: 'Tous', count: conges.length});
  }

  return (
    <div>
      <PageHeader title="Congés & Absences" 
        subtitle={`Solde: ${soldeConges} jours disponibles`}
        tabs={tabs}
        activeTab={tab} onTabChange={setTab}
        action={<div className="flex gap-2">
          {!importDone && <Button variant="secondary" size="sm" onClick={openImport} icon="📥">Import solde</Button>}
          <Button onClick={openNew} icon="➕">Demander congé</Button>
        </div>}
      />

      {/* Carte récapitulative du solde */}
      {tab === 'mes' && (
        <div className="grid grid-cols-5 gap-4 mb-6">
          <StatCard title="Report antérieur" value={joursReportAnterieurs + 'j'} icon="📥" color="slate" />
          <StatCard title="Jours acquis" value={(joursAcquis - joursReportAnterieurs) + 'j'} icon="📅" color="blue" subtitle={`(${moisAnciennete} mois × 2j)`} />
          <StatCard title="Jours pris" value={joursPris + 'j'} icon="🏖️" color="amber" />
          <StatCard title="En attente" value={joursEnAttente + 'j'} icon="⏳" color="purple" />
          <StatCard title="Solde disponible" value={soldeConges + 'j'} icon="✅" color="green" />
        </div>
      )}

      {loading ? <Loader /> : (
        <Card>
          <Table columns={[
            {header: 'Type', render: r => { const t = LEAVE_TYPES.find(l => l.value === r.type_conge); return <Badge color={t?.color}>{t?.label}</Badge>; }},
            {header: 'Période', render: r => <span>{fmtDate(r.date_debut)} → {fmtDate(r.date_fin)}</span>},
            {header: 'Jours', render: r => <span className="font-medium">{r.nb_jours}j</span>},
            {header: 'Statut', render: r => <Badge color={LEAVE_STATUS[r.statut]?.color}>{LEAVE_STATUS[r.statut]?.label}</Badge>},
            {header: 'Motif', render: r => <span className="text-sm text-slate-500 truncate max-w-xs">{r.motif || '-'}</span>}
          ]} data={tab === 'mes' ? mesConges : tab === 'valider' ? congesAValider : conges}
          actions={r => (
            <div className="flex gap-1">
              {tab === 'valider' && r.statut === 'pending' && (<>
                <Button variant="success" size="xs" onClick={() => updateStatus(r, 'approved')} title="Approuver">✓</Button>
                <Button variant="danger" size="xs" onClick={() => updateStatus(r, 'rejected')} title="Refuser">✗</Button>
              </>)}
              {r.statut === 'pending' && r.utilisateur_id === user.id && (
                <Button variant="ghost" size="xs" onClick={() => deleteConge(r)} title="Annuler">🗑️</Button>
              )}
            </div>
          )} />
        </Card>
      )}

      <Modal isOpen={modal === 'conge'} onClose={() => setModal(null)} title="Demande de congé">
        <div className="space-y-4">
          <Select label="Type de congé" value={form.type_conge} onChange={v => setForm(p => ({...p, type_conge: v}))} options={LEAVE_TYPES.map(t => ({value: t.value, label: t.label}))} />
          <div className="grid grid-cols-2 gap-4">
            <Input label="Date début" type="date" value={form.date_debut} onChange={v => setForm(p => ({...p, date_debut: v}))} required />
            <Input label="Date fin" type="date" value={form.date_fin} onChange={v => setForm(p => ({...p, date_fin: v}))} required />
          </div>
          {form.date_debut && form.date_fin && (
            <div className="p-3 bg-blue-50 rounded-xl text-center">
              <span className="text-blue-600 font-medium">{workingDaysBetween(form.date_debut, form.date_fin)} jours ouvrés</span>
              {form.type_conge === 'conge_paye' && workingDaysBetween(form.date_debut, form.date_fin) > soldeConges && (
                <div className="text-red-500 text-sm mt-1">⚠️ Dépasse votre solde de {soldeConges}j</div>
              )}
            </div>
          )}
          <TextArea label="Motif (optionnel)" value={form.motif} onChange={v => setForm(p => ({...p, motif: v}))} rows={2} />
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button>
            <Button onClick={save} loading={saving} className="flex-1">Soumettre</Button>
          </div>
        </div>
      </Modal>

      {/* Modal Import solde antérieur */}
      <Modal isOpen={modal === 'import'} onClose={() => setModal(null)} title="Importer solde antérieur" size="sm">
        <div className="space-y-4">
          <div className="p-4 bg-amber-50 rounded-xl text-amber-700 text-sm">
            <strong>⚠️ Important:</strong> Cette opération ne peut être effectuée qu'une seule fois. Entrez le solde de congés que vous aviez avant d'utiliser KabiNet.
          </div>
          <Input 
            label="Solde antérieur (jours)" 
            type="number" 
            value={form.solde_anterieur} 
            onChange={v => setForm(p => ({...p, solde_anterieur: v}))} 
            placeholder="Ex: 12"
            required 
          />
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button>
            <Button onClick={saveImport} loading={saving} className="flex-1">Importer</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};
// ========== FACTURATION PAGE ==========
const FacturationPage = () => {
  const {org, collab, isAssocie, isAdmin} = useApp();
  const [factures, setFactures] = useState([]);
  const [allMissions, setAllMissions] = useState([]);
  const [clients, setClients] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [tab, setTab] = useState('toutes');
  
  // Associé+ voit tout, Manager voit seulement ses missions
  const canViewAll = isAssocie || isAdmin;

  useEffect(() => { loadData(); }, []);

  const loadData = async () => {
    const [f, m, c] = await Promise.all([
      supabase.from('factures').select('*,clients(nom),projets(nom,code,responsable_id)').eq('organisation_id', org.id).order('date_emission', {ascending: false}),
      supabase.from('projets').select('*,clients(nom),departements:departement_id(nom)').eq('organisation_id', org.id),
      supabase.from('clients').select('id,nom').eq('organisation_id', org.id)
    ]);
    
    // Filtrer les factures pour les managers (seulement leurs missions)
    let filteredFactures = f.data || [];
    if (!canViewAll && collab?.id) {
      filteredFactures = filteredFactures.filter(fac => 
        !fac.projet_id || fac.projets?.responsable_id === collab.id
      );
    }
    
    setFactures(filteredFactures);
    setAllMissions(m.data || []);
    setClients(c.data || []);
    setLoading(false);
  };
  
  // Missions filtrées pour le select (Manager = ses missions, Associé+ = toutes)
  const missions = canViewAll 
    ? allMissions 
    : allMissions.filter(m => m.responsable_id === collab?.id);

  const openNew = () => {
    setEditItem(null);
    setForm({reference: genCode('FAC'), projet_id: '', client_id: '', type_facture: 'standard', date_emission: today(), date_echeance: addDays(today(), 30), montant_ht: 0, taux_tva: 18, statut: 'draft', montant_encaisse: 0, date_encaissement: ''});
    setModal('facture');
  };

  const save = async () => {
    if (!form.client_id) return alert('Client requis');
    setSaving(true);
    try {
      const montantHT = parseFloat(form.montant_ht) || 0;
      const tauxTVA = parseFloat(form.taux_tva) || 18;
      const tva = montantHT * tauxTVA / 100;
      
      const data = {
        reference: form.reference,
        client_id: form.client_id,
        projet_id: form.projet_id || null,
        type_facture: form.type_facture || 'standard',
        date_emission: form.date_emission,
        date_echeance: form.date_echeance,
        montant_ht: montantHT,
        taux_tva: tauxTVA,
        montant_tva: tva,
        montant_total: montantHT + tva,
        statut: form.statut || 'draft'
      };
      
      let result;
      if (editItem?.id) {
        result = await supabase.from('factures').update(data).eq('id', editItem.id);
      } else {
        result = await supabase.from('factures').insert([{...data, organisation_id: org.id}]);
      }
      
      if (result.error) throw result.error;
      setModal(null); loadData();
    } catch (e) { 
      console.error('Facture save error:', e);
      alert('Erreur: ' + e.message); 
    }
    setSaving(false);
  };

  const updateStatus = async (f, statut) => { 
    // Confirmation selon le statut
    const messages = {
      'sent': `Envoyer la facture ${f.reference} au client ?`,
      'paid': `Marquer la facture ${f.reference} comme entièrement payée (${fmtMoney(f.montant_total)}) ?`
    };
    
    if (messages[statut] && !confirm(messages[statut])) return;
    
    const updates = {statut};
    if (statut === 'paid') {
      updates.montant_encaisse = f.montant_total;
      updates.date_encaissement = today();
    }
    await supabase.from('factures').update(updates).eq('id', f.id); 
    loadData(); 
  };

  // Encaissement partiel
  const openEncaissement = (f) => {
    setEditItem(f);
    setForm({montant_encaisse: f.montant_encaisse || 0, date_encaissement: f.date_encaissement || today()});
    setModal('encaissement');
  };

  const saveEncaissement = async () => {
    setSaving(true);
    try {
      const montant = parseFloat(form.montant_encaisse) || 0;
      let statut = editItem.statut;
      if (montant >= editItem.montant_total) statut = 'paid';
      else if (montant > 0) statut = 'partial';
      
      await supabase.from('factures').update({
        montant_encaisse: montant,
        date_encaissement: form.date_encaissement,
        statut
      }).eq('id', editItem.id);
      setModal(null); loadData();
    } catch(e) { alert(e.message); }
    setSaving(false);
  };

  const exportPDF = (f) => {
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF();
    
    doc.setFontSize(20);
    doc.text('FACTURE', 105, 25, {align: 'center'});
    
    doc.setFontSize(14);
    doc.text(String(f.reference || ''), 105, 35, {align: 'center'});
    
    doc.setDrawColor(200);
    doc.line(20, 45, 190, 45);
    
    doc.setFontSize(10);
    doc.text('Date: ' + fmtDate(f.date_emission), 20, 55);
    doc.text('Echeance: ' + fmtDate(f.date_echeance), 20, 62);
    doc.text('Client: ' + String(f.clients?.nom || '-'), 20, 69);
    if (f.projets?.nom) doc.text('Mission: ' + String(f.projets?.code || '') + ' - ' + String(f.projets.nom), 20, 76);
    
    doc.line(20, 85, 190, 85);
    
    doc.setFontSize(11);
    const y1 = 100;
    doc.text('Montant HT:', 110, y1);
    doc.text(fmtSimple(f.montant_ht) + ' FCFA', 190, y1, {align: 'right'});
    
    doc.text('TVA (' + String(f.taux_tva || 18) + '%):', 110, y1 + 10);
    doc.text(fmtSimple(f.montant_tva) + ' FCFA', 190, y1 + 10, {align: 'right'});
    
    doc.line(110, y1 + 15, 190, y1 + 15);
    
    doc.setFontSize(14);
    doc.text('TOTAL TTC:', 110, y1 + 25);
    doc.text(fmtSimple(f.montant_total) + ' FCFA', 190, y1 + 25, {align: 'right'});
    
    doc.save('Facture_' + String(f.reference) + '.pdf');
  };

  const stats = {
    total: factures.reduce((s, f) => s + (f.montant_total || 0), 0), 
    encaisse: factures.reduce((s, f) => s + (f.montant_encaisse || 0), 0),
    enAttente: factures.filter(f => f.statut === 'sent').reduce((s, f) => s + (f.montant_total - (f.montant_encaisse || 0)), 0)
  };

  const filteredFactures = tab === 'toutes' ? factures : 
    tab === 'draft' ? factures.filter(f => f.statut === 'draft') :
    tab === 'sent' ? factures.filter(f => f.statut === 'sent') :
    tab === 'paid' ? factures.filter(f => f.statut === 'paid') : factures;
  
  const exportFactures = () => exportToExcel(filteredFactures, [
    {header: 'Référence', key: 'reference'},
    {header: 'Client', getValue: r => r.clients?.nom || ''},
    {header: 'Mission', getValue: r => r.projets?.code || ''},
    {header: 'Date émission', key: 'date_emission'},
    {header: 'Date échéance', key: 'date_echeance'},
    {header: 'Montant HT', key: 'montant_ht'},
    {header: 'TVA', key: 'montant_tva'},
    {header: 'Montant TTC', key: 'montant_total'},
    {header: 'Encaissé', key: 'montant_encaisse'},
    {header: 'Statut', getValue: r => INVOICE_STATUS[r.statut]?.label || ''}
  ], 'factures');

  return (
    <div>
      <PageHeader title="Facturation" subtitle={canViewAll ? factures.length + ' factures' : 'Mes missions - ' + factures.length + ' factures'} 
        tabs={[
          {key: 'toutes', label: 'Toutes', count: factures.length},
          {key: 'draft', label: 'Brouillons', count: factures.filter(f => f.statut === 'draft').length},
          {key: 'sent', label: 'Envoyées', count: factures.filter(f => f.statut === 'sent').length},
          {key: 'paid', label: 'Payées', count: factures.filter(f => f.statut === 'paid').length}
        ]}
        activeTab={tab} onTabChange={setTab}
        action={<div className="flex gap-2">
          <Button variant="secondary" size="sm" onClick={exportFactures} icon="📥">Export</Button>
          <Button onClick={openNew} icon="➕">Nouvelle</Button>
        </div>} 
      />
      
      {!canViewAll && (
        <div className="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-xl text-blue-700 text-sm">
          ℹ️ Vous voyez uniquement les factures des missions dont vous êtes responsable.
        </div>
      )}
      
      <div className="grid grid-cols-3 gap-4 mb-6">
        <StatCard title="Total facturé" value={fmtMoney(stats.total)} icon="📄" color="blue" />
        <StatCard title="Encaissé" value={fmtMoney(stats.encaisse)} icon="✅" color="green" />
        <StatCard title="En attente" value={fmtMoney(stats.enAttente)} icon="⏳" color="amber" />
      </div>
      {loading ? <Loader /> : (
        <Card>
          <Table columns={[
            {header: 'Facture', render: r => <div><div className="font-medium">{r.reference}</div><div className="text-xs text-slate-400">{r.type_facture}</div></div>},
            {header: 'Client', render: r => r.clients?.nom || '-'},
            {header: 'Mission', render: r => r.projets?.code || '-'},
            {header: 'Montant', render: r => <span className="font-bold">{fmtMoney(r.montant_total)}</span>},
            {header: 'Encaissé', render: r => r.montant_encaisse > 0 ? <span className="text-green-600">{fmtMoney(r.montant_encaisse)}</span> : '-'},
            {header: 'Statut', render: r => <Badge color={INVOICE_STATUS[r.statut]?.color}>{INVOICE_STATUS[r.statut]?.label}</Badge>}
          ]} data={filteredFactures} actions={r => (
            <div className="flex gap-1">
              <Button variant="ghost" size="xs" onClick={() => exportPDF(r)} title="PDF">📄</Button>
              {r.statut === 'draft' && <Button variant="ghost" size="xs" onClick={() => updateStatus(r, 'sent')} title="Envoyer">📤</Button>}
              {(r.statut === 'sent' || r.statut === 'partial') && <Button variant="ghost" size="xs" onClick={() => openEncaissement(r)} title="Encaisser">💰</Button>}
              {r.statut === 'sent' && <Button variant="ghost" size="xs" onClick={() => updateStatus(r, 'paid')} title="Payé 100%">✅</Button>}
            </div>
          )} />
        </Card>
      )}

      {/* Modal Nouvelle Facture */}
      <Modal isOpen={modal === 'facture'} onClose={() => setModal(null)} title="Nouvelle facture" size="lg">
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4">
            <Input label="Référence" value={form.reference} onChange={v => setForm(p => ({...p, reference: v}))} />
            <Select label="Type" value={form.type_facture} onChange={v => setForm(p => ({...p, type_facture: v}))} options={[{value: 'standard', label: 'Standard'}, {value: 'acompte', label: 'Acompte'}, {value: 'solde', label: 'Solde'}, {value: 'avoir', label: 'Avoir'}]} />
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Select label="Client" value={form.client_id} onChange={v => setForm(p => ({...p, client_id: v, projet_id: ''}))} options={clients.map(c => ({value: c.id, label: c.nom}))} placeholder="Sélectionner" required />
            <Select label="Mission" value={form.projet_id} onChange={v => { 
              const m = missions.find(x => x.id === v); 
              setForm(p => ({...p, projet_id: v, client_id: m?.client_id || p.client_id})); 
            }} options={missions.filter(m => !form.client_id || m.client_id === form.client_id).map(m => ({value: m.id, label: m.code + ' - ' + m.nom + ' (' + (m.departements?.nom || 'Sans dept') + ')'}))} placeholder="Sélectionner (optionnel)" />
          </div>
          
          {/* Affichage du budget restant si mission sélectionnée */}
          {form.projet_id && (() => {
            const mission = missions.find(m => m.id === form.projet_id);
            if (!mission) return null;
            const facturesMission = factures.filter(f => f.projet_id === form.projet_id && f.id !== editItem?.id);
            const dejaFacture = facturesMission.reduce((s, f) => s + (f.montant_ht || 0), 0);
            const budgetRestant = (mission.budget_montant || 0) - dejaFacture;
            const isDepassement = (parseFloat(form.montant_ht) || 0) > budgetRestant;
            
            return (
              <div className={cn('p-4 rounded-xl', isDepassement ? 'bg-red-50 border border-red-200' : 'bg-blue-50')}>
                <div className="grid grid-cols-3 gap-4 text-center text-sm">
                  <div>
                    <div className="text-slate-500">Budget mission</div>
                    <div className="font-bold text-lg">{fmtMoney(mission.budget_montant)}</div>
                  </div>
                  <div>
                    <div className="text-slate-500">Déjà facturé</div>
                    <div className="font-bold text-lg text-amber-600">{fmtMoney(dejaFacture)}</div>
                  </div>
                  <div>
                    <div className="text-slate-500">Reste à facturer</div>
                    <div className={cn('font-bold text-lg', budgetRestant >= 0 ? 'text-green-600' : 'text-red-600')}>{fmtMoney(budgetRestant)}</div>
                  </div>
                </div>
                {isDepassement && (
                  <div className="mt-3 p-2 bg-red-100 rounded-lg text-red-700 text-sm text-center">
                    ⚠️ Attention: Dépassement de {fmtMoney((parseFloat(form.montant_ht) || 0) - budgetRestant)} par rapport au budget restant
                  </div>
                )}
              </div>
            );
          })()}
          
          <div className="grid grid-cols-2 gap-4">
            <Input label="Date émission" type="date" value={form.date_emission} onChange={v => setForm(p => ({...p, date_emission: v}))} />
            <Input label="Date échéance" type="date" value={form.date_echeance} onChange={v => setForm(p => ({...p, date_echeance: v}))} />
          </div>
          <div className="grid grid-cols-3 gap-4">
            <Input label="Montant HT (FCFA)" type="number" value={form.montant_ht} onChange={v => setForm(p => ({...p, montant_ht: v}))} />
            <Input label="TVA %" type="number" value={form.taux_tva} onChange={v => setForm(p => ({...p, taux_tva: v}))} />
            <div><label className="block text-sm font-medium mb-1.5">Total TTC</label><div className="px-4 py-2.5 bg-green-50 rounded-xl font-bold text-green-700">{fmtMoney((form.montant_ht || 0) * (1 + (form.taux_tva || 0) / 100))}</div></div>
          </div>
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button><Button onClick={save} loading={saving} className="flex-1">Créer</Button></div>
        </div>
      </Modal>

      {/* Modal Encaissement */}
      <Modal isOpen={modal === 'encaissement'} onClose={() => setModal(null)} title={`Encaissement - ${editItem?.reference}`} size="sm">
        <div className="space-y-4">
          <div className="p-4 bg-slate-50 rounded-xl">
            <div className="flex justify-between mb-2"><span className="text-slate-500">Montant facture:</span><span className="font-bold">{fmtMoney(editItem?.montant_total)}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">Déjà encaissé:</span><span className="text-green-600">{fmtMoney(editItem?.montant_encaisse || 0)}</span></div>
          </div>
          <Input label="Montant encaissé (FCFA)" type="number" value={form.montant_encaisse} onChange={v => setForm(p => ({...p, montant_encaisse: v}))} />
          <Input label="Date encaissement" type="date" value={form.date_encaissement} onChange={v => setForm(p => ({...p, date_encaissement: v}))} />
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button><Button onClick={saveEncaissement} loading={saving} className="flex-1">Enregistrer</Button></div>
        </div>
      </Modal>
    </div>
  );
};

// ========== NOTES DE FRAIS PAGE ==========
const EXPENSE_TYPES = [
  {value: 'transport', label: 'Transport', icon: '🚗'},
  {value: 'repas', label: 'Repas', icon: '🍽️'},
  {value: 'hebergement', label: 'Hébergement', icon: '🏨'},
  {value: 'fournitures', label: 'Fournitures', icon: '📎'},
  {value: 'communication', label: 'Communication', icon: '📱'},
  {value: 'autre', label: 'Autre', icon: '📦'}
];

const EXPENSE_STATUS = {
  draft: {label: 'Brouillon', color: 'gray'},
  submitted: {label: 'Soumise', color: 'blue'},
  approved: {label: 'Approuvée', color: 'green'},
  rejected: {label: 'Refusée', color: 'red'},
  paid: {label: 'Remboursée', color: 'purple'}
};

const NotesFraisPage = () => {
  const {org, user, collab, isManager, isAdmin, userDeptId} = useApp();
  const [notes, setNotes] = useState([]);
  const [missions, setMissions] = useState([]);
  const [validateurs, setValidateurs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [tab, setTab] = useState('mes');
  
  // Vérifier si l'utilisateur est validateur notes de frais
  const [isValidateur, setIsValidateur] = useState(false);

  useEffect(() => { loadData(); }, []);

  const loadData = async () => {
    const [n, m, v] = await Promise.all([
      supabase.from('notes_frais').select('*,projets(nom,code),collaborateurs:utilisateur_id(nom,prenom,departement_id)').eq('organisation_id', org.id).order('date_frais', {ascending: false}),
      supabase.from('projets').select('id,nom,code').eq('organisation_id', org.id),
      supabase.from('validateurs_departement').select('*').eq('organisation_id', org.id).eq('type_validation', 'frais')
    ]);
    setNotes(n.data || []);
    setMissions(m.data || []);
    setValidateurs(v.data || []);
    
    // Vérifier si l'utilisateur courant est validateur
    const isVal = (v.data || []).some(val => val.collaborateur_id === collab?.id);
    setIsValidateur(isVal || isAdmin);
    
    setLoading(false);
  };

  const openNew = () => {
    setEditItem(null);
    setForm({
      reference: genCode('NDF'),
      utilisateur_id: user.id,
      projet_id: '',
      type_frais: 'transport',
      date_frais: today(),
      description: '',
      montant: 0,
      justificatif: false,
      statut: 'draft'
    });
    setModal('note');
  };

  const openEdit = (n) => {
    setEditItem(n);
    setForm({...n, date_frais: n.date_frais?.split('T')[0] || ''});
    setModal('note');
  };

  const save = async () => {
    if (!form.montant || form.montant <= 0) return alert('Montant requis');
    setSaving(true);
    try {
      const data = {
        reference: form.reference,
        utilisateur_id: user.id,
        projet_id: form.projet_id || null,
        type_frais: form.type_frais,
        date_frais: form.date_frais,
        description: form.description || '',
        montant: parseFloat(form.montant) || 0,
        justificatif: form.justificatif || false,
        justificatif_url: form.justificatif_url || null,
        statut: form.statut || 'draft'
      };

      let result;
      if (editItem?.id) {
        result = await supabase.from('notes_frais').update(data).eq('id', editItem.id);
      } else {
        result = await supabase.from('notes_frais').insert([{...data, organisation_id: org.id}]);
      }

      if (result.error) throw result.error;
      setModal(null);
      loadData();
    } catch (e) {
      console.error('Note frais error:', e);
      alert('Erreur: ' + e.message);
    }
    setSaving(false);
  };

  const submitNote = async (n) => {
    if (!confirm('Soumettre cette note de frais pour validation ?')) return;
    await supabase.from('notes_frais').update({statut: 'submitted'}).eq('id', n.id);
    loadData();
  };

  const approveNote = async (n) => {
    if (!confirm(`Approuver la note ${n.reference} de ${fmtMoney(n.montant)} ?`)) return;
    await supabase.from('notes_frais').update({statut: 'approved', date_validation: today()}).eq('id', n.id);
    loadData();
  };

  const rejectNote = async (n) => {
    const motif = prompt('Motif du refus :');
    if (!motif) return;
    await supabase.from('notes_frais').update({statut: 'rejected', motif_refus: motif}).eq('id', n.id);
    loadData();
  };

  const markPaid = async (n) => {
    if (!confirm(`Marquer la note ${n.reference} comme remboursée ?`)) return;
    await supabase.from('notes_frais').update({statut: 'paid', date_remboursement: today()}).eq('id', n.id);
    loadData();
  };

  const deleteNote = async (n) => {
    if (n.statut !== 'draft') return alert('Seules les notes en brouillon peuvent être supprimées');
    if (!confirm('Supprimer cette note de frais ?')) return;
    await supabase.from('notes_frais').delete().eq('id', n.id);
    loadData();
  };

  const mesNotes = notes.filter(n => n.utilisateur_id === user.id);
  
  // Notes à valider: seulement si l'utilisateur est validateur
  const notesAValider = isValidateur ? notes.filter(n => {
    if (n.statut !== 'submitted') return false;
    if (isAdmin) return true;
    // Validateur département: voir seulement les notes de son département
    const validDepts = validateurs.filter(v => v.collaborateur_id === collab?.id).map(v => v.departement_id);
    return validDepts.includes(n.collaborateurs?.departement_id);
  }) : [];
  
  const notesApprouvees = notes.filter(n => n.statut === 'approved');

  const stats = {
    totalMes: mesNotes.reduce((s, n) => s + (n.montant || 0), 0),
    enAttente: mesNotes.filter(n => n.statut === 'submitted').reduce((s, n) => s + (n.montant || 0), 0),
    approuve: mesNotes.filter(n => n.statut === 'approved').reduce((s, n) => s + (n.montant || 0), 0),
    rembourse: mesNotes.filter(n => n.statut === 'paid').reduce((s, n) => s + (n.montant || 0), 0)
  };

  const displayNotes = tab === 'mes' ? mesNotes : tab === 'valider' ? notesAValider : tab === 'approuvees' ? notesApprouvees : notes;

  const exportNotes = () => exportToExcel(displayNotes, [
    {header: 'Référence', key: 'reference'},
    {header: 'Date', key: 'date_frais'},
    {header: 'Type', getValue: r => EXPENSE_TYPES.find(t => t.value === r.type_frais)?.label || ''},
    {header: 'Mission', getValue: r => r.projets?.code || ''},
    {header: 'Description', key: 'description'},
    {header: 'Montant', key: 'montant'},
    {header: 'Justificatif', getValue: r => r.justificatif ? 'Oui' : 'Non'},
    {header: 'Statut', getValue: r => EXPENSE_STATUS[r.statut]?.label || ''}
  ], 'notes_frais');
  
  // Tabs dynamiques selon permissions
  const tabsList = [
    {key: 'mes', label: 'Mes notes', count: mesNotes.length}
  ];
  if (isValidateur) {
    tabsList.push({key: 'valider', label: 'À valider', count: notesAValider.length, icon: '🔔'});
  }
  if (isManager || isAdmin) {
    tabsList.push({key: 'approuvees', label: 'À rembourser', count: notesApprouvees.length});
    tabsList.push({key: 'toutes', label: 'Toutes', count: notes.length});
  }

  return (
    <div>
      <PageHeader title="Notes de Frais" subtitle={`${mesNotes.length} notes • ${fmtMoney(stats.totalMes)} total`}
        tabs={tabsList}
        activeTab={tab} onTabChange={setTab}
        action={<div className="flex gap-2">
          <Button variant="secondary" size="sm" onClick={exportNotes} icon="📥">Export</Button>
          <Button onClick={openNew} icon="➕">Nouvelle note</Button>
        </div>}
      />

      {tab === 'mes' && (
        <div className="grid grid-cols-4 gap-4 mb-6">
          <StatCard title="Total soumis" value={fmtMoney(stats.totalMes)} icon="📋" color="blue" />
          <StatCard title="En attente" value={fmtMoney(stats.enAttente)} icon="⏳" color="amber" />
          <StatCard title="Approuvé" value={fmtMoney(stats.approuve)} icon="✅" color="green" />
          <StatCard title="Remboursé" value={fmtMoney(stats.rembourse)} icon="💰" color="purple" />
        </div>
      )}

      {loading ? <Loader /> : (
        <Card>
          <Table columns={[
            {header: 'Référence', render: r => <div><div className="font-medium">{r.reference}</div><div className="text-xs text-slate-400">{fmtDate(r.date_frais)}</div></div>},
            {header: 'Type', render: r => {
              const t = EXPENSE_TYPES.find(x => x.value === r.type_frais);
              return <span>{t?.icon} {t?.label}</span>;
            }},
            {header: 'Mission', render: r => r.projets?.code || <span className="text-slate-400">-</span>},
            {header: 'Description', render: r => <span className="text-sm truncate max-w-xs">{r.description || '-'}</span>},
            {header: 'Montant', render: r => <span className="font-bold">{fmtMoney(r.montant)}</span>},
            {header: 'Justif.', render: r => r.justificatif_url ? (
              <a href={r.justificatif_url} target="_blank" className="text-blue-600 hover:underline">📎 Voir</a>
            ) : r.justificatif ? <Badge color="green">✓</Badge> : <Badge color="gray">-</Badge>},
            {header: 'Statut', render: r => <Badge color={EXPENSE_STATUS[r.statut]?.color}>{EXPENSE_STATUS[r.statut]?.label}</Badge>}
          ]} data={displayNotes} actions={r => (
            <div className="flex gap-1">
              {r.statut === 'draft' && r.utilisateur_id === user.id && (<>
                <Button variant="ghost" size="xs" onClick={() => openEdit(r)} title="Modifier">✏️</Button>
                <Button variant="ghost" size="xs" onClick={() => submitNote(r)} title="Soumettre">📤</Button>
                <Button variant="ghost" size="xs" onClick={() => deleteNote(r)} title="Supprimer">🗑️</Button>
              </>)}
              {r.statut === 'submitted' && tab === 'valider' && (<>
                <Button variant="success" size="xs" onClick={() => approveNote(r)} title="Approuver">✓</Button>
                <Button variant="danger" size="xs" onClick={() => rejectNote(r)} title="Refuser">✗</Button>
              </>)}
              {r.statut === 'approved' && tab === 'approuvees' && (
                <Button variant="ghost" size="xs" onClick={() => markPaid(r)} title="Marquer remboursé">💰</Button>
              )}
            </div>
          )} empty="Aucune note de frais" />
        </Card>
      )}

      {/* Modal Note de frais */}
      <Modal isOpen={modal === 'note'} onClose={() => setModal(null)} title={editItem ? 'Modifier note de frais' : 'Nouvelle note de frais'}>
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4">
            <Input label="Référence" value={form.reference} onChange={v => setForm(p => ({...p, reference: v}))} disabled={!!editItem} />
            <Input label="Date" type="date" value={form.date_frais} onChange={v => setForm(p => ({...p, date_frais: v}))} required />
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Select label="Type de frais" value={form.type_frais} onChange={v => setForm(p => ({...p, type_frais: v}))} options={EXPENSE_TYPES.map(t => ({value: t.value, label: t.icon + ' ' + t.label}))} />
            <Select label="Mission (optionnel)" value={form.projet_id} onChange={v => setForm(p => ({...p, projet_id: v}))} options={missions.map(m => ({value: m.id, label: m.code + ' - ' + m.nom}))} placeholder="Non lié à une mission" />
          </div>
          <Input label="Description" value={form.description} onChange={v => setForm(p => ({...p, description: v}))} placeholder="Ex: Taxi client SONATEL, Déjeuner équipe projet..." />
          <div className="grid grid-cols-2 gap-4">
            <Input label="Montant (FCFA)" type="number" value={form.montant} onChange={v => setForm(p => ({...p, montant: v}))} required />
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1">Justificatif (image/PDF)</label>
              <input 
                type="file" 
                accept="image/*,.pdf"
                onChange={async (e) => {
                  const file = e.target.files?.[0];
                  if (!file) return;
                  // Upload vers Supabase Storage
                  const fileName = `${org.id}/${user.id}/${Date.now()}_${file.name}`;
                  const {data, error} = await supabase.storage.from('justificatifs').upload(fileName, file);
                  if (error) {
                    alert('Erreur upload: ' + error.message);
                    return;
                  }
                  const {data: urlData} = supabase.storage.from('justificatifs').getPublicUrl(fileName);
                  setForm(p => ({...p, justificatif: true, justificatif_url: urlData.publicUrl}));
                  alert('✅ Fichier uploadé !');
                }}
                className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-600 file:cursor-pointer"
              />
              {form.justificatif_url && (
                <a href={form.justificatif_url} target="_blank" className="text-xs text-blue-600 hover:underline mt-1 block">📎 Voir le fichier</a>
              )}
            </div>
          </div>
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button>
            <Button onClick={save} loading={saving} className="flex-1">{editItem ? 'Modifier' : 'Créer'}</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};

const SoustraitancePage = () => {

  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);

  useEffect(() => { loadData(); }, []);
  const loadData = async () => {
    const [p, m, c] = await Promise.all([
      supabase.from('prestataires').select('*').eq('organisation_id', org.id).order('nom'),
      supabase.from('projets').select('id,nom,code').eq('organisation_id', org.id),
      supabase.from('contrats_soustraitance').select('*,prestataires(nom),projets(nom,code)').eq('organisation_id', org.id)
    ]);
    setPrestataires(p.data || []); setMissions(m.data || []); setContrats(c.data || []); setLoading(false);

  const openEditPresta = (p) => { setEditItem(p); setForm({...p}); setModal('presta'); };

    setSaving(true);
    try {

const IntercoPage = () => {
  const {org} = useApp();
  const [transactions, setTransactions] = useState([]);
  const [depts, setDepts] = useState([]);
  const [missions, setMissions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);

  useEffect(() => { loadData(); }, []);
  const loadData = async () => {
    const [t, d, m] = await Promise.all([
      supabase.from('transactions_interco').select('*').eq('organisation_id', org.id).order('created_at', {ascending: false}),
      supabase.from('departements').select('*').eq('organisation_id', org.id),
      supabase.from('projets').select('id,nom,code').eq('organisation_id', org.id)
    ]);
    setTransactions(t.data || []); setDepts(d.data || []); setMissions(m.data || []); setLoading(false);
  };

  const openNew = () => { 
    setEditItem(null);
    setForm({dept_vendeur: '', dept_acheteur: '', projet_id: '', description: '', montant: 0, date: today()}); 
    setModal(true); 
  };
  
  const openEdit = (t) => {
    setEditItem(t);
    setForm({
      dept_vendeur: t.dept_vendeur || '',
      dept_acheteur: t.dept_acheteur || '',
      projet_id: t.projet_id || '',
      description: t.description || '',
      montant: t.montant || 0,
      date: t.date || today()
    });
    setModal(true);
  };
  
  const save = async () => {
    if (!form.dept_vendeur || !form.dept_acheteur) return alert('Départements requis');
    setSaving(true);
    try { 
      const data = {
        dept_vendeur: form.dept_vendeur,
        dept_acheteur: form.dept_acheteur,
        projet_id: form.projet_id || null,
        description: form.description || '',
        montant: parseFloat(form.montant) || 0,
        date: form.date
      };
      
      let result;
      if (editItem?.id) {
        result = await supabase.from('transactions_interco').update(data).eq('id', editItem.id);
      } else {
        result = await supabase.from('transactions_interco').insert([{...data, organisation_id: org.id}]);
      }
      
      if (result.error) throw result.error;
      setModal(false); loadData(); 
    }
    catch(e) { alert('Erreur: ' + e.message); }
    setSaving(false);
  };
  
  const deleteTransaction = async (t) => {
    if (!confirm('Supprimer cette transaction ?')) return;
    await supabase.from('transactions_interco').delete().eq('id', t.id);
    loadData();
  };

  const totalVentes = transactions.reduce((s, t) => s + (t.montant || 0), 0);

  return (
    <div>
      <PageHeader title="Ventes/Achats Interco" subtitle={`${transactions.length} transactions • Total: ${fmtMoney(totalVentes)}`} 
        action={<div className="flex gap-2">
          <Button variant="secondary" size="sm" onClick={() => exportToExcel(transactions, [
            {header: 'Vendeur', getValue: r => depts.find(d => d.id === r.dept_vendeur)?.nom || ''},
            {header: 'Acheteur', getValue: r => depts.find(d => d.id === r.dept_acheteur)?.nom || ''},
            {header: 'Description', key: 'description'},
            {header: 'Montant', key: 'montant'},
            {header: 'Date', key: 'date'}
          ], 'interco')}>📥 Export</Button>
          <Button onClick={openNew} icon="➕">Transaction</Button>
        </div>} 
      />
      {loading ? <Loader /> : (
        <Card>
          <Table columns={[
            {header: 'Vendeur', render: r => <Badge color="green">{depts.find(d => d.id === r.dept_vendeur)?.nom || '-'}</Badge>},
            {header: 'Acheteur', render: r => <Badge color="blue">{depts.find(d => d.id === r.dept_acheteur)?.nom || '-'}</Badge>},
            {header: 'Mission', render: r => {
              const m = missions.find(x => x.id === r.projet_id);
              return m ? <span className="text-sm">{m.code}</span> : '-';
            }},
            {header: 'Description', key: 'description'},
            {header: 'Montant', render: r => <span className="font-bold">{fmtMoney(r.montant)}</span>},
            {header: 'Date', render: r => fmtDate(r.date)}
          ]} data={transactions} actions={r => (
            <div className="flex gap-1">
              <Button variant="ghost" size="xs" onClick={() => openEdit(r)}>✏️</Button>
              <Button variant="ghost" size="xs" onClick={() => deleteTransaction(r)}>🗑️</Button>
            </div>
          )} empty="Aucune transaction interco" />
        </Card>
      )}
      <Modal isOpen={modal} onClose={() => setModal(false)} title={editItem ? 'Modifier transaction' : 'Nouvelle transaction interco'}>
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4">
            <Select label="Département vendeur" value={form.dept_vendeur} onChange={v => setForm(p => ({...p, dept_vendeur: v}))} options={depts.map(d => ({value: d.id, label: d.nom}))} placeholder="Sélectionner" required />
            <Select label="Département acheteur" value={form.dept_acheteur} onChange={v => setForm(p => ({...p, dept_acheteur: v}))} options={depts.map(d => ({value: d.id, label: d.nom}))} placeholder="Sélectionner" required />
          </div>
          <Select label="Mission concernée" value={form.projet_id} onChange={v => setForm(p => ({...p, projet_id: v}))} options={missions.map(m => ({value: m.id, label: m.code + ' - ' + m.nom}))} placeholder="Sélectionner (optionnel)" />
          <Input label="Description" value={form.description} onChange={v => setForm(p => ({...p, description: v}))} placeholder="Ex: Heures de conseil, Formation..." />
          <div className="grid grid-cols-2 gap-4">
            <Input label="Montant (FCFA)" type="number" value={form.montant} onChange={v => setForm(p => ({...p, montant: v}))} />
            <Input label="Date" type="date" value={form.date} onChange={v => setForm(p => ({...p, date: v}))} />
          </div>
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(false)} className="flex-1">Annuler</Button><Button onClick={save} loading={saving} className="flex-1">{editItem ? 'Modifier' : 'Créer'}</Button></div>
        </div>
      </Modal>
    </div>
  );
};
// ========== PROMOTIONS TAB COMPONENT ==========
const PromotionsTab = ({org, collaborateurs, grades}) => {
  const [passages, setPassages] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);

  useEffect(() => { loadPassages(); }, []);

  const loadPassages = async () => {
    const {data} = await supabase.from('passages_grade').select('*').eq('organisation_id', org.id).order('date_effet', {ascending: false});
    setPassages(data || []);
    setLoading(false);
  };

  const openNew = () => {
    setForm({collaborateur_id: '', ancien_grade_id: '', nouveau_grade_id: '', date_effet: today(), motif: ''});
    setModal(true);
  };

  const handleCollabChange = (collabId) => {
    const collab = collaborateurs.find(c => c.id === collabId);
    setForm(p => ({...p, collaborateur_id: collabId, ancien_grade_id: collab?.grade_id || ''}));
  };

  const save = async () => {
    if (!form.collaborateur_id || !form.nouveau_grade_id) return alert('Collaborateur et nouveau grade requis');
    setSaving(true);
    try {
      // Enregistrer le passage
      const {error: e1} = await supabase.from('passages_grade').insert([{
        organisation_id: org.id,
        collaborateur_id: form.collaborateur_id,
        ancien_grade_id: form.ancien_grade_id || null,
        nouveau_grade_id: form.nouveau_grade_id,
        date_effet: form.date_effet,
        motif: form.motif
      }]);
      if (e1) throw e1;

      // Mettre à jour le grade du collaborateur
      const grade = grades.find(g => g.id === form.nouveau_grade_id);
      const {error: e2} = await supabase.from('collaborateurs').update({
        grade_id: form.nouveau_grade_id, 
        taux_journalier: grade?.taux_journalier || 0
      }).eq('id', form.collaborateur_id);
      if (e2) throw e2;

      setModal(false); 
      loadPassages();
    } catch(e) { alert('Erreur: ' + e.message); }
    setSaving(false);
  };

  const getCollab = (id) => collaborateurs.find(c => c.id === id);
  const getGrade = (id) => grades.find(g => g.id === id);

  if (loading) return <Loader />;

  return (
    <div className="space-y-4">
      <Card>
        <div className="flex justify-between items-center mb-4">
          <h3 className="font-semibold">Historique des promotions</h3>
          <Button onClick={openNew} icon="➕" size="sm">Nouvelle promotion</Button>
        </div>

        {passages.length === 0 ? (
          <EmptyState icon="🎖️" title="Aucune promotion" description="Enregistrez les passages de grade ici" />
        ) : (
          <Table columns={[
            {header: 'Collaborateur', render: r => {
              const c = getCollab(r.collaborateur_id);
              return c ? <span className="font-medium">{c.prenom} {c.nom}</span> : '-';
            }},
            {header: 'Ancien grade', render: r => {
              const g = getGrade(r.ancien_grade_id);
              return g ? <Badge color="gray">{g.nom}</Badge> : <span className="text-slate-400">-</span>;
            }},
            {header: '', render: () => <span className="text-green-500">→</span>},
            {header: 'Nouveau grade', render: r => {
              const g = getGrade(r.nouveau_grade_id);
              return g ? <Badge color="green">{g.nom}</Badge> : '-';
            }},
            {header: 'Date effet', render: r => fmtDate(r.date_effet)},
            {header: 'Motif', render: r => <span className="text-sm text-slate-500">{r.motif || '-'}</span>}
          ]} data={passages} />
        )}
      </Card>

      {/* Statistiques */}
      <div className="grid grid-cols-3 gap-4">
        <StatCard title="Promotions ce mois" value={passages.filter(p => p.date_effet?.startsWith(today().substring(0, 7))).length} icon="🎖️" color="green" />
        <StatCard title="Total promotions" value={passages.length} icon="📈" color="blue" />
        <StatCard title="Collaborateurs promouvables" value={collaborateurs.filter(c => c.actif).length} icon="👥" color="purple" />
      </div>

      {/* Modal nouvelle promotion */}
      <Modal isOpen={modal} onClose={() => setModal(false)} title="Nouvelle promotion" size="md">
        <div className="space-y-4">
          <Select label="Collaborateur" value={form.collaborateur_id} onChange={handleCollabChange} 
            options={collaborateurs.filter(c => c.actif).map(c => ({value: c.id, label: c.prenom + ' ' + c.nom}))} 
            placeholder="Sélectionner" required />
          
          {form.collaborateur_id && (
            <div className="p-4 bg-slate-50 rounded-xl">
              <div className="text-sm text-slate-500">Grade actuel</div>
              <div className="font-bold">{getGrade(form.ancien_grade_id)?.nom || 'Non défini'}</div>
            </div>
          )}

          <Select label="Nouveau grade" value={form.nouveau_grade_id} onChange={v => setForm(p => ({...p, nouveau_grade_id: v}))} 
            options={grades.filter(g => g.id !== form.ancien_grade_id).map(g => ({value: g.id, label: g.nom + ' (' + fmt(g.taux_journalier) + ' F/j)'}))} 
            placeholder="Sélectionner" required />

          <Input label="Date d'effet" type="date" value={form.date_effet} onChange={v => setForm(p => ({...p, date_effet: v}))} />
          <TextArea label="Motif" value={form.motif} onChange={v => setForm(p => ({...p, motif: v}))} rows={2} placeholder="Promotion annuelle, performance exceptionnelle..." />

          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(false)} className="flex-1">Annuler</Button>
            <Button onClick={save} loading={saving} className="flex-1">Valider promotion</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};
