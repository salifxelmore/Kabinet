// Fonction d'export Excel générique
const exportToExcel = (data, columns, filename) => {
  if (!data || data.length === 0) {
    alert('Aucune donnée à exporter');
    return;
  }
  
  // Créer le contenu CSV
  const headers = columns.map(c => c.header).join(';');
  const rows = data.map(row => 
    columns.map(c => {
      let val = c.key ? row[c.key] : (c.getValue ? c.getValue(row) : '');
      if (val === null || val === undefined) val = '';
      // Échapper les guillemets et points-virgules
      val = String(val).replace(/"/g, '""');
      if (val.includes(';') || val.includes('"') || val.includes('\n')) {
        val = '"' + val + '"';
      }
      return val;
    }).join(';')
  ).join('\n');
  
  const csv = '\uFEFF' + headers + '\n' + rows; // BOM pour Excel
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename + '_' + today() + '.csv';
  a.click();
  URL.revokeObjectURL(url);
};

const getWeekStart = (date = new Date()) => {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(d.setDate(diff)).toISOString().split('T')[0];
};

const addDays = (date, n) => {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
};

const isWeekend = (date) => {
  const d = new Date(date);
  return d.getDay() === 0 || d.getDay() === 6;
};

const isHoliday = (date, holidays = []) => holidays.includes(date);

const daysBetween = (start, end) => {
  const s = new Date(start);
  const e = new Date(end);
  return Math.ceil((e - s) / (1000 * 60 * 60 * 24));
};

const workingDaysBetween = (start, end, holidays = []) => {
  let count = 0;
  let current = new Date(start);
  const endDate = new Date(end);
  while (current <= endDate) {
    const dateStr = current.toISOString().split('T')[0];
    if (!isWeekend(dateStr) && !isHoliday(dateStr, holidays)) {
      count++;
    }
    current.setDate(current.getDate() + 1);
  }
  return count;
};

const ChartComponent = ({type, data, options = {}, height = 300}) => {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || !data) return;
    if (chartRef.current) chartRef.current.destroy();
    
    const ctx = canvasRef.current.getContext('2d');
    chartRef.current = new Chart(ctx, {
      type,
      data,
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {position: 'bottom', labels: {padding: 20, usePointStyle: true}},
          ...options.plugins
        },
        ...options
      }
    });
    
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [type, data, options]);

  return <div style={{height}}><canvas ref={canvasRef}></canvas></div>;
};

  const handleSubmit = async () => {
    if (!form.cabinet || !form.nom || !form.prenom || !form.email || !form.password) return setError('Tous les champs sont requis');
    if (form.password.length < 6) return setError('Le mot de passe doit contenir au moins 6 caractères');
    setLoading(true); setError('');
    try {
      const {data: auth, error: e1} = await supabase.auth.signUp({email: form.email.toLowerCase().trim(), password: form.password});
      if (e1) throw e1;
      
      const {data: org, error: e2} = await supabase.from('organisations').insert([{nom: form.cabinet}]).select().single();
      if (e2) throw e2;
      
      await supabase.from('utilisateurs').insert([{
        organisation_id: org.id, auth_id: auth.user?.id, nom: form.nom, prenom: form.prenom,

  const getGradeNiveau = () => {
    const niveau = collabData?.grades?.niveau;
    if (niveau && niveau > 0) return niveau;
    
    // Fallback basé sur le nom du grade
    const gradeName = (collabData?.grades?.nom || '').toLowerCase();
    if (gradeName.includes('junior') || gradeName.includes('stagiaire')) return 1;
    if (gradeName.includes('senior') && !gradeName.includes('manager')) return 2;
    if (gradeName.includes('manager') && !gradeName.includes('senior')) return 3;
    if (gradeName.includes('senior manager') || gradeName.includes('directeur')) return 4;
    if (gradeName.includes('associé') || gradeName.includes('partner') || gradeName.includes('associe')) return 5;
    
    return 0; // Pas de grade = pas de droits spéciaux
  };
  
  const gradeNiveau = getGradeNiveau();
  const userRole = (userData.role || '').toLowerCase();
  const isAdmin = userRole === 'admin' || isSuperAdmin;
  
  // IMPORTANT: Les permissions sont basées UNIQUEMENT sur le grade du collaborateur
  // isAdmin donne tous les droits, sinon c'est le niveau du grade qui compte
  const isAssocie = gradeNiveau >= 5 || isAdmin;
  const isManager = gradeNiveau >= 3 || isAdmin;
  const isSenior = gradeNiveau === 2;
  const isJunior = gradeNiveau === 1;
  const isCollaborateur = gradeNiveau > 0 && gradeNiveau <= 2 && !isAdmin; // Junior ou Senior sans droits admin
  const userDeptId = collabData?.departement_id;
  
  // Debug permissions (à retirer en prod)
  console.log('Permissions debug:', { 
    gradeNiveau, 
    gradeNom: collabData?.grades?.nom,
    gradeNiveauBrut: collabData?.grades?.niveau,
    userRole, 
    isAdmin, 
    isManager, 
    isCollaborateur,
    collabEmail: collabData?.email 
  });
  
  // Permissions par fonctionnalité
  const permissions = {
    dashboard: true, // Tout le monde (mais contenu différent)
    staffing: true, // Tout le monde (mais lecture seule pour junior/senior)
    timesheet: true, // Tout le monde
    conges: true, // Tout le monde
    frais: true, // Tout le monde
    profil: true, // Tout le monde peut voir son profil
    crm: isManager && !isCollaborateur, // Manager+ seulement
    missions: isManager && !isCollaborateur, // Manager+ seulement
    facturation: isManager && !isCollaborateur, // Manager+ (leurs missions) et Associé+ (toutes)
    soustraitance: isManager && !isCollaborateur, // Manager+ seulement
    interco: isManager && !isCollaborateur, // Manager+ seulement
    equipe: isAssocie, // Associé+ seulement
    rapports: isManager && !isCollaborateur, // Manager+ seulement
    parametres: isAdmin, // Admin seulement (config organisation)
  };

  // Menu filtré selon permissions
  const fullNav = [
    {k: 'dashboard', l: 'Dashboard', i: '📊'},
    {k: 'crm', l: 'CRM', i: '🏢'},
    {k: 'missions', l: 'Missions', i: '📋'},
    {k: 'staffing', l: 'Staffing', i: '📅'},
    {k: 'timesheet', l: 'Temps', i: '⏱️'},
    {k: 'conges', l: 'Congés', i: '🏖️'},
    {k: 'frais', l: 'Notes de frais', i: '🧾'},
    {k: 'soustraitance', l: 'Sous-traitance', i: '🤝'},
    {k: 'interco', l: 'Interco', i: '🔄'},
    {k: 'facturation', l: 'Facturation', i: '💰'},
    {k: 'equipe', l: 'Équipe', i: '👥'},
    {k: 'rapports', l: 'Rapports', i: '📈'},
    {k: 'profil', l: 'Mon profil', i: '👤'},
    {k: 'parametres', l: 'Paramètres', i: '⚙️'}
  ];
  
  // Filtrer le menu selon les permissions
  const nav = fullNav.filter(n => permissions[n.k]);
  if (isSuperAdmin) nav.push({k: 'admin', l: 'Admin', i: '🛡️'});

  // Contexte enrichi avec permissions
  const ctx = {
    user: userData, 
    collab: collabData,
    org: orgData, 
    abo: aboData, 
    reload: loadUser, 
    isSuperAdmin, 
    setPage, 
    setViewMode,
    // Permissions
    permissions,
    gradeNiveau,
    isAdmin,
    isAssocie,
    isManager,
    isSenior,
    isJunior,
    isCollaborateur, // Junior ou Senior
    userDeptId,
    canEdit: (ressource) => permissions[ressource] !== false,
    canView: (ressource) => permissions[ressource] !== false,
  };

  return (
    <AppContext.Provider value={ctx}>
      <div className="min-h-screen bg-slate-50 flex">
        {sidebarOpen && <div className="fixed inset-0 bg-black/30 z-40 lg:hidden" onClick={() => setSidebarOpen(false)}></div>}

          <div className="p-4 border-b border-slate-100 flex items-center gap-3">

// ========== SUPER ADMIN APP ==========
const SuperAdminApp = ({user, onLogout, onSwitchToOrg, hasOrg = true}) => {
  const [orgs, setOrgs] = useState([]);
  const [users, setUsers] = useState([]);
  const [abos, setAbos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('orgs');
  const [editOrg, setEditOrg] = useState(null);
  const [editForm, setEditForm] = useState({plan: 'trial', date_fin: ''});
  const [saving, setSaving] = useState(false);
  const [linkModal, setLinkModal] = useState(false);
  const [selectedOrg, setSelectedOrg] = useState('');

  useEffect(() => { loadData(); }, []);

  const linkToOrg = async () => {
    if (!selectedOrg) return alert('Sélectionnez une organisation');
    setSaving(true);
    try {
      // Vérifier si l'utilisateur existe déjà
      const {data: existingUser} = await supabase.from('utilisateurs').select('id').eq('auth_id', user.id).maybeSingle();
      
      if (existingUser) {
        // Mettre à jour
        const {error} = await supabase.from('utilisateurs').update({organisation_id: selectedOrg}).eq('id', existingUser.id);
        if (error) throw error;
      } else {
        // Créer
        const {error} = await supabase.from('utilisateurs').insert([{
          auth_id: user.id,
          organisation_id: selectedOrg,
          email: user.email,
          nom: 'Admin',
          prenom: 'Super',
          role: 'Admin'
        }]);
        if (error) throw error;
      }
      setLinkModal(false);
      setSaving(false);
      // Forcer le rechargement complet de la page
      window.location.href = window.location.href;
    } catch(e) { 
      console.error(e);
      alert('Erreur: ' + e.message); 
      setSaving(false);
    }
  };

  const loadData = async () => {
    const [o, u, a] = await Promise.all([
      supabase.from('organisations').select('*').order('created_at', {ascending: false}),
      supabase.from('utilisateurs').select('*,organisations(nom)').order('created_at', {ascending: false}),
      supabase.from('abonnements').select('*,organisations(nom)').order('created_at', {ascending: false})
    ]);
    setOrgs(o.data || []);
    setUsers(u.data || []);
    setAbos(a.data || []);
    setLoading(false);
  };

  const getAbo = (orgId) => abos.find(a => a.organisation_id === orgId);
  
  const openEdit = (org) => {
    const a = getAbo(org.id);
    setEditOrg(org);
    setEditForm({plan: a?.plan || 'trial', date_fin: a?.date_fin?.split('T')[0] || ''});
  };

  const saveAbo = async () => {
    if (!editOrg) return;
    setSaving(true);
    try {
      const a = getAbo(editOrg.id);
      const data = {
        organisation_id: editOrg.id,
        plan: editForm.plan,
        statut: 'actif',
        date_debut: new Date().toISOString(),
        date_fin: editForm.date_fin ? new Date(editForm.date_fin).toISOString() : null,
        montant: PLANS[editForm.plan]?.prix || 0
      };
      if (a?.id) await supabase.from('abonnements').update(data).eq('id', a.id);
      else await supabase.from('abonnements').insert([data]);
      await loadData();
      setEditOrg(null);
    } catch (e) { alert(e.message); }
    setSaving(false);
  };

  const stats = {
    total: orgs.length,
    trial: abos.filter(a => a.plan === 'trial').length,
    standard: abos.filter(a => a.plan === 'standard').length,
    premium: abos.filter(a => a.plan === 'premium').length
  };

  return (
    <div className="min-h-screen bg-slate-50">
      <header className="bg-white border-b border-slate-100 px-6 py-4 flex items-center justify-between sticky top-0 z-30">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 gradient-primary rounded-xl flex items-center justify-center text-white font-bold">K</div>
          <div>
            <div className="font-bold text-slate-800">KabiNet</div>
            <div className="text-xs text-amber-600 font-medium">🛡️ Super Admin</div>
          </div>
        </div>
        <div className="flex items-center gap-4">
          <span className="text-sm text-slate-500 hidden sm:block">{user.email}</span>
          {hasOrg ? (
            <Button variant="primary" size="sm" onClick={onSwitchToOrg}>🏢 Mon Cabinet</Button>
          ) : (
            <Button variant="warning" size="sm" onClick={() => setLinkModal(true)}>🔗 Lier à un cabinet</Button>
          )}
          <Button variant="secondary" size="sm" onClick={onLogout}>Déconnexion</Button>
        </div>
      </header>

      <div className="max-w-7xl mx-auto p-6">
        <h1 className="text-2xl font-bold text-slate-800 mb-6">Administration Globale</h1>

        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <StatCard title="Organisations" value={stats.total} icon="🏢" color="blue" />
          <StatCard title="Essais" value={stats.trial} icon="🎁" color="amber" />
          <StatCard title="Standard" value={stats.standard} icon="⭐" color="green" />
          <StatCard title="Premium" value={stats.premium} icon="👑" color="purple" />
        </div>

        <Card>
          <Tabs tabs={[
            {key: 'orgs', label: 'Organisations', icon: '🏢', count: orgs.length},
            {key: 'users', label: 'Utilisateurs', icon: '👥', count: users.length},
            {key: 'abos', label: 'Abonnements', icon: '💳', count: abos.length}
          ]} active={tab} onChange={setTab} />
          
          <div className="p-4">
            {loading ? <Loader /> : (
              <>
                {tab === 'orgs' && (
                  <Table columns={[
                    {header: 'Cabinet', render: r => <div><div className="font-medium text-slate-800">{r.nom}</div><div className="text-xs text-slate-400">{fmtDate(r.created_at)}</div></div>},
                    {header: 'Plan', render: r => {
                      const a = getAbo(r.id);
                      const plan = PLANS[a?.plan] || PLANS.trial;
                      return <Badge color={plan.color}>{plan.icon} {plan.nom}</Badge>;
                    }},
                    {header: 'Expire', render: r => {
                      const a = getAbo(r.id);
                      if (!a?.date_fin) return '-';
                      const days = daysBetween(today(), a.date_fin);
                      return <span className={days < 0 ? 'text-red-500 font-medium' : days < 7 ? 'text-amber-500' : ''}>{fmtDate(a.date_fin)}</span>;
                    }}
                  ]} data={orgs} actions={r => (
                    <Button variant="ghost" size="xs" onClick={() => openEdit(r)}>✏️</Button>
                  )} />
                )}
                
                {tab === 'users' && (
                  <Table columns={[
                    {header: 'Utilisateur', render: r => <div><div className="font-medium text-slate-800">{r.prenom} {r.nom}</div><div className="text-xs text-slate-400">{r.email}</div></div>},
                    {header: 'Cabinet', render: r => r.organisations?.nom || '-'},
                    {header: 'Rôle', render: r => <Badge color={r.role === 'Admin' ? 'blue' : 'gray'}>{r.role}</Badge>},
                    {header: 'Créé', render: r => fmtDate(r.created_at)}
                  ]} data={users} />
                )}
                
                {tab === 'abos' && (
                  <Table columns={[
                    {header: 'Cabinet', render: r => r.organisations?.nom || '-'},
                    {header: 'Plan', render: r => <Badge color={PLANS[r.plan]?.color || 'gray'}>{PLANS[r.plan]?.nom || r.plan}</Badge>},
                    {header: 'Statut', render: r => <Badge color={r.statut === 'actif' ? 'green' : 'red'}>{r.statut}</Badge>},
                    {header: 'Période', render: r => <span className="text-sm">{fmtDate(r.date_debut)} → {fmtDate(r.date_fin)}</span>}
                  ]} data={abos} />
                )}
              </>
            )}
          </div>
        </Card>
      </div>

      <Modal isOpen={!!editOrg} onClose={() => setEditOrg(null)} title={`Modifier: ${editOrg?.nom}`} size="sm">
        <div className="space-y-4">
          <Select label="Plan" value={editForm.plan} onChange={v => setEditForm(p => ({...p, plan: v}))}
            options={Object.entries(PLANS).map(([k, v]) => ({value: k, label: `${v.icon} ${v.nom} - ${v.prix > 0 ? fmt(v.prix) + ' F/mois' : 'Gratuit'}`}))} />
          <Input label="Date d'expiration" type="date" value={editForm.date_fin} onChange={v => setEditForm(p => ({...p, date_fin: v}))} />
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setEditOrg(null)} className="flex-1">Annuler</Button>
            <Button onClick={saveAbo} loading={saving} className="flex-1">Enregistrer</Button>
          </div>
        </div>
      </Modal>

      <Modal isOpen={linkModal} onClose={() => setLinkModal(false)} title="Lier votre compte à un cabinet" size="sm">
        <div className="space-y-4">
          <p className="text-slate-600 text-sm">Votre compte Super Admin n'est pas encore lié à un cabinet. Sélectionnez le cabinet auquel vous souhaitez accéder :</p>
          <Select label="Cabinet" value={selectedOrg} onChange={setSelectedOrg} 
            options={orgs.map(o => ({value: o.id, label: o.nom}))} placeholder="Sélectionner un cabinet" />
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setLinkModal(false)} className="flex-1">Annuler</Button>
            <Button onClick={linkToOrg} loading={saving} className="flex-1">Lier mon compte</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};
// ========== DASHBOARD PAGE ==========
const DashboardPage = () => {
  const {org, user, collab, isManager, isAdmin, isCollaborateur, setPage} = useApp();
  const [stats, setStats] = useState({});
  const [myStats, setMyStats] = useState({});
  const [loading, setLoading] = useState(true);

  useEffect(() => { loadStats(); }, []);

  const loadStats = async () => {
    // Stats globales (pour managers+)
    if (isManager || isAdmin) {
      const [clients, projets, temps, factures, collabList] = await Promise.all([
        supabase.from('clients').select('id').eq('organisation_id', org.id),
        supabase.from('projets').select('id, statut, budget_montant, montant_facture').eq('organisation_id', org.id),
        supabase.from('saisies_temps').select('heures, facturable').eq('organisation_id', org.id),
        supabase.from('factures').select('montant_total, statut').eq('organisation_id', org.id),
        supabase.from('collaborateurs').select('id, actif').eq('organisation_id', org.id)
      ]);

      const projetsActifs = projets.data?.filter(p => p.statut === 'active') || [];
      const heuresTotal = temps.data?.reduce((s, t) => s + (t.heures || 0), 0) || 0;
      const heuresFact = temps.data?.filter(t => t.facturable).reduce((s, t) => s + (t.heures || 0), 0) || 0;
      const caEncaisse = factures.data?.filter(f => f.statut === 'paid').reduce((s, f) => s + (f.montant_total || 0), 0) || 0;
      const budgetTotal = projets.data?.reduce((s, p) => s + (p.budget_montant || 0), 0) || 0;
      const caFacture = factures.data?.reduce((s, f) => s + (f.montant_total || 0), 0) || 0;
      
      setStats({
        clients: clients.data?.length || 0,
        projetsActifs: projetsActifs.length,
        heuresTotal, heuresFact,
        tauxCharge: heuresTotal > 0 ? Math.round((heuresFact / heuresTotal) * 100) : 0,
        caEncaisse, budgetTotal, caFacture,
        resteFacturer: budgetTotal - caFacture,
        collaborateurs: collabList.data?.filter(c => c.actif).length || 0
      });
    }
    
    // Stats personnelles (pour tous)
    const [mesTemps, mesConges, mesFrais, mesMissions] = await Promise.all([
      supabase.from('saisies_temps').select('heures, facturable, projet_id').eq('utilisateur_id', user.id),
      supabase.from('conges').select('*').eq('utilisateur_id', user.id),
      supabase.from('notes_frais').select('*').eq('utilisateur_id', user.id),
      supabase.from('affectations').select('projet_id').eq('collaborateur_id', collab?.id)
    ]);
    
    const mesHeuresTotal = mesTemps.data?.reduce((s, t) => s + (t.heures || 0), 0) || 0;
    const mesHeuresFact = mesTemps.data?.filter(t => t.facturable).reduce((s, t) => s + (t.heures || 0), 0) || 0;
    const mesHeuresNonFact = mesHeuresTotal - mesHeuresFact;
    
    // Missions uniques sur lesquelles j'ai travaillé
    const missionIds = [...new Set(mesTemps.data?.map(t => t.projet_id).filter(Boolean) || [])];
    
    // Solde congés
    const congesApprouves = (mesConges.data || []).filter(c => c.statut === 'approved' && c.type_conge === 'conge_paye');
    const joursReportAnterieurs = (mesConges.data || []).find(c => c.type_conge === 'report_anterieur')?.nb_jours || 0;
    const dateEntree = user.date_entree ? new Date(user.date_entree) : new Date(new Date().getFullYear(), 0, 1);
    const moisAnciennete = Math.floor((new Date() - dateEntree) / (1000 * 60 * 60 * 24 * 30));
    const joursAcquis = Math.min(moisAnciennete * 2, 24) + joursReportAnterieurs;
    const joursPris = congesApprouves.reduce((s, c) => s + (c.nb_jours || 0), 0);
    const soldeConges = Math.max(0, joursAcquis - joursPris);
    
    // Notes de frais
    const fraisEnAttente = (mesFrais.data || []).filter(f => f.statut === 'submitted').reduce((s, f) => s + (f.montant || 0), 0);
    const fraisApprouves = (mesFrais.data || []).filter(f => f.statut === 'approved').reduce((s, f) => s + (f.montant || 0), 0);
    
    setMyStats({
      nbMissions: missionIds.length,
      heuresTotal: mesHeuresTotal,
      heuresFact: mesHeuresFact,
      heuresNonFact: mesHeuresNonFact,
      tauxCharge: mesHeuresTotal > 0 ? Math.round((mesHeuresFact / mesHeuresTotal) * 100) : 0,
      soldeConges,
      fraisEnAttente,
      fraisApprouves,
      nbFrais: (mesFrais.data || []).length
    });
    
    setLoading(false);
  };

  if (loading) return <Loader text="Chargement..." />;

  // Dashboard Collaborateur (Junior/Senior)
  if (isCollaborateur) {
    return (
      <div>
        <PageHeader title="Mon espace" subtitle={`Bienvenue, ${user.prenom} !`} />
        
        {/* Stats personnelles */}
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <StatCard title="Missions travaillées" value={myStats.nbMissions} icon="📋" color="blue" />
          <StatCard title="Heures facturables" value={fmt(myStats.heuresFact) + 'h'} subtitle={`${myStats.tauxCharge}% du total`} icon="✅" color="green" />
          <StatCard title="Heures non fact." value={fmt(myStats.heuresNonFact) + 'h'} icon="⏱️" color="slate" />
          <StatCard title="Solde congés" value={myStats.soldeConges + 'j'} icon="🏖️" color="purple" />
        </div>
        
        <div className="grid lg:grid-cols-2 gap-6">
          {/* Mes indicateurs */}
          <Card title="📊 Mes indicateurs">
            <div className="space-y-4">
              <div>
                <div className="flex justify-between text-sm mb-1">
                  <span>Taux de chargeabilité</span>
                  <span className="font-medium">{myStats.tauxCharge}%</span>
                </div>
                <ProgressBar value={myStats.heuresFact} max={myStats.heuresTotal || 1} color="green" showLabel={false} />
              </div>
              <div className="grid grid-cols-2 gap-4 pt-4 border-t">
                <div className="text-center">
                  <div className="text-2xl font-bold text-green-600">{fmt(myStats.heuresFact)}h</div>
                  <div className="text-sm text-slate-500">Heures facturables</div>
                </div>
                <div className="text-center">
                  <div className="text-2xl font-bold text-slate-400">{fmt(myStats.heuresNonFact)}h</div>
                  <div className="text-sm text-slate-500">Heures non fact.</div>
                </div>
              </div>
            </div>
          </Card>
          
          {/* Notes de frais */}
          <Card title="🧾 Mes notes de frais">
            <div className="space-y-4">
              <div className="grid grid-cols-2 gap-4">
                <div className="p-4 bg-amber-50 rounded-xl text-center">
                  <div className="text-2xl font-bold text-amber-600">{fmtMoney(myStats.fraisEnAttente)}</div>
                  <div className="text-sm text-amber-700">En attente</div>
                </div>
                <div className="p-4 bg-green-50 rounded-xl text-center">
                  <div className="text-2xl font-bold text-green-600">{fmtMoney(myStats.fraisApprouves)}</div>
                  <div className="text-sm text-green-700">Approuvés</div>
                </div>
              </div>
              <div className="text-center text-slate-500 text-sm">{myStats.nbFrais} note(s) de frais au total</div>
            </div>
          </Card>
        </div>
        
        {/* Actions rapides */}
        <Card title="🎯 Actions rapides" className="mt-6">
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <button onClick={() => setPage('timesheet')} className="p-4 bg-blue-50 rounded-xl text-left hover:bg-blue-100 transition-colors">
              <div className="text-2xl mb-2">⏱️</div>
              <div className="font-medium">Saisir mes temps</div>
            </button>
            <button onClick={() => setPage('conges')} className="p-4 bg-purple-50 rounded-xl text-left hover:bg-purple-100 transition-colors">
              <div className="text-2xl mb-2">🏖️</div>
              <div className="font-medium">Demander congé</div>
            </button>
            <button onClick={() => setPage('frais')} className="p-4 bg-amber-50 rounded-xl text-left hover:bg-amber-100 transition-colors">
              <div className="text-2xl mb-2">🧾</div>
              <div className="font-medium">Note de frais</div>
            </button>
            <button onClick={() => setPage('staffing')} className="p-4 bg-green-50 rounded-xl text-left hover:bg-green-100 transition-colors">
              <div className="text-2xl mb-2">📅</div>
              <div className="font-medium">Mon planning</div>
            </button>
          </div>
        </Card>
      </div>
    );
  }

  // Dashboard Manager/Admin
  return (
    <div>
      <PageHeader title="Tableau de bord" subtitle={`Bienvenue, ${user.prenom} !`} />
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <StatCard title="Missions actives" value={stats.projetsActifs} icon="📋" color="blue" />
        <StatCard title="Heures saisies" value={fmt(stats.heuresTotal) + 'h'} subtitle={`${stats.tauxCharge}% facturable`} icon="⏱️" color="green" />
        <StatCard title="CA encaissé" value={fmtMoney(stats.caEncaisse)} icon="💰" color="purple" />
        <StatCard title="Reste à facturer" value={fmtMoney(stats.resteFacturer)} icon="📊" color="amber" />
      </div>
      <div className="grid lg:grid-cols-2 gap-6">
        <Card title="📊 Indicateurs">
          <div className="space-y-4">
            <div><div className="flex justify-between text-sm mb-1"><span>Budget consommé</span><span className="font-medium">{stats.budgetTotal > 0 ? Math.round((stats.caFacture / stats.budgetTotal) * 100) : 0}%</span></div><ProgressBar value={stats.caFacture} max={stats.budgetTotal} color="blue" showLabel={false} /></div>
            <div><div className="flex justify-between text-sm mb-1"><span>Taux chargeabilité</span><span className="font-medium">{stats.tauxCharge}%</span></div><ProgressBar value={stats.heuresFact} max={stats.heuresTotal} color="green" showLabel={false} /></div>
            <div className="grid grid-cols-2 gap-4 pt-4 border-t"><div className="text-center"><div className="text-2xl font-bold">{stats.clients}</div><div className="text-sm text-slate-500">Clients</div></div><div className="text-center"><div className="text-2xl font-bold">{stats.collaborateurs}</div><div className="text-sm text-slate-500">Collaborateurs</div></div></div>
          </div>
        </Card>
        <Card title="🎯 Actions rapides">
          <div className="grid grid-cols-2 gap-3">
            <button onClick={() => setPage('missions')} className="p-4 bg-blue-50 rounded-xl text-left hover:bg-blue-100 transition-colors"><div className="text-2xl mb-2">➕</div><div className="font-medium">Nouvelle mission</div></button>
            <button onClick={() => setPage('timesheet')} className="p-4 bg-green-50 rounded-xl text-left hover:bg-green-100 transition-colors"><div className="text-2xl mb-2">⏱️</div><div className="font-medium">Saisir mes temps</div></button>
            <button onClick={() => setPage('facturation')} className="p-4 bg-purple-50 rounded-xl text-left hover:bg-purple-100 transition-colors"><div className="text-2xl mb-2">💰</div><div className="font-medium">Créer facture</div></button>
            <button onClick={() => setPage('conges')} className="p-4 bg-amber-50 rounded-xl text-left hover:bg-amber-100 transition-colors"><div className="text-2xl mb-2">🏖️</div><div className="font-medium">Demander congé</div></button>
          </div>
        </Card>
      </div>
    </div>
  );
};

// ========== CRM PAGE ==========
const CRMPage = () => {
  const {org} = useApp();
  const [tab, setTab] = useState('clients');
  const [clients, setClients] = useState([]);
  const [prospects, setProspects] = useState([]);
  const [contacts, setContacts] = useState([]);
  const [opportunites, setOpportunites] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [filterType, setFilterType] = useState('');
  const [modal, setModal] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);

  useEffect(() => { loadData(); }, []);

  const loadData = async () => {
    const [c, co, op] = await Promise.all([
      supabase.from('clients').select('*').eq('organisation_id', org.id).order('nom'),
      supabase.from('contacts').select('*,clients(nom)').eq('organisation_id', org.id).order('nom'),
      supabase.from('opportunites').select('*,clients(nom)').eq('organisation_id', org.id).order('created_at', {ascending: false})
    ]);
    const allClients = c.data || [];
    // Séparer clients (est_prospect = false ou null) et prospects (est_prospect = true)
    setClients(allClients.filter(x => !x.est_prospect));
    setProspects(allClients.filter(x => x.est_prospect === true));
    setContacts(co.data || []);
    setOpportunites(op.data || []);
    setLoading(false);
  };

  // CLIENT CRUD
  const openNewClient = () => { setEditItem(null); setForm({code: genCode('CLI'), type_client: 'entreprise', nom: '', denomination: '', ninea: '', adresse: '', ville: 'DAKAR', email: '', telephone: '', est_prospect: false}); setModal('client'); };
  const openEditClient = (c) => { setEditItem(c); setForm({...c}); setModal('client'); };
  const saveClient = async () => {
    if (!form.nom && !form.denomination) return alert('Nom requis');
    setSaving(true);
    try {
      const data = {...form, nom: form.denomination || form.nom};
      if (editItem?.id) await supabase.from('clients').update(data).eq('id', editItem.id);
      else await supabase.from('clients').insert([{...data, organisation_id: org.id}]);
      setModal(null); loadData();
    } catch (e) { alert(e.message); }
    setSaving(false);
  };
  const deleteClient = async (c) => { if (!confirm(`Supprimer "${c.nom}" ?`)) return; await supabase.from('clients').delete().eq('id', c.id); loadData(); };
  
  // PROSPECT CRUD
  const openNewProspect = () => { setEditItem(null); setForm({code: genCode('PRO'), type_client: 'entreprise', nom: '', denomination: '', ninea: '', adresse: '', ville: 'DAKAR', email: '', telephone: '', est_prospect: true}); setModal('prospect'); };
  const openEditProspect = (p) => { setEditItem(p); setForm({...p}); setModal('prospect'); };
  const saveProspect = async () => {
    if (!form.nom && !form.denomination) return alert('Nom requis');
    setSaving(true);
    try {
      const data = {...form, nom: form.denomination || form.nom, est_prospect: true};
      if (editItem?.id) await supabase.from('clients').update(data).eq('id', editItem.id);
      else await supabase.from('clients').insert([{...data, organisation_id: org.id}]);
      setModal(null); loadData();
    } catch (e) { alert(e.message); }
    setSaving(false);
  };
  const convertToClient = async (p) => {
    if (!confirm(`Convertir "${p.nom}" en client ?`)) return;
    await supabase.from('clients').update({est_prospect: false, code: genCode('CLI')}).eq('id', p.id);
    loadData();
  };

  // CONTACT CRUD
  const openNewContact = (clientId = '') => { setEditItem(null); setForm({client_id: clientId, nom: '', prenom: '', fonction: '', email: '', telephone: '', principal: false}); setModal('contact'); };
  const openEditContact = (c) => { setEditItem(c); setForm({...c}); setModal('contact'); };
  const saveContact = async () => {
    if (!form.nom || !form.client_id) return alert('Client et nom requis');
    setSaving(true);
    try {
      const data = {
        client_id: form.client_id,
        nom: form.nom,
        prenom: form.prenom || '',
        fonction: form.fonction || '',
        email: form.email || '',
        telephone: form.telephone || '',
        mobile: form.mobile || '',
        principal: form.principal || false
      };
      
      let result;
      if (editItem?.id) {
        result = await supabase.from('contacts').update(data).eq('id', editItem.id);
      } else {
        result = await supabase.from('contacts').insert([{...data, organisation_id: org.id}]);
      }
      
      if (result.error) throw result.error;
      setModal(null); loadData();
    } catch (e) { 
      console.error('Contact save error:', e);
      alert('Erreur: ' + e.message); 
    }
    setSaving(false);
  };
  const deleteContact = async (c) => { if (!confirm(`Supprimer "${c.prenom} ${c.nom}" ?`)) return; await supabase.from('contacts').delete().eq('id', c.id); loadData(); };

  // OPPORTUNITE CRUD
  const allClientsAndProspects = [...clients, ...prospects]; // Pour le select dans le modal
  const openNewOpp = () => { setEditItem(null); setForm({code: genCode('OPP'), nom: '', client_id: '', nouveau_prospect: false, prospect_nom: '', prospect_email: '', prospect_telephone: '', montant: 0, probabilite: 50, stage: 'prospect', date_cloture_prevue: ''}); setModal('opportunite'); };
  const openEditOpp = (o) => { setEditItem(o); setForm({...o, date_cloture_prevue: o.date_cloture_prevue?.split('T')[0] || '', nouveau_prospect: false}); setModal('opportunite'); };
  
  const saveOpp = async () => {
    setSaving(true);
    try {
      let clientId = form.client_id;
      
      // Si nouveau prospect, le créer d'abord
      if (form.nouveau_prospect && form.prospect_nom) {
        const prospectData = {
          code: genCode('PRO'),
          nom: form.prospect_nom,
          email: form.prospect_email || '',
          telephone: form.prospect_telephone || '',
          type_client: 'entreprise',
          ville: 'DAKAR',
          est_prospect: true,
          organisation_id: org.id
        };
        const {data: newProspect, error: prospectError} = await supabase.from('clients').insert([prospectData]).select().single();
        if (prospectError) throw prospectError;
        clientId = newProspect.id;
      }
      
      if (!form.nom || !clientId) return alert('Nom et client/prospect requis');
      
      const ref = form.code || genCode('OPP');
      const data = {
        reference: ref,
        nom: form.nom,
        client_id: clientId,
        description: form.description || '',
        montant: parseFloat(form.montant) || 0,
        probabilite: parseInt(form.probabilite) || 50,
        stage: form.stage || 'prospect',
        date_cloture_prevue: form.date_cloture_prevue || null
      };
      
      let result;
      if (editItem?.id) {
        data.reference = editItem.reference || ref;
        result = await supabase.from('opportunites').update(data).eq('id', editItem.id);
      } else {
        result = await supabase.from('opportunites').insert([{...data, organisation_id: org.id}]);
      }
      
      if (result.error) throw result.error;
      setModal(null); loadData();
    } catch (e) { 
      console.error('Opportunite save error:', e);
      alert('Erreur: ' + e.message); 
    }
    setSaving(false);
  };
  
  // Mettre à jour le stage d'une opportunité (avec conversion auto prospect -> client si gagné)
  const updateOppStage = async (o, stage) => { 
    try {
      // Important: inclure reference pour éviter l'erreur NOT NULL
      const {error} = await supabase.from('opportunites').update({
        stage,
        reference: o.reference || o.code || genCode('OPP')
      }).eq('id', o.id); 
      if (error) throw error;
      
      // Si l'opportunité passe à "gagne", convertir le prospect en client
      if (stage === 'gagne' && o.client_id) {
        // Vérifier si c'est un prospect
        const prospect = prospects.find(p => p.id === o.client_id);
        if (prospect) {
          await supabase.from('clients').update({
            est_prospect: false,
            code: genCode('CLI')
          }).eq('id', o.client_id);
          // Notification
          alert(`✅ Opportunité gagnée ! Le prospect "${prospect.nom}" a été converti en client.`);
        }
      }
      
      loadData(); 
    } catch(e) {
      console.error('Update stage error:', e);
      alert('Erreur: ' + e.message);
    }
  };

  const filteredClients = clients.filter(c => {
    const matchSearch = c.nom?.toLowerCase().includes(search.toLowerCase()) || c.ninea?.toLowerCase().includes(search.toLowerCase());
    const matchType = !filterType || c.type_client === filterType;
    return matchSearch && matchType;
  });
  const filteredProspects = prospects.filter(p => {
    const matchSearch = p.nom?.toLowerCase().includes(search.toLowerCase()) || p.email?.toLowerCase().includes(search.toLowerCase());
    const matchType = !filterType || p.type_client === filterType;
    return matchSearch && matchType;
  });
  const filteredContacts = contacts.filter(c => c.nom?.toLowerCase().includes(search.toLowerCase()) || c.prenom?.toLowerCase().includes(search.toLowerCase()));
  const oppActives = opportunites.filter(o => !['gagne', 'perdu'].includes(o.stage));
  const totalPipeline = oppActives.reduce((s, o) => s + (o.montant * o.probabilite / 100), 0);
  
  const exportClients = () => exportToExcel(clients, [
    {header: 'Code', key: 'code'},
    {header: 'Nom', key: 'nom'},
    {header: 'Type', getValue: r => CLIENT_TYPES.find(t => t.value === r.type_client)?.label || ''},
    {header: 'NINEA', key: 'ninea'},
    {header: 'Ville', key: 'ville'},
    {header: 'Email', key: 'email'},
    {header: 'Téléphone', key: 'telephone'}
  ], 'clients');

  return (
    <div>
      <PageHeader title="CRM" subtitle={`${clients.length} clients • ${prospects.length} prospects • ${contacts.length} contacts • ${opportunites.length} opportunités`}
        tabs={[
          {key: 'clients', label: 'Clients', icon: '🏢', count: clients.length}, 
          {key: 'prospects', label: 'Prospects', icon: '🎯', count: prospects.length},
          {key: 'contacts', label: 'Contacts', icon: '👤', count: contacts.length}, 
          {key: 'opportunites', label: 'Opportunités', icon: '💰', count: opportunites.length}, 
          {key: 'pipeline', label: 'Pipeline', icon: '📊'}
        ]}
        activeTab={tab} onTabChange={setTab}
        action={<div className="flex gap-2">
          <Button variant="secondary" size="sm" onClick={exportClients} icon="📥">Export</Button>
          {tab === 'prospects' && <Button size="sm" onClick={openNewProspect} icon="➕">Prospect</Button>}
          {tab === 'clients' && <Button size="sm" onClick={openNewClient} icon="➕">Client</Button>}
          {tab === 'contacts' && <Button size="sm" onClick={() => openNewContact()} icon="➕">Contact</Button>}
          {(tab === 'opportunites' || tab === 'pipeline') && <Button size="sm" onClick={openNewOpp} icon="➕">Opportunité</Button>}
        </div>}
      />

      {loading ? <Loader /> : (<>
        {tab === 'clients' && (
          <Card>
            <div className="flex gap-4 mb-4">
              <SearchInput value={search} onChange={setSearch} placeholder="Rechercher..." className="flex-1" />
              <Select value={filterType} onChange={setFilterType} options={CLIENT_TYPES} placeholder="Tous les types" className="w-48" />
              {filterType && <Button variant="ghost" size="sm" onClick={() => setFilterType('')}>🔄</Button>}
            </div>
            <Table columns={[
              {header: 'Client', render: r => <div><div className="font-medium">{r.nom}</div><div className="text-xs text-slate-400">{r.code} • {CLIENT_TYPES.find(t => t.value === r.type_client)?.label}</div></div>},
              {header: 'NINEA', render: r => r.ninea || '-'},
              {header: 'Ville', key: 'ville'},
              {header: 'Contact', render: r => <div className="text-sm"><div>{r.email}</div><div className="text-slate-400">{r.telephone}</div></div>}
            ]} data={filteredClients} actions={r => <div className="flex gap-1"><Button variant="ghost" size="xs" onClick={() => openNewContact(r.id)}>👤</Button><Button variant="ghost" size="xs" onClick={() => openEditClient(r)}>✏️</Button><Button variant="ghost" size="xs" onClick={() => deleteClient(r)}>🗑️</Button></div>} />
          </Card>
        )}
        
        {tab === 'prospects' && (
          <Card>
            <div className="flex gap-4 mb-4">
              <SearchInput value={search} onChange={setSearch} placeholder="Rechercher..." className="flex-1" />
              <Select value={filterType} onChange={setFilterType} options={CLIENT_TYPES} placeholder="Tous les types" className="w-48" />
              {filterType && <Button variant="ghost" size="sm" onClick={() => setFilterType('')}>🔄</Button>}
            </div>
            {filteredProspects.length === 0 ? (
              <div className="text-center py-12 text-slate-400">
                <div className="text-4xl mb-4">🎯</div>
                <p>Aucun prospect pour l'instant</p>
                <p className="text-sm mt-2">Les prospects sont créés lors de la saisie d'une opportunité ou manuellement</p>
              </div>
            ) : (
              <Table columns={[
                {header: 'Prospect', render: r => <div><div className="font-medium">{r.nom}</div><div className="text-xs text-slate-400">{r.code} • {CLIENT_TYPES.find(t => t.value === r.type_client)?.label}</div></div>},
                {header: 'Contact', render: r => <div className="text-sm"><div>{r.email || '-'}</div><div className="text-slate-400">{r.telephone || '-'}</div></div>},
                {header: 'Ville', key: 'ville'},
                {header: 'Opportunités', render: r => {
                  const oppCount = opportunites.filter(o => o.client_id === r.id).length;
                  return oppCount > 0 ? <Badge color="blue">{oppCount}</Badge> : <span className="text-slate-400">-</span>;
                }}
              ]} data={filteredProspects} actions={r => (
                <div className="flex gap-1">
                  <Button variant="success" size="xs" onClick={() => convertToClient(r)} title="Convertir en client">✓ Client</Button>
                  <Button variant="ghost" size="xs" onClick={() => openEditProspect(r)} title="Modifier">✏️</Button>
                  <Button variant="ghost" size="xs" onClick={() => deleteClient(r)} title="Supprimer">🗑️</Button>
                </div>
              )} />
            )}
          </Card>
        )}

        {tab === 'contacts' && (
          <Card>
            <div className="mb-4"><SearchInput value={search} onChange={setSearch} placeholder="Rechercher..." /></div>
            <Table columns={[
              {header: 'Contact', render: r => <div><div className="font-medium">{r.prenom} {r.nom}</div><div className="text-xs text-slate-400">{r.fonction}</div></div>},
              {header: 'Client', render: r => r.clients?.nom || '-'},
              {header: 'Email', key: 'email'},
              {header: 'Téléphone', render: r => r.telephone || '-'},
              {header: 'Principal', render: r => r.principal ? <Badge color="green">✓</Badge> : ''}
            ]} data={filteredContacts} actions={r => <div className="flex gap-1"><Button variant="ghost" size="xs" onClick={() => openEditContact(r)}>✏️</Button><Button variant="ghost" size="xs" onClick={() => deleteContact(r)}>🗑️</Button></div>} />
          </Card>
        )}

        {tab === 'opportunites' && (
          <Card action={<Button size="sm" onClick={openNewOpp} icon="➕">Opportunité</Button>}>
            <div className="grid grid-cols-3 gap-4 mb-6 p-4 bg-slate-50 rounded-xl">
              <div className="text-center"><div className="text-2xl font-bold">{oppActives.length}</div><div className="text-sm text-slate-500">En cours</div></div>
              <div className="text-center"><div className="text-2xl font-bold text-green-600">{fmtMoney(totalPipeline)}</div><div className="text-sm text-slate-500">Pipeline pondéré</div></div>
              <div className="text-center"><div className="text-2xl font-bold">{opportunites.filter(o => o.stage === 'gagne').length}</div><div className="text-sm text-slate-500">Gagnées</div></div>
            </div>
            <Table columns={[
              {header: 'Opportunité', render: r => <div><div className="font-medium">{r.nom}</div><div className="text-xs text-slate-400">{r.code}</div></div>},
              {header: 'Client', render: r => r.clients?.nom || '-'},
              {header: 'Montant', render: r => <span className="font-medium">{fmtMoney(r.montant)}</span>},
              {header: 'Proba', render: r => <span>{r.probabilite}%</span>},
              {header: 'Stage', render: r => { const s = OPPORTUNITY_STAGES.find(s => s.id === r.stage); return <Badge color={s?.color}>{s?.nom}</Badge>; }},
              {header: 'Clôture', render: r => r.date_cloture_prevue ? fmtDate(r.date_cloture_prevue) : '-'}
            ]} data={opportunites} actions={r => <div className="flex gap-1"><Button variant="ghost" size="xs" onClick={() => openEditOpp(r)}>✏️</Button></div>} />
          </Card>
        )}

        {tab === 'pipeline' && (
          <div>
            {/* Pipeline actif */}
            <div className="flex gap-4 overflow-x-auto pb-4">
              {OPPORTUNITY_STAGES.filter(s => !['gagne', 'perdu'].includes(s.id)).map(stage => {
                const opps = opportunites.filter(o => o.stage === stage.id);
                const total = opps.reduce((s, o) => s + o.montant, 0);
                return (
                  <div key={stage.id} className="pipeline-stage flex-shrink-0">
                    <div className="bg-slate-100 rounded-t-xl p-3">
                      <div className="flex justify-between items-center"><span className="font-medium">{stage.nom}</span><Badge color={stage.color}>{opps.length}</Badge></div>
                      <div className="text-sm text-slate-500 mt-1">{fmtMoney(total)}</div>
                    </div>
                    <div className="bg-slate-50 rounded-b-xl p-2 min-h-[300px] space-y-2">
                      {opps.map(o => (
                        <div key={o.id} className="kanban-card bg-white p-3 rounded-lg shadow-sm border hover:shadow-md transition-shadow cursor-pointer" onClick={() => openEditOpp(o)}>
                          <div className="font-medium text-sm">{o.nom}</div>
                          <div className="text-xs text-slate-400">{o.clients?.nom}</div>
                          <div className="flex justify-between items-center mt-2">
                            <span className="text-sm font-medium text-green-600">{fmtMoney(o.montant)}</span>
                            <span className="text-xs text-slate-400">{o.probabilite}%</span>
                          </div>
                          {/* Boutons pour passer à Gagné/Perdu */}
                          <div className="flex gap-1 mt-2 pt-2 border-t">
                            <Button size="xs" variant="success" onClick={(e) => { e.stopPropagation(); updateOppStage(o, 'gagne'); }}>✓ Gagné</Button>
                            <Button size="xs" variant="danger" onClick={(e) => { e.stopPropagation(); updateOppStage(o, 'perdu'); }}>✗ Perdu</Button>

                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}

            {/* Résultats: Gagné et Perdu */}
            <div className="grid grid-cols-2 gap-4 mt-6">
              {/* Colonne Gagné */}
              <Card className="border-green-200 bg-green-50/50">
                <div className="flex justify-between items-center mb-4">

                  <Badge color="green">{opportunites.filter(o => o.stage === 'gagne').length}</Badge>

              </Card>
              
              {/* Colonne Perdu */}
              <Card className="border-red-200 bg-red-50/50">
                <div className="flex justify-between items-center mb-4">

                <div className="space-y-2 max-h-48 overflow-y-auto">
                  {opportunites.filter(o => o.stage === 'perdu').map(o => (
                    <div key={o.id} className="bg-white p-2 rounded-lg text-sm flex justify-between items-center">
                      <div>
                        <div className="font-medium">{o.nom}</div>
                        <div className="text-xs text-slate-400">{o.clients?.nom}</div>

                      <span className="font-bold text-red-600">{fmtMoney(o.montant)}</span>

                </div>
              </Card>
            </div>
          </div>
        )}
      </>)}

      {/* MODAL CLIENT */}
      <Modal isOpen={modal === 'client'} onClose={() => setModal(null)} title={editItem ? 'Modifier client' : 'Nouveau client'} size="lg">
        <div className="space-y-4">
          <Select label="Type de client" value={form.type_client} onChange={v => setForm(p => ({...p, type_client: v}))} options={CLIENT_TYPES} required />
          {form.type_client === 'entreprise' ? (<>
            <div className="grid grid-cols-2 gap-4"><Input label="Code" value={form.code} onChange={v => setForm(p => ({...p, code: v}))} /><Input label="NINEA" value={form.ninea} onChange={v => setForm(p => ({...p, ninea: v}))} /></div>

          <Input label="Adresse" value={form.adresse} onChange={v => setForm(p => ({...p, adresse: v}))} />
          <div className="grid grid-cols-2 gap-4"><Input label="Ville" value={form.ville} onChange={v => setForm(p => ({...p, ville: v}))} /><Input label="Pays" value={form.pays || 'Sénégal'} onChange={v => setForm(p => ({...p, pays: v}))} /></div>
          <div className="grid grid-cols-2 gap-4"><Input label="Email" type="email" value={form.email} onChange={v => setForm(p => ({...p, email: v}))} /><Input label="Téléphone" value={form.telephone} onChange={v => setForm(p => ({...p, telephone: v}))} /></div>

      <Modal isOpen={modal === 'contact'} onClose={() => setModal(null)} title={editItem ? 'Modifier contact' : 'Nouveau contact'}>
        <div className="space-y-4">
          <Select label="Client" value={form.client_id} onChange={v => setForm(p => ({...p, client_id: v}))} options={clients.map(c => ({value: c.id, label: c.nom}))} placeholder="Sélectionner" required />
          <div className="grid grid-cols-2 gap-4"><Input label="Prénom" value={form.prenom} onChange={v => setForm(p => ({...p, prenom: v}))} /><Input label="Nom" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} required /></div>
          <Input label="Fonction" value={form.fonction} onChange={v => setForm(p => ({...p, fonction: v}))} placeholder="Ex: Directeur Financier" />
          <div className="grid grid-cols-2 gap-4"><Input label="Email" type="email" value={form.email} onChange={v => setForm(p => ({...p, email: v}))} /><Input label="Téléphone" value={form.telephone} onChange={v => setForm(p => ({...p, telephone: v}))} /></div>
          <Checkbox label="Contact principal" checked={form.principal} onChange={v => setForm(p => ({...p, principal: v}))} />
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button><Button onClick={saveContact} loading={saving} className="flex-1">Enregistrer</Button></div>
        </div>
      </Modal>

      {/* MODAL OPPORTUNITE */}
      <Modal isOpen={modal === 'opportunite'} onClose={() => setModal(null)} title={editItem ? 'Modifier opportunité' : 'Nouvelle opportunité'} size="lg">
        <div className="space-y-4">
          <Input label="Code" value={form.code} onChange={v => setForm(p => ({...p, code: v}))} />
          <Input label="Nom de l'opportunité" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} required placeholder="Ex: Audit comptable 2026" />
          
          {/* Choix Client existant ou Nouveau prospect */}
          {!editItem && (
            <div className="p-4 bg-slate-50 rounded-xl space-y-4">
              <div className="flex gap-4">
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="radio" checked={!form.nouveau_prospect} onChange={() => setForm(p => ({...p, nouveau_prospect: false, client_id: ''}))} className="w-4 h-4" />
                  <span className="font-medium">Client ou Prospect existant</span>
                </label>
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="radio" checked={form.nouveau_prospect} onChange={() => setForm(p => ({...p, nouveau_prospect: true, client_id: ''}))} className="w-4 h-4" />
                  <span className="font-medium">Nouveau prospect</span>
                </label>
              </div>
              
              {!form.nouveau_prospect ? (
                <Select 
                  label="Client / Prospect" 
                  value={form.client_id} 
                  onChange={v => setForm(p => ({...p, client_id: v}))} 
                  options={[
                    ...clients.map(c => ({value: c.id, label: '🏢 ' + c.nom})),
                    ...prospects.map(p => ({value: p.id, label: '🎯 ' + p.nom}))
                  ]} 
                  placeholder="Sélectionner un client ou prospect" 
                  required 
                />
              ) : (
                <div className="space-y-3">
                  <Input label="Nom du prospect" value={form.prospect_nom} onChange={v => setForm(p => ({...p, prospect_nom: v}))} required placeholder="Ex: SONATEL SA" />
                  <div className="grid grid-cols-2 gap-4">
                    <Input label="Email" type="email" value={form.prospect_email} onChange={v => setForm(p => ({...p, prospect_email: v}))} placeholder="contact@example.com" />
                    <Input label="Téléphone" value={form.prospect_telephone} onChange={v => setForm(p => ({...p, prospect_telephone: v}))} placeholder="+221 77 000 00 00" />
                  </div>
                </div>
              )}
            </div>
          )}
          
          {/* En mode édition, juste afficher le client */}
          {editItem && (
            <Select label="Client / Prospect" value={form.client_id} onChange={v => setForm(p => ({...p, client_id: v}))} options={allClientsAndProspects.map(c => ({value: c.id, label: c.nom}))} required />
          )}
          
          <div className="grid grid-cols-3 gap-4">
            <Input label="Montant (FCFA)" type="number" value={form.montant} onChange={v => setForm(p => ({...p, montant: v}))} />
            <Input label="Probabilité (%)" type="number" value={form.probabilite} onChange={v => setForm(p => ({...p, probabilite: v}))} min={0} max={100} />
            <Select label="Étape" value={form.stage} onChange={v => setForm(p => ({...p, stage: v}))} options={OPPORTUNITY_STAGES.map(s => ({value: s.id, label: s.nom}))} />
          </div>
          <Input label="Date clôture prévue" type="date" value={form.date_cloture_prevue} onChange={v => setForm(p => ({...p, date_cloture_prevue: v}))} />
          <TextArea label="Description" value={form.description} onChange={v => setForm(p => ({...p, description: v}))} rows={3} />
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button>
            <Button onClick={saveOpp} loading={saving} className="flex-1">Enregistrer</Button>
          </div>
        </div>
      </Modal>
      
      {/* MODAL PROSPECT */}
      <Modal isOpen={modal === 'prospect'} onClose={() => setModal(null)} title={editItem ? 'Modifier prospect' : 'Nouveau prospect'} size="lg">
        <div className="space-y-4">
          <Select label="Type" value={form.type_client} onChange={v => setForm(p => ({...p, type_client: v}))} options={CLIENT_TYPES} required />
          {form.type_client === 'entreprise' ? (<>
            <div className="grid grid-cols-2 gap-4">
              <Input label="Code" value={form.code} onChange={v => setForm(p => ({...p, code: v}))} />
              <Input label="NINEA" value={form.ninea} onChange={v => setForm(p => ({...p, ninea: v}))} />
            </div>
            <Input label="Dénomination sociale" value={form.denomination} onChange={v => setForm(p => ({...p, denomination: v}))} required />
          </>) : (
            <div className="grid grid-cols-2 gap-4">
              <Input label="Code" value={form.code} onChange={v => setForm(p => ({...p, code: v}))} />
              <Input label="Nom" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} required />
            </div>
          )}
          <Input label="Adresse" value={form.adresse} onChange={v => setForm(p => ({...p, adresse: v}))} />
          <div className="grid grid-cols-2 gap-4">
            <Input label="Ville" value={form.ville || 'DAKAR'} onChange={v => setForm(p => ({...p, ville: v}))} />
            <Input label="Pays" value={form.pays || 'Sénégal'} onChange={v => setForm(p => ({...p, pays: v}))} />
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Input label="Email" type="email" value={form.email} onChange={v => setForm(p => ({...p, email: v}))} />
            <Input label="Téléphone" value={form.telephone} onChange={v => setForm(p => ({...p, telephone: v}))} />
          </div>
          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button>
            <Button onClick={saveProspect} loading={saving} className="flex-1">Enregistrer</Button>
          </div>

    </div>
  );
};
// ========== MISSIONS PAGE ==========
const MissionsPage = () => {
  const {org} = useApp();
  const [missions, setMissions] = useState([]);
  const [clients, setClients] = useState([]);
  const [depts, setDepts] = useState([]);
  const [managers, setManagers] = useState([]); // Collaborateurs grade >= Manager
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [modal, setModal] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [acomptes, setAcomptes] = useState([]);

  useEffect(() => { loadData(); }, []);

  const loadData = async () => {
    const [m, c, d, a, collabs, grades] = await Promise.all([
      supabase.from('projets').select('*,clients(nom),departements:departement_id(nom),responsable:responsable_id(id,nom,prenom)').eq('organisation_id', org.id).order('created_at', {ascending: false}),
      supabase.from('clients').select('id,nom').eq('organisation_id', org.id).eq('est_prospect', false),
      supabase.from('departements').select('id,nom').eq('organisation_id', org.id),
      supabase.from('acomptes').select('*').eq('organisation_id', org.id),
      supabase.from('collaborateurs').select('*,grades:grade_id(nom,niveau)').eq('organisation_id', org.id).eq('actif', true),
      supabase.from('grades').select('*').eq('organisation_id', org.id)
    ]);
    setMissions(m.data || []);
    setClients(c.data || []);
    setDepts(d.data || []);
    setAcomptes(a.data || []);
    // Filtrer les collaborateurs avec grade >= Manager (niveau >= 3)
    const allCollabs = collabs.data || [];
    const mgrs = allCollabs.filter(c => c.grades?.niveau >= 3);
    setManagers(mgrs);
    setLoading(false);
  };

  const openNew = () => {
    setEditItem(null);
    setForm({
      code: genCode('MIS'), nom: '', client_id: '', departement_id: '',
      type_facturation: 'regie', statut: 'draft', budget_montant: 0,
      date_debut: today(), date_fin_prevue: '', description: '', facturable: true,
      responsable_id: ''
    });
    setModal('mission');
  };

  const openEdit = (m) => {
    setEditItem(m);
    setForm({...m, date_debut: m.date_debut?.split('T')[0] || '', date_fin_prevue: m.date_fin_prevue?.split('T')[0] || ''});
    setModal('mission');
  };

  const save = async () => {
    if (!form.nom || !form.client_id) return alert('Client et nom requis');
    setSaving(true);
    try {
      // Ne garder que les champs valides pour la table projets
      const data = {
        code: form.code,
        nom: form.nom,
        client_id: form.client_id || null,
        departement_id: form.departement_id || null,
        responsable_id: form.responsable_id || null,
        type_facturation: form.type_facturation,
        statut: form.statut,
        budget_montant: parseFloat(form.budget_montant) || 0,
        date_debut: form.date_debut || null,
        date_fin_prevue: form.date_fin_prevue || null,
        description: form.description || '',
        facturable: form.facturable !== false
      };
      
      if (editItem?.id) {
        const {error} = await supabase.from('projets').update(data).eq('id', editItem.id);
        if (error) throw error;
      } else {
        const {error} = await supabase.from('projets').insert([{...data, organisation_id: org.id}]);
        if (error) throw error;
      }
      setModal(null); 
      loadData();
    } catch (e) { 
      console.error('Save error:', e);
      alert('Erreur: ' + e.message); 
    }
    setSaving(false);
  };

  const openAcomptes = (m) => { setEditItem(m); setModal('acomptes'); };

  const deleteMission = async (m) => {
    // Vérifier s'il y a des heures saisies sur cette mission
    const {data: temps} = await supabase.from('saisies_temps').select('id').eq('projet_id', m.id);
    const hasTemps = temps && temps.length > 0;
    
    let confirmMsg = `Supprimer la mission "${m.nom}" ?`;
    if (hasTemps) {
      confirmMsg = `⚠️ ATTENTION: Cette mission a ${temps.length} saisie(s) de temps.\n\nSupprimer la mission "${m.nom}" ?\n\nToutes les heures et factures liées seront supprimées.`;
    }
    
    if (!confirm(confirmMsg)) return;
    
    // Supprimer les données liées
    await supabase.from('saisies_temps').delete().eq('projet_id', m.id);
    await supabase.from('acomptes').delete().eq('projet_id', m.id);
    await supabase.from('factures').delete().eq('projet_id', m.id);
    // Supprimer la mission
    await supabase.from('projets').delete().eq('id', m.id);
    
    loadData();
  };

  const addAcompte = async () => {
    const missionAcomptes = acomptes.filter(a => a.projet_id === editItem.id);
    const totalAcomptes = missionAcomptes.reduce((s, a) => s + (a.montant || 0), 0);
    const reste = (editItem.budget_montant || 0) - totalAcomptes;
    const num = missionAcomptes.length + 1;
    
    const montant = parseFloat(prompt(`Montant de l'acompte ${num} (Reste: ${fmt(reste)} F):`, reste)) || 0;
    if (montant <= 0) return;
    
    await supabase.from('acomptes').insert([{
      organisation_id: org.id,
      projet_id: editItem.id,
      numero: num,
      montant,
      date_prevu: today(),
      statut: 'prevu'
    }]);
    
    const newTotal = totalAcomptes + montant;
    await supabase.from('projets').update({montant_facture: newTotal}).eq('id', editItem.id);
    loadData();
  };

  const getMissionAcomptes = (missionId) => acomptes.filter(a => a.projet_id === missionId);
  const getMissionTotalFacture = (m) => getMissionAcomptes(m.id).reduce((s, a) => s + (a.montant || 0), 0);
  const getMissionResteFacturer = (m) => (m.budget_montant || 0) - getMissionTotalFacture(m);
  const getMissionProgress = (m) => m.budget_montant > 0 ? Math.round((getMissionTotalFacture(m) / m.budget_montant) * 100) : 0;

  // Calcul dépassement délai
  const getDelaiStatus = (m) => {
    if (!m.date_fin_prevue) return null;
    const days = daysBetween(today(), m.date_fin_prevue);
    if (m.statut === 'completed') return {status: 'ok', label: 'Terminé'};
    if (days < 0) return {status: 'late', label: `${Math.abs(days)}j de retard`, color: 'red'};
    if (days <= 7) return {status: 'warning', label: `${days}j restants`, color: 'yellow'};
    return {status: 'ok', label: `${days}j restants`, color: 'green'};
  };

  const filtered = missions.filter(m => {
    if (search && !m.nom?.toLowerCase().includes(search.toLowerCase()) && !m.code?.toLowerCase().includes(search.toLowerCase())) return false;
    if (filterStatus && m.statut !== filterStatus) return false;
    return true;
  });

  const stats = {
    total: missions.length,
    actives: missions.filter(m => m.statut === 'active').length,
    budget: missions.reduce((s, m) => s + (m.budget_montant || 0), 0),
    facture: missions.reduce((s, m) => s + getMissionTotalFacture(m), 0)
  };
  
  const exportMissions = () => exportToExcel(filtered, [
    {header: 'Code', key: 'code'},
    {header: 'Nom', key: 'nom'},
    {header: 'Client', getValue: r => r.clients?.nom || ''},
    {header: 'Département', getValue: r => r.departements?.nom || ''},
    {header: 'Type', getValue: r => r.type_facturation === 'forfait' ? 'Forfait' : 'Régie'},
    {header: 'Budget', key: 'budget_montant'},
    {header: 'Facturé', getValue: r => getMissionTotalFacture(r)},
    {header: 'Reste', getValue: r => getMissionResteFacturer(r)},
    {header: 'Date début', key: 'date_debut'},
    {header: 'Date fin prévue', key: 'date_fin_prevue'},
    {header: 'Statut', getValue: r => MISSION_STATUS[r.statut]?.label || ''}
  ], 'missions');

  return (
    <div>
      <PageHeader title="Missions" subtitle={`${stats.actives} actives sur ${stats.total} • Budget: ${fmtMoney(stats.budget)}`}
        action={<div className="flex gap-2">
          <Button variant="secondary" size="sm" onClick={exportMissions} icon="📥">Export</Button>
          <Button onClick={openNew} icon="➕">Nouvelle mission</Button>
        </div>} />

      {loading ? <Loader /> : (
        <Card>
          <div className="flex flex-col sm:flex-row gap-4 mb-4">
            <SearchInput value={search} onChange={setSearch} placeholder="Rechercher..." className="flex-1" />
            <Select value={filterStatus} onChange={setFilterStatus} options={Object.entries(MISSION_STATUS).map(([k, v]) => ({value: k, label: v.label}))} placeholder="Tous statuts" className="w-40" />
          </div>

          <Table columns={[
            {header: 'Mission', render: r => (
              <div>
                <div className="font-medium">{r.nom}</div>
                <div className="text-xs text-slate-400">{r.code}</div>
              </div>
            )},
            {header: 'Client', render: r => r.clients?.nom || '-'},
            {header: 'Responsable', render: r => r.responsable ? (
              <span className="text-sm">{r.responsable.prenom} {r.responsable.nom}</span>
            ) : <span className="text-slate-400">-</span>},
            {header: 'Type', render: r => <Badge>{r.type_facturation === 'forfait' ? 'Forfait' : 'Régie'}</Badge>},
            {header: 'Budget', render: r => (
              <div>
                <div className="font-medium">{fmtMoney(r.budget_montant)}</div>
                <ProgressBar value={getMissionTotalFacture(r)} max={r.budget_montant} color={getMissionProgress(r) >= 100 ? 'green' : 'blue'} size="sm" showLabel={false} />
                <div className="text-xs text-slate-400 mt-1">Reste: {fmtMoney(getMissionResteFacturer(r))}</div>
              </div>
            )},
            {header: 'Délai', render: r => {
              const d = getDelaiStatus(r);
              if (!d) return '-';
              return <Badge color={d.color}>{d.label}</Badge>;
            }},
            {header: 'Statut', render: r => <Badge color={MISSION_STATUS[r.statut]?.color}>{MISSION_STATUS[r.statut]?.label}</Badge>}
          ]} data={filtered} actions={r => (
            <div className="flex gap-1">
              <Button variant="ghost" size="xs" onClick={() => openAcomptes(r)} title="Acomptes">💰</Button>
              <Button variant="ghost" size="xs" onClick={() => openEdit(r)} title="Modifier">✏️</Button>
              <Button variant="ghost" size="xs" onClick={() => deleteMission(r)} title="Supprimer">🗑️</Button>
            </div>
          )} />
        </Card>
      )}

      {/* MODAL MISSION */}
      <Modal isOpen={modal === 'mission'} onClose={() => setModal(null)} title={editItem ? 'Modifier mission' : 'Nouvelle mission'} size="lg">
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4">
            <Input label="Code" value={form.code} onChange={v => setForm(p => ({...p, code: v}))} />
            <Select label="Client" value={form.client_id} onChange={v => setForm(p => ({...p, client_id: v}))} options={clients.map(c => ({value: c.id, label: c.nom}))} placeholder="Sélectionner" required />
          </div>
