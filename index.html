    const [p, m, c] = await Promise.all([
      supabase.from('prestataires').select('*').eq('organisation_id', org.id).order('nom'),
      supabase.from('projets').select('id,nom,code').eq('organisation_id', org.id),
      supabase.from('contrats_soustraitance').select('*,prestataires(nom),projets(nom,code)').eq('organisation_id', org.id)
    ]);
    setPrestataires(p.data || []); setMissions(m.data || []); setContrats(c.data || []); setLoading(false);
  };

  // Prestataire CRUD
  const openNewPresta = () => { setEditItem(null); setForm({code: genCode('PRE'), nom: '', prenom: '', type: 'entreprise', ninea: '', adresse: '', email: '', telephone: '', rib: '', specialite: ''}); setModal('presta'); };
  const openEditPresta = (p) => { setEditItem(p); setForm({...p}); setModal('presta'); };
  const savePresta = async () => {
    if (!form.nom) return alert('Nom requis');
    setSaving(true);
    try {
      if (editItem?.id) await supabase.from('prestataires').update(form).eq('id', editItem.id);
      else await supabase.from('prestataires').insert([{...form, organisation_id: org.id}]);
      setModal(null); loadData();
    } catch(e) { alert(e.message); }
    setSaving(false);
  };
  const deletePresta = async (p) => { if (!confirm(`Supprimer "${p.nom}" ?`)) return; await supabase.from('prestataires').delete().eq('id', p.id); loadData(); };

  // Contrat CRUD
  const openNewContrat = () => { setEditItem(null); setForm({prestataire_id: '', projet_id: '', montant: 0, date_debut: today(), date_fin: '', description: '', statut: 'actif'}); setModal('contrat'); };
  const saveContrat = async () => {
    if (!form.prestataire_id) return alert('Prestataire requis');

    catch(e) { alert(e.message); }

  };

  return (

      <PageHeader title="Sous-traitance" subtitle={prestataires.length + ' prestataires'}

      />
      {loading ? <Loader /> : (<>
        {tab === 'presta' && (
          <Card>
            <Table columns={[
              {header: 'Prestataire', render: r => <div><div className="font-medium">{r.prenom ? r.prenom + ' ' : ''}{r.nom}</div><div className="text-xs text-slate-400">{r.code} • {r.type === 'entreprise' ? 'Entreprise' : 'Indépendant'}</div></div>},
              {header: 'Spécialité', key: 'specialite'},
              {header: 'Contact', render: r => <div><div>{r.email}</div><div className="text-xs text-slate-400">{r.telephone}</div></div>},
              {header: 'RIB', render: r => r.rib ? <span className="text-xs font-mono">{r.rib}</span> : '-'}
            ]} data={prestataires} actions={r => (
              <div className="flex gap-1">
                <Button variant="ghost" size="xs" onClick={() => openEditPresta(r)}>✏️</Button>
                <Button variant="ghost" size="xs" onClick={() => deletePresta(r)}>🗑️</Button>
              </div>
            )} />
          </Card>
        )}
        {tab === 'contrats' && (
          <Card>
            <Table columns={[
              {header: 'Prestataire', render: r => r.prestataires?.nom || '-'},
              {header: 'Mission', render: r => r.projets ? r.projets.code + ' - ' + r.projets.nom : '-'},
              {header: 'Montant', render: r => <span className="font-bold">{fmtMoney(r.montant)}</span>},
              {header: 'Période', render: r => <span>{fmtDate(r.date_debut)} → {fmtDate(r.date_fin)}</span>},
              {header: 'Statut', render: r => <Badge color={r.statut === 'actif' ? 'green' : 'gray'}>{r.statut}</Badge>}
            ]} data={contrats} />
          </Card>
        )}
      </>)}

      {/* Modal Prestataire */}
      <Modal isOpen={modal === 'presta'} onClose={() => setModal(null)} title={editItem ? 'Modifier prestataire' : 'Nouveau prestataire'} size="lg">

          </div>
          <div className="grid grid-cols-2 gap-4">
            <Input label="Nom / Raison sociale" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} required />
            <Input label="Prénom (si indépendant)" value={form.prenom} onChange={v => setForm(p => ({...p, prenom: v}))} />

          <Input label="Spécialité" value={form.specialite} onChange={v => setForm(p => ({...p, specialite: v}))} placeholder="Ex: Développement web, Audit fiscal..." />

          <Input label="RIB / IBAN" value={form.rib} onChange={v => setForm(p => ({...p, rib: v}))} placeholder="SN..." />

          </div>
          <div className="grid grid-cols-2 gap-4">
            <Input label="Date début" type="date" value={form.date_debut} onChange={v => setForm(p => ({...p, date_debut: v}))} />
            <Input label="Date fin" type="date" value={form.date_fin} onChange={v => setForm(p => ({...p, date_fin: v}))} />
          </div>
          <TextArea label="Description" value={form.description} onChange={v => setForm(p => ({...p, description: v}))} rows={2} />

        </div>
      </Modal>
    </div>
  );
};

      const data = {...form, projet_id: form.projet_id || null};
      await supabase.from('transactions_interco').insert([{...data, organisation_id: org.id}]); 
      setModal(false); loadData(); 
    }

    setSaving(false);

  return (
    <div>

            {header: 'Mission', render: r => r.projets ? <span className="text-sm">{r.projets.code}</span> : '-'},
            {header: 'Description', key: 'description'},
            {header: 'Montant', render: r => <span className="font-bold">{fmtMoney(r.montant)}</span>},
            {header: 'Date', render: r => fmtDate(r.date)}
          ]} data={transactions} empty="Aucune transaction interco" />
        </Card>
      )}
      <Modal isOpen={modal} onClose={() => setModal(false)} title="Nouvelle transaction interco">
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4">
            <Select label="Département vendeur" value={form.dept_vendeur} onChange={v => setForm(p => ({...p, dept_vendeur: v}))} options={depts.map(d => ({value: d.id, label: d.nom}))} placeholder="Sélectionner" required />
            <Select label="Département acheteur" value={form.dept_acheteur} onChange={v => setForm(p => ({...p, dept_acheteur: v}))} options={depts.map(d => ({value: d.id, label: d.nom}))} placeholder="Sélectionner" required />
          </div>
          <Select label="Mission concernée" value={form.projet_id} onChange={v => setForm(p => ({...p, projet_id: v}))} options={missions.map(m => ({value: m.id, label: m.code + ' - ' + m.nom}))} placeholder="Sélectionner (optionnel)" />
          <Input label="Description" value={form.description} onChange={v => setForm(p => ({...p, description: v}))} placeholder="Ex: Heures de conseil, Formation..." />
          <div className="grid grid-cols-2 gap-4">
            <Input label="Montant (FCFA)" type="number" value={form.montant} onChange={v => setForm(p => ({...p, montant: v}))} />
            <Input label="Date" type="date" value={form.date} onChange={v => setForm(p => ({...p, date: v}))} />
          </div>
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(false)} className="flex-1">Annuler</Button><Button onClick={save} loading={saving} className="flex-1">Créer</Button></div>
        </div>
      </Modal>
    </div>
  );
};

  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);

  useEffect(() => { loadPassages(); }, []);

  const loadPassages = async () => {
    const {data} = await supabase.from('passages_grade').select('*').eq('organisation_id', org.id).order('date_effet', {ascending: false});
    setPassages(data || []);
    setLoading(false);
  };

  const openNew = () => {
    setForm({collaborateur_id: '', ancien_grade_id: '', nouveau_grade_id: '', date_effet: today(), motif: ''});
    setModal(true);
  };

  const handleCollabChange = (collabId) => {
    const collab = collaborateurs.find(c => c.id === collabId);
    setForm(p => ({...p, collaborateur_id: collabId, ancien_grade_id: collab?.grade_id || ''}));
  };

  const save = async () => {
    if (!form.collaborateur_id || !form.nouveau_grade_id) return alert('Collaborateur et nouveau grade requis');
    setSaving(true);
    try {
      // Enregistrer le passage
      const {error: e1} = await supabase.from('passages_grade').insert([{
        organisation_id: org.id,
        collaborateur_id: form.collaborateur_id,
        ancien_grade_id: form.ancien_grade_id || null,
        nouveau_grade_id: form.nouveau_grade_id,
        date_effet: form.date_effet,
        motif: form.motif
      }]);
      if (e1) throw e1;

      // Mettre à jour le grade du collaborateur
      const grade = grades.find(g => g.id === form.nouveau_grade_id);
      const {error: e2} = await supabase.from('collaborateurs').update({
        grade_id: form.nouveau_grade_id, 
        taux_journalier: grade?.taux_journalier || 0
      }).eq('id', form.collaborateur_id);
      if (e2) throw e2;

      setModal(false); 
      loadPassages();
    } catch(e) { alert('Erreur: ' + e.message); }
    setSaving(false);
  };

  const getCollab = (id) => collaborateurs.find(c => c.id === id);
  const getGrade = (id) => grades.find(g => g.id === id);

  if (loading) return <Loader />;

  return (
    <div className="space-y-4">
      <Card>
        <div className="flex justify-between items-center mb-4">
          <h3 className="font-semibold">Historique des promotions</h3>
          <Button onClick={openNew} icon="➕" size="sm">Nouvelle promotion</Button>
        </div>

        {passages.length === 0 ? (
          <EmptyState icon="🎖️" title="Aucune promotion" description="Enregistrez les passages de grade ici" />
        ) : (
          <Table columns={[
            {header: 'Collaborateur', render: r => {
              const c = getCollab(r.collaborateur_id);
              return c ? <span className="font-medium">{c.prenom} {c.nom}</span> : '-';
            }},
            {header: 'Ancien grade', render: r => {
              const g = getGrade(r.ancien_grade_id);
              return g ? <Badge color="gray">{g.nom}</Badge> : <span className="text-slate-400">-</span>;
            }},
            {header: '', render: () => <span className="text-green-500">→</span>},
            {header: 'Nouveau grade', render: r => {
              const g = getGrade(r.nouveau_grade_id);
              return g ? <Badge color="green">{g.nom}</Badge> : '-';
            }},
            {header: 'Date effet', render: r => fmtDate(r.date_effet)},
            {header: 'Motif', render: r => <span className="text-sm text-slate-500">{r.motif || '-'}</span>}
          ]} data={passages} />
        )}
      </Card>

      {/* Statistiques */}
      <div className="grid grid-cols-3 gap-4">
        <StatCard title="Promotions ce mois" value={passages.filter(p => p.date_effet?.startsWith(today().substring(0, 7))).length} icon="🎖️" color="green" />
        <StatCard title="Total promotions" value={passages.length} icon="📈" color="blue" />
        <StatCard title="Collaborateurs promouvables" value={collaborateurs.filter(c => c.actif).length} icon="👥" color="purple" />
      </div>

      {/* Modal nouvelle promotion */}
      <Modal isOpen={modal} onClose={() => setModal(false)} title="Nouvelle promotion" size="md">
        <div className="space-y-4">
          <Select label="Collaborateur" value={form.collaborateur_id} onChange={handleCollabChange} 
            options={collaborateurs.filter(c => c.actif).map(c => ({value: c.id, label: c.prenom + ' ' + c.nom}))} 
            placeholder="Sélectionner" required />
          
          {form.collaborateur_id && (
            <div className="p-4 bg-slate-50 rounded-xl">
              <div className="text-sm text-slate-500">Grade actuel</div>
              <div className="font-bold">{getGrade(form.ancien_grade_id)?.nom || 'Non défini'}</div>
            </div>
          )}

          <Select label="Nouveau grade" value={form.nouveau_grade_id} onChange={v => setForm(p => ({...p, nouveau_grade_id: v}))} 
            options={grades.filter(g => g.id !== form.ancien_grade_id).map(g => ({value: g.id, label: g.nom + ' (' + fmt(g.taux_journalier) + ' F/j)'}))} 
            placeholder="Sélectionner" required />

          <Input label="Date d'effet" type="date" value={form.date_effet} onChange={v => setForm(p => ({...p, date_effet: v}))} />
          <TextArea label="Motif" value={form.motif} onChange={v => setForm(p => ({...p, motif: v}))} rows={2} placeholder="Promotion annuelle, performance exceptionnelle..." />

          <div className="flex gap-3 pt-4">
            <Button variant="secondary" onClick={() => setModal(false)} className="flex-1">Annuler</Button>
            <Button onClick={save} loading={saving} className="flex-1">Valider promotion</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};

// ========== EQUIPE PAGE ==========
const EquipePage = () => {
  const {org} = useApp();
  const [collaborateurs, setCollaborateurs] = useState([]);
  const [grades, setGrades] = useState([]);
  const [depts, setDepts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('collab');
  const [modal, setModal] = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);

  useEffect(() => { loadData(); }, []);

  const loadData = async () => {
    const [c, g, d] = await Promise.all([
      supabase.from('collaborateurs').select('*,grades(nom,taux_journalier),departements(nom)').eq('organisation_id', org.id).order('nom'),
      supabase.from('grades').select('*').eq('organisation_id', org.id).order('niveau', {ascending: false}),
      supabase.from('departements').select('*').eq('organisation_id', org.id).order('nom')
    ]);
    setCollaborateurs(c.data || []); setGrades(g.data || []); setDepts(d.data || []); setLoading(false);
  };

  // Collaborateur CRUD
  const openNewCollab = () => { setEditItem(null); setForm({code: genCode('EMP'), nom: '', prenom: '', email: '', telephone: '', departement_id: '', grade_id: '', date_entree: today(), actif: true}); setModal('collab'); };
  const openEditCollab = (c) => { setEditItem(c); setForm({...c, date_entree: c.date_entree?.split('T')[0]}); setModal('collab'); };
  const saveCollab = async () => {
    if (!form.nom || !form.prenom) return alert('Nom et prénom requis');
    setSaving(true);
    try {
      const grade = grades.find(g => g.id === form.grade_id);
      const data = {...form, taux_journalier: grade?.taux_journalier || 0};
      if (editItem?.id) await supabase.from('collaborateurs').update(data).eq('id', editItem.id);
      else await supabase.from('collaborateurs').insert([{...data, organisation_id: org.id}]);
      setModal(null); loadData();
    } catch(e) { alert(e.message); }
    setSaving(false);
  };

  // Passage de grade
  const openPassageGrade = (c) => {
    setEditItem(c);
    setForm({collaborateur_id: c.id, ancien_grade_id: c.grade_id, nouveau_grade_id: '', date_effet: today(), motif: ''});
    setModal('passage');
  };
  const savePassage = async () => {
    if (!form.nouveau_grade_id) return alert('Nouveau grade requis');
    setSaving(true);
    try {
      await supabase.from('passages_grade').insert([{...form, organisation_id: org.id}]);
      const grade = grades.find(g => g.id === form.nouveau_grade_id);
      await supabase.from('collaborateurs').update({grade_id: form.nouveau_grade_id, taux_journalier: grade?.taux_journalier}).eq('id', editItem.id);
      setModal(null); loadData();
    } catch(e) { alert(e.message); }
    setSaving(false);
  };

  const actifs = collaborateurs.filter(c => c.actif);

  return (
    <div>
      <PageHeader title="Équipe" subtitle={actifs.length + ' collaborateurs actifs'}
        tabs={[{key: 'collab', label: 'Collaborateurs', count: collaborateurs.length}, {key: 'grades', label: 'Passages de grade', icon: '🎖️'}]}
        activeTab={tab} onTabChange={setTab}
        action={<Button onClick={openNewCollab} icon="➕">Collaborateur</Button>}
      />

      {loading ? <Loader /> : (<>
        {tab === 'collab' && (
          <Card>
            <Table columns={[
              {header: 'Collaborateur', render: r => <div><div className="font-medium">{r.prenom} {r.nom}</div><div className="text-xs text-slate-400">{r.code}</div></div>},
              {header: 'Email', key: 'email'},
              {header: 'Département', render: r => r.departements?.nom || '-'},
              {header: 'Grade', render: r => <Badge color="blue">{r.grades?.nom || '-'}</Badge>},
              {header: 'TJ', render: r => r.taux_journalier ? fmt(r.taux_journalier) + ' F' : '-'},
              {header: 'Statut', render: r => <Badge color={r.actif ? 'green' : 'gray'}>{r.actif ? 'Actif' : 'Inactif'}</Badge>}
            ]} data={collaborateurs} actions={r => (
              <div className="flex gap-1">
                <Button variant="ghost" size="xs" onClick={() => openPassageGrade(r)} title="Passage grade">🎖️</Button>
                <Button variant="ghost" size="xs" onClick={() => openEditCollab(r)}>✏️</Button>
              </div>
            )} />
          </Card>
        )}

        {tab === 'grades' && (
          <PromotionsTab org={org} collaborateurs={collaborateurs} grades={grades} />
        )}
      </>)}

      {/* Modal Collaborateur */}
      <Modal isOpen={modal === 'collab'} onClose={() => setModal(null)} title={editItem ? 'Modifier collaborateur' : 'Nouveau collaborateur'} size="lg">
        <div className="space-y-4">
          <div className="grid grid-cols-3 gap-4">
            <Input label="Code" value={form.code} onChange={v => setForm(p => ({...p, code: v}))} />
            <Input label="Prénom" value={form.prenom} onChange={v => setForm(p => ({...p, prenom: v}))} required />
            <Input label="Nom" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} required />
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Input label="Email" type="email" value={form.email} onChange={v => setForm(p => ({...p, email: v}))} />
            <Input label="Téléphone" value={form.telephone} onChange={v => setForm(p => ({...p, telephone: v}))} />
          </div>
          <div className="grid grid-cols-3 gap-4">
            <Select label="Département" value={form.departement_id} onChange={v => setForm(p => ({...p, departement_id: v}))} options={depts.map(d => ({value: d.id, label: d.nom}))} placeholder="Sélectionner" />
            <Select label="Grade" value={form.grade_id} onChange={v => setForm(p => ({...p, grade_id: v}))} options={grades.map(g => ({value: g.id, label: g.nom + ' - ' + fmt(g.taux_journalier) + ' F'}))} placeholder="Sélectionner" />
            <Input label="Date entrée" type="date" value={form.date_entree} onChange={v => setForm(p => ({...p, date_entree: v}))} />
          </div>
          <Checkbox label="Collaborateur actif" checked={form.actif} onChange={v => setForm(p => ({...p, actif: v}))} />
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button><Button onClick={saveCollab} loading={saving} className="flex-1">Enregistrer</Button></div>
        </div>
      </Modal>

      {/* Modal Passage Grade */}
      <Modal isOpen={modal === 'passage'} onClose={() => setModal(null)} title={'Passage de grade - ' + editItem?.prenom + ' ' + editItem?.nom}>
        <div className="space-y-4">
          <div className="p-4 bg-slate-50 rounded-xl">
            <div className="text-sm text-slate-500">Grade actuel</div>
            <div className="font-bold">{grades.find(g => g.id === editItem?.grade_id)?.nom || 'Non défini'}</div>
          </div>
          <Select label="Nouveau grade" value={form.nouveau_grade_id} onChange={v => setForm(p => ({...p, nouveau_grade_id: v}))} options={grades.filter(g => g.id !== editItem?.grade_id).map(g => ({value: g.id, label: g.nom + ' - ' + fmt(g.taux_journalier) + ' F/j'}))} placeholder="Sélectionner" required />
          <Input label="Date d'effet" type="date" value={form.date_effet} onChange={v => setForm(p => ({...p, date_effet: v}))} />
          <TextArea label="Motif" value={form.motif} onChange={v => setForm(p => ({...p, motif: v}))} rows={2} placeholder="Promotion annuelle, performance..." />
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setModal(null)} className="flex-1">Annuler</Button><Button onClick={savePassage} loading={saving} className="flex-1">Valider passage</Button></div>
        </div>
      </Modal>
    </div>
  );
};

// ========== RAPPORTS PAGE ==========
const RapportsPage = () => {
  const {org} = useApp();
  const [data, setData] = useState({});
  const [loading, setLoading] = useState(true);
  const [period, setPeriod] = useState('month'); // month, quarter, year
  const [tab, setTab] = useState('global');

  useEffect(() => { loadData(); }, [period]);

  const getPeriodDates = () => {
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    
    if (period === 'month') {
      const start = new Date(year, month, 1);
      const end = new Date(year, month + 1, 0);
      return { start: start.toISOString().split('T')[0], end: end.toISOString().split('T')[0], label: 'Ce mois' };
    } else if (period === 'quarter') {
      const qMonth = Math.floor(month / 3) * 3;
      const start = new Date(year, qMonth, 1);
      const end = new Date(year, qMonth + 3, 0);
      return { start: start.toISOString().split('T')[0], end: end.toISOString().split('T')[0], label: 'Ce trimestre' };
    } else {
      const start = new Date(year, 0, 1);
      const end = new Date(year, 11, 31);
      return { start: start.toISOString().split('T')[0], end: end.toISOString().split('T')[0], label: 'Cette année' };
    }
  };

  const loadData = async () => {
    setLoading(true);
    const {start, end} = getPeriodDates();
    
    const [temps, factures, collabs, missions, clients, conges] = await Promise.all([
      supabase.from('saisies_temps').select('heures,facturable,date,projet_id').eq('organisation_id', org.id).gte('date', start).lte('date', end),
      supabase.from('factures').select('montant_total,montant_encaisse,statut,date_emission,client_id').eq('organisation_id', org.id),
      supabase.from('collaborateurs').select('*,grades(taux_journalier)').eq('organisation_id', org.id).eq('actif', true),
      supabase.from('projets').select('*,clients(nom)').eq('organisation_id', org.id),
      supabase.from('clients').select('*').eq('organisation_id', org.id),
      supabase.from('conges').select('*').eq('organisation_id', org.id).eq('statut', 'approved')
    ]);

    const h = temps.data || [];
    const heuresTotal = h.reduce((s, t) => s + (t.heures || 0), 0);
    const heuresFact = h.filter(t => t.facturable).reduce((s, t) => s + (t.heures || 0), 0);
    const heuresNonFact = heuresTotal - heuresFact;
    
    const f = factures.data || [];
    const fPeriod = f.filter(x => x.date_emission >= start && x.date_emission <= end);
    const caTotal = fPeriod.reduce((s, x) => s + (x.montant_total || 0), 0);
    const caEncaisse = f.filter(x => x.statut === 'paid').reduce((s, x) => s + (x.montant_total || 0), 0);
    const caEnAttente = f.filter(x => x.statut === 'sent').reduce((s, x) => s + ((x.montant_total || 0) - (x.montant_encaisse || 0)), 0);
    
    const m = missions.data || [];
    const missionsActives = m.filter(x => x.statut === 'active').length;
    const budgetTotal = m.reduce((s, x) => s + (x.budget_montant || 0), 0);
    
    // Production valorisée (heures * taux moyen)
    const tauxMoyen = collabs.data?.length > 0 ? collabs.data.reduce((s, c) => s + (c.grades?.taux_journalier || 0), 0) / collabs.data.length / 8 : 0;
    const production = heuresFact * tauxMoyen;

    // Top clients par CA
    const clientsCA = {};
    f.forEach(fac => {
      if (fac.client_id) {
        clientsCA[fac.client_id] = (clientsCA[fac.client_id] || 0) + (fac.montant_total || 0);
      }
    });
    const topClients = Object.entries(clientsCA)
      .map(([id, ca]) => ({id, ca, nom: clients.data?.find(c => c.id === id)?.nom || 'Inconnu'}))
      .sort((a, b) => b.ca - a.ca)
      .slice(0, 5);

    // Top missions par heures
    const missionsHeures = {};
    h.forEach(t => {
      if (t.projet_id) {
        missionsHeures[t.projet_id] = (missionsHeures[t.projet_id] || 0) + (t.heures || 0);
      }
    });
    const topMissions = Object.entries(missionsHeures)
      .map(([id, heures]) => ({id, heures, nom: m.find(x => x.id === id)?.nom || 'Inconnue', code: m.find(x => x.id === id)?.code}))
      .sort((a, b) => b.heures - a.heures)
      .slice(0, 5);

    // Jours de congés
    const joursConges = (conges.data || []).reduce((s, c) => s + (c.nb_jours || 0), 0);

    setData({
      heuresTotal, heuresFact, heuresNonFact,
      tauxCharge: heuresTotal > 0 ? Math.round((heuresFact / heuresTotal) * 100) : 0,
      caTotal, caEncaisse, caEnAttente, budgetTotal, production,
      rentabilite: budgetTotal > 0 ? Math.round((caEncaisse / budgetTotal) * 100) : 0,
      missionsActives, totalMissions: m.length,
      nbCollabs: collabs.data?.length || 0,
      nbClients: clients.data?.length || 0,
      topClients, topMissions, joursConges, tauxMoyen
    });
    setLoading(false);
  };

  if (loading) return <Loader />;

  const {label} = getPeriodDates();

  return (
    <div>
      <PageHeader title="Rapports & Analyses" subtitle={label}
        tabs={[
          {key: 'global', label: 'Vue globale'},
          {key: 'temps', label: 'Temps'},
          {key: 'finance', label: 'Finance'},
          {key: 'clients', label: 'Clients'}
        ]}
        activeTab={tab} onTabChange={setTab}
        action={
          <div className="flex gap-2">
            <Select value={period} onChange={setPeriod} options={[
              {value: 'month', label: 'Ce mois'},
              {value: 'quarter', label: 'Ce trimestre'},
              {value: 'year', label: 'Cette année'}
            ]} className="w-40" />
          </div>
        }
      />
      
      {tab === 'global' && (<>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <StatCard title="Heures totales" value={fmt(data.heuresTotal) + 'h'} icon="⏱️" color="blue" />
          <StatCard title="Taux chargeabilité" value={data.tauxCharge + '%'} icon="📊" color="purple" trend={data.tauxCharge >= 75 ? 'up' : 'down'} />
          <StatCard title="CA facturé" value={fmtMoney(data.caTotal)} icon="📄" color="green" />
          <StatCard title="CA encaissé" value={fmtMoney(data.caEncaisse)} icon="💰" color="amber" />
        </div>

        <div className="grid lg:grid-cols-2 gap-6">
          <Card title="📈 Performance financière">
            <div className="space-y-4">
              <div>
                <div className="flex justify-between text-sm mb-1"><span>CA vs Budget</span><span className="font-medium">{data.rentabilite}%</span></div>
                <ProgressBar value={data.caEncaisse} max={data.budgetTotal} color={data.rentabilite >= 100 ? 'green' : 'blue'} />
                <div className="text-xs text-slate-400 mt-1">{fmtMoney(data.caEncaisse)} / {fmtMoney(data.budgetTotal)}</div>
              </div>
              <div>
                <div className="flex justify-between text-sm mb-1"><span>Production valorisée</span><span className="font-medium">{fmtMoney(data.production)}</span></div>
                <ProgressBar value={data.production} max={data.budgetTotal} color="purple" />
              </div>
              <div className="pt-2 border-t">
                <div className="flex justify-between text-sm"><span>En attente encaissement</span><span className="font-medium text-amber-600">{fmtMoney(data.caEnAttente)}</span></div>
              </div>
            </div>
          </Card>

          <Card title="🎯 Objectifs">
            <div className="grid grid-cols-2 gap-4">
              <div className="text-center p-4 bg-gradient-to-br from-blue-50 to-blue-100 rounded-xl">
                <div className={cn('text-3xl font-bold', data.tauxCharge >= 75 ? 'text-green-600' : 'text-blue-600')}>{data.tauxCharge}%</div>
                <div className="text-sm text-slate-600 font-medium">Chargeabilité</div>
                <div className="text-xs text-slate-400">Objectif: 75%</div>
                <div className="mt-2"><ProgressBar value={data.tauxCharge} max={100} color={data.tauxCharge >= 75 ? 'green' : 'blue'} size="sm" /></div>
              </div>
              <div className="text-center p-4 bg-gradient-to-br from-green-50 to-green-100 rounded-xl">
                <div className={cn('text-3xl font-bold', data.rentabilite >= 100 ? 'text-green-600' : 'text-amber-600')}>{data.rentabilite}%</div>
                <div className="text-sm text-slate-600 font-medium">Rentabilité</div>
                <div className="text-xs text-slate-400">Objectif: 100%</div>
                <div className="mt-2"><ProgressBar value={data.rentabilite} max={100} color={data.rentabilite >= 100 ? 'green' : 'amber'} size="sm" /></div>
              </div>
            </div>
          </Card>
        </div>

        <div className="grid lg:grid-cols-2 gap-6 mt-6">
          <Card title="🏆 Top 5 Clients (CA)">
            {data.topClients?.length > 0 ? (
              <div className="space-y-3">
                {data.topClients.map((c, i) => (
                  <div key={c.id} className="flex items-center gap-3">
                    <div className="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold">{i + 1}</div>
                    <div className="flex-1 font-medium">{c.nom}</div>
                    <div className="font-bold text-green-600">{fmtMoney(c.ca)}</div>
                  </div>
                ))}
              </div>
            ) : <EmptyState icon="👥" title="Pas de données" />}
          </Card>

          <Card title="⏱️ Top 5 Missions (Heures)">
            {data.topMissions?.length > 0 ? (
              <div className="space-y-3">
                {data.topMissions.map((m, i) => (
                  <div key={m.id} className="flex items-center gap-3">
                    <div className="w-6 h-6 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-xs font-bold">{i + 1}</div>
                    <div className="flex-1"><div className="font-medium">{m.nom}</div><div className="text-xs text-slate-400">{m.code}</div></div>
                    <div className="font-bold text-purple-600">{m.heures}h</div>

                ))}
              </div>
            ) : <EmptyState icon="📊" title="Pas de données" />}
          </Card>
        </div>
      </>)}

      {tab === 'temps' && (<>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <StatCard title="Heures totales" value={fmt(data.heuresTotal) + 'h'} icon="⏱️" color="blue" />
          <StatCard title="Facturables" value={fmt(data.heuresFact) + 'h'} icon="💼" color="green" />
          <StatCard title="Non-facturables" value={fmt(data.heuresNonFact) + 'h'} icon="📋" color="gray" />
          <StatCard title="Taux facturable" value={data.tauxCharge + '%'} icon="📊" color="purple" />
        </div>

        <div className="grid lg:grid-cols-2 gap-6">
          <Card title="📊 Répartition du temps">
            <div className="space-y-4">
              <div>
                <div className="flex justify-between text-sm mb-1"><span>Heures facturables</span><span className="text-green-600 font-medium">{fmt(data.heuresFact)}h ({data.tauxCharge}%)</span></div>
                <div className="h-4 bg-slate-100 rounded-full overflow-hidden">
                  <div className="h-full bg-green-500 rounded-full" style={{width: data.tauxCharge + '%'}}></div>
                </div>
              </div>
              <div>
                <div className="flex justify-between text-sm mb-1"><span>Heures non-facturables</span><span className="text-slate-500 font-medium">{fmt(data.heuresNonFact)}h ({100 - data.tauxCharge}%)</span></div>
                <div className="h-4 bg-slate-100 rounded-full overflow-hidden">
                  <div className="h-full bg-slate-400 rounded-full" style={{width: (100 - data.tauxCharge) + '%'}}></div>
                </div>
              </div>
            </div>
          </Card>

          <Card title="👥 Ressources">
            <div className="grid grid-cols-2 gap-4">
              <div className="text-center p-4 bg-slate-50 rounded-xl">
                <div className="text-3xl font-bold text-blue-600">{data.nbCollabs}</div>
                <div className="text-sm text-slate-500">Collaborateurs actifs</div>
              </div>
              <div className="text-center p-4 bg-slate-50 rounded-xl">
                <div className="text-3xl font-bold text-amber-600">{data.joursConges}</div>
                <div className="text-sm text-slate-500">Jours de congés pris</div>
              </div>
              <div className="text-center p-4 bg-slate-50 rounded-xl">
                <div className="text-3xl font-bold text-green-600">{fmt(data.tauxMoyen)}</div>
                <div className="text-sm text-slate-500">Taux horaire moyen (F)</div>
              </div>
              <div className="text-center p-4 bg-slate-50 rounded-xl">
                <div className="text-3xl font-bold text-purple-600">{data.missionsActives}</div>
                <div className="text-sm text-slate-500">Missions actives</div>
              </div>
            </div>
          </Card>
        </div>
      </>)}

      {tab === 'finance' && (<>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <StatCard title="CA facturé" value={fmtMoney(data.caTotal)} icon="📄" color="blue" />
          <StatCard title="CA encaissé" value={fmtMoney(data.caEncaisse)} icon="✅" color="green" />
          <StatCard title="En attente" value={fmtMoney(data.caEnAttente)} icon="⏳" color="amber" />
          <StatCard title="Budget total" value={fmtMoney(data.budgetTotal)} icon="🎯" color="purple" />
        </div>

        <div className="grid lg:grid-cols-2 gap-6">
          <Card title="💰 Flux de trésorerie">
            <div className="space-y-4">
              <div className="flex justify-between items-center p-3 bg-green-50 rounded-xl">
                <span className="text-green-700">Encaissé</span>
                <span className="font-bold text-green-700">{fmtMoney(data.caEncaisse)}</span>
              </div>
              <div className="flex justify-between items-center p-3 bg-amber-50 rounded-xl">
                <span className="text-amber-700">À encaisser</span>
                <span className="font-bold text-amber-700">{fmtMoney(data.caEnAttente)}</span>
              </div>
              <div className="flex justify-between items-center p-3 bg-blue-50 rounded-xl">
                <span className="text-blue-700">Production non facturée</span>
                <span className="font-bold text-blue-700">{fmtMoney(data.production - data.caTotal)}</span>
              </div>
            </div>
          </Card>

          <Card title="📈 Indicateurs">
            <div className="space-y-4">
              <div>
                <div className="flex justify-between text-sm mb-1"><span>Taux de recouvrement</span><span>{data.caTotal > 0 ? Math.round((data.caEncaisse / data.caTotal) * 100) : 0}%</span></div>
                <ProgressBar value={data.caEncaisse} max={data.caTotal} color="green" />
              </div>
              <div>
                <div className="flex justify-between text-sm mb-1"><span>Consommation budget</span><span>{Math.round((data.caTotal / data.budgetTotal) * 100) || 0}%</span></div>
                <ProgressBar value={data.caTotal} max={data.budgetTotal} color="blue" />
              </div>
            </div>
          </Card>
        </div>
      </>)}

      {tab === 'clients' && (<>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <StatCard title="Total clients" value={data.nbClients} icon="👥" color="blue" />
          <StatCard title="Missions" value={data.totalMissions} icon="📋" color="green" />
          <StatCard title="Missions actives" value={data.missionsActives} icon="🚀" color="purple" />
          <StatCard title="CA moyen/client" value={fmtMoney(data.nbClients > 0 ? data.caTotal / data.nbClients : 0)} icon="💰" color="amber" />
        </div>

        <Card title="🏆 Classement clients par CA">
          {data.topClients?.length > 0 ? (
            <Table columns={[
              {header: '#', render: (r, i) => <span className="font-bold text-slate-400">{i + 1}</span>},
              {header: 'Client', render: r => <span className="font-medium">{r.nom}</span>},
              {header: 'CA Total', render: r => <span className="font-bold text-green-600">{fmtMoney(r.ca)}</span>},
              {header: '% du CA', render: r => <div><ProgressBar value={r.ca} max={data.caTotal} color="green" size="sm" /></div>}
            ]} data={data.topClients} />
          ) : <EmptyState icon="👥" title="Pas de données clients" />}
        </Card>
      </>)}
    </div>
  );
};
// ========== PARAMETRES PAGE ==========
const ParametresPage = () => {
  const {org, abo, reload} = useApp();
  const [tab, setTab] = useState('org');
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [depts, setDepts] = useState([]);
  const [grades, setGrades] = useState([]);
  const [categories, setCategories] = useState([]);
  const [holidays, setHolidays] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editModal, setEditModal] = useState(null);
  const [editForm, setEditForm] = useState({});

  useEffect(() => { setForm({nom: org.nom, adresse: org.adresse || '', ville: org.ville || '', email: org.email || '', telephone: org.telephone || ''}); loadParams(); }, [org]);

  const loadParams = async () => {
    const [d, g, c, h] = await Promise.all([
      supabase.from('departements').select('*').eq('organisation_id', org.id).order('nom'),
      supabase.from('grades').select('*').eq('organisation_id', org.id).order('niveau', {ascending: false}),
      supabase.from('categories_taches').select('*').eq('organisation_id', org.id).order('nom'),
      supabase.from('jours_feries').select('*').eq('organisation_id', org.id).order('date')
    ]);
    setDepts(d.data || []); setGrades(g.data || []); setCategories(c.data || []); setHolidays(h.data || []); setLoading(false);
  };

  const saveOrg = async () => { setSaving(true); try { await supabase.from('organisations').update(form).eq('id', org.id); reload(); alert('Enregistré!'); } catch(e) { alert(e.message); } setSaving(false); };

  // CRUD générique
  const openEdit = (type, item = null) => {
    setEditModal(type);
    if (item) setEditForm({...item});
    else if (type === 'dept') setEditForm({code: '', nom: '', facturable: true, couleur: '#2563eb'});
    else if (type === 'grade') setEditForm({code: '', nom: '', niveau: 1, taux_journalier: 0, taux_cible: 80});
    else if (type === 'categorie') setEditForm({code: '', nom: '', facturable: true, couleur: '#2563eb'});
    else if (type === 'holiday') setEditForm({date: '', nom: ''});
  };

  const saveEdit = async () => {
    setSaving(true);
    try {
      const table = editModal === 'dept' ? 'departements' : editModal === 'grade' ? 'grades' : editModal === 'categorie' ? 'categories_taches' : 'jours_feries';
      if (editForm.id) await supabase.from(table).update(editForm).eq('id', editForm.id);
      else await supabase.from(table).insert([{...editForm, organisation_id: org.id}]);
      setEditModal(null); loadParams();
    } catch(e) { alert(e.message); }
    setSaving(false);
  };

  const deleteItem = async (table, id) => {
    if (!confirm('Supprimer cet élément ?')) return;
    await supabase.from(table).delete().eq('id', id);
    loadParams();
  };

  const exportData = async () => {
    const [c, p, t, f] = await Promise.all([
      supabase.from('clients').select('*').eq('organisation_id', org.id),
      supabase.from('projets').select('*').eq('organisation_id', org.id),
      supabase.from('saisies_temps').select('*').eq('organisation_id', org.id),
      supabase.from('factures').select('*').eq('organisation_id', org.id)
    ]);
    const data = {organisation: org, clients: c.data, projets: p.data, temps: t.data, factures: f.data, exportedAt: new Date().toISOString()};
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'kabinet_backup_' + today() + '.json'; a.click();
  };

  const joursRestants = abo?.date_fin ? Math.ceil((new Date(abo.date_fin) - new Date()) / (1000*60*60*24)) : 0;
  const isExpire = joursRestants <= 0;

  return (
    <div>
      <PageHeader title="Paramètres" />
      <Tabs tabs={[{key: 'org', label: '🏢 Organisation'}, {key: 'abo', label: '💳 Abonnement'}, {key: 'config', label: '⚙️ Configuration'}, {key: 'backup', label: '💾 Sauvegarde'}]} active={tab} onChange={setTab} />

      <div className="mt-6">
        {tab === 'org' && (
          <Card title="Informations de l'organisation">
            <div className="space-y-4 max-w-xl">
              <Input label="Nom du cabinet" value={form.nom} onChange={v => setForm(p => ({...p, nom: v}))} />
              <Input label="Adresse" value={form.adresse} onChange={v => setForm(p => ({...p, adresse: v}))} />
              <div className="grid grid-cols-2 gap-4"><Input label="Ville" value={form.ville} onChange={v => setForm(p => ({...p, ville: v}))} /><Input label="Téléphone" value={form.telephone} onChange={v => setForm(p => ({...p, telephone: v}))} /></div>
              <Input label="Email" type="email" value={form.email} onChange={v => setForm(p => ({...p, email: v}))} />
              <Button onClick={saveOrg} loading={saving} icon="💾">Enregistrer</Button>
            </div>
          </Card>
        )}

        {tab === 'abo' && (
          <Card title="Abonnement">
            <div className="max-w-2xl">
              <div className={cn('p-6 rounded-2xl mb-6', isExpire ? 'bg-red-50 border-2 border-red-200' : 'bg-blue-50 border-2 border-blue-200')}>
                <div className="flex items-center justify-between mb-4">
                  <div><span className="text-3xl mr-3">{PLANS[abo?.plan]?.icon}</span><span className="text-2xl font-bold">{PLANS[abo?.plan]?.nom}</span></div>
                  <Badge color={isExpire ? 'red' : 'green'}>{isExpire ? 'Expiré' : 'Actif'}</Badge>
                </div>
                {abo?.date_fin && <div className="flex justify-between text-sm"><span>Expire: <b>{fmtDate(abo.date_fin)}</b></span><span className={isExpire ? 'text-red-600 font-bold' : ''}>{isExpire ? 'Expiré' : joursRestants + ' jours restants'}</span></div>}
              </div>
              <h3 className="font-bold mb-4">Plans disponibles</h3>
              <div className="grid grid-cols-3 gap-4">
                {Object.entries(PLANS).map(([k, p]) => (
                  <div key={k} className={cn('p-4 rounded-xl border-2', abo?.plan === k ? 'border-blue-500 bg-blue-50' : 'border-slate-200')}>
                    <div className="text-2xl mb-2">{p.icon}</div><div className="font-bold">{p.nom}</div><div className="text-slate-500 text-sm">{p.prix ? fmt(p.prix) + ' F/mois' : 'Gratuit'}</div>
                    {abo?.plan === k && <Badge color="blue" className="mt-2">Actuel</Badge>}
                  </div>
                ))}
              </div>
            </div>
          </Card>
        )}

        {tab === 'config' && loading ? <Loader /> : tab === 'config' && (
          <div className="space-y-6">
            {/* Départements */}
            <Card title="Départements" collapsible defaultOpen={false} action={<Button size="xs" onClick={() => openEdit('dept')}>➕</Button>}>
              <Table columns={[
                {header: 'Code', render: r => <span className="font-mono text-xs bg-slate-100 px-2 py-1 rounded">{r.code}</span>},
                {header: 'Nom', render: r => <b>{r.nom}</b>},
                {header: 'Facturable', render: r => <Badge color={r.facturable ? 'green' : 'gray'}>{r.facturable ? 'Oui' : 'Non'}</Badge>}
              ]} data={depts} actions={r => (
                <div className="flex gap-1"><Button variant="ghost" size="xs" onClick={() => openEdit('dept', r)}>✏️</Button><Button variant="ghost" size="xs" onClick={() => deleteItem('departements', r.id)}>🗑️</Button></div>
              )} />
            </Card>

            {/* Grades */}
            <Card title="Grades" collapsible defaultOpen={false} action={<Button size="xs" onClick={() => openEdit('grade')}>➕</Button>}>
              <Table columns={[
                {header: 'Code', key: 'code'},
                {header: 'Nom', render: r => <b>{r.nom}</b>},
                {header: 'Niveau', key: 'niveau'},
                {header: 'Taux journalier', render: r => fmtMoney(r.taux_journalier)},
                {header: 'Cible', render: r => (r.taux_cible || 0) + '%'}
              ]} data={grades} actions={r => (
                <div className="flex gap-1"><Button variant="ghost" size="xs" onClick={() => openEdit('grade', r)}>✏️</Button><Button variant="ghost" size="xs" onClick={() => deleteItem('grades', r.id)}>🗑️</Button></div>
              )} />
            </Card>

            {/* Catégories */}
            <Card title="Catégories de tâches" collapsible defaultOpen={false} action={<Button size="xs" onClick={() => openEdit('categorie')}>➕</Button>}>
              <Table columns={[
                {header: 'Code', key: 'code'},
                {header: 'Nom', render: r => <b>{r.nom}</b>},
                {header: 'Facturable', render: r => <Badge color={r.facturable ? 'green' : 'gray'}>{r.facturable ? 'Oui' : 'Non'}</Badge>}
              ]} data={categories} actions={r => (
                <div className="flex gap-1"><Button variant="ghost" size="xs" onClick={() => openEdit('categorie', r)}>✏️</Button><Button variant="ghost" size="xs" onClick={() => deleteItem('categories_taches', r.id)}>🗑️</Button></div>
              )} />
            </Card>

            {/* Jours fériés */}
            <Card title="Jours fériés" collapsible defaultOpen={false} action={<Button size="xs" onClick={() => openEdit('holiday')}>➕</Button>}>
              <Table columns={[
                {header: 'Date', render: r => fmtDate(r.date)},
                {header: 'Nom', render: r => <b>{r.nom}</b>}
              ]} data={holidays} actions={r => (
                <Button variant="ghost" size="xs" onClick={() => deleteItem('jours_feries', r.id)}>🗑️</Button>
              )} />
            </Card>
          </div>
        )}

        {tab === 'backup' && (
          <Card title="Sauvegarde et Import">
            <div className="max-w-xl space-y-6">
              <div className="p-6 bg-slate-50 rounded-xl"><h3 className="font-bold mb-2">📥 Exporter</h3><p className="text-slate-500 text-sm mb-4">Téléchargez vos données en JSON.</p><Button onClick={exportData} variant="secondary" icon="⬇️">Exporter</Button></div>
              <div className="p-6 bg-slate-50 rounded-xl"><h3 className="font-bold mb-2">📤 Importer</h3><p className="text-slate-500 text-sm mb-4">Import Excel (bientôt).</p><Button variant="secondary" disabled icon="⬆️">Import Excel</Button></div>
            </div>
          </Card>
        )}
      </div>

      {/* Modals d'édition */}
      <Modal isOpen={editModal === 'dept'} onClose={() => setEditModal(null)} title={editForm.id ? 'Modifier département' : 'Nouveau département'} size="sm">
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4"><Input label="Code" value={editForm.code} onChange={v => setEditForm(p => ({...p, code: v}))} /><Input label="Nom" value={editForm.nom} onChange={v => setEditForm(p => ({...p, nom: v}))} required /></div>
          <Checkbox label="Facturable" checked={editForm.facturable} onChange={v => setEditForm(p => ({...p, facturable: v}))} />
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setEditModal(null)} className="flex-1">Annuler</Button><Button onClick={saveEdit} loading={saving} className="flex-1">Enregistrer</Button></div>
        </div>
      </Modal>

      <Modal isOpen={editModal === 'grade'} onClose={() => setEditModal(null)} title={editForm.id ? 'Modifier grade' : 'Nouveau grade'} size="sm">
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4"><Input label="Code" value={editForm.code} onChange={v => setEditForm(p => ({...p, code: v}))} /><Input label="Nom" value={editForm.nom} onChange={v => setEditForm(p => ({...p, nom: v}))} required /></div>
          <div className="grid grid-cols-3 gap-4"><Input label="Niveau" type="number" value={editForm.niveau} onChange={v => setEditForm(p => ({...p, niveau: v}))} /><Input label="Taux journalier" type="number" value={editForm.taux_journalier} onChange={v => setEditForm(p => ({...p, taux_journalier: v}))} /><Input label="Cible %" type="number" value={editForm.taux_cible} onChange={v => setEditForm(p => ({...p, taux_cible: v}))} /></div>
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setEditModal(null)} className="flex-1">Annuler</Button><Button onClick={saveEdit} loading={saving} className="flex-1">Enregistrer</Button></div>
        </div>
      </Modal>

      <Modal isOpen={editModal === 'categorie'} onClose={() => setEditModal(null)} title={editForm.id ? 'Modifier catégorie' : 'Nouvelle catégorie'} size="sm">
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-4"><Input label="Code" value={editForm.code} onChange={v => setEditForm(p => ({...p, code: v}))} /><Input label="Nom" value={editForm.nom} onChange={v => setEditForm(p => ({...p, nom: v}))} required /></div>
          <Checkbox label="Facturable" checked={editForm.facturable} onChange={v => setEditForm(p => ({...p, facturable: v}))} />
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setEditModal(null)} className="flex-1">Annuler</Button><Button onClick={saveEdit} loading={saving} className="flex-1">Enregistrer</Button></div>
        </div>
      </Modal>

      <Modal isOpen={editModal === 'holiday'} onClose={() => setEditModal(null)} title="Ajouter jour férié" size="sm">
        <div className="space-y-4">
          <Input label="Date" type="date" value={editForm.date} onChange={v => setEditForm(p => ({...p, date: v}))} required />
          <Input label="Nom" value={editForm.nom} onChange={v => setEditForm(p => ({...p, nom: v}))} placeholder="Ex: Tabaski" required />
          <div className="flex gap-3 pt-4"><Button variant="secondary" onClick={() => setEditModal(null)} className="flex-1">Annuler</Button><Button onClick={saveEdit} loading={saving} className="flex-1">Ajouter</Button></div>
        </div>
      </Modal>
    </div>
  );
};

// ========== ADMIN PAGE ==========
const AdminPage = () => {
  const {isSuperAdmin, setViewMode} = useApp();
  if (!isSuperAdmin) return <EmptyState icon="🔒" title="Accès refusé" description="Cette section est réservée aux super administrateurs." />;
  return (
    <div>
      <PageHeader title="Administration" />
      <Card>
        <div className="text-center py-8">
          <div className="text-5xl mb-4">🛡️</div>
          <h3 className="text-xl font-bold mb-2">Accès Super Admin</h3>
          <p className="text-slate-500 mb-6">Basculez vers l'interface d'administration globale pour gérer toutes les organisations, utilisateurs et abonnements.</p>
          <Button onClick={() => setViewMode('admin')} icon="🚀" size="lg">Ouvrir Admin Global</Button>
        </div>
      </Card>
    </div>
  );
};
// ========== ROOT APP ==========
const App = () => {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [page, setPage] = useState('landing');
  const [confirmEmail, setConfirmEmail] = useState('');

  useEffect(() => {
    supabase.auth.getSession().then(({data: {session}}) => {
      setUser(session?.user || null);
      setLoading(false);
    });
    const {data: {subscription}} = supabase.auth.onAuthStateChange((e, s) => setUser(s?.user || null));
    return () => subscription.unsubscribe();
  }, []);

  const logout = async () => {
    await supabase.auth.signOut();
    setUser(null);
    setPage('landing');
  };

  if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="loader"></div></div>;
  if (user) return <MainApp user={user} onLogout={logout} />;
  if (page === 'login') return <LoginPage onLogin={setUser} onRegister={() => setPage('register')} onBack={() => setPage('landing')} />;
  if (page === 'register') return <RegisterPage onLogin={() => setPage('login')} onBack={() => setPage('landing')} onConfirm={e => {setConfirmEmail(e); setPage('confirm');}} />;
  if (page === 'confirm') return <ConfirmPage email={confirmEmail} onLogin={() => setPage('login')} />;
  return <LandingPage onLogin={() => setPage('login')} onRegister={() => setPage('register')} />;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
